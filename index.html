<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3b82f6;--blue-2:#60a5fa;--blue-3:#93c5fd;--yellow:#facc15;--yellow-2:#fde047;--green:#22c55e;--green-2:#4ade80;--red:#dc2626;--txt:#f0f4ff;--muted:#7a8ab8;--dim:#4a5680;--line:rgba(59,130,246,.12);--line-2:rgba(59,130,246,.22);--line-3:rgba(59,130,246,.4);--pink:#ec4899;--pink-2:#f9a8d4}
body{font-family:'Noto Sans Bengali',sans-serif;color:var(--txt);background:#04060d;background-image:radial-gradient(circle at 15% 5%,rgba(59,130,246,.15),transparent 45%),radial-gradient(circle at 85% 95%,rgba(34,197,94,.12),transparent 45%);background-attachment:fixed;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#050810}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--blue),var(--green));border-radius:10px;border:2px solid #050810}
.hidden{display:none!important}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 12px rgba(34,197,94,0)}}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
@keyframes pulsePink{0%,100%{box-shadow:0 0 0 0 rgba(236,72,153,.5)}50%{box-shadow:0 0 0 10px rgba(236,72,153,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes notifSlide{from{opacity:0;transform:translateX(420px)}to{opacity:1;transform:translateX(0)}}
@keyframes notifProgress{from{width:100%}to{width:0%}}
@keyframes bellRing{0%,100%{transform:rotate(0)}20%{transform:rotate(20deg)}40%{transform:rotate(-18deg)}60%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
@keyframes slideInRT{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.rgb{background:linear-gradient(90deg,var(--blue),var(--yellow),var(--green),var(--blue));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.sidebar-overlay{position:fixed;inset:0;z-index:400;background:rgba(2,4,10,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.sidebar-overlay.active{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:320px;max-width:88vw;z-index:500;background:linear-gradient(165deg,#0f1428,#06091a);border-right:1px solid var(--line-3);box-shadow:20px 0 60px rgba(0,0,0,.9);transform:translateX(-100%);transition:transform .35s;display:flex;flex-direction:column;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sidebar-head{padding:18px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.sidebar-head h3{font-size:16px;font-weight:800;color:#fff}
.sidebar-head .sb-close{border:none;background:rgba(220,38,38,.15);color:#f87171;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:14px;border:1px solid rgba(220,38,38,.4)}
.sidebar-body{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:8px}
.sb-section{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;padding:14px 8px 6px;margin-top:4px;border-top:1px dashed var(--line)}
.sb-section:first-child{border-top:none;margin-top:0;padding-top:6px}
.sb-btn{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;background:linear-gradient(145deg,#0f1428,#080c1a);border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;text-align:left;width:100%}
.sb-btn:hover{background:linear-gradient(145deg,rgba(59,130,246,.15),rgba(34,197,94,.06));border-color:var(--line-3);transform:translateX(3px)}
.sb-btn .sb-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.08));border:1px solid var(--line-3);flex-shrink:0}
.sb-btn .sb-lbl{flex:1;display:flex;flex-direction:column;gap:2px}
.sb-btn .sb-lbl .sb-sub{font-size:11.5px;color:var(--muted);font-weight:600}
.sb-btn.primary{background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(34,197,94,.15));border-color:var(--blue)}
.sb-btn.danger{background:linear-gradient(135deg,rgba(220,38,38,.15),rgba(153,27,27,.08));border-color:rgba(220,38,38,.4);color:#f87171}
.sb-btn.warn{background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(245,158,11,.08));border-color:rgba(250,204,21,.4);color:#facc15}
.sb-badge{margin-left:auto;padding:3px 10px;border-radius:8px;font-size:11.5px;font-weight:800;background:rgba(220,38,38,.2);border:1px solid rgba(220,38,38,.5);color:#f87171}
.sb-user{padding:14px 16px;border-radius:14px;background:linear-gradient(145deg,rgba(59,130,246,.1),rgba(34,197,94,.04));border:1px solid var(--line-3);margin-bottom:6px}
.sb-user .name{font-size:15px;font-weight:800;color:#fff}
.sb-user .role{font-size:12px;color:var(--green-2);font-weight:700;margin-top:4px}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;background:rgba(4,6,13,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2);transform:translateY(0);transition:transform .35s cubic-bezier(.2,1,.3,1),box-shadow .35s}
.topbar.hidden-scroll{transform:translateY(-110%)}
.topbar.scrolled{box-shadow:0 8px 30px rgba(0,0,0,.6)}
.topbar .tb-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar .tb-menu-btn{width:44px;height:44px;border-radius:13px;border:1px solid var(--line-3);background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.08));color:#fff;cursor:pointer;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.1));border:1px solid var(--line-3);flex-shrink:0}
.brand h1{font-size:17px;font-weight:800}
.brand p{font-size:11.5px;color:#a5b4d8;margin-top:1px;font-weight:600}
.topbar .tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.tb-branch{font-size:13px;font-weight:700;padding:9px 14px;border-radius:11px;background:linear-gradient(145deg,rgba(59,130,246,.12),rgba(34,197,94,.06));border:1px solid var(--line-3);white-space:nowrap;color:#fff;display:flex;align-items:center;gap:6px}
.tb-branch b{color:var(--green-2);font-weight:800}
.tb-date{padding:8px 12px;border-radius:11px;background:#080c1a;border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:13px;outline:none}
.tb-select{padding:9px 14px;border-radius:11px;background:#080c1a;border:1px solid var(--line-3);color:var(--green-2);font-family:inherit;font-size:13px;font-weight:800;outline:none;cursor:pointer}
.tb-time{font-size:13.5px;font-weight:800;padding:9px 14px;border-radius:11px;background:linear-gradient(145deg,rgba(59,130,246,.15),rgba(34,197,94,.08));border:1px solid var(--line-3);color:var(--green-2);display:flex;align-items:center;gap:6px}
.tb-time .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green-2);animation:pulseGreen 1.8s ease-in-out infinite}
.sync-status{font-size:11.5px;padding:6px 12px;border-radius:18px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:var(--green-2);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.realtime-status{font-size:11.5px;padding:6px 12px;border-radius:18px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.4);color:var(--blue-3);font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .3s}
.realtime-status.online{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:var(--green-2);animation:pulseGreen 2s ease-in-out infinite}
.realtime-status.offline{background:rgba(122,138,184,.12);border-color:rgba(122,138,184,.3);color:var(--muted)}
.realtime-status.connecting{background:rgba(250,204,21,.15);border-color:rgba(250,204,21,.5);color:var(--yellow-2)}
.realtime-status.error{background:rgba(220,38,38,.15);border-color:rgba(220,38,38,.5);color:#f87171}
.rt-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.presence-badge{font-size:11.5px;padding:6px 12px;border-radius:18px;background:rgba(236,72,153,.12);border:1px solid rgba(236,72,153,.4);color:#f9a8d4;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.presence-badge b{color:#fff;font-weight:900}
.net-status{font-size:11.5px;padding:6px 12px;border-radius:18px;background:rgba(122,138,184,.12);border:1px solid rgba(122,138,184,.3);color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:5px;transition:all .3s}
.net-status.online{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:var(--green-2)}
.net-status.slow{background:rgba(250,204,21,.15);border-color:rgba(250,204,21,.5);color:var(--yellow-2)}
.net-status.offline{background:rgba(220,38,38,.15);border-color:rgba(220,38,38,.5);color:#f87171;animation:pulseRed 1.5s ease-in-out infinite}
.net-status .n-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.queue-badge{font-size:11.5px;padding:6px 12px;border-radius:18px;background:rgba(236,72,153,.15);border:1px solid rgba(236,72,153,.5);color:#f9a8d4;font-weight:800;display:none;align-items:center;gap:5px;cursor:pointer}
.queue-badge.show{display:inline-flex;animation:pulsePink 2s ease-in-out infinite}
.queue-badge b{color:#fff;font-weight:900}
.net-banner{position:fixed;top:0;left:0;right:0;z-index:9998;padding:10px 18px;background:linear-gradient(135deg,rgba(220,38,38,.95),rgba(153,27,27,.92));color:#fff;font-weight:800;font-size:13px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.6);transform:translateY(-100%);transition:transform .35s;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.net-banner.show{transform:translateY(0)}
.net-banner.online-banner{background:linear-gradient(135deg,rgba(34,197,94,.95),rgba(22,163,74,.92))}
.net-banner .retry-btn{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);padding:5px 12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.sync-spinner{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 30%,#0a1020,#04060d 70%)}
.login-box{width:100%;max-width:440px;background:linear-gradient(165deg,#0f1428,#060a18);border:1px solid var(--line-2);border-radius:28px;padding:38px 30px;box-shadow:0 20px 50px rgba(0,0,0,.9);animation:popIn .5s}
.login-logo{width:88px;height:88px;margin:0 auto 18px;display:grid;place-items:center;animation:float 3s ease-in-out infinite}
.login-box h1{text-align:center;font-size:24px;font-weight:800;color:#fff;margin-bottom:8px}
.login-box h2{text-align:center;font-size:13.5px;color:#a5b4d8;font-weight:500;margin-bottom:26px}
.field{position:relative;z-index:1;margin-bottom:16px}
.field label{display:block;font-size:13.5px;color:#b8c8ee;margin-bottom:7px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.field input,.field select{width:100%;padding:14px 16px;border-radius:12px;background:#050810;border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:15.5px;font-weight:500;outline:none}
.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;padding:13px 22px;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--blue),#2563eb);transition:all .2s;box-shadow:0 4px 16px rgba(59,130,246,.35)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.btn.pink{background:linear-gradient(135deg,var(--blue),var(--green))}
.btn.green{background:linear-gradient(135deg,var(--green),#16a34a)}
.btn.gray{background:linear-gradient(145deg,#141a30,#0a0f1e);color:var(--txt);border:1px solid var(--line-2);font-size:14.5px}
.btn.red{background:linear-gradient(135deg,#dc2626,#991b1b)}
.btn.yellow{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000}
.btn.cyan{background:linear-gradient(135deg,#06b6d4,#0891b2)}
.btn.purple{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.btn.sm{padding:8px 14px;font-size:13px}
main{max-width:1500px;margin:0 auto;padding:26px 20px 80px;display:flex;flex-direction:column;gap:26px;align-items:center;animation:fadeInUp .5s}
.section{width:100%}
.section-title{display:flex;align-items:center;gap:11px;margin-bottom:16px;font-size:16.5px;font-weight:800;color:#fff;flex-wrap:wrap}
.section-title span.bar{width:4px;height:26px;border-radius:4px;background:linear-gradient(180deg,var(--blue),var(--yellow),var(--green))}
.grid{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{position:relative;cursor:pointer;overflow:hidden;border-radius:22px;padding:20px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);transition:all .35s;animation:fadeInUp .4s backwards}
.card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--yellow),var(--green))}
.card:hover{transform:translateY(-6px) scale(1.01);border-color:var(--line-3);box-shadow:0 24px 60px rgba(0,0,0,.9)}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.card-top .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(145deg,rgba(59,130,246,.2),rgba(34,197,94,.08));border:1px solid var(--line-3)}
.card-top h3{font-size:15px;font-weight:700;color:#fff}
.big-amt{font-size:30px;line-height:1.25;font-weight:800;color:#fff}
.big-amt.sm{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.big-amt.sm .lbl{color:#a5b4d8;font-size:13px;font-weight:600;min-width:62px}
.card-sub{margin-top:10px;font-size:13.5px;color:#a5b4d8;line-height:1.6}
.card-sub b{color:var(--green-2);font-weight:700}
.card-tap{position:absolute;right:16px;bottom:14px;font-size:12px;color:var(--dim);opacity:.7}
.vault-box{width:100%;border-radius:22px;padding:20px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2)}
.vault-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.vault-item{flex:1 1 84px;min-width:78px;text-align:center;padding:13px 6px;border-radius:14px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1px solid var(--line-2)}
.vault-item .d{font-size:13.5px;color:#a5b4d8;font-weight:700}
.vault-item .c{font-size:22px;font-weight:800;margin-top:4px;color:var(--green-2)}
.vault-total{margin-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-top:14px;border-top:1px dashed var(--line-2)}
.vault-total span{font-size:14.5px;color:#a5b4d8;font-weight:600}
.vault-total b{color:var(--green-2)}
.balance-panel{width:100%;border-radius:22px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);padding:18px}
.balance-row-top{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
.balance-cell{padding:16px 14px;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.03),rgba(0,0,0,.15));border:1px solid var(--line-2);text-align:center}
.balance-cell .bc-ico{font-size:22px;margin-bottom:6px;display:block}
.balance-cell .bc-lbl{font-size:12.5px;color:#a5b4d8;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.balance-cell .bc-lbl.big-label{font-size:15px!important;font-weight:800!important;color:var(--blue-2)!important;text-transform:none!important}
.balance-cell .bc-val{font-size:19px;font-weight:800;color:#fff}
.balance-cell.blue .bc-val{color:var(--blue-2)}
.balance-cell.green .bc-val{color:var(--green-2)}
.balance-cell.purple .bc-val{color:#a78bfa}
.balance-cell.yellow .bc-val{color:var(--yellow-2)}
.bal-grid{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:16px}
.bal-card{border-radius:22px;padding:22px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2)}
.bal-card .t{font-size:13.5px;color:#a5b4d8;font-weight:700;margin-bottom:10px;text-transform:uppercase}
.bal-card .v{font-size:30px;font-weight:800;color:#fff}
.bal-card.main{background:linear-gradient(135deg,#131a35,#0a0f1e 60%,#0f1428);border-color:var(--blue)}
.bal-card.main .v{font-size:46px;background:linear-gradient(135deg,var(--blue-2),var(--green-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bal-card.capital{border-color:rgba(250,204,21,.45)}
.bal-card.capital .v{color:var(--yellow-2)}
.bal-card.deficit{border-color:rgba(220,38,38,.45)}
.bal-card.deficit .v{color:#f87171}
.bal-card.surplus{border-color:rgba(34,197,94,.45)}
.bal-card.surplus .v{color:var(--green-2)}
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(2,4,10,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto;animation:fadeIn .2s}
.modal{width:100%;max-width:760px;border-radius:22px;overflow:hidden;background:linear-gradient(165deg,#0f1428,#06091a);border:1px solid var(--line-3);animation:popIn .3s}
.modal.wide{max-width:1100px}
.modal.xwide{max-width:1400px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:5;background:#0f1428}
.modal-head h3{font-size:17px;font-weight:800;color:#fff;display:flex;align-items:center;gap:9px}
.modal-head .x{border:none;background:rgba(59,130,246,.15);color:var(--blue-3);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:15px;border:1px solid var(--line-3)}
.modal-head .x:hover{background:var(--blue);color:#fff;transform:rotate(90deg)}
.modal-body{padding:20px 22px 26px;font-size:14px}
.form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.cust-box{margin-top:8px;padding:16px;border-radius:16px;background:linear-gradient(145deg,rgba(59,130,246,.06),rgba(34,197,94,.03));border:1px solid var(--line-2)}
.cust-box .head{margin-bottom:12px}
.cust-box .head h4{font-size:13px;color:var(--blue-3);font-weight:700;text-transform:uppercase}
.suggest{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);background:#06091a;max-height:240px;overflow-y:auto}
.suggest:empty{display:none}
.sug-item{padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px;color:#e8eeff;line-height:1.7}
.sug-item:hover{background:linear-gradient(90deg,rgba(59,130,246,.15),rgba(34,197,94,.08))}
.sug-item b{color:var(--green-2);font-size:14.5px}
.sug-item small{color:#a5b4d8;font-size:12.5px}
.notes-cols{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:8px}
@media(max-width:700px){.notes-cols{grid-template-columns:1fr}}
.notes-col{padding:16px;border-radius:16px;border:1px solid var(--line-2);background:linear-gradient(145deg,#0a0f1e,#050810)}
.notes-col.out{border-color:rgba(250,204,21,.3)}
.notes-col.in{border-color:rgba(34,197,94,.3)}
.notes-col h4{font-size:20px;margin-bottom:14px;font-weight:800;color:#fff}
.notes-col.out h4{color:var(--yellow-2)}
.notes-col.in h4{color:var(--green-2)}
.notes-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:space-between}
.note-item{flex:1 1 54px;min-width:52px;text-align:center}
.note-item label{display:block;font-size:13.5px;color:#b8c8ee;margin-bottom:6px;font-weight:700}
.note-item input{width:100%;padding:11px 5px;text-align:center;border-radius:9px;background:#03060d;border:1px solid var(--line-2);color:#fff;font-family:inherit;font-size:15px;font-weight:800;outline:none}
.note-item input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.notes-col.out .note-item input{color:var(--yellow-2)}
.notes-col.in .note-item input{color:var(--green-2)}
.sum-line{margin-top:12px;font-size:14px;color:#a5b4d8;display:flex;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--line-2)}
.sum-line b{font-size:17px;color:#fff}
.total-preview{margin-top:18px;padding:18px;border-radius:16px;text-align:center;background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(34,197,94,.06));border:1px solid var(--line-3)}
.total-preview .l{font-size:12.5px;color:var(--blue-3);font-weight:700;text-transform:uppercase}
.total-preview .v{font-size:32px;margin-top:6px;color:#fff;font-weight:800}
.pending-box{margin-top:16px;padding:16px;border-radius:16px;background:linear-gradient(145deg,rgba(250,204,21,.08),rgba(250,204,21,.02));border:1px solid rgba(250,204,21,.35)}
.pending-box h4{font-size:13.5px;color:var(--yellow);font-weight:800;margin-bottom:12px}
.pending-empty{color:#a5b4d8;text-align:center;padding:14px;font-size:13.5px}
.pending-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;margin-bottom:8px;background:rgba(0,0,0,.3);border:1px solid var(--line-2);flex-wrap:wrap}
.pending-item .info{font-size:13.5px;color:#eee;flex:1;min-width:180px;line-height:1.75}
.pending-item .info b{color:var(--yellow)}
.pending-item .info small{color:var(--muted);display:block;margin-top:3px}
.accept-head{padding:16px;border-radius:16px;margin-bottom:16px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1px solid var(--line-3);font-size:14px;line-height:1.9;color:#e0eaff}
.online-box{margin-top:16px;padding:18px;border-radius:16px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1.5px solid var(--blue);display:none}
.online-box.active{display:block}
.online-box h4{font-size:14px;font-weight:800;margin-bottom:12px;color:var(--blue-3)}
.cust-branch-toggle{padding:16px 18px;border-radius:16px;margin-top:8px;margin-bottom:16px;background:linear-gradient(145deg,rgba(59,130,246,.06),rgba(34,197,94,.03));border:1px solid var(--line-2)}
.cust-branch-toggle .toggle-title{font-size:13px;font-weight:800;color:#fff;margin-bottom:12px;text-transform:uppercase}
.branch-toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.branch-toggle-btn{padding:13px 20px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;border:1px solid var(--line-2);background:linear-gradient(145deg,#0f1428,#080c1a);color:var(--muted)}
.branch-toggle-btn.active{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;border-color:transparent}
.table-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line-2)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
table.tbl th{background:linear-gradient(180deg,rgba(59,130,246,.18),rgba(59,130,246,.06));padding:14px;text-align:left;font-weight:700;color:var(--blue-3);font-size:13px;border-bottom:1px solid var(--line-3);text-transform:uppercase}
table.tbl td{padding:12px 14px;border-top:1px solid var(--line);color:#e0e8ff;line-height:1.7;font-size:13.5px}
table.tbl td.amt{font-weight:800;color:var(--green-2);white-space:nowrap}
table.tbl tr:hover td{background:rgba(59,130,246,.04)}
table.tbl tr.clickable-row{cursor:pointer}
table.tbl tr.clickable-row:hover td{background:rgba(236,72,153,.08)!important}
.badge{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:700;white-space:nowrap;background:rgba(59,130,246,.15);border:1px solid var(--line-3);color:var(--blue-3);display:inline-block}
.badge.pending{background:rgba(250,204,21,.15);border-color:rgba(250,204,21,.5);color:var(--yellow-2)}
.badge.accepted{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:var(--green-2)}
.badge.due{background:rgba(220,38,38,.18);border-color:rgba(220,38,38,.5);color:#f87171}
.mini{border:none;cursor:pointer;background:rgba(59,130,246,.15);color:var(--blue-3);padding:7px 12px;border-radius:8px;font-size:13px;border:1px solid var(--line-3);font-weight:700}
.mini:hover{background:var(--blue);color:#fff}
.mini.danger{background:rgba(220,38,38,.15);color:#f87171;border-color:rgba(220,38,38,.4)}
.mini.accept{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;border-color:transparent}
.mini.cash-btn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border-color:transparent}
.mini.online-btn{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:transparent}
.mini.print-btn{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;border-color:transparent}
.mini.show{background:rgba(34,197,94,.2);color:var(--green-2);border-color:rgba(34,197,94,.4)}
.empty{padding:36px 24px;text-align:center;color:#a5b4d8;font-size:14.5px}
.bank-hint{font-size:13.5px;color:#b8c8ee;background:rgba(59,130,246,.08);padding:12px 16px;border-radius:10px;margin-bottom:12px;border:1px dashed rgba(59,130,246,.35)}
.cust-row{cursor:pointer}
.cust-row:hover td{background:rgba(59,130,246,.06)!important}
.cust-row.has-due td{background:rgba(220,38,38,.05)}
.date-mode-banner{width:100%;padding:14px 20px;border-radius:16px;background:linear-gradient(145deg,rgba(250,204,21,.12),rgba(250,204,21,.04));border:1px solid rgba(250,204,21,.4);color:var(--yellow-2);font-size:14px;font-weight:600;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.date-mode-banner b{color:#fff;font-weight:800}
.date-mode-banner .close-mode{margin-left:auto;background:rgba(250,204,21,.2);color:var(--yellow-2);border:1px solid rgba(250,204,21,.5);padding:8px 15px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.auto-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.5);color:var(--green-2);font-size:12.5px;font-weight:700}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.2);border-top-color:var(--blue-3);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
.pending-coll-card{cursor:pointer;padding:22px;border-radius:22px;background:linear-gradient(155deg,rgba(250,204,21,.14),rgba(245,158,11,.05));border:1.5px solid rgba(250,204,21,.5)}
.pending-transfers-card{cursor:pointer;padding:22px;border-radius:22px;background:linear-gradient(155deg,rgba(59,130,246,.14),rgba(34,197,94,.05));border:1.5px solid rgba(59,130,246,.5)}
.sync-indicator{position:fixed;bottom:14px;right:14px;z-index:900;font-size:11px;color:var(--muted);background:rgba(4,6,13,.9);padding:6px 12px;border-radius:20px;border:1px solid var(--line-2);font-weight:600;pointer-events:none}
.sync-indicator.active{color:var(--green-2);border-color:rgba(34,197,94,.5)}
.branch-tab{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.branch-tab-btn{padding:14px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:800;border:1.5px solid var(--line-2);background:linear-gradient(145deg,#0f1428,#080c1a);color:var(--muted)}
.branch-tab-btn.active{background:linear-gradient(135deg,var(--blue),#06b6d4);color:#fff;border-color:transparent}
.branch-summary-box{padding:14px 16px;border-radius:12px;background:linear-gradient(145deg,rgba(6,182,212,.06),rgba(59,130,246,.03));border:1px dashed rgba(6,182,212,.4);margin-bottom:14px;font-size:13px;color:#d0daf5;line-height:1.85}
.branch-summary-box b{color:#fff;font-weight:800}
.online-tick-box{padding:16px 18px;border-radius:16px;margin-top:8px;margin-bottom:16px;background:linear-gradient(145deg,rgba(34,197,94,.08),rgba(59,130,246,.04));border:1px solid rgba(34,197,94,.4)}
.online-tick-label{display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line-2)}
.online-tick-label input[type="checkbox"]{width:22px;height:22px;cursor:pointer;accent-color:#22c55e;flex-shrink:0}
.online-tick-text .title{font-size:14px;font-weight:800;color:#fff}
.online-tick-text .sub{font-size:12.5px;color:#a5b4d8;margin-top:3px;line-height:1.6}
.bank-only-box{padding:16px 18px;border-radius:16px;margin-top:8px;margin-bottom:16px;background:linear-gradient(145deg,rgba(139,92,246,.08),rgba(59,130,246,.04));border:1px solid rgba(139,92,246,.4)}
.bank-only-box .title{font-size:14px;font-weight:800;color:#a78bfa;margin-bottom:12px}
.db-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line-2)}
.db-tab-btn{padding:10px 16px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;border:1px solid var(--line-2);background:linear-gradient(145deg,#0f1428,#080c1a);color:var(--muted)}
.db-tab-btn.active{background:linear-gradient(135deg,var(--blue),#2563eb);color:#fff;border-color:transparent}
.db-tab-btn .cnt{margin-left:6px;padding:1px 8px;border-radius:6px;background:rgba(255,255,255,.15);font-size:11px;font-weight:800}
.db-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.db-search{flex:1;min-width:200px;padding:10px 14px;border-radius:10px;background:#050810;border:1px solid var(--line-2);color:#fff;font-family:inherit;font-size:13.5px;outline:none}
.db-info{font-size:12.5px;color:#a5b4d8;padding:8px 12px;border-radius:8px;background:rgba(59,130,246,.08);border:1px solid var(--line-2)}
.db-json{font-family:'Courier New',monospace;font-size:12px;background:#03060d;border:1px solid var(--line-2);border-radius:12px;padding:16px;overflow-x:auto;color:#c9d5f0;line-height:1.7;max-height:520px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.db-edit-field{margin-bottom:10px}
.db-edit-field label{display:block;font-size:12px;color:#a5b4d8;font-weight:700;margin-bottom:4px;text-transform:uppercase}
.db-edit-field input,.db-edit-field textarea{width:100%;padding:10px 12px;border-radius:8px;background:#050810;border:1px solid var(--line-2);color:#fff;font-family:inherit;font-size:13.5px;outline:none}
.db-edit-field textarea{min-height:80px;resize:vertical;font-family:'Courier New',monospace;font-size:12.5px}
.modal-history{margin-top:24px;padding-top:18px;border-top:2px dashed var(--line-3)}
.modal-history-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:15px;font-weight:800;color:#fff;flex-wrap:wrap}
.modal-history-title span.bar{width:4px;height:22px;border-radius:4px;background:linear-gradient(180deg,#ec4899,#a855f7)}
.notif-container{position:fixed;top:78px;right:18px;z-index:99999;display:flex;flex-direction:column;gap:12px;max-width:420px;width:calc(100% - 36px);pointer-events:none}
.notif-card{pointer-events:auto;position:relative;overflow:hidden;border-radius:18px;padding:16px 18px;background:linear-gradient(150deg,#0f1428,#06091a);border:1.5px solid rgba(59,130,246,.6);box-shadow:0 24px 60px rgba(0,0,0,.95);animation:notifSlide .35s cubic-bezier(.2,1,.3,1);display:flex;gap:14px;align-items:flex-start;backdrop-filter:blur(14px);cursor:pointer}
.notif-card.success{border-color:rgba(34,197,94,.7);background:linear-gradient(150deg,rgba(34,197,94,.18),rgba(6,9,26,.95))}
.notif-card.warning{border-color:rgba(250,204,21,.7);background:linear-gradient(150deg,rgba(250,204,21,.16),rgba(6,9,26,.95))}
.notif-card.danger{border-color:rgba(220,38,38,.7);background:linear-gradient(150deg,rgba(220,38,38,.18),rgba(6,9,26,.95))}
.notif-card.info{border-color:rgba(59,130,246,.7);background:linear-gradient(150deg,rgba(59,130,246,.16),rgba(6,9,26,.95))}
.notif-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex-shrink:0;background:linear-gradient(145deg,rgba(59,130,246,.25),rgba(34,197,94,.1));border:1px solid rgba(59,130,246,.5)}
.notif-card.success .notif-icon{background:linear-gradient(145deg,rgba(34,197,94,.35),rgba(34,197,94,.1));border-color:rgba(34,197,94,.6)}
.notif-card.warning .notif-icon{background:linear-gradient(145deg,rgba(250,204,21,.35),rgba(250,204,21,.1));border-color:rgba(250,204,21,.6)}
.notif-card.danger .notif-icon{background:linear-gradient(145deg,rgba(220,38,38,.35),rgba(220,38,38,.1));border-color:rgba(220,38,38,.6)}
.notif-icon.ring{animation:bellRing .8s ease-in-out}
.notif-content{flex:1;min-width:0}
.notif-title{font-size:14px;font-weight:900;color:#fff;line-height:1.5;margin-bottom:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notif-title .notif-badge{font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(59,130,246,.25);border:1px solid rgba(59,130,246,.5);color:#93c5fd;font-weight:800;text-transform:uppercase}
.notif-title .notif-badge.success{background:rgba(34,197,94,.25);border-color:rgba(34,197,94,.5);color:#4ade80}
.notif-title .notif-badge.warning{background:rgba(250,204,21,.25);border-color:rgba(250,204,21,.5);color:#facc15}
.notif-title .notif-badge.danger{background:rgba(220,38,38,.25);border-color:rgba(220,38,38,.5);color:#f87171}
.notif-body{font-size:12.5px;color:#c9d5f0;line-height:1.85;word-break:break-word}
.notif-body b{color:#fff;font-weight:800}
.notif-body .notif-amt{color:#4ade80;font-weight:900;font-size:15px}
.notif-body .notif-meta{display:block;margin-top:6px;font-size:11px;color:#7a8ab8}
.notif-close{position:absolute;top:8px;right:10px;width:26px;height:26px;border:none;border-radius:8px;background:rgba(255,255,255,.06);color:#a5b4d8;cursor:pointer;font-size:13px;display:grid;place-items:center}
.notif-close:hover{background:rgba(220,38,38,.3);color:#f87171}
.notif-progress{position:absolute;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#3b82f6,#22c55e);animation:notifProgress linear forwards}
.notif-card.success .notif-progress{background:linear-gradient(90deg,#22c55e,#4ade80)}
.notif-card.warning .notif-progress{background:linear-gradient(90deg,#facc15,#f59e0b)}
.notif-card.danger .notif-progress{background:linear-gradient(90deg,#dc2626,#f87171)}
.notif-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.notif-actions button{padding:7px 14px;border-radius:9px;border:1px solid rgba(59,130,246,.4);background:rgba(59,130,246,.15);color:#93c5fd;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
.notif-actions button:hover{background:rgba(59,130,246,.35);color:#fff;transform:translateY(-1px)}
.notif-actions button.primary{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent;color:#fff}
.rt-toast{position:fixed;top:78px;right:18px;z-index:9999;padding:13px 18px;border-radius:14px;background:linear-gradient(135deg,rgba(34,197,94,.95),rgba(59,130,246,.9));color:#fff;font-weight:800;font-size:13.5px;box-shadow:0 12px 40px rgba(0,0,0,.85);animation:slideInRT .35s;display:flex;align-items:center;gap:10px;max-width:340px}
.rt-toast.err{background:linear-gradient(135deg,rgba(220,38,38,.95),rgba(153,27,27,.9))}
@media(max-width:640px){
  .brand h1{font-size:15px}.brand p{font-size:10.5px}
  .topbar{padding:10px 12px}
  main{padding:18px 12px 60px;gap:20px}
  .modal-body{padding:16px}
  .balance-row-top{grid-template-columns:1fr!important}
  .sidebar{width:88vw}
  .card{padding:16px}
  table.tbl th,table.tbl td{font-size:12.5px;padding:10px}
  .btn{font-size:14px;padding:12px 18px}
  .mini{font-size:12.5px;padding:6px 10px}
  .realtime-status,.presence-badge,.net-status,.queue-badge{font-size:10.5px;padding:5px 9px}
  .notif-container{top:70px;right:10px;left:10px;width:auto;max-width:none}
  .notif-card{padding:14px 15px;gap:11px}
  .notif-icon{width:42px;height:42px;font-size:20px;border-radius:12px}
}
@keyframes inputFocusPulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.4)}70%{box-shadow:0 0 0 8px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
@keyframes notePopIn{0%{opacity:0;transform:scale(.85) translateY(6px)}60%{transform:scale(1.04) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}

function computeTxChanges(oldTx, newTx){
  const changes = {};

  keys.forEach(k => {
    const oldV = oldTx ? oldTx[k] : undefined;
    const newV = newTx ? newTx[k] : undefined;
    if(JSON.stringify(oldV) !== JSON.stringify(newV)) changes[k] = { from: oldV, to: newV };
  });
  const oldNotes = JSON.stringify(oldTx?.notesOut || {}) + '|' + JSON.stringify(oldTx?.notesIn || {});
  const newNotes = JSON.stringify(newTx?.notesOut || {}) + '|' + JSON.stringify(newTx?.notesIn || {});
  if(oldNotes !== newNotes){
    changes.notesOut = { from: oldTx?.notesOut || {}, to: newTx?.notesOut || {} };

  }
  return changes;
}

function playNotifSound(type){
  if(!__soundEnabled) return;
  try{
    if(!__audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; __audioCtx = new AC(); }
    if(__audioCtx.state === 'suspended'){ __audioCtx.resume(); }
    const patterns = {
      success:[{f:880,d:.10,t:0},{f:1100,d:.14,t:.11},{f:1320,d:.22,t:.26}],
      danger:[{f:520,d:.16,t:0},{f:420,d:.16,t:.18},{f:520,d:.22,t:.36}],
      warning:[{f:720,d:.13,t:0},{f:720,d:.13,t:.18}],
      info:[{f:620,d:.10,t:0},{f:820,d:.16,t:.12}],
      transfer:[{f:660,d:.10,t:0},{f:880,d:.10,t:.11},{f:1100,d:.20,t:.22}]
    };
    const notes = patterns[type] || patterns.info;
    notes.forEach(n => {
      const osc = __audioCtx.createOscillator(), gain = __audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = n.f;
      gain.gain.setValueAtTime(0, __audioCtx.currentTime + n.t);
      gain.gain.linearRampToValueAtTime(0.28, __audioCtx.currentTime + n.t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, __audioCtx.currentTime + n.t + n.d);
      osc.connect(gain); gain.connect(__audioCtx.destination);
      osc.start(__audioCtx.currentTime + n.t); osc.stop(__audioCtx.currentTime + n.t + n.d + 0.02);
    });
  }catch(e){}
}

function getNetworkType(){
  try{

    if(!conn) return 'unknown';
    const t = (conn.type || '').toLowerCase();
    if(t) return t;
    const et = conn.effectiveType || '';
    if(et === '4g' || et === '5g') return 'fast';
    if(et === '3g') return 'medium';

async function pullRemoteDB(){
  if(!__isRemoteReady || !__supabaseClient) return;
  const res = await withTimeout(
    __supabaseClient.from(window.SUPABASE_TABLE).select('data').eq('id', window.SUPABASE_ROW_ID).maybeSingle(),
    SUPABASE_TIMEOUT_MS, { data: null, error: { message: 'timeout' } }
  );
  if(res && res.data && res.data.data && typeof res.data.data === 'object'){
    const remote = res.data.data;
    const remoteTxCount = (remote.txs || []).length;
    const remoteCustCount = (remote.customers || []).length;
    const localTxCount = (DB()?.txs || []).length;
    const localCustCount = (DB()?.customers || []).length;
    if(remoteTxCount === 0 && remoteCustCount === 0 && (localTxCount > 0 || localCustCount > 0)){
      window.__hasSyncedOnce = true; return;
    }
    const localTs = Date.parse((DB() && DB().__lastUpdate) || 0) || 0;
    const remoteTs = Date.parse(remote.__lastUpdate || 0) || 0;
    if(remoteTs >= localTs || localTxCount === 0){
      __isApplyingRemote = true;
      window.db = remote;
      normalizeDB(); forceFixAdmin(); recalcAllCustomerDues(false); recomputeLive(); saveLocalDB();
      __isApplyingRemote = false;
      window.__hasSyncedOnce = true;
      if(session){ renderTopbar(); renderDashboard(); renderSidebar(); }

  } else { window.__hasSyncedOnce = true; }

function setupRealtime(){
  if(!__isRemoteReady || !__supabaseClient) return;
  try{
    if(__realtimeChannel){ try{ __supabaseClient.removeChannel(__realtimeChannel); }catch(e){} __realtimeChannel = null; }
    updateRealtimeIndicator('connecting');
    const presenceKey = (session?.id || 'anon_' + Date.now() + '_' + Math.random().toString(36).slice(2,6));
    __realtimeChannel = __supabaseClient
      .channel('agent_bank_rt_' + window.SUPABASE_ROW_ID, { config: { presence: { key: presenceKey }, broadcast: { self: false } } })
      .on('postgres_changes', { event: '*', schema: 'public', table: window.SUPABASE_TABLE, filter: 'id=eq.' + window.SUPABASE_ROW_ID }, (payload) => { handleRealtimeUpdate(payload); })
      .on('presence', { event: 'sync' }, () => {
        try{ const state = __realtimeChannel.presenceState(); const flat = Object.values(state).flat(); updatePresenceUI(flat); }catch(e){}
      })
      .subscribe(async (status) => {
        if(status === 'SUBSCRIBED'){
          __realtimeReconnectAttempts = 0;
          updateRealtimeIndicator('online');
          try{ await pullRemoteDB(); }catch(e){}
          try{
            const geo = await fetchGeoLocation(); window.__geoCache = geo;
            await __realtimeChannel.track({ user: (session?.name) || 'অতিথি', username: (session?.username) || '', branch: (session?.branch) || 'all', role: (session?.role) || '', location: geo.label, joined_at: new Date().toISOString() });
          }catch(e){}
        } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){
          updateRealtimeIndicator('error');
          __realtimeReconnectAttempts++;
          const delay = Math.min(1000 * Math.pow(1.5, __realtimeReconnectAttempts - 1), 15000);
          setTimeout(() => { if(navigator.onLine) setupRealtime(); }, delay);
        } else if(status === 'CLOSED'){
          updateRealtimeIndicator('offline');
          setTimeout(() => { if(navigator.onLine) setupRealtime(); }, 3000);
        }
      });
  }catch(e){ updateRealtimeIndicator('error'); setTimeout(() => { if(navigator.onLine) setupRealtime(); }, 5000); }
}
function handleRealtimeUpdate(payload){
  try{
    if(__isApplyingRemote) return;
    if(!payload || payload.eventType === 'DELETE') return;
    const remote = payload.new && payload.new.data;
    if(!remote || typeof remote !== 'object') return;
    const remoteTs = Date.parse(remote.__lastUpdate || 0) || 0;
    const localTs = Date.parse((DB() && DB().__lastUpdate) || 0) || 0;

    __isApplyingRemote = true;

  }catch(e){ __isApplyingRemote = false; }
}

function detectNetworkQuality(){

    __connEffectiveType = conn.effectiveType || 'unknown';
    const et = conn.effectiveType;
    if(!__isOnline || et === 'slow-2g' || et === '2g') return __isOnline ? 'slow' : 'offline';
    if(et === '3g') return 'slow';
    return 'online';
  }catch(e){ return __isOnline ? 'online' : 'offline'; }
}

function performDailyRollover(force){
  const today = todayStr();
  if(!force && DB().__lastRolloverDate === today) return false;
  if(!DB().yearlyArchive) DB().yearlyArchive = {};
  (DB().txs||[]).forEach(t => { if(!t.year && t.date) t.year = t.date.slice(0,4); });
  const currentYear = new Date().getFullYear();
  const keep = [];
  (DB().txs||[]).forEach(t => {
    const ty = parseInt((t.date||'').slice(0,4),10);
    if(!isNaN(ty) && (currentYear - ty) >= ARCHIVE_YEARS_AFTER){
      const y = String(ty); if(!DB().yearlyArchive[y]) DB().yearlyArchive[y] = [];
      DB().yearlyArchive[y].push(t);
    } else keep.push(t);
  });
  DB().txs = keep;
  DB().lastBaseDate = today;
  DB().__lastRolloverDate = today;
  return true;
}
function recomputeLive(){
  const d = DB();
  Object.keys(BRANCHES).forEach(b=>{
    d.liveVault[b] = {};
    DENOMS.forEach(x => d.liveVault[b][x] = Number(d.baseVault[b][x]) || 0);
    d.liveAccounts[b] = { bank: Number(d.baseAccounts[b].bank) || 0, cash: Number(d.baseAccounts[b].cash) || 0, other: Number(d.baseAccounts[b].other) || 0 };
  });
  const sorted = getAllTxs().slice().sort((a,b)=> (a.createdAt || a.date || '').localeCompare(b.createdAt || b.date || ''));
  sorted.forEach(tx=>{
    if(tx.type === 'branch_transfer'){ applyTxToLive(tx, 'send'); if(tx.accepted) applyTxToLive(tx, 'accept'); }
    else applyTxToLive(tx);
  });
  syncLiveCashFromVault();
}
function applyTxToLive(tx, phase){
  const d = DB();
  const bb = tx.branch || 'kalaroa';
  const vb = tx.custBranch || tx.branch || 'kalaroa';
  const ensure = br => { if(!br) return; if(!d.liveAccounts[br]) d.liveAccounts[br] = { bank:0, cash:0, other:0 }; if(!d.liveVault[br]) d.liveVault[br] = {}; DENOMS.forEach(x=>{ if(typeof d.liveVault[br][x] !== 'number') d.liveVault[br][x] = 0; }); };
  ensure(bb); ensure(vb);
  const amt = Number(tx.amount) || 0;
  const nIn = tx.notesIn || {}, nOut = tx.notesOut || {};
  switch(tx.type){
    case 'loan_given':
      if(tx.cashNotTaken){ d.liveAccounts[bb].bank += amt; }
      else if(tx.onlineTransfer && (Number(tx.onlineAmount)||0) > 0){
        const onlineAmt = Number(tx.onlineAmount) || 0;
        const cashAmt = Number(tx.cashAmount) || (amt - onlineAmt);
        d.liveAccounts[bb].bank -= onlineAmt; d.liveAccounts[bb].bank += cashAmt;
        adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1);
      } else { d.liveAccounts[bb].bank += amt; adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      break;
    case 'loan_collection':
      if(tx.collectionMode === 'cash'){ adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      else d.liveAccounts[bb].bank -= amt;
      break;
    case 'loan_received': d.liveAccounts[bb].bank -= amt; adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); break;
    case 'deposit': d.liveAccounts[bb].bank -= amt; adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); break;
    case 'withdrawal': d.liveAccounts[bb].bank += amt; adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); break;
    case 'expense': adjustNotes(d.liveVault[bb], nOut, -1); adjustNotes(d.liveVault[bb], nIn, +1); break;
    case 'branch_transfer': {
      const from = tx.from, to = tx.to;
      if(!from || !to || from === to) break;
      ensure(from); ensure(to);
      const transferNotes = (nOut && Object.keys(nOut).length > 0) ? nOut : nIn;
      if(!transferNotes || !Object.keys(transferNotes).length) break;
      if(phase === 'send') adjustNotes(d.liveVault[from], transferNotes, -1);
      else if(phase === 'accept') adjustNotes(d.liveVault[to], transferNotes, +1);
      break;
    }
    case 'bank_transfer':
      if(tx.dir === 'in') d.liveAccounts[bb].bank += amt;
      else if(tx.dir === 'out') d.liveAccounts[bb].bank -= amt;
      break;
    case 'other_bank':
      if(tx.dir === 'online_in') d.liveAccounts[bb].bank += amt;
      else if(tx.dir === 'online_out') d.liveAccounts[bb].bank -= amt;
      else if(tx.dir === 'in'){ d.liveAccounts[bb].bank += amt; adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); }
      else { d.liveAccounts[bb].bank -= amt; adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      break;
    case 'support':
      if(tx.dir === 'online_support_out') d.liveAccounts[bb].bank -= amt;
      else if(tx.dir === 'online_support_in') d.liveAccounts[bb].bank += amt;
      else if(tx.dir === 'out'){ adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      else { adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); }
      break;
    case 'money_exchange': adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); break;
  }
}

function calculateCustomerDue(accountNo){
  const res = { paid:0, refund:0, net:0, count:0 };
  if(!accountNo) return res;
  const acc = String(accountNo).trim();
  getAllTxs().forEach(t=>{
    if(t.type !== 'support') return;
    if(String(t.custAcc||'').trim() !== acc) return;
    res.count++;
    const amt = Number(t.amount) || 0;
    if(t.dir === 'out' || t.dir === 'online_support_out') res.paid += amt;
    else if(t.dir === 'in' || t.dir === 'online_support_in') res.refund += amt;
  });
  res.paid = Math.round(res.paid*100)/100; res.refund = Math.round(res.refund*100)/100;
  res.net = Math.round((res.paid - res.refund)*100)/100;
  return res;
}
function recalcAllCustomerDues(save){

    if(!map[acc]) map[acc] = { paid:0, refund:0, count:0 };
    const amt = Number(t.amount) || 0;
    if(t.dir === 'out' || t.dir === 'online_support_out') map[acc].paid += amt;
    else if(t.dir === 'in' || t.dir === 'online_support_in') map[acc].refund += amt;

function getPendingCollections(){

    result.push({ ...t, _pending: Math.round(pending*100)/100, _owed: totalOwed, _collected: collected });
  });

function computeStats(bf, date){
  const r = { loan_given:{amt:0,cnt:0}, loan_received:{amt:0,cnt:0}, deposit:{amt:0,cnt:0}, withdrawal:{amt:0,cnt:0},
    transfer:{in:0,out:0,cnt:0}, expense:{amt:0,cnt:0}, other:{in:0,out:0,onlineIn:0,onlineOut:0},
    support:{in:0,out:0,cnt:0}, money_exchange:{in:0,out:0,cnt:0}, bank_transfer:{in:0,out:0,cnt:0} };
  getAllTxs().forEach(t=>{
    const ok = (bf === 'all') || (t.branch === bf) || (t.type === 'branch_transfer' && (t.from === bf || t.to === bf));
    if(!ok) return;
    if(t.type === 'branch_transfer'){
      const accepted = !!t.accepted, sd = t.date || '', ad = t.acceptedDate || '';
      const isS = (t.from === bf), isR = (t.to === bf);
      if(!accepted){ if(bf === 'all'){ r.transfer.out += t.amount; if(!date || sd === date) r.transfer.cnt++; } else { if(isS){ r.transfer.out += t.amount; if(!date || sd === date) r.transfer.cnt++; } } return; }
      if(bf === 'all'){ if(!date || ad === date){ r.transfer.in += t.amount; r.transfer.out += t.amount; r.transfer.cnt++; } }
      else { if(isS){ if(!date || sd === date){ r.transfer.out += t.amount; r.transfer.cnt++; } } if(isR){ if(!date || ad === date){ r.transfer.in += t.amount; if(!isS) r.transfer.cnt++; } } }
      return;
    }
    if(date && t.date !== date) return;
    switch(t.type){
      case 'loan_given': r.loan_given.amt += t.amount; r.loan_given.cnt++; break;
      case 'loan_received': r.loan_received.amt += t.amount; r.loan_received.cnt++; break;
      case 'deposit': r.deposit.amt += t.amount; r.deposit.cnt++; break;
      case 'withdrawal': r.withdrawal.amt += t.amount; r.withdrawal.cnt++; break;
      case 'expense': r.expense.amt += t.amount; r.expense.cnt++; break;
      case 'bank_transfer': if(t.dir === 'in') r.bank_transfer.in += t.amount; else r.bank_transfer.out += t.amount; r.bank_transfer.cnt++; break;
      case 'other_bank':
        if(t.dir === 'in') r.other.in += t.amount; else if(t.dir === 'online_in') r.other.onlineIn += t.amount;
        else if(t.dir === 'out') r.other.out += t.amount; else if(t.dir === 'online_out') r.other.onlineOut += t.amount;
        break;
      case 'support': if(t.dir === 'online_support_out' || t.dir === 'out') r.support.out += t.amount; else r.support.in += t.amount; r.support.cnt++; break;
      case 'money_exchange': r.money_exchange.out += Number(t.notesOutSum)||0; r.money_exchange.in += Number(t.notesInSum)||0; r.money_exchange.cnt++; break;
    }
  });
  return r;
}

function openAuditLogModal(){
  const logs = getAllTxLogs();
  if(!logs.length){ openModal({ title: '📜 সব লেনদেনের ইতিহাস', wide: true, bodyHTML: '<div class="empty">📭 এখনো কোনো ইতিহাস নেই</div>' }); return; }
  const actionLabels = { create:{label:'🆕 তৈরি',color:'#22c55e'}, update:{label:'✏️ আপডেট',color:'#facc15'}, delete:{label:'🗑️ ডিলিট',color:'#dc2626'}, accept:{label:'✅ গ্রহণ',color:'#06b6d4'}, collect:{label:'💰 সংগ্রহ',color:'#a78bfa'} };
  let filterAction = 'all', filterUser = 'all', filterTxId = '';
  function buildTable(){
    let filtered = logs.slice();
    if(filterAction !== 'all') filtered = filtered.filter(l => l.action === filterAction);
    if(filterUser !== 'all') filtered = filtered.filter(l => l.username === filterUser);
    if(filterTxId.trim()) filtered = filtered.filter(l => (l.txId || '').toLowerCase().includes(filterTxId.trim().toLowerCase()));
    if(!filtered.length) return '<div class="empty">📭 কোনো এন্ট্রি নেই</div>';
    return '<div style="max-height:60vh;overflow-y:auto">' + filtered.slice(0, 500).map(log => {
      const a = actionLabels[log.action] || { label: log.action, color: '#7a8ab8' };
      const tx = findTxAnywhere(log.txId)?.tx;
      const txLabel = tx ? (TX_CFG[tx.type]?.icon || '') + ' ' + (TX_CFG[tx.type]?.title || tx.type) : '❓';
      const txAmt = tx ? '৳ ' + fmt(tx.amount) : '—';
      let changeSummary = '';
      if(log.changes){
        const keys = Object.keys(log.changes).slice(0, 3);
        changeSummary = keys.map(k => '<span style="font-size:11px;color:#93c5fd">' + esc(k) + '</span>').join(' • ');
        if(Object.keys(log.changes).length > 3) changeSummary += ' • +' + (Object.keys(log.changes).length - 3);
      }
      return '<div style="padding:10px 12px;border-radius:10px;background:linear-gradient(145deg,#0f1428,#07091a);border:1px solid ' + a.color.replace(')', ',.35)').replace('rgb','rgba') + ';margin-bottom:8px;cursor:pointer" data-log-txid="' + esc(log.txId) + '"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><div style="display:inline-block;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:900;color:' + a.color + ';background:' + a.color.replace(')', ',.15)').replace('rgb','rgba') + ';border:1px solid ' + a.color + '">' + a.label + '</div><div style="margin-top:6px;font-size:12.5px;color:#fff;font-weight:800">👤 ' + esc(log.user) + ' <span style="color:#7a8ab8;font-weight:600;font-size:11px">(' + (log.role === 'admin' ? '👑 অ্যাডমিন' : '👤 ইউজার') + ')</span></div><div style="margin-top:3px;font-size:11.5px;color:#a5b4d8">🏦 ' + esc(log.branch) + ' • 📱 ' + esc(log.device) + (log.location ? ' • 📍 ' + esc(log.location) : '') + '</div><div style="margin-top:5px;font-size:12px;color:#fde047"><b>' + txLabel + '</b> • <b style="color:#4ade80">' + txAmt + '</b>' + (changeSummary ? ' <span style="color:#7a8ab8">|</span> ' + changeSummary : '') + '</div></div><div style="text-align:right;font-size:11px;color:#93c5fd;font-weight:700;white-space:nowrap">' + esc(fmtDateTime(log.at)) + '</div></div></div>';
    }).join('') + '</div>';
  }
  const users = [...new Set(logs.map(l => l.username).filter(Boolean))];
  const userOptions = '<option value="all">— সব ইউজার —</option>' + users.map(u => '<option value="' + esc(u) + '">' + esc(u) + '</option>').join('');
  openModal({ title: '📜 সব লেনদেনের ইতিহাস (' + toBn(logs.length) + ' এন্ট্রি)', xwide: true,
    bodyHTML: '<div class="accept-head" style="margin-bottom:12px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px"><div><div style="color:#a5b4d8;font-size:12px;font-weight:700">📊 মোট এন্ট্রি</div><div style="color:#fff;font-size:20px;font-weight:900">' + toBn(logs.length) + '</div></div><div><div style="color:#a5b4d8;font-size:12px;font-weight:700">🆕 তৈরি</div><div style="color:#4ade80;font-size:20px;font-weight:900">' + toBn(logs.filter(l=>l.action==='create').length) + '</div></div><div><div style="color:#a5b4d8;font-size:12px;font-weight:700">✏️ আপডেট</div><div style="color:#facc15;font-size:20px;font-weight:900">' + toBn(logs.filter(l=>l.action==='update').length) + '</div></div><div><div style="color:#a5b4d8;font-size:12px;font-weight:700">🗑️ ডিলিট</div><div style="color:#f87171;font-size:20px;font-weight:900">' + toBn(logs.filter(l=>l.action==='delete').length) + '</div></div></div></div><div class="form-row" style="margin-bottom:12px"><div class="field"><label>কাজ</label><select id="al_action"><option value="all">— সব —</option><option value="create">🆕 তৈরি</option><option value="update">✏️ আপডেট</option><option value="delete">🗑️ ডিলিট</option><option value="accept">✅ গ্রহণ</option><option value="collect">💰 সংগ্রহ</option></select></div><div class="field"><label>ইউজার</label><select id="al_user">' + userOptions + '</select></div><div class="field"><label>Tx ID</label><input type="text" id="al_txid" placeholder="আইডি লিখুন..." autocomplete="off"></div></div><div id="al_body"></div>',
    onMount: (w) => {
      const bodyEl = w.querySelector('#al_body');
      function refresh(){ bodyEl.innerHTML = buildTable(); bindRows(); }
      function bindRows(){ bodyEl.querySelectorAll('[data-log-txid]').forEach(el => { el.addEventListener('click', () => { const txId = el.dataset.logTxid; if(findTxAnywhere(txId)) openTxHistoryModal(txId); else toast('❌ লেনদেন পাওয়া যায়নি'); }); }); }
      w.querySelector('#al_action').addEventListener('change', e => { filterAction = e.target.value; refresh(); });
      w.querySelector('#al_user').addEventListener('change', e => { filterUser = e.target.value; refresh(); });
      w.querySelector('#al_txid').addEventListener('input', e => { filterTxId = e.target.value; refresh(); });
      refresh();
    }
  });
}

function buildHistoryHTML(txId, compact){
  const logs = getTxHistory(txId);
  if(!logs.length) return '<div style="padding:14px;text-align:center;color:#7a8ab8;font-size:13px">📭 এই লেনদেনের কোনো ইতিহাস নেই</div>';
  const actionLabels = { create:{label:'🆕 তৈরি',color:'#22c55e',bg:'rgba(34,197,94,.15)'}, update:{label:'✏️ আপডেট',color:'#facc15',bg:'rgba(250,204,21,.15)'}, delete:{label:'🗑️ ডিলিট',color:'#dc2626',bg:'rgba(220,38,38,.15)'}, accept:{label:'✅ গ্রহণ',color:'#06b6d4',bg:'rgba(6,182,212,.15)'}, collect:{label:'💰 সংগ্রহ',color:'#a78bfa',bg:'rgba(167,139,250,.15)'} };
  const fieldNames = { date:'তারিখ', amount:'টাকা', note:'মন্তব্য', type:'ধরন', branch:'আউটলেট', custBranch:'গ্রাহক আউটলেট', custName:'গ্রাহক নাম', custAcc:'অ্যাকাউন্ট', custMobile:'মোবাইল', custAddr:'ঠিকানা', dir:'দিক', bank:'ব্যাংক', onlineAmount:'অনলাইন পরিমাণ', onlineBankName:'অনলাইন ব্যাংক', cashAmount:'ক্যাশ পরিমাণ', cashNotTaken:'ক্যাশ নেয়নি', cashNotTakenAmount:'নেয়নি পরিমাণ', collectionStatus:'সংগ্রহ স্ট্যাটাস', collectedAmount:'সংগৃহীত', accepted:'গৃহীত', acceptedBy:'গৃহীত ইউজার', notesOut:'প্রদান নোট', notesIn:'গ্রহণ নোট', deleted:'ডিলিট স্ট্যাটাস' };
  function formatVal(k, v){
    if(v === null || v === undefined || v === '') return '—';
    if(typeof v === 'object'){ const keys = Object.keys(v).filter(k2 => v[k2] > 0); if(!keys.length) return '—'; return keys.sort((a,b)=>b-a).map(d => '৳'+toBn(d)+'×'+toBn(v[d])).join(', '); }
    if(k === 'amount' || k === 'onlineAmount' || k === 'cashAmount' || k === 'cashNotTakenAmount' || k === 'collectedAmount') return '৳ ' + fmt(v);
    if(k === 'date' || k === 'acceptedDate') return toBn(v);
    if(typeof v === 'boolean') return v ? '✅ হ্যাঁ' : '❌ না';
    return esc(String(v));
  }
  return logs.map((log) => {
    const a = actionLabels[log.action] || { label: log.action, color: '#7a8ab8', bg: 'rgba(122,138,184,.15)' };
    let changesHtml = '';
    if(log.changes && Object.keys(log.changes).length){
      changesHtml = '<div style="margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(59,130,246,.2)"><div style="font-size:10.5px;color:#93c5fd;font-weight:800;margin-bottom:4px">📋 পরিবর্তন:</div>' + Object.keys(log.changes).map(k => { const c = log.changes[k]; if(c && typeof c === 'object' && 'from' in c && 'to' in c){ return '<div style="font-size:11.5px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.08)"><b style="color:#facc15">' + esc(fieldNames[k] || k) + ':</b> <span style="color:#f87171;text-decoration:line-through">' + formatVal(k, c.from) + '</span> <span style="color:#7a8ab8">➜</span> <span style="color:#4ade80;font-weight:700">' + formatVal(k, c.to) + '</span></div>'; } return '<div style="font-size:11.5px;padding:3px 0;color:#a5b4d8">• ' + esc(fieldNames[k] || k) + ': ' + formatVal(k, c) + '</div>'; }).join('') + '</div>';
    }
    return '<div style="padding:' + (compact ? '10px 12px' : '12px 14px') + ';border-radius:10px;background:linear-gradient(145deg,#0f1428,#07091a);border:1px solid ' + a.color.replace(')', ',.4)').replace('rgb','rgba') + ';margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><div style="display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:900;color:' + a.color + ';background:' + a.bg + ';border:1px solid ' + a.color + '">' + a.label + '</div><div style="margin-top:8px;font-size:13px;color:#fff;font-weight:800">👤 ' + esc(log.user) + ' <span style="color:#7a8ab8;font-weight:600;font-size:11px">(' + (log.role === 'admin' ? '👑 অ্যাডমিন' : '👤 ইউজার') + ')</span></div><div style="margin-top:4px;font-size:11.5px;color:#a5b4d8">🏦 ' + esc(log.branch) + ' &nbsp;•&nbsp; 📱 ' + esc(log.device) + (log.location ? ' &nbsp;•&nbsp; 📍 ' + esc(log.location) : '') + '</div></div><div style="text-align:right;font-size:11.5px;color:#93c5fd;font-weight:700;white-space:nowrap">' + esc(fmtDateTime(log.at)) + '</div></div>' + changesHtml + '</div>';
  }).join('');
}

async function receiveTransferDirect(id){
  const found = findTxAnywhere(id);
  if(!found || !found.tx || found.tx.accepted){ toast('❌ পাওয়া যায়নি'); return; }
  const t = found.tx;
  if(session.role !== 'admin' && session.branch !== t.to){ toast('❌ শুধু গ্রহণকারী আউটলেট'); return; }
  if(!confirm('গ্রহণ?\n\n' + (BRANCHES[t.from]?.name||'') + ' ➜ ' + (BRANCHES[t.to]?.name||'') + '\n৳ ' + fmt(t.amount))) return;
  const nowISO = new Date().toISOString();
  updateTxAnywhere(id, { accepted: true, acceptedDate: todayStr(), acceptedAt: nowISO, acceptedBy: session.name, updatedAt: nowISO });
  addTxLog(id, 'accept', { accepted: { from: false, to: true }, acceptedBy: { from: '', to: session.name } }, t);
  recomputeLive(); await saveDB();
  try{ await pushRemoteDB(true); }catch(e){}
  toast('✅ গ্রহণ — ৳ ' + fmt(t.amount));
  renderTopbar(); renderDashboard(); renderSidebar();
}

/* ============ গ্রাহক বিস্তারিত ============ */
function openCustomerDetailPopup(accountNo, custName){
  const allTxs = getCustomerAllTxs(accountNo);
  const cust = DB().customers.find(c => c.accountNo === accountNo);
  const name = custName || cust?.name || '-';
  const isAdmin = session.role === 'admin';
  const sTxs = allTxs.filter(t => t.type === 'support');
  const sPaid = sTxs.filter(t => t.dir === 'out' || t.dir === 'online_support_out').reduce((s,t)=> s+Number(t.amount||0),0);
  const sRefund = sTxs.filter(t => t.dir === 'in' || t.dir === 'online_support_in').reduce((s,t)=> s+Number(t.amount||0),0);
  const sNet = sPaid - sRefund;
  openModal({ title: '👤 ' + esc(name) + ' — সম্পূর্ণ লেনদেন', xwide: true,
    bodyHTML: '<div class="cust-box" style="margin-bottom:16px"><div class="head"><h4>👤 গ্রাহকের তথ্য</h4></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;font-size:13.5px;line-height:1.9"><div>অ্যাকাউন্ট: <b style="color:#fff">' + esc(accountNo) + '</b></div><div>নাম: <b style="color:#fff">' + esc(name) + '</b></div><div>মোবাইল: <b style="color:#fff">' + esc(cust?.mobile || '-') + '</b></div><div>আউটলেট: <b style="color:#fff">' + esc(BRANCHES[cust?.branch]?.name || '-') + '</b></div></div></div><div class="accept-head"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px"><div><div style="color:#a5b4d8;font-size:12px;font-weight:700">📊 মোট</div><div style="font-size:22px;font-weight:900;color:#fff" id="cust_stat_total">' + toBn(allTxs.length) + ' টি</div></div><div><div style="color:#a5b4d8;font-size:12px;font-weight:700">🤝 প্রদান</div><div style="font-size:16px;font-weight:800;color:#93c5fd" id="cust_stat_paid">৳ ' + fmt(sPaid) + '</div></div><div><div style="color:#a5b4d8;font-size:12px;font-weight:700">↩️ ফেরত</div><div style="font-size:16px;font-weight:800;color:#4ade80" id="cust_stat_refund">৳ ' + fmt(sRefund) + '</div></div><div><div style="color:#a5b4d8;font-size:12px;font-weight:700">📉 নেট</div><div style="font-size:18px;font-weight:900;color:' + (sNet>0?'#f87171':'#4ade80') + '" id="cust_stat_net">৳ ' + fmt(Math.abs(sNet)) + '</div></div></div></div><div class="bank-hint" style="margin-top:12px;font-size:12.5px">💡 <b>✏️</b> = এডিট &nbsp;•&nbsp; <b>📜</b> = পূর্ণ ইতিহাস &nbsp;•&nbsp; <b>🖨️</b> = প্রিন্ট' + (isAdmin ? ' &nbsp;•&nbsp; <b>🗑️</b> = ডিলিট (শুধু অ্যাডমিন)' : '') + '</div><div class="modal-history"><div class="modal-history-title"><span class="bar"></span> 📋 সব লেনদেন (<span id="cust_tx_count">' + toBn(allTxs.length) + '</span> টি)</div><div id="cust_tx_list"></div></div><div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn green" id="cust_h_support" style="flex:1">🤝 নতুন সাপোর্ট</button><button class="btn cyan" id="cust_h_print" style="flex:1">🖨️ History Print (A4)</button></div>',
    onMount: (w, close) => {
      const listEl = w.querySelector('#cust_tx_list');
      function renderList(){
        const txs = getCustomerAllTxs(accountNo);
        if(!txs.length){ listEl.innerHTML = '<div class="empty">📭 নেই</div>'; return; }
        const rowsHtml = txs.map((t,i) => {
          const cfg = TX_CFG[t.type] || { title:t.type, icon:'📌' };
          const nOut = t.notesOut || {}, nIn = t.notesIn || {};
          const outParts = Object.keys(nOut).filter(k => nOut[k] > 0).sort((a,b)=>b-a).map(d => '৳' + toBn(d) + '×' + toBn(nOut[d]));
          const inParts = Object.keys(nIn).filter(k => nIn[k] > 0).sort((a,b)=>b-a).map(d => '৳' + toBn(d) + '×' + toBn(nIn[d]));
          let notesHtml = '';
          if(outParts.length) notesHtml += '<div style="font-size:11.5px;color:#fde047;margin-top:3px"><b>📤</b> ' + outParts.join(' • ') + '</div>';
          if(inParts.length) notesHtml += '<div style="font-size:11.5px;color:#4ade80;margin-top:3px"><b>📥</b> ' + inParts.join(' • ') + '</div>';
          const noteHtml = t.note ? '<div style="font-size:11.5px;color:#a5b4d8;margin-top:4px;font-style:italic">📝 ' + esc(t.note) + '</div>' : '';
          const detailHtml = (notesHtml || noteHtml) ? (notesHtml + noteHtml) : '<span style="color:#7a8ab8">—</span>';
          const logCount = getTxHistory(t.id).length;
          let actionsHtml = '<button class="mini print-btn" data-action="print" data-txid="' + t.id + '" title="প্রিন্ট">🖨️</button>';
          actionsHtml += ' <button class="mini" data-action="hist" data-txid="' + t.id + '" title="পূর্ণ ইতিহাস" style="background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;border-color:transparent">📜' + (logCount > 0 ? '<span style="font-size:9px;margin-left:2px">' + toBn(logCount) + '</span>' : '') + '</button>';
          actionsHtml += ' <button class="mini" data-action="edit" data-txid="' + t.id + '" title="এডিট" style="background:linear-gradient(135deg,#facc15,#f59e0b);color:#000;border-color:transparent">✏️</button>';
          if(isAdmin){ actionsHtml += ' <button class="mini danger" data-action="del" data-txid="' + t.id + '" title="ডিলিট (শুধু অ্যাডমিন)">🗑️</button>'; }
          return '<tr><td>' + toBn(i+1) + '</td><td>' + toBn(t.date) + '</td><td>' + (cfg.icon||'') + ' <b>' + esc(cfg.title||t.type) + '</b></td><td>' + esc(BRANCHES[t.branch]?.name||'-') + '</td><td class="amt">৳ ' + fmt(t.amount) + '</td><td style="font-size:12px;line-height:1.7">' + detailHtml + '</td><td>' + esc(t.user||'-') + '</td><td style="white-space:nowrap">' + actionsHtml + '</td></tr>';
        }).join('');
        listEl.innerHTML = '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>তারিখ</th><th>ধরন</th><th>আউটলেট</th><th>টাকা</th><th>বিবরণ / মন্তব্য</th><th>ইউজার</th><th>অ্যাকশন</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';
        listEl.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const action = btn.dataset.action, txId = btn.dataset.txid;
            if(action === 'print'){ const t = findTxAnywhere(txId)?.tx; if(t) printSingleTransaction(t); }
            else if(action === 'hist'){ openTxHistoryModal(txId); }
            else if(action === 'edit'){ const t = getAllTxs().find(x => x.id === txId); if(!t){ toast('❌ পাওয়া যায়নি'); return; } close(); setTimeout(() => openTxModal(t.type, txId), 150); }
            else if(action === 'del'){
              if(!isAdmin){ toast('🔒 শুধু অ্যাডমিন ডিলিট করতে পারবে'); return; }
              if(!confirm('🗑️ এই লেনদেন ডিলিট করবেন?\n\nএটি ফিরিয়ে আনা যাবে না।')) return;
              const deletedTx = getAllTxs().find(x => x.id === txId);
              addTxLog(txId, 'delete', { deleted: { from: 'active', to: 'deleted' } }, deletedTx);
              if(!DB().deletedTxIds) DB().deletedTxIds = {};
              DB().deletedTxIds[txId] = new Date().toISOString();
              DB().txs = DB().txs.filter(x => x.id !== txId);
              Object.keys(DB().yearlyArchive || {}).forEach(y => { DB().yearlyArchive[y] = (DB().yearlyArchive[y] || []).filter(x => x.id !== txId); });
              recomputeLive(); await saveDB();
              try{ await pushRemoteDB(true); }catch(e){}
              toast('🗑️ লেনদেন ডিলিট হয়েছে');
              const newTxs = getCustomerAllTxs(accountNo);
              w.querySelector('#cust_tx_count').textContent = toBn(newTxs.length);
              w.querySelector('#cust_stat_total').textContent = toBn(newTxs.length) + ' টি';
              const nS = newTxs.filter(t => t.type === 'support');
              const nP = nS.filter(t => t.dir === 'out' || t.dir === 'online_support_out').reduce((s,t)=> s+Number(t.amount||0),0);
              const nR = nS.filter(t => t.dir === 'in' || t.dir === 'online_support_in').reduce((s,t)=> s+Number(t.amount||0),0);
              w.querySelector('#cust_stat_paid').textContent = '৳ ' + fmt(nP);
              w.querySelector('#cust_stat_refund').textContent = '৳ ' + fmt(nR);
              const netEl = w.querySelector('#cust_stat_net');
              const nNet = nP - nR;
              netEl.textContent = '৳ ' + fmt(Math.abs(nNet));
              netEl.style.color = nNet > 0 ? '#f87171' : '#4ade80';
              renderList(); renderDashboard(); renderSidebar();
            }
          });
        });
      }
      renderList();
      w.querySelector('#cust_h_support').addEventListener('click', ()=>{ close(); openTxModal('support'); });
      w.querySelector('#cust_h_print').addEventListener('click', ()=>{ printCustomerHistory(accountNo, name); });
    }
  });
}

      else if(onL) tA = onA;
      else if(type === 'support') tA = Math.abs(os - is);
      else if(dir === 'in') tA = is;
      else if(dir === 'out') tA = os;
      else tA = Math.abs(os - is);
      if(!isBO && !cNT){
        const vault = DB().liveVault?.[cB] || {};
        const miss = [];
        Object.keys(on).forEach(d => { const n = Number(on[d]) || 0, h = Number(vault[d]) || 0; if(n > h) miss.push({ d, n, h }); });
        if(miss.length > 0 && !editing){ alert('⚠️ নোট কম:\n' + miss.map(m => '৳' + m.d + ' — দরকার ' + m.n + ', আছে ' + m.h).join('\n')); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      }
      let fNote;
      if(isLG && cNT) fNote = 'ক্যাশ নেয়নি — ৳ ' + fmt(cNTA) + ' ব্যাংকে জমা।';
      else if(isLG && oT) fNote = 'ক্যাশ ৳ ' + fmt(cA) + ' + অনলাইন ৳ ' + fmt(oA);
      else fNote = wrap.querySelector('#f_note')?.value.trim() || '';
      const isBtEmpty = !(wrap.querySelector('#bt_amount')?.value || '').trim();
      const isOnlineEmpty = !(wrap.querySelector('#online_amount')?.value || '').trim();
      const isSupportEmpty = !(wrap.querySelector('#support_amount')?.value || '').trim();
      const isCNTEmpty = !(wrap.querySelector('#f_cashNotTakenAmount')?.value || '').trim();
      const isOnlineLGEmpty = !(wrap.querySelector('#f_onlineAmount')?.value || '').trim();
      const finalAmount = isBO ? (isBtEmpty ? null : Math.round(tA*100)/100) : (onL ? (isOnlineEmpty ? null : Math.round(tA*100)/100) : (osL ? (isSupportEmpty ? null : Math.round(tA*100)/100) : Math.round(tA*100)/100));
      const tx = { id: editing ? editing.id : uid(), type, date, branch: tB, custBranch: cB, bank: bk, dir, amount: finalAmount,
        onlineAmount: isLG ? (oT ? (isOnlineLGEmpty ? null : Math.round(oA*100)/100) : null) : ((onL || osL) ? (isOnlineEmpty || isSupportEmpty ? null : tA) : null),
        notesOut: osL ? {} : on, notesIn: osL ? {} : inN,
        custAcc: wrap.querySelector('#f_acc')?.value.trim() || '', custName: wrap.querySelector('#f_name')?.value.trim() || '',
        custMobile: wrap.querySelector('#f_mobile')?.value.trim() || '', custAddr: wrap.querySelector('#f_addr')?.value.trim() || '',
        note: fNote, user: session.name, userUsername: session.username,
        createdAt: editing ? editing.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString(),
        year: date.slice(0,4), accepted: true, acceptedDate: date,
        onlineTransfer: isLG ? oT : false, onlineBankName: isLG && oT ? oBN : null,
        cashAmount: isLG ? Math.round(cA*100)/100 : null, cashNotTaken: isLG ? cNT : false,
        cashNotTakenAmount: isLG && cNT ? (isCNTEmpty ? null : Math.round(cNTA*100)/100) : null };
      if(cNT && !editing){ tx.collectionStatus = 'pending'; tx.collectedAmount = 0; }
      const isCreating = !editing;
      if(!editing){ DB().txs.push(tx); } else { const i = DB().txs.findIndex(x => x.id === editing.id); if(i >= 0) DB().txs[i] = tx; }
      if(cfg.cust && (tx.custAcc || tx.custName)){ const c = upsertCustomer({ accountNo: tx.custAcc, name: tx.custName, mobile: tx.custMobile, address: tx.custAddr, branch: cB }); if(c) tx.custAcc = c.accountNo; }
      if(type === 'support' && tx.custAcc) updateCustomerDueInDB(tx.custAcc, false);
      addTxLog(tx.id, isCreating ? 'create' : 'update', isCreating ? { action: 'new transaction' } : computeTxChanges(editing, tx), tx);
      recomputeLive(); await saveDB();
      try{ if(!editing) await pushRemoteDB(true, [tx]); }catch(e){}
      close(); toast('✅ সংরক্ষিত — ৳ ' + fmt(tA));
      renderDashboard(); renderTopbar(); renderSidebar();
    }catch(e){ alert('❌ ' + e.message); sBtn.disabled = false; sBtn.innerHTML = orig; }
  });
}

lay:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn green" id="me_save" style="flex:1;min-width:160px">💾 সংরক্ষণ</button></div>',

    }
  });
}
