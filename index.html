function setupMoneyExchange(wrap, close, initialBranch){
  const sumOutEl = wrap.querySelector('#me_sumOut');
  const sumInEl = wrap.querySelector('#me_sumIn');
  const netEl = wrap.querySelector('#me_netAmt');
  function currentBranch(){ return wrap.querySelector('#me_branch')?.value || initialBranch; }
  function recalc(){
    const outNotes = readNotes(wrap, 'me_out');
    const inNotes = readNotes(wrap, 'me_in');
    const outSum = noteSum(outNotes), inSum = noteSum(inNotes);
    sumOutEl.textContent = '৳ ' + fmt(outSum);
    sumInEl.textContent = '৳ ' + fmt(inSum);
    netEl.textContent = '৳ ' + fmt(Math.abs(outSum - inSum));
  }
  wrap.querySelectorAll('.note-item input').forEach(i => i.addEventListener('input', recalc));
  recalc();

  /* রিপোর্ট render */
  const meRDate = wrap.querySelector('#me_r_date');
  const meRBody = wrap.querySelector('#me_r_body');
  let currentReportList = [];
  function renderReport(){
    const dateVal = meRDate.value;
    let list = DB().txs.filter(t => t.type === 'money_exchange');
    const bf = currentBranchFilter();
    if(session.role !== 'admin'){
      list = list.filter(t => t.branch === session.branch);
    } else if(bf !== 'all'){
      list = list.filter(t => t.branch === bf);
    }
    if(dateVal) list = list.filter(t => t.date === dateVal);
    list.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
    currentReportList = list;
    meRBody.innerHTML = txListHTML(list, { admin: session.role === 'admin' });
    meRBody.querySelectorAll('[data-edit]').forEach(b =>
      b.addEventListener('click', async () => { close(); openTxModal('money_exchange', b.dataset.edit); }));
    meRBody.querySelectorAll('[data-del]').forEach(b =>
      b.addEventListener('click', async () => {
        if(confirm('ডিলিট?')){ await deleteTx(b.dataset.del); renderReport(); }
      }));
  }
  if(meRDate) meRDate.addEventListener('change', renderReport);
  const meAllBtn = wrap.querySelector('#me_r_all');
  if(meAllBtn) meAllBtn.addEventListener('click', ()=>{ meRDate.value=''; renderReport(); });
  renderReport();

  /* PDF */
  const mePdfBtn = wrap.querySelector('#me_r_pdf');
  if(mePdfBtn){
    mePdfBtn.addEventListener('click', () => {
      const rows = currentReportList.map(t => buildReportRow(t));
      const total = currentReportList.reduce((s,t)=> s + Number(t.amount||0), 0);
      rows.push(['', '', '', '', 'TOTAL', 'BDT ' + fmt(total), '', '', '', '']);
      exportToPDF('Money Exchange Report', REPORT_HEADERS, rows, 'money_exchange.pdf');
    });
  }
  /* XLSX */
  const meXlsxBtn = wrap.querySelector('#me_r_xlsx');
  if(meXlsxBtn){
    meXlsxBtn.addEventListener('click', () => {
      const rows = currentReportList.map(t => buildReportRow(t));
      const total = currentReportList.reduce((s,t)=> s + Number(t.amount||0), 0);
      rows.push(['', '', '', '', 'TOTAL', 'BDT ' + fmt(total), '', '', '', '']);
      exportToXLSX('Money Exchange Report', REPORT_HEADERS, rows, 'money_exchange.xlsx');
    });
  }

  wrap.querySelector('#me_save').addEventListener('click', async () => {
    const br = currentBranch();
    const bankKey = wrap.querySelector('#me_bank').value;
    const dirVal = wrap.querySelector('#me_dir').value;
    const desc = wrap.querySelector('#me_desc').value.trim();
    if(!bankKey){ alert('ব্যাংক নির্বাচন করুন'); return; }
    const outNotes = readNotes(wrap, 'me_out');
    const inNotes = readNotes(wrap, 'me_in');
    const outSum = noteSum(outNotes), inSum = noteSum(inNotes);
    if(outSum === 0 && inSum === 0){ alert('নোট দিন'); return; }
    const v = DB().liveVault[br];
    for(const d in outNotes){
      if((Number(v[d])||0) < Number(outNotes[d])){
        alert('ভল্টে পর্যাপ্ত ৳' + d + ' নেই। আছে: ' + toBn(v[d] || 0));
        return;
      }
    }
    const tx = {
      id: uid(), type: 'money_exchange',
      date: wrap.querySelector('#me_date').value || dashDate,
      branch: br, custBranch: br, from: null, to: null,
      bank: bankKey,
      dir: dirVal,
      amount: Math.round(Math.abs(outSum - inSum) * 100) / 100,
      notesOut: outNotes, notesIn: inNotes,
      custAcc: '', custName: '', custMobile: '', custAddr: '',
      note: desc || 'মানি এক্সচেঞ্জ',
      user: session.name, userUsername: session.username,
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
      accepted: true, acceptedDate: wrap.querySelector('#me_date').value || dashDate,
      acceptedBy: session.name, acceptedByUsername: session.username,
      acceptedAt: new Date().toISOString()
    };
    DB().txs.push(tx);
    await saveDB();
    close();
    renderDashboard();
    toast('✅ মানি এক্সচেঞ্জ — ৳' + fmt(Math.abs(outSum - inSum)));
  });
  wrap.querySelector('#me_close').addEventListener('click', close);
}

  
/* PDF / XLSX */
const REPORT_HEADERS = ['Date','Type','Branch','Customer','Direction','Amount','Description','Notes','User','Time'];

function exportToPDF(title, headers, rows, filename){
  try{
    const { jsPDF } = window.jspdf;
    if(!jsPDF){ toast('❌ PDF নেই', 'err'); return; }
    const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text(title, 40, 40);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.text('Generated: ' + fmtDateTimeEN(new Date().toISOString()) + ' | By: ' + (session?.username || 'System'), 40, 55);
    doc.autoTable({
      head: [headers], body: rows, startY: 70,
      styles: { font: 'helvetica', fontSize: 8, cellPadding: 4, overflow: 'linebreak' },
      headStyles: { fillColor: [124, 58, 237], textColor: 255 },
      alternateRowStyles: { fillColor: [245, 245, 255] },
      margin: { left: 40, right: 40 }
    });
    doc.save(filename || 'report.pdf');
    toast('📄 PDF');
  }catch(e){ console.error(e); toast('❌ PDF failed', 'err'); }
}
function exportToXLSX(title, headers, rows, filename){
  try{
    const aoa = [[title], [], headers, ...rows];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = headers.map(() => ({ wch: 18 }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Report');
    XLSX.writeFile(wb, filename || 'report.xlsx');
    toast('📊 XLSX');
  }catch(e){ console.error(e); toast('❌ XLSX failed', 'err'); }
}
function buildReportRow(t){
  const typeEn = txEN(t.type);
  const branchEn = branchEN(t.branch);
  let description = '', dirText = '';
  if(t.type === 'branch_transfer'){
    description = branchEN(t.from) + ' -> ' + branchEN(t.to);
    description += t.accepted ? ' [ACCEPTED]' : ' [PENDING]';
  } else if(t.type === 'other_bank'){
    const bn = t.bank ? bankEN(t.bank) : '';
    if(t.dir === 'online_in'){ dirText = 'Online In'; description = bn; }
    else if(t.dir === 'online_out'){ dirText = 'Online Out'; description = bn; }
    else if(t.dir === 'in'){ dirText = 'In'; description = bn; }
    else if(t.dir === 'out'){ dirText = 'Out'; description = bn; }
  } else if(t.type === 'support'){
    dirText = t.dir === 'in' ? 'Refund' : 'Paid';
  } else if(t.type === 'money_exchange'){
    const mBank = t.bank ? (BANKS[t.bank]?.en || t.bank) : '';
    const mDir = t.dir === 'in_physical' ? 'Physically In'
              : t.dir === 'in_online' ? 'Online In'
              : t.dir === 'out_physical' ? 'Physically Out'
              : t.dir === 'out_online' ? 'Online Out'
              : '';
    description = [mBank, mDir].filter(x=>x).join(' | ') || 'Money Exchange';
    if(t.note && t.note !== 'মানি এক্সচেঞ্জ'){
      description += ' | Note: ' + t.note;
    }
  } else if(t.dir){
    dirText = t.dir === 'in' ? 'Receive' : 'Give';
  }
  const notesOut = t.notesOut && Object.keys(t.notesOut).length ? noteTextPlain(t.notesOut) : '';
  const notesIn = t.notesIn && Object.keys(t.notesIn).length ? noteTextPlain(t.notesIn) : '';
  let notesStr = '';
  if(notesOut) notesStr += 'OUT: ' + notesOut;
  if(notesIn) notesStr += (notesStr ? ' | ' : '') + 'IN: ' + notesIn;
  if(t.onlineRef) notesStr += (notesStr ? ' | ' : '') + 'Ref: ' + t.onlineRef;
  const custName = t.custName || '', custAcc = t.custAcc || '';
  let customer = '';
  if(hasBengali(custName)){ customer = custAcc ? '(' + custAcc + ')' : '-'; }
  else { customer = (custName || '-') + (custAcc ? ' (' + custAcc + ')' : ''); }
  let userDisplay = t.userUsername || '';
  if(!userDisplay){
    const u = (DB().users||[]).find(x => x.name === t.user);
    if(u) userDisplay = u.username;
  }
  if(!userDisplay) userDisplay = safeEN(t.user, '-');
  return [
    t.date || '-', typeEn, branchEn, customer, dirText || '-',
    'BDT ' + fmt(t.amount), description || '-', notesStr || '-',
    userDisplay, fmtDateTimeEN(t.createdAt)
  ];
}

function txListHTML(list, opts){
  opts = opts || {};
  if(!list.length) return `<div class="empty">📭 কোনো লেনদেন নেই</div>`;
  const rows = list.map(t => {
    const cfg = TX_CFG[t.type] || { title:t.type };
    let extra = '', dirBadge = '';
    if(t.type === 'branch_transfer'){ extra = `${BRANCHES[t.from]?.name||''} ➜ ${BRANCHES[t.to]?.name||''}`; }
else if(t.type === 'other_bank'){
      const bn = t.bank && BANKS[t.bank] ? BANKS[t.bank].name : '';
      let dirLabel = '';
      if(t.dir === 'online_in'){ dirLabel = '💳 অনলাইনে আসা'; dirBadge = ' <span class="badge online">💳</span>'; }
      else if(t.dir === 'online_out'){ dirLabel = '💳 অনলাইন পাঠানো'; dirBadge = ' <span class="badge online">💳</span>'; }
      else if(t.dir === 'in'){ dirLabel = '📥 ফিজিক্যালি আসা'; }
      else if(t.dir === 'out'){ dirLabel = '📤 ফিজিক্যালি পাঠানো'; }
      extra = (bn ? bn + ' • ' : '') + dirLabel;
      if(t.note && t.note !== '-'){
        extra += '<br><small style="color:#8b95c9">📝 ' + esc(t.note) + '</small>';
      }
    }
    else if(t.type === 'money_exchange'){
      const bankName = t.bank ? (BANKS[t.bank]?.name || t.bank) : '';
      const dirLabel = t.dir === 'in_physical' ? '📥 ফিজিক্যালি আনা হল... (+)'
                     : t.dir === 'in_online' ? '💳 অনলাইনে আনা হল... (+)'
                     : t.dir === 'out_physical' ? '📤 ফিজিক্যালি পাঠানো হল... (−)'
                     : t.dir === 'out_online' ? '📤 অনলাইনে পাঠানো হল... (−)'
                     : (t.dir === 'in' ? '📥 গ্রহণ' : t.dir === 'out' ? '📤 প্রদান' : '');
      const outSum = t.notesOut ? Object.keys(t.notesOut).reduce((s,k)=> s + Number(k)*Number(t.notesOut[k]), 0) : 0;
      const inSum  = t.notesIn  ? Object.keys(t.notesIn).reduce((s,k)=> s + Number(k)*Number(t.notesIn[k]), 0) : 0;
      extra = `🏦 ${bankName}<br><span style="color:#ffcb2b">${dirLabel}</span>${t.note && t.note !== 'মানি এক্সচেঞ্জ' ? '<br><small style="color:#8b95c9">📝 ' + esc(t.note) + '</small>' : ''}<br><small>📤 প্রদান: ৳ ${fmt(outSum)} • 📥 গ্রহণ: ৳ ${fmt(inSum)}</small>`;
    }
    else if(t.dir){ extra = t.dir === 'in' ? 'গ্রহণ' : 'প্রদান'; }
    let notesHTML = '';
    if(t.notesOut && Object.keys(t.notesOut).length) notesHTML += `<div style="margin-top:3px"><small style="color:#ffb3d1">📤</small>${noteListInline(t.notesOut,'out')}</div>`;
    if(t.notesIn && Object.keys(t.notesIn).length) notesHTML += `<div style="margin-top:3px"><small style="color:#d3ffa8">📥</small>${noteListInline(t.notesIn,'in')}</div>`;
    if(t.onlineRef) notesHTML += `<div style="margin-top:3px"><small style="color:#22e6ff">🔗 ${esc(t.onlineRef)}</small></div>`;
    let statusBadge = '';
    if(t.type === 'branch_transfer'){
      statusBadge = t.accepted
        ? `<div style="margin-top:4px"><span class="badge accepted">✅</span></div>`
        : '<div style="margin-top:4px"><span class="badge pending">⏳</span></div>';
    }
    let actionBtns = '';
    if(t.type === 'branch_transfer' && !t.accepted){
      const canAccept = session.role === 'admin' || session.branch === t.to;
      if(canAccept) actionBtns += `<button class="mini accept" data-accept="${t.id}">✅</button> `;
    }
    if(opts.admin){
      actionBtns += `<button class="mini" data-edit="${t.id}">✏️</button>
                     <button class="mini danger" data-del="${t.id}">🗑️</button>`;
    }
    return `<tr>
      <td>${toBn(t.date)}</td>
      <td>${cfg.icon||''} ${esc(cfg.title||t.type)}${dirBadge}</td>
      <td>${esc(t.custName||'-')}<br><small style="color:#8b95c9">${esc(t.custAcc||'')}</small><br><span style="font-size:9.5px;padding:2px 6px;border-radius:5px;background:rgba(34,230,255,.15);border:1px solid rgba(34,230,255,.4);color:#22e6ff;display:inline-block;margin-top:3px">🏦 ${esc(BRANCHES[t.custBranch || t.branch]?.name||'-')}</span></td>
      <td>${extra || esc(t.note || '-')}${notesHTML}${statusBadge}</td>
      <td class="amt">৳ ${fmt(t.amount)}</td>
      <td>${esc(t.user||'-')}</td>
      <td style="font-size:11px;white-space:nowrap">${esc(fmtDateTime(t.createdAt))}</td>
      ${opts.admin ? `<td>${actionBtns}</td>` : ''}
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="tbl">
    <thead><tr>
      <th>তারিখ</th><th>ধরন</th><th>গ্রাহক</th><th>বিবরণ ও নোট</th><th>টাকা</th>
      <th>ইউজার</th><th>সময়</th>
      ${opts.admin ? '<th>অ্যাকশন</th>' : ''}
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

        });

        wrap.querySelector('#nc_mobile').value = '';
        wrap.querySelector('#nc_addr').value = '';
        renderList(searchEl.value);
        toast('✅ গ্রাহক যোগ হয়েছে');
      });
      renderList('');
    }
  });
}

  const list = DB().txs.filter(t => t.custAcc === accountNo)
    .sort((a,b)=> (b.date + (b.createdAt||'') < a.date + (a.createdAt||'') ? 1 : -1));
  let rows = '';
  if(list.length){
    rows = list.map((t, i) => {
      const cfg = TX_CFG[t.type] || { title:t.type, icon:'' };
      return `<tr>

        <td>${esc(t.user||'-')}</td>
        <td style="font-size:11px">${esc(fmtDateTime(t.createdAt))}</td>

    }).join('');
  } else {
    rows = `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">📭 নেই</td></tr>`;
  }
  const body = `
    <div class="cust-box" style="margin-bottom:14px">
      <div class="head"><h4>👤 ${esc(cust.name||'-')}</h4></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;font-size:13px;line-height:2">
        <div><span style="color:var(--muted)">অ্যাকাউন্ট:</span> <b class="rgb">${esc(cust.accountNo)}</b></div>
        <div><span style="color:var(--muted)">মোবাইল:</span> <b>${esc(cust.mobile||'-')}</b></div>
        <div><span style="color:var(--muted)">শাখা:</span> <b>${esc(BRANCHES[cust.branch]?.name||'-')}</b></div>
        <div><span style="color:var(--muted)">ঠিকানা:</span> <b>${esc(cust.address||'-')}</b></div>
      </div>

      <tbody>${rows}</tbody>
    </table></div>`;
  openModal({ title: '📄 গ্রাহকের লেনদেন', bodyHTML: body, wide: true });
}

function openAllData(){
  const bf = currentBranchFilter();
  const isAdmin = session.role === 'admin';
  const options = Object.entries(TX_CFG).filter(([k])=> k !== 'customer').map(([k,v]) => `<option value="${k}">${v.icon} ${v.title}</option>`).join('');
  openModal({
    title: '📋 সব ডেটা', wide: true,
    bodyHTML: `
      <div class="form-row">
        <div class="field"><label>ধরন</label>
          <select id="ad_type"><option value="all">— সব —</option>${options}</select></div>
        <div class="field"><label>শুরু</label><input type="date" id="ad_from"></div>
        <div class="field"><label>শেষ</label><input type="date" id="ad_to"></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap">
        <button class="btn pdf" id="ad_pdf">📄 PDF</button>
        <button class="btn xlsx" id="ad_xlsx">📊 XLSX</button>
      </div>
      <div id="ad_body" style="margin-top:16px"></div>`,
    onMount: (wrap) => {
      let currentList = [];
      function render(){
        const ty = wrap.querySelector('#ad_type').value;
        const f = wrap.querySelector('#ad_from').value;
        const tt = wrap.querySelector('#ad_to').value;
        let list = DB().txs.slice();
        if(session.role !== 'admin') list = list.filter(t => t.branch === session.branch || t.from === session.branch || t.to === session.branch || t.custBranch === session.branch);
        else if(bf !== 'all') list = list.filter(t => t.branch === bf || t.from === bf || t.to === bf || t.custBranch === bf);
        if(ty !== 'all') list = list.filter(t => t.type === ty);
        if(f) list = list.filter(t => t.date >= f || (t.acceptedDate && t.acceptedDate >= f));
        if(tt) list = list.filter(t => t.date <= tt || (t.acceptedDate && t.acceptedDate <= tt));
        list.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
        currentList = list;
        const total = list.reduce((s,t)=> s + t.amount, 0);
        wrap.querySelector('#ad_body').innerHTML =
          `<div style="margin-bottom:10px;font-size:13.5px;color:#8b95c9">
             মোট <b style="color:#8dff3f">${toBn(list.length)}</b> • সর্বমোট <b class="rgb">৳ ${fmt(total)}</b>
           </div>` + txListHTML(list, { admin:isAdmin });
        wrap.querySelectorAll('[data-del]').forEach(b =>
          b.addEventListener('click', async ()=>{ if(confirm('ডিলিট?')){ await deleteTx(b.dataset.del); render(); } }));
        wrap.querySelectorAll('[data-edit]').forEach(b =>
          b.addEventListener('click', ()=>{
            const t = DB().txs.find(x=>x.id===b.dataset.edit);
            if(t){ wrap.remove(); openTxModal(t.type, t.id); }
          }));
        wrap.querySelectorAll('[data-accept]').forEach(b =>
          b.addEventListener('click', ()=> acceptTransfer(b.dataset.accept, wrap, 'branch_transfer', null)));
      }
      wrap.querySelector('#ad_type').addEventListener('change', render);
      wrap.querySelector('#ad_from').addEventListener('change', render);
      wrap.querySelector('#ad_to').addEventListener('change', render);
      render();
      wrap.querySelector('#ad_pdf').addEventListener('click', () => {
        const rows = currentList.map(t => buildReportRow(t));
        const total = currentList.reduce((s,t)=> s + Number(t.amount||0), 0);
        rows.push(['', '', '', '', 'TOTAL', 'BDT ' + fmt(total), '', '', '', '']);
        exportToPDF('All Data', REPORT_HEADERS, rows, 'all_data.pdf');
      });
      wrap.querySelector('#ad_xlsx').addEventListener('click', () => {
        const rows = currentList.map(t => buildReportRow(t));
        const total = currentList.reduce((s,t)=> s + Number(t.amount||0), 0);
        rows.push(['', '', '', '', 'TOTAL', 'BDT ' + fmt(total), '', '', '', '']);
        exportToXLSX('All Data', REPORT_HEADERS, rows, 'all_data.xlsx');
      });
    }
  });
}

async function clearAllData(){
  if(session.role !== 'admin') return;
  if(!confirm('⚠️ সব ডেটা মুছে যাবে?')) return;
  if(!confirm('🚨 শেষবার নিশ্চিত করুন।')) return;
  const users = DB().users;
  db = defaultDB();
  db.users = users;
  db.__firstSetupDone = false;
  await saveDB();
  renderDashboard();
  toast('🗑️ ক্লিয়ার');
}

function openUserManager(){
  openModal({
    title: '👥 ইউজার ম্যানেজমেন্ট', wide: true,
    bodyHTML: `
      <div class="form-row">
        <div class="field"><label>নাম</label><input type="text" id="u_name" placeholder="ইউজারের নাম"></div>
        <div class="field"><label>আইডি</label><input type="text" id="u_user" placeholder="login id"></div>
        <div class="field"><label>পাসওয়ার্ড</label><input type="text" id="u_pass" placeholder="password"></div>
        <div class="field"><label>শাখা</label>
          <select id="u_branch">
            <option value="kalaroa">কলারোয়া</option>
            <option value="jhaudanga">ঝাউডাঙ্গা</option>
            <option value="all">সব শাখা</option>
          </select></div>
        <div class="field"><label>রোল</label>
          <select id="u_role">
            <option value="user">👤 ইউজার</option>
            <option value="admin">👑 অ্যাডমিন</option>
          </select></div>
      </div>
      <button class="btn green block" id="u_add" style="margin-top:6px">➕ ইউজার তৈরি</button>
      <div style="margin-top:20px" id="u_list"></div>`,
    onMount: (wrap) => {
      const listBox = wrap.querySelector('#u_list');
      function renderList(){
        listBox.innerHTML = `
          <div class="table-wrap"><table class="tbl">
            <thead><tr>
              <th>নাম</th><th>আইডি</th><th>পাসওয়ার্ড</th><th>শাখা</th><th>রোল</th><th>অ্যাকশন</th>
            </tr></thead>
            <tbody>${DB().users.map(u => {
              const isMe = session.id === u.id;
              const totalAdmins = DB().users.filter(x => x.role === 'admin').length;
              const isLastAdmin = u.role === 'admin' && totalAdmins <= 1;
              return `<tr>
                <td>${esc(u.name)} ${isMe ? '<span class="badge accepted" style="font-size:10px">আপনি</span>' : ''}</td>
                <td><b style="color:#22e6ff">${esc(u.username)}</b></td>
                <td>
                  <div class="pw-cell">
                    <span class="pw-value pw-hidden" data-pw="${esc(u.password || '—')}" data-userid="${u.id}">••••••</span>
                    <button class="mini show" data-show="${u.id}" title="দেখুন">👁️</button>
                  </div>
                </td>
                <td>${u.branch === 'all' ? '<span class="badge cross">সব শাখা</span>' : esc(BRANCHES[u.branch]?.name||'')}</td>
                <td>${u.role === 'admin' ? '<span class="badge accepted">👑</span>' : '<span class="badge online">👤</span>'}</td>
                <td style="white-space:nowrap">
                  <button class="mini edit" data-edit="${u.id}">✏️</button>
                  ${isLastAdmin ? '—' : `<button class="mini danger" data-uid="${u.id}">🗑️</button>`}
                </td>
              </tr>`;
            }).join('')}</tbody>
          </table></div>`;
        listBox.querySelectorAll('[data-show]').forEach(b => {
          b.addEventListener('click', () => {
            const userId = b.dataset.show;
            const pwEl = listBox.querySelector(`.pw-value[data-userid="${userId}"]`);
            if(!pwEl) return;
            if(pwEl.classList.contains('pw-hidden')){
              pwEl.textContent = pwEl.dataset.pw;
              pwEl.classList.remove('pw-hidden');
              b.textContent = '🙈';
            } else {
              pwEl.textContent = '••••••';
              pwEl.classList.add('pw-hidden');
              b.textContent = '👁️';
            }
          });
        });
        listBox.querySelectorAll('[data-edit]').forEach(b => {
          b.addEventListener('click', () => openUserEditModal(b.dataset.edit));
        });
        listBox.querySelectorAll('[data-uid]').forEach(b => {
          b.addEventListener('click', async () => {
            const userId = b.dataset.uid;
            const u = DB().users.find(x => x.id === userId);
            if(!u) return;
            const totalAdmins = DB().users.filter(x => x.role === 'admin').length;
            if(u.role === 'admin' && totalAdmins <= 1){
              alert('⚠️ শেষ অ্যাডমিন অ্যাকাউন্ট ডিলিট করা যাবে না।');
              return;
            }
            if(session.id === userId){
              alert('⚠️ আপনি নিজের অ্যাকাউন্ট ডিলিট করতে পারবেন না।');
              return;
            }
            if(!confirm('ইউজার ডিলিট করবেন: ' + u.name + ' (' + u.username + ')?')) return;
            DB().users = DB().users.filter(x => x.id !== userId);
            await saveDB();
            renderList();
            toast('🗑️ ইউজার ডিলিট হয়েছে: ' + u.username);
          });
        });
      }
      renderList();

      wrap.querySelector('#u_add').addEventListener('click', async () => {
        const name = wrap.querySelector('#u_name').value.trim();
        const user = wrap.querySelector('#u_user').value.trim();
        const pass = wrap.querySelector('#u_pass').value.trim();
        let br = wrap.querySelector('#u_branch').value;
        let role = wrap.querySelector('#u_role').value;
        if(!name || !user || !pass){ alert('সব ঘর পূরণ করুন'); return; }
        if(DB().users.some(u => u.username === user)){ alert('⚠️ এই আইডি ইতিমধ্যে আছে'); return; }
        if(role === 'admin') br = 'all';
        const passwordHash = await sha256(pass);
        DB().users.push({ id:uid(), name, username:user, password: pass, passwordHash, role, branch:br });
        await saveDB();
        wrap.querySelector('#u_name').value = '';
        wrap.querySelector('#u_user').value = '';
        wrap.querySelector('#u_pass').value = '';
        renderList();
        toast('✅ ইউজার তৈরি হয়েছে: ' + user);
      });
    }
  });
}

function openUserEditModal(userId){
  const user = DB().users.find(u => u.id === userId);
  if(!user) return;
  const isLastAdmin = user.role === 'admin' && DB().users.filter(u => u.role === 'admin').length <= 1;
  const body = `
    <div class="accept-head">
      <div>👤 <b>${esc(user.name)}</b> — <b style="color:#22e6ff">${esc(user.username)}</b></div>
    </div>
    <div class="form-row">
      <div class="field"><label>নাম</label><input type="text" id="ue_name" value="${esc(user.name)}"></div>
      <div class="field"><label>আইডি</label><input type="text" id="ue_user" value="${esc(user.username)}"></div>
      <div class="field"><label>পাসওয়ার্ড</label><input type="text" id="ue_pass" value="${esc(user.password || '')}"></div>
      <div class="field"><label>শাখা</label>
        <select id="ue_branch">
          <option value="kalaroa" ${user.branch==='kalaroa'?'selected':''}>কলারোয়া</option>
          <option value="jhaudanga" ${user.branch==='jhaudanga'?'selected':''}>ঝাউডাঙ্গা</option>
          <option value="all" ${user.branch==='all'?'selected':''}>সব শাখা</option>
        </select></div>
      <div class="field"><label>রোল</label>
        <select id="ue_role">
          <option value="user" ${user.role==='user'?'selected':''}>👤 ইউজার</option>
          <option value="admin" ${user.role==='admin'?'selected':''}>👑 অ্যাডমিন</option>
        </select></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
      <button class="btn green" id="ue_save" style="flex:1;min-width:160px">💾 সংরক্ষণ</button>
      <button class="btn gray" id="ue_cancel" style="flex:1;min-width:120px">বাতিল</button>
    </div>`;
  openModal({
    title: '✏️ ইউজার এডিট', bodyHTML: body,
    onMount: (w, close) => {
      w.querySelector('#ue_save').addEventListener('click', async () => {
        const newName = w.querySelector('#ue_name').value.trim();
        const newUser = w.querySelector('#ue_user').value.trim();
        const newPass = w.querySelector('#ue_pass').value.trim();
        let newBr = w.querySelector('#ue_branch').value;
        let newRole = w.querySelector('#ue_role').value;
        if(!newName || !newUser){ alert('নাম ও আইডি দিন'); return; }
        if(DB().users.some(u => u.username === newUser && u.id !== user.id)){ alert('আইডি আছে'); return; }
        if(isLastAdmin && newRole !== 'admin'){
          if(!confirm('একমাত্র অ্যাডমিন। রোল পরিবর্তন?')) return;
        }
        if(newRole === 'admin') newBr = 'all';
        const idx = DB().users.findIndex(u => u.id === user.id);
        if(idx < 0) return;
        const wasCurrent = session.id === user.id;
        DB().users[idx].name = newName;
        DB().users[idx].username = newUser;
        DB().users[idx].password = newPass || DB().users[idx].password;
        if(newPass) DB().users[idx].passwordHash = await sha256(newPass);
        DB().users[idx].branch = newBr;
        DB().users[idx].role = newRole;
        await saveDB();
        if(wasCurrent){
          session = DB().users[idx];
          viewBranch = session.role === 'admin' ? (viewBranch || 'all') : session.branch;
          if(session.role !== 'admin') viewBranch = session.branch;
        }
        close();
        setTimeout(() => {
          document.querySelectorAll('.modal-overlay').forEach(x => x.remove());
          if(wasCurrent){ renderTopbar(); renderDashboard(); }
          openUserManager();
        }, 100);
        toast('✅ আপডেট হয়েছে');
      });
      w.querySelector('#ue_cancel').addEventListener('click', close);
    }
  });
}

function toast(msg){
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:linear-gradient(135deg,#16a34a,#22e6ff);color:#04120a;
    padding:13px 24px;border-radius:14px;font-weight:800;font-size:14px;z-index:999;
    box-shadow:0 16px 40px rgba(0,0,0,.6);opacity:0;transition:.3s;font-family:inherit;max-width:90%;`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(0)'; });
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(20px)'; setTimeout(()=>el.remove(),320); }, 2500);
}

async function doLogin(){
  const btn = $('#loginBtn');
  const err = $('#loginErr');
  const u = $('#loginUser').value.trim();
  const p = $('#loginPass').value.trim();

  if(!u || !p){ err.textContent = 'আইডি ও পাসওয়ার্ড দিন'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> যাচাই হচ্ছে...';
  err.textContent = '';

  try {
    const hash = await sha256(p);
    let user = DB().users.find(x => x.username === u && x.passwordHash === hash);
    if(!user) user = DB().users.find(x => x.username === u && x.password === p);
    if(!user && u === 'admin' && p === 'admin123'){
      user = DB().users.find(x => x.username === 'admin');
      if(user){ user.passwordHash = DEFAULT_HASH_ADMIN; user.password = 'admin123'; }
    }

    if(!user){
      err.textContent = '❌ ভুল আইডি বা পাসওয়ার্ড';
      $('#loginPass').value = '';
      btn.disabled = false;
      btn.innerHTML = '🔐 লগইন করুন';
      return;
    }

    if(!user.passwordHash){ user.passwordHash = hash; }
    if(!user.password){ user.password = p; }

    session = user;
    sessionStorage.setItem(SKEY, user.id);

    viewBranch = user.role === 'admin' ? 'all' : user.branch;
    dashDate = todayStr();
    startApp();

  } catch(e){
    err.textContent = '❌ সমস্যা: ' + e.message;
    btn.disabled = false;
    btn.innerHTML = '🔐 লগইন করুন';
  }
}
function logout(){
  stopSessionTimer();
  sessionStorage.removeItem(SKEY);
  session = null;
  $('#app').classList.add('hidden');
  $('#loginScreen').classList.remove('hidden');
  $('#loginPass').value = '';
  $('#modalRoot').innerHTML = '';
  const btn = $('#loginBtn');
  if(btn){ btn.disabled = false; btn.innerHTML = '🔐 লগইন করুন'; }
}
function startApp(){
  $('#loginScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  performDailyRollover(false);
  dashDate = todayStr();
  isDateViewMode = false;
  renderTopbar();
  renderDashboard();
  saveDB();
  resetSessionTimer();
  lastActivityTime = Date.now();
  if(session && session.role === 'admin' && isSystemEmpty()){
    setTimeout(() => openSetupWizard(), 500);
  }
}

(async function init(){
  try{
    if(!localStorage.getItem('__cleared_v53')){
      localStorage.removeItem('cc_agent_bank_v1');
      localStorage.removeItem('cc_agent_bank_session');
      localStorage.setItem('__cleared_v53', 'yes');
      console.log('🧹 পুরনো localStorage ডেটা একবার ক্লিয়ার করা হয়েছে');
    }
  }catch(e){}

  initSupabase();

  try{
    await loadDB();
  }catch(e){
    console.warn('DB load error:', e);
    db = defaultDB();
    window.db = db;
  }

  bindActivityListeners();

  $('#loginBtn').addEventListener('click', doLogin);
  $('#loginUser').addEventListener('keydown', e => { if(e.key === 'Enter') $('#loginPass').focus(); });
  $('#loginPass').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

  const sid = sessionStorage.getItem(SKEY);
  if(sid){
    const u = DB().users.find(x => x.id === sid);
    if(u){
      session = u;
      viewBranch = u.role === 'admin' ? 'all' : u.branch;
      startApp();
    }
  }

  setInterval(async () => {
    if(supabaseReady){
      try{
        await supabaseClient.from(window.SUPABASE_TABLE).select('id').eq('id', window.SUPABASE_ROW_ID).maybeSingle();
        console.log('✅ Supabase keep-alive ping');
      }catch(e){}
    }
  }, 5 * 24 * 60 * 60 * 1000);
})();
