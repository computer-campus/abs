><div id="me_warn" style="margin-top:10px;display:none"></div><div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn green" id="me_save" style="flex:1;min-width:160px">💾 সংরক্ষণ</button></div>',
    onMount: (w, close) => {
      const so = w.querySelector('#me_sumOut'), si = w.querySelector('#me_sumIn'), ne = w.querySelector('#me_netAmt');
      const getBranchKey = () => { const b = w.querySelector('#me_branch'); return b?.value || tb; };
      function isOD(){ const d = w.querySelector('#me_dir').value; return d === 'in_online' || d === 'out_online'; }
      function recalc(){
        const o = noteSum(readNotes(w, 'me_out')), i = noteSum(readNotes(w, 'me_in'));
        so.textContent = '৳ ' + fmt(o);
        si.textContent = '৳ ' + fmt(i);
        if(isOD()){ const v = parseNum(w.querySelector('#me_online_amount')?.value); ne.textContent = '৳ ' + fmt(v); return; }
        ne.textContent = '৳ ' + fmt(Math.abs(o - i));
      }
      __setupDenomInputs(w, getBranchKey, recalc);
      w.querySelectorAll('input[inputmode="decimal"]').forEach(inp => attachAmountInput(inp, { decimal: true }));
      w.querySelector('#me_online_amount')?.addEventListener('input', recalc);
      w.querySelector('#me_dir').addEventListener('change', ()=>{
        const io = isOD();
        w.querySelector('#me_notes_cols').style.display = io ? 'none' : 'grid';
        w.querySelector('#me_online_box').style.display = io ? 'block' : 'none';
        recalc();
      });
      w.querySelector('#me_dir').dispatchEvent(new Event('change'));
      ['me_out', 'me_in'].forEach(p => updateVaultStock(w, p, getBranchKey()));
      recalc();
      w.querySelector('#me_save').addEventListener('click', async ()=>{
        const b = w.querySelector('#me_save');
        if(b.disabled) return;
        const br = w.querySelector('#me_branch').value, bk = w.querySelector('#me_bank').value, dv = w.querySelector('#me_dir').value;
        const io = isOD();
        const on = io ? {} : readNotes(w, 'me_out'), inN = io ? {} : readNotes(w, 'me_in');
        const os = noteSum(on), is = noteSum(inN);
        let a = 0, oa = 0, orf = '';
        if(io){ oa = parseNum(w.querySelector('#me_online_amount').value); orf = w.querySelector('#me_online_ref').value.trim(); if(oa <= 0){ alert('পরিমাণ দিন'); return; } a = oa; }
        else { if(os === 0 && is === 0){ sorryNoNote(); return; } a = Math.abs(os - is); }
        
        // Vault check
        if(!io){
          const vault = DB().liveVault?.[br] || {};
          const miss = [];
          Object.keys(on).forEach(d => { const n = Number(on[d]) || 0, h = Number(vault[d]) || 0; if(n > h) miss.push({ d, n, h }); });
          if(miss.length > 0){
            miss.forEach(m => { const inp = w.querySelector('#me_out_' + m.d); if(inp){ inp.style.borderColor = 'rgba(220,38,38,.9)'; inp.style.background = 'rgba(220,38,38,.25)'; inp.focus(); } });
            alert('🚫 ভল্টে পর্যাপ্ত নোট নেই!\n\n' + miss.map(m => '৳ ' + toBn(m.d) + ' — দরকার ' + toBn(m.n) + ', আছে ' + toBn(m.h)).join('\n'));
            return;
          }
        }
        
        b.disabled = true;
        const og = b.innerHTML;
        b.innerHTML = '<span class="spinner"></span>';
        try{
          const dV = w.querySelector('#me_date').value || dashDate;
          const tx = { id: uid(), type: 'money_exchange', date: dV, branch: br, custBranch: br, bank: bk, dir: dv, amount: Math.round(a*100)/100, onlineAmount: io ? Math.round(oa*100)/100 : null, onlineRef: io ? orf : null, notesOutSum: Math.round(os*100)/100, notesInSum: Math.round(is*100)/100, notesOut: on, notesIn: inN, note: w.querySelector('#me_desc').value.trim() || 'মানি এক্সচেঞ্জ', user: session.name, userUsername: session.username, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), year: dV.slice(0,4), accepted: true, acceptedDate: dV };
          DB().txs.push(tx);
          addTxLog(tx.id, 'create', { action: 'money exchange' }, tx);
          addActivityLog({ type: 'txn_create', title: '💱 মানি এক্সচেঞ্জ', detail: BRANCHES[br]?.name || '', amount: a, targetId: tx.id });
          close();
          toast('✅ মানি এক্সচেঞ্জ');
          await afterTxSave(tx, true);
        }catch(e){
          alert('❌ ' + e.message);
          b.disabled = false;
          b.innerHTML = og;
        }
      });
    }
  });
}

function openCollectionChildModal(parentId, mode){
  const found = findTxAnywhere(parentId);
  if(!found || !found.tx){ toast('❌ নেই'); return; }
  const parent = found.tx;
  const owed = Number(parent.cashNotTakenAmount) || Number(parent.amount) || 0;
  const collected = Number(parent.collectedAmount) || 0;
  const pending = Math.round((owed - collected)*100)/100;
  if(pending <= 0.01){ toast('✅ সম্পূর্ণ'); return; }
  const isC = mode === 'cash';
  const branchVault = DB().liveVault?.[parent.branch] || {};
  openModal({
    title: isC ? '💵 ক্যাশ সংগ্রহ' : '🌐 অনলাইন সংগ্রহ', wide: true,

    onMount: (w, close) => {
      const so = w.querySelector('#cc_sumOut');
      const getBranchKey = () => { const b = w.querySelector('#cc_branch'); return b?.value || parent.branch; };
      function recalc(){ if(isC && so) so.textContent = '৳ ' + fmt(noteSum(readNotes(w, 'cc_out'))); }
      __setupDenomInputs(w, getBranchKey, recalc);
      w.querySelectorAll('input[inputmode="decimal"]').forEach(inp => attachAmountInput(inp, { decimal: true }));
      if(isC) updateVaultStock(w, 'cc_out', getBranchKey());
      recalc();
      w.querySelector('#cc_save').addEventListener('click', async ()=>{
        const b = w.querySelector('#cc_save');
        if(b.disabled) return;
        const date = w.querySelector('#cc_date').value, br = w.querySelector('#cc_branch').value;
        const amt = Math.round(parseNum(w.querySelector('#cc_amount').value)*100)/100;
        if(amt <= 0){ alert('পরিমাণ দিন'); return; }
        if(amt > pending + 0.01){ alert('পরিমাণ বাকির বেশি হতে পারবে না (সর্বোচ্চ ৳ ' + fmt(pending) + ')'); return; }
        let on = {}, inN = {}, bk = null, pn = '';
        if(isC){
          on = readNotes(w, 'cc_out');
          if(Object.keys(on).length === 0){ sorryNoNote(); return; }
          if(Math.abs(noteSum(on) - amt) > 0.01){ alert('নোট যোগফল ৳ ' + fmt(noteSum(on)) + ' সমান হতে হবে ৳ ' + fmt(amt) + ' এর'); return; }
          const vault = DB().liveVault?.[br] || {};
          const miss = [];
          Object.keys(on).forEach(d => { const n = Number(on[d]) || 0, h = Number(vault[d]) || 0; if(n > h) miss.push({ d, n, h }); });
          if(miss.length > 0){
            miss.forEach(m => { const inp = w.querySelector('#cc_out_' + m.d); if(inp){ inp.style.borderColor = 'rgba(220,38,38,.9)'; inp.style.background = 'rgba(220,38,38,.25)'; inp.focus(); } });
            alert('🚫 ভল্টে পর্যাপ্ত নোট নেই!\n\n' + miss.map(m => '৳ ' + toBn(m.d) + ' — দরকার ' + toBn(m.n) + ', আছে ' + toBn(m.h)).join('\n'));
            return;
          }
        } else {
          bk = w.querySelector('#cc_bank').value;
          pn = w.querySelector('#cc_partner').value.trim();
          if(!pn){ alert('প্রাপক দিন'); return; }
        }
        b.disabled = true;
        const og = b.innerHTML;
        b.innerHTML = '<span class="spinner"></span>';
        try{
          const child = { id: uid(), type: 'loan_collection', date, branch: br, custBranch: parent.custBranch || parent.branch, dir: isC ? 'cash' : 'online_out', amount: amt, notesOut: on, notesIn: inN, bank: bk, partnerName: pn, custAcc: parent.custAcc, custName: parent.custName, note: w.querySelector('#cc_note').value.trim(), linkedParentId: parent.id, collectionMode: isC ? 'cash' : 'online', user: session.name, userUsername: session.username, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), year: date.slice(0,4), accepted: true, acceptedDate: date };
          DB().txs.push(child);
          const nc = Math.round(((Number(parent.collectedAmount) || 0) + amt)*100)/100;
          const ns = nc >= owed - 0.01 ? 'collected' : 'partial';
          updateTxAnywhere(parent.id, { collectedAmount: nc, collectionStatus: ns, updatedAt: new Date().toISOString() });
          addTxLog(parent.id, 'collect', { collectedAmount: { from: collected, to: nc }, collectionStatus: { from: parent.collectionStatus, to: ns } }, parent);
          addTxLog(child.id, 'create', { action: 'collection entry created' }, child);
          addActivityLog({ type: 'txn_collect', title: '💰 ঋণ সংগ্রহ', detail: parent.custName || '', amount: amt, targetId: parent.id });
          close();
          toast('✅ সংগ্রহ — ৳ ' + fmt(amt) + (ns === 'collected' ? ' (সম্পূর্ণ)' : ' (বাকি ৳ ' + fmt(owed - nc) + ')'));
          await afterTxSave(child, true);
          try{ broadcastActivity({ type: 'txn_collect', amount: amt, txId: parent.id, custName: parent.custName }); }catch(e){}
        }catch(e){
          alert('❌ ' + e.message);
          b.disabled = false;
          b.innerHTML = og;
        }
      });
    }
  });
}

async function receiveTransferDirect(id){
  const found = findTxAnywhere(id);
  if(!found || !found.tx || found.tx.accepted){ toast('❌ পাওয়া যায়নি'); return; }
  const t = found.tx;
  if(t.cancelled){ toast('❌ বাতিল'); return; }
  if(!canAcceptTransfer(t)){ toast('❌ শুধু গ্রহণকারী আউটলেট'); return; }
  if(!confirm('গ্রহণ?\n\n' + (BRANCHES[t.from]?.name||'') + ' ➜ ' + (BRANCHES[t.to]?.name||'') + '\n৳ ' + fmt(t.amount))) return;
  const nowISO = new Date().toISOString();
  updateTxAnywhere(id, { accepted: true, acceptedDate: todayStr(), acceptedAt: nowISO, acceptedBy: session.name, updatedAt: nowISO });
  addTxLog(id, 'accept', { accepted: { from: false, to: true }, acceptedBy: { from: '', to: session.name } }, t);
  addActivityLog({ type: 'txn_accept', title: '✅ ট্রান্সফার গৃহীত', detail: (BRANCHES[t.from]?.name||'') + ' ➜ ' + (BRANCHES[t.to]?.name||''), amount: t.amount, targetId: id });
  toast('✅ গ্রহণ — ৳ ' + fmt(t.amount));
  await afterTxSave({ ...t, accepted: true }, false);
}

async function cancelTransferDirect(id){
  const found = findTxAnywhere(id);
  if(!found || !found.tx){ toast('❌ নেই'); return; }
  const t = found.tx;
  if(t.accepted && !t.cancelled){ toast('❌ গৃহীত'); return; }
  if(t.cancelled){ toast('❌ বাতিল'); return; }
  if(!canCancelTransfer(t)){ toast('❌ শুধু প্রেরক'); return; }
  const reason = prompt('🔴 বাতিল?\n\n📤 ' + (BRANCHES[t.from]?.name || '') + '\n📥 ' + (BRANCHES[t.to]?.name || '') + '\n💰 ৳ ' + fmt(t.amount) + '\n\nকারণ:', 'দরকার নেই');
  if(reason === null) return;
  if(!confirm('🔴 নিশ্চিত?')) return;
  const nowISO = new Date().toISOString();
  updateTxAnywhere(id, { accepted: false, cancelled: true, cancelledAt: nowISO, cancelledBy: session.name, cancelReason: reason || 'দরকার নেই', updatedAt: nowISO });
  addTxLog(id, 'delete', { cancelled: { from: false, to: true }, cancelReason: { from: '', to: reason || 'দরকার নেই' } }, t);
  addActivityLog({ type: 'txn_delete', title: '🔴 ট্রান্সফার বাতিল', detail: (BRANCHES[t.from]?.name || '') + ' ➜ ' + (BRANCHES[t.to]?.name || ''), amount: t.amount, targetId: id });
  toast('🔴 বাতিল — ৳ ' + fmt(t.amount));
  await afterTxSave({ ...t, cancelled: true }, false);
}
</script>

<script>
/* ============================================================
   SECTION 40: DB ENGINE
   ============================================================ */
function performDailyRollover(force){
  const today = todayStr();
  if(!force && DB().__lastRolloverDate === today) return false;
  if(!DB().yearlyArchive) DB().yearlyArchive = {};
  (DB().txs||[]).forEach(t => { if(!t.year && t.date) t.year = t.date.slice(0,4); });
  const currentYear = new Date().getFullYear();
  const keep = [];
  (DB().txs||[]).forEach(t => {
    const ty = parseInt((t.date||'').slice(0,4),10);
    if(!isNaN(ty) && (currentYear - ty) >= ARCHIVE_YEARS_AFTER){
      const y = String(ty);
      if(!DB().yearlyArchive[y]) DB().yearlyArchive[y] = [];
      DB().yearlyArchive[y].push(t);
    } else keep.push(t);
  });
  DB().txs = keep;
  DB().lastBaseDate = today;
  DB().__lastRolloverDate = today;
  DB().__lastUpdate = new Date().toISOString();
  return true;
}

function adjustNotes(target, notes, sign){
  if(!notes || !target) return;
  for(const k in notes){
    target[k] = (target[k]||0) + sign * (Number(notes[k])||0);
    if(target[k] < 0) target[k] = 0;
  }
}

function applyTxToLive(tx, phase){
  const d = DB();
  const bb = tx.branch || 'kalaroa';
  const vb = tx.custBranch || tx.branch || 'kalaroa';
  const ensure = br => { if(!br) return; if(!d.liveAccounts[br]) d.liveAccounts[br] = { bank:0, cash:0, other:0 }; if(!d.liveVault[br]) d.liveVault[br] = {}; DENOMS.forEach(x=>{ if(typeof d.liveVault[br][x] !== 'number') d.liveVault[br][x] = 0; }); };
  ensure(bb); ensure(vb);
  const amt = Number(tx.amount) || 0;
  const nIn = tx.notesIn || {}, nOut = tx.notesOut || {};
  switch(tx.type){
    case 'loan_given': {
      // নতুন Logic: Bank += D (total - online - cash)
      const A = Number(tx.amount) || 0;
      const B = Number(tx.onlineAmount) || 0;
      const C = Number(tx.cashAmount) || 0;
      const D = Number(tx.cashNotTakenAmount) || Math.max(0, A - B - C);
      d.liveAccounts[bb].bank += D;
      adjustNotes(d.liveVault[vb], nOut, -1);
      adjustNotes(d.liveVault[vb], nIn, +1);
      break;
    }
    case 'loan_collection':
      if(tx.collectionMode === 'cash'){ adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      else d.liveAccounts[bb].bank -= amt;
      break;
    case 'loan_received':
      d.liveAccounts[bb].bank -= amt;
      adjustNotes(d.liveVault[vb], nIn, +1);
      adjustNotes(d.liveVault[vb], nOut, -1);
      break;
    case 'deposit':
      d.liveAccounts[bb].bank -= amt;
      adjustNotes(d.liveVault[vb], nIn, +1);
      adjustNotes(d.liveVault[vb], nOut, -1);
      break;
    case 'withdrawal':
      d.liveAccounts[bb].bank += amt;
      adjustNotes(d.liveVault[vb], nOut, -1);
      adjustNotes(d.liveVault[vb], nIn, +1);
      break;
    case 'expense':
      adjustNotes(d.liveVault[bb], nOut, -1);
      adjustNotes(d.liveVault[bb], nIn, +1);
      break;
    case 'branch_transfer': {
      const from = tx.from, to = tx.to;
      if(!from || !to || from === to) break;
      ensure(from); ensure(to);
      const transferNotes = (nOut && Object.keys(nOut).length > 0) ? nOut : nIn;
      if(!transferNotes || !Object.keys(transferNotes).length) break;
      if(phase === 'send') adjustNotes(d.liveVault[from], transferNotes, -1);
      else if(phase === 'accept') adjustNotes(d.liveVault[to], transferNotes, +1);
      break;
    }
    case 'bank_transfer':
      if(tx.dir === 'in') d.liveAccounts[bb].bank += amt;
      else if(tx.dir === 'out') d.liveAccounts[bb].bank -= amt;
      break;
    case 'other_bank':
      if(tx.dir === 'online_in') d.liveAccounts[bb].bank += amt;
      else if(tx.dir === 'online_out') d.liveAccounts[bb].bank -= amt;
      else if(tx.dir === 'in'){ d.liveAccounts[bb].bank += amt; adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); }
      else { d.liveAccounts[bb].bank -= amt; adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      break;
    case 'support':
      if(tx.dir === 'online_support_out') d.liveAccounts[bb].bank -= amt;
      else if(tx.dir === 'online_support_in') d.liveAccounts[bb].bank += amt;
      else if(tx.dir === 'out'){ adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      else { adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); }
      break;
    case 'money_exchange':
      adjustNotes(d.liveVault[vb], nOut, -1);
      adjustNotes(d.liveVault[vb], nIn, +1);
      break;
  }
}

function syncLiveCashFromVault(){
  const d = DB();
  Object.keys(BRANCHES).forEach(br=>{
    let total = 0;
    DENOMS.forEach(x => total += (Number(d.liveVault[br][x])||0) * x);
    d.liveAccounts[br].cash = Math.round(total*100)/100;
  });
}

function recomputeLive(){
  const d = DB();
  Object.keys(BRANCHES).forEach(b=>{
    d.liveVault[b] = {};
    DENOMS.forEach(x => d.liveVault[b][x] = Number(d.baseVault[b][x]) || 0);
    d.liveAccounts[b] = { bank: Number(d.baseAccounts[b].bank) || 0, cash: Number(d.baseAccounts[b].cash) || 0, other: Number(d.baseAccounts[b].other) || 0 };
  });
  const sorted = getAllTxs().slice().sort((a,b)=> (a.createdAt || a.date || '').localeCompare(b.createdAt || b.date || ''));
  sorted.forEach(tx=>{
    if(tx.cancelled) return;
    if(tx.type === 'branch_transfer'){ applyTxToLive(tx, 'send'); if(tx.accepted && !tx.cancelled) applyTxToLive(tx, 'accept'); }
    else applyTxToLive(tx);
  });
  syncLiveCashFromVault();
}

function recomputeLiveIncremental(newTx){
  if(!newTx) return;
  if(newTx.cancelled) return;
  const d = DB();
  const bb = newTx.branch || 'kalaroa';
  const vb = newTx.custBranch || newTx.branch || 'kalaroa';
  const ensure = br => { if(!br) return; if(!d.liveAccounts[br]) d.liveAccounts[br] = { bank:0, cash:0, other:0 }; if(!d.liveVault[br]) d.liveVault[br] = {}; DENOMS.forEach(x=>{ if(typeof d.liveVault[br][x] !== 'number') d.liveVault[br][x] = 0; }); };
  ensure(bb); ensure(vb);
  if(newTx.type === 'branch_transfer'){ ensure(newTx.from); ensure(newTx.to); }
  try{
    if(newTx.type === 'branch_transfer'){ applyTxToLive(newTx, 'send'); if(newTx.accepted) applyTxToLive(newTx, 'accept'); }
    else applyTxToLive(newTx);
    syncLiveCashFromVault();
  }catch(e){ recomputeLive(); }
}

/* ============================================================
   SECTION 41: getAllTxs CACHED
   ============================================================ */
function getAllTxs(){
  const db = DB();
  const currentVersion = (db.__lastUpdate || '0') + '|' + (db.txs?.length || 0) + '|' + Object.keys(db.deletedTxIds || {}).length + '|' + Object.keys(db.yearlyArchive || {}).length;
  if(__cachedAllTxs && __cachedAllTxsVersion === currentVersion) return __cachedAllTxs;
  const seen = new Set();
  const result = [];
  const pool = [...(db.txs || [])];
  Object.values(db.yearlyArchive || {}).forEach(arr=>{ if(Array.isArray(arr)) pool.push(...arr); });
  const delSet = new Set(Object.keys(db.deletedTxIds || {}));
  for(const t of pool){
    if(!t || !t.id || delSet.has(t.id) || seen.has(t.id)) continue;
    seen.add(t.id);
    result.push(t);
  }
  __cachedAllTxs = result;
  __cachedAllTxsVersion = currentVersion;
  return result;
}

function getAllTxsForYear(year){
  year = String(year);
  const delSet = new Set(Object.keys(DB().deletedTxIds || {}));
  const fromArch = (DB().yearlyArchive?.[year]) || [];
  const fromMain = (DB().txs||[]).filter(t => (t.date||'').startsWith(year));
  return [...fromArch, ...fromMain].filter(t => !delSet.has(t.id));
}

function findTxAnywhere(id){
  if(!id) return null;
  const m = (DB().txs||[]).find(t => t.id === id);
  if(m) return { tx: m, location: 'main' };
  for(const y in (DB().yearlyArchive||{})){
    const a = DB().yearlyArchive[y] || [];
    const f = a.find(t => t.id === id);
    if(f) return { tx: f, location: 'archive', year: y };
  }
  return null;
}

function updateTxAnywhere(id, updates){
  const found = findTxAnywhere(id);
  if(!found) return false;
  if(found.location === 'main'){
    const i = DB().txs.findIndex(x => x.id === id);
    if(i >= 0){ DB().txs[i] = { ...DB().txs[i], ...updates }; return true; }
  } else {
    const arr = DB().yearlyArchive[found.year] || [];
    const i = arr.findIndex(x => x.id === id);
    if(i >= 0){ arr[i] = { ...arr[i], ...updates }; return true; }
  }
  return false;
}

function getAllBranchTransfers(){
  const all = getAllTxs().filter(t => t.type === 'branch_transfer' && !t.cancelled);
  all.sort((a,b)=>{ const aT = a.accepted ? (a.acceptedAt || a.acceptedDate || '') : (a.createdAt || ''); const bT = b.accepted ? (b.acceptedAt || b.acceptedDate || '') : (b.createdAt || ''); return bT.localeCompare(aT); });
  return all;
}
function getPendingTransfers(){ return getAllBranchTransfers().filter(t => !t.accepted && !t.cancelled); }

function getPendingCountByType(type){
  const bf = currentBranchFilter();
  if(type === 'branch_transfer'){ let l = getPendingTransfers(); if(bf !== 'all') l = l.filter(t => t.to === bf); return l.length; }
  if(type === 'loan_given'){ let l = getAllTxs().filter(t => t.type === 'loan_given' && (t.collectionStatus === 'pending' || t.collectionStatus === 'partial')); if(bf !== 'all') l = l.filter(t => t.branch === bf); return l.length; }
  return 0;
}

function getAllPending(){
  const bf = currentBranchFilter();
  let transfers = getPendingTransfers();
  if(bf !== 'all') transfers = transfers.filter(t => t.to === bf);
  let collections = getPendingCollections();
  if(bf !== 'all') collections = collections.filter(t => t.branch === bf);
  const transferAmt = transfers.reduce((s,t)=> s + (Number(t.amount)||0), 0);
  const collectionAmt = collections.reduce((s,t)=> s + (t._pending||0), 0);
  return { transfers, collections, totalAmount: transferAmt + collectionAmt, totalCount: transfers.length + collections.length };
}

/* ============================================================
   SECTION 42: CUSTOMER DUE CACHED
   ============================================================ */
function calculateCustomerDue(accountNo){
  if(!accountNo) return { paid:0, refund:0, net:0, count:0 };
  const acc = String(accountNo).trim();
  const currentVersion = (DB().__lastUpdate || '0') + '|' + (DB().txs?.length || 0);
  if(__customerDueCache && __customerDueCacheVersion === currentVersion){
    if(__customerDueCache[acc]) return { ...__customerDueCache[acc] };
    return { paid:0, refund:0, net:0, count:0 };
  }
  recalcAllCustomerDues(false);
  if(__customerDueCache && __customerDueCache[acc]) return { ...__customerDueCache[acc] };
  return { paid:0, refund:0, net:0, count:0 };
}

function recalcAllCustomerDues(save){
  const currentVersion = (DB().__lastUpdate || '0') + '|' + (DB().txs?.length || 0);
  if(__customerDueCache && __customerDueCacheVersion === currentVersion){
    (DB().customers || []).forEach(c=>{
      const m = __customerDueCache[c.accountNo] || { paid:0, refund:0, net:0, count:0 };
      c.supportPaid = m.paid; c.supportRefund = m.refund; c.supportDue = m.net; c.supportCount = m.count;
    });
    return;
  }
  const map = {};
  const allTxs = getAllTxs();
  for(let i = 0; i < allTxs.length; i++){
    const t = allTxs[i];
    if(t.type !== 'support') continue;
    const acc = String(t.custAcc || '').trim();
    if(!acc) continue;
    if(!map[acc]) map[acc] = { paid:0, refund:0, count:0 };
    const amt = Number(t.amount) || 0;
    if(t.dir === 'out' || t.dir === 'online_support_out') map[acc].paid += amt;
    else if(t.dir === 'in' || t.dir === 'online_support_in') map[acc].refund += amt;
    map[acc].count++;
  }
  __customerDueCache = {};
  Object.keys(map).forEach(acc => { const m = map[acc]; __customerDueCache[acc] = { paid: Math.round(m.paid*100)/100, refund: Math.round(m.refund*100)/100, net: Math.round((m.paid - m.refund)*100)/100, count: m.count }; });
  __customerDueCacheVersion = currentVersion;
  (DB().customers || []).forEach(c=>{
    const m = __customerDueCache[c.accountNo] || { paid:0, refund:0, net:0, count:0 };
    c.supportPaid = m.paid; c.supportRefund = m.refund; c.supportDue = m.net; c.supportCount = m.count;
  });
}

function updateCustomerDueInDB(accountNo, save){
  if(!accountNo) return null;
  const acc = String(accountNo).trim();
  const c = (DB().customers || []).find(x => x.accountNo === acc);
  if(!c) return null;
  __customerDueCache = null; __customerDueCacheVersion = '';
  const d = calculateCustomerDue(acc);
  c.supportPaid = d.paid; c.supportRefund = d.refund; c.supportDue = d.net; c.supportCount = d.count;
  if(save){ try{ saveDB(); }catch(e){} }
  return c;
}

function getPendingCollections(){
  const result = [];
  getAllTxs().forEach(t => {
    if(t.type !== 'loan_given' || !t.cashNotTaken || t.collectionStatus === 'collected') return;
    const totalOwed = Number(t.cashNotTakenAmount) || Number(t.amount) || 0;
    const collected = Number(t.collectedAmount) || 0;
    const pending = totalOwed - collected;
    if(pending <= 0.01) return;
    result.push({ ...t, _pending: Math.round(pending*100)/100, _owed: totalOwed, _collected: collected });
  });
  result.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  return result;
}

function getCustomerAllTxs(accountNo){
  if(!accountNo) return [];
  const acc = String(accountNo).trim();
  return getAllTxs().filter(t => (t.custAcc && String(t.custAcc).trim() === acc)).sort((a,b)=> (a.createdAt || '').localeCompare(b.createdAt || ''));
}

function upsertCustomer(data){
  if(!data.accountNo && !data.name) return null;
  let c = DB().customers.find(x => (data.accountNo && x.accountNo === data.accountNo) || (!data.accountNo && data.name && x.name === data.name));
  if(c){ c.name = data.name || c.name; c.mobile = data.mobile || c.mobile; c.address = data.address || c.address; if(data.branch) c.branch = data.branch; return c; }
  c = { id: uid(), accountNo: data.accountNo || ('ACC'+Math.floor(Math.random()*900000+100000)), name: data.name || 'অজ্ঞাত', mobile: data.mobile || '', address: data.address || '', branch: data.branch || 'kalaroa', createdAt: new Date().toISOString(), supportPaid:0, supportRefund:0, supportDue:0, supportCount:0 };
  DB().customers.push(c);
  return c;
}

function searchCustomers(q){

}

function getBalancesForDate(dateStr, bf){
  const branches = bf === 'all' ? Object.keys(BRANCHES) : [bf];
  const r = { bank:0, cash:0, other:0 };
  branches.forEach(b=>{
    const la = DB().liveAccounts[b] || {bank:0,cash:0,other:0};
    r.bank += Number(la.bank)||0;
    r.cash += Number(la.cash)||0;
    r.other += Number(la.other)||0;
  });
  return r;
}

function getVaultForDate(dateStr, bf){
  const branches = bf === 'all' ? Object.keys(BRANCHES) : [bf];
  const totals = {}; DENOMS.forEach(d=> totals[d]=0);
  branches.forEach(b=>{ const lv = DB().liveVault[b] || {}; DENOMS.forEach(d=>{ totals[d] += Number(lv[d]) || 0; }); });
  return { totals };
}

function computeStats(bf, date){
  const r = { loan_given:{amt:0,cnt:0}, loan_received:{amt:0,cnt:0}, deposit:{amt:0,cnt:0}, withdrawal:{amt:0,cnt:0}, transfer:{in:0,out:0,cnt:0}, expense:{amt:0,cnt:0}, other:{in:0,out:0,onlineIn:0,onlineOut:0}, support:{in:0,out:0,cnt:0}, money_exchange:{in:0,out:0,cnt:0}, bank_transfer:{in:0,out:0,cnt:0} };
  getAllTxs().forEach(t=>{
    if(t.cancelled) return;
    const ok = (bf === 'all') || (t.branch === bf) || (t.type === 'branch_transfer' && (t.from === bf || t.to === bf));
    if(!ok) return;
    if(t.type === 'branch_transfer'){
      const accepted = !!t.accepted, sd = t.date || '', ad = t.acceptedDate || '';
      const isS = (t.from === bf), isR = (t.to === bf);
      if(!accepted){ if(bf === 'all'){ r.transfer.out += t.amount; if(!date || sd === date) r.transfer.cnt++; } else { if(isS){ r.transfer.out += t.amount; if(!date || sd === date) r.transfer.cnt++; } } return; }
      if(bf === 'all'){ if(!date || ad === date){ r.transfer.in += t.amount; r.transfer.out += t.amount; r.transfer.cnt++; } }
      else { if(isS){ if(!date || sd === date){ r.transfer.out += t.amount; r.transfer.cnt++; } } if(isR){ if(!date || ad === date){ r.transfer.in += t.amount; if(!isS) r.transfer.cnt++; } } }
      return;
    }
    if(date && t.date !== date) return;
    switch(t.type){
      case 'loan_given': r.loan_given.amt += t.amount; r.loan_given.cnt++; break;
      case 'loan_received': r.loan_received.amt += t.amount; r.loan_received.cnt++; break;
      case 'deposit': r.deposit.amt += t.amount; r.deposit.cnt++; break;
      case 'withdrawal': r.withdrawal.amt += t.amount; r.withdrawal.cnt++; break;
      case 'expense': r.expense.amt += t.amount; r.expense.cnt++; break;
      case 'bank_transfer': if(t.dir === 'in') r.bank_transfer.in += t.amount; else r.bank_transfer.out += t.amount; r.bank_transfer.cnt++; break;
      case 'other_bank': if(t.dir === 'in') r.other.in += t.amount; else if(t.dir === 'online_in') r.other.onlineIn += t.amount; else if(t.dir === 'out') r.other.out += t.amount; else if(t.dir === 'online_out') r.other.onlineOut += t.amount; break;
      case 'support': if(t.dir === 'online_support_out' || t.dir === 'out') r.support.out += t.amount; else r.support.in += t.amount; r.support.cnt++; break;
      case 'money_exchange': r.money_exchange.out += Number(t.notesOutSum)||0; r.money_exchange.in += Number(t.notesInSum)||0; r.money_exchange.cnt++; break;
    }
  });
  return r;
}

function printCustomerHistory(accountNo, custName){
  if(!accountNo){ toast('❌ নেই'); return; }
  const allTxs = getCustomerAllTxs(accountNo);
  const cust = DB().customers.find(c => c.accountNo === accountNo);
  const name = custName || cust?.name || '-';
  const sTxs = allTxs.filter(t => t.type === 'support');
  const sPaid = sTxs.filter(t => t.dir === 'out' || t.dir === 'online_support_out').reduce((s,t)=> s+Number(t.amount||0),0);
  const sRefund = sTxs.filter(t => t.dir === 'in' || t.dir === 'online_support_in').reduce((s,t)=> s+Number(t.amount||0),0);
  const sNet = sPaid - sRefund;
  const rows = allTxs.map((t,i) => {
    const cfg = TX_CFG[t.type] || { title:t.type, icon:'📌' };
    const nOut = t.notesOut || {}, nIn = t.notesIn || {};
    const outParts = Object.keys(nOut).filter(k => nOut[k] > 0).sort((a,b)=>b-a).map(d => '৳'+toBn(d)+'×'+toBn(nOut[d]));
    const inParts = Object.keys(nIn).filter(k => nIn[k] > 0).sort((a,b)=>b-a).map(d => '৳'+toBn(d)+'×'+toBn(nIn[d]));
    let notesHtml = '';
    if(outParts.length) notesHtml += '<div style="font-size:9.5px;color:#a16207;margin-top:2px"><b>📤</b> '+outParts.join(' • ')+'</div>';
    if(inParts.length) notesHtml += '<div style="font-size:9.5px;color:#15803d;margin-top:2px"><b>📥</b> '+inParts.join(' • ')+'</div>';
    return '<tr><td style="text-align:center;padding:5px 4px;font-size:10px">'+toBn(i+1)+'</td><td style="white-space:nowrap;padding:5px 4px;font-size:10px">'+toBn(t.date)+'</td><td style="padding:5px 4px;font-size:10px"><b>'+cfg.icon+' '+esc(cfg.title)+'</b>'+notesHtml+'</td><td class="amt" style="padding:5px 4px;font-size:10.5px">৳ '+fmt(t.amount)+'</td></tr>';
  }).join('');
  const body = '<div class="print-title" style="padding:8px 12px;margin-bottom:8px;font-size:14px">👤 গ্রাহক লেনদেন ইতিহাস — '+esc(name)+'<div style="font-size:11px;color:#475569;font-weight:700;margin-top:2px">অ্যাকাউন্ট: '+esc(accountNo)+' • মোবাইল: '+esc(cust?.mobile||'-')+'</div></div><div class="info-grid" style="gap:5px;margin-bottom:6px"><div class="info-cell blue" style="padding:6px 8px"><div class="lbl" style="font-size:9px">মোট লেনদেন</div><div class="val" style="font-size:12px">'+toBn(allTxs.length)+' টি</div></div><div class="info-cell" style="padding:6px 8px"><div class="lbl" style="font-size:9px">সাপোর্ট প্রদান</div><div class="val" style="font-size:12px;color:#1e40af">৳ '+fmt(sPaid)+'</div></div><div class="info-cell green" style="padding:6px 8px"><div class="lbl" style="font-size:9px">সাপোর্ট ফেরত</div><div class="val" style="font-size:12px;color:#15803d">৳ '+fmt(sRefund)+'</div></div></div><div class="summary-line" style="padding:6px 10px;margin-bottom:6px;font-size:11.5px;background:'+(sNet>0?'#fef2f2':'#f0fdf4')+'"><span>📊 নেট সাপোর্ট '+(sNet>0?'(বকেয়া)':'(পরিশোধিত)')+'</span><span style="color:'+(sNet>0?'#b91c1c':'#15803d')+';font-size:12px">৳ '+fmt(Math.abs(sNet))+'</span></div><table class="tbl-print"><thead><tr><th style="width:6%;padding:5px 4px;font-size:9.5px">#</th><th style="width:15%;padding:5px 4px;font-size:9.5px">তারিখ</th><th style="width:60%;padding:5px 4px;font-size:9.5px">ধরন / বিবরণ</th><th style="width:15%;padding:5px 4px;font-size:9.5px;text-align:right">টাকা</th></tr></thead><tbody>'+(rows || '<tr><td colspan="4" style="text-align:center;padding:20px;color:#94a3b8">📭 কোনো লেনদেন নেই</td></tr>')+'</tbody></table>';
  openPrintWindow('গ্রাহক: '+name+' — '+accountNo, body);
}

  }
  if(__renderTimer) clearTimeout(__renderTimer);
  __renderTimer = setTimeout(() => { __renderTimer = null; __actualRenderDashboard(); }, 200);
}

function __actualRenderDashboard(){
  if(!session) return;
  performDailyRollover(false);
  recalcAllCustomerDues(false);
  const bf = currentBranchFilter();
  const st = computeStats(bf, dashDate);
  renderDateBanner();
  renderStats(bf, st);
  renderVault(bf);
  renderBalances(bf, st);
  renderDueSection();
  renderCollectionPendingSection();
}

  if(!BRANCHES[bf] && bf !== 'all') bf = session?.branch || 'kalaroa';

  const totals = v.totals;
  const items = DENOMS.map(d => {
    const c = Number(totals[d]) || 0, amt = c * d, empty = c === 0;

function txListHTML(list, opts){
  opts = opts || {};
  if(!list.length) return '<div class="empty">📭 নেই</div>';
  const MAX_ROWS = 200;
  const totalCount = list.length;
  const hasMore = totalCount > MAX_ROWS;
  const limitedList = hasMore ? list.slice(0, MAX_ROWS) : list;
  const isAdminUser = session && session.role === 'admin';
  const rows = limitedList.map(t => {
    const dirInfo = getDirInfo(t);
    let extra = '';
    if(t.type === 'branch_transfer') extra = (BRANCHES[t.from]?.name||'') + ' ➜ ' + (BRANCHES[t.to]?.name||'');
    if(t.type === 'loan_given' && t.cashNotTaken) extra = '💰 ক্যাশ নেয়নি';
    if(t.type === 'loan_given' && t.collectionStatus === 'partial') extra = '⏳ আংশিক';
    const ab = isAdminUser ? '<button class="mini" data-edit="' + t.id + '">✏️</button><button class="mini danger" data-del="' + t.id + '">🗑️</button><button class="mini print-btn" data-print="' + t.id + '">🖨️</button>' : '<button class="mini" data-edit="' + t.id + '">✏️</button><button class="mini print-btn" data-print="' + t.id + '">🖨️</button>';
    const cn = t.custName || '', ca = t.custAcc || '', cl = !!ca;
    return '<tr class="' + (cl?'clickable-row':'') + '" ' + (cl ? 'data-cust-acc="' + esc(ca) + '" data-cust-name="' + esc(cn) + '"' : '') + '><td>' + toBn(t.date) + '</td><td>' + (dirInfo.icon||'') + ' ' + esc(dirInfo.label||t.type) + '</td><td>' + (cl ? '👤 <b style="color:#4ade80">' + esc(cn) + '</b>' : '—') + '</td><td>' + extra + '</td><td class="amt">৳ ' + fmt(t.amount) + '</td><td>' + esc(t.user||'-') + '</td><td>' + ab + '</td></tr>';
  }).join('');
  const notice = hasMore ? '<div style="padding:10px 14px;margin-bottom:10px;border-radius:10px;background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.3);font-size:13px;color:#facc15;text-align:center">⚠️ প্রথম <b>' + toBn(MAX_ROWS) + '</b> টি দেখানো হচ্ছে — মোট <b>' + toBn(totalCount) + '</b> টি</div>' : '';
  return notice + '<div class="table-wrap"><table class="tbl"><thead><tr><th>তারিখ</th><th>ধরন</th><th>গ্রাহক</th><th>বিবরণ</th><th>টাকা</th><th>ইউজার</th><th>অ্যাকশন</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

async function deleteTx(id){
  if(!requireAdmin('ডিলিট')) return;
  const t = DB().txs.find(x => x.id === id);
  if(!t){ toast('❌ নেই'); return; }
  if(!DB().deletedTxIds) DB().deletedTxIds = {};
  DB().deletedTxIds[id] = new Date().toISOString();
  DB().txs = DB().txs.filter(x=>x.id !== id);
  addTxLog(id, 'delete', { deleted: { from: 'active', to: 'deleted' } }, t);
  addActivityLog({ type: 'txn_delete', title: '🗑️ ডিলিট', detail: (TX_CFG[t?.type]?.title || ''), amount: t?.amount || 0, targetId: id });
  toast('🗑️ ডিলিট');
  await afterTxSave(t, false);
}

function getTableData(n){ const d = DB(); if(!d) return null; return d[n]; }
function getTableCount(n){ const d = getTableData(n); if(d == null) return 0; if(Array.isArray(d)) return d.length; if(typeof d === 'object') return Object.keys(d).length; return 1; }

function openDatabaseBrowser(){
  if(!requireAdmin('ডেটাবেস')) return;
  let activeTab = 'txs', searchQuery = '';
  const editableTables = {
    txs: { label:'💸 লেনদেন', editable: true },
    customers: { label:'🧑 গ্রাহক', editable: true },
    users: { label:'👥 ইউজার', editable: true },
    txEditLog: { label:'📜 অডিট', editable: false },
    activityLog: { label:'🔔 অ্যাক্টিভিটি', editable: false },
    branchCapital: { label:'💵 মূলধন', editable: true },
    baseVault: { label:'🗄️ বেস ভল্ট', editable: true },
    baseAccounts: { label:'🏦 বেস', editable: true },
    liveVault: { label:'⚡ লাইভ ভল্ট', editable: false },
    liveAccounts: { label:'💵 লাইভ', editable: false }
  };
  const tabsHTML = Object.entries(editableTables).map(([k,v]) => '<button class="db-tab-btn" data-dbtab="' + k + '">' + v.label + ' <span class="cnt">' + toBn(getTableCount(k)) + '</span></button>').join('');
  
  openModal({
    title: '🗄️ ডেটাবেস ব্রাউজার (Full Control)', xwide: true,
    bodyHTML: '<div class="db-tabs" id="dbTabs">' + tabsHTML + '</div><div class="db-toolbar"><input type="text" class="db-search" id="dbSearch" placeholder="🔍 খুঁজুন..." autocomplete="off"><span class="db-info" id="dbInfo">—</span></div><div id="dbContent"></div>',
    onMount: (w) => {
      const tabsEl = w.querySelector('#dbTabs'), contentEl = w.querySelector('#dbContent'), infoEl = w.querySelector('#dbInfo');
      function setActive(t){ activeTab = t; tabsEl.querySelectorAll('.db-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.dbtab === t)); renderTable(); }
      function refreshCounts(){ tabsEl.querySelectorAll('.db-tab-btn').forEach(btn => { const k = btn.dataset.dbtab; const cnt = btn.querySelector('.cnt'); if(cnt) cnt.textContent = toBn(getTableCount(k)); }); }
      
      function renderTable(){
        const data = getTableData(activeTab);
        const meta = editableTables[activeTab];
        if(data == null){ contentEl.innerHTML = '<div class="empty">📭 খালি</div>'; infoEl.textContent = '0'; return; }
        
        if(Array.isArray(data)){
          let list = data.slice();
          if(searchQuery){ const q = searchQuery.toLowerCase(); list = list.filter(item => JSON.stringify(item).toLowerCase().includes(q)); }
          infoEl.textContent = 'মোট: ' + toBn(data.length) + ' • দেখানো: ' + toBn(list.length);
          if(!list.length){ contentEl.innerHTML = '<div class="empty">📭 নেই</div>'; return; }
          
          const allKeys = new Set();
          list.forEach(item => { if(item && typeof item === 'object') Object.keys(item).forEach(k => allKeys.add(k)); });
          const dk = Array.from(allKeys).slice(0, 6);
          const canEdit = meta.editable, canDelete = meta.editable;
          
          contentEl.innerHTML = '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th>' + dk.map(k => '<th>' + esc(k) + '</th>').join('') + '<th style="min-width:160px">অ্যাকশন</th></tr></thead><tbody>' +
            list.slice(0, 200).map((item, i) => {
              const originalIndex = data.indexOf(item);
              return '<tr><td>' + toBn(i+1) + '</td>' + dk.map(k => { let v = item[k]; if(v == null) return '<td>—</td>'; if(typeof v === 'object') v = JSON.stringify(v).slice(0,50)+'…'; v = String(v); if(v.length > 60) v = v.slice(0,60)+'…'; return '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(v) + '</td>'; }).join('') + '<td style="white-space:nowrap"><button class="mini show" data-dbview="' + originalIndex + '">👁️</button>' + (canEdit ? ' <button class="mini" data-dbedit="' + originalIndex + '">✏️</button>' : '') + (canDelete ? ' <button class="mini danger" data-dbdel="' + originalIndex + '">🗑️</button>' : '') + '</td></tr>';
            }).join('') + '</tbody></table></div>';
          
          contentEl.querySelectorAll('[data-dbview]').forEach(b => b.addEventListener('click', () => { const item = data[+b.dataset.dbview]; openModal({ title: '👁️ বিস্তারিত (' + activeTab + ')', wide: true, bodyHTML: '<div class="db-json">' + esc(JSON.stringify(item, null, 2)) + '</div>' }); }));
          
          contentEl.querySelectorAll('[data-dbedit]').forEach(b => b.addEventListener('click', () => {
            const idx = +b.dataset.dbedit;
            const item = data[idx];
            if(activeTab === 'txs'){
              if(typeof openTxModal === 'function' && item.type){ w.querySelector('.x').click(); setTimeout(() => openTxModal(item.type, item.id), 150); }
            } else if(activeTab === 'customers'){
              openCustomerEditInline(item, () => { renderTable(); refreshCounts(); });
            } else if(activeTab === 'users'){
              openUserEditInline(item, () => { renderTable(); refreshCounts(); });
            } else {
              openJsonEditor(item, (newData) => { data[idx] = newData; saveDB(); renderTable(); toast('✅ আপডেট'); });
            }
          }));
          
          contentEl.querySelectorAll('[data-dbdel]').forEach(b => b.addEventListener('click', async () => {
            const idx = +b.dataset.dbdel;
            const item = data[idx];
            let confirmMsg = '🗑️ ডিলিট করবেন?\n\n';
            if(activeTab === 'txs') confirmMsg += '📌 ' + (item.type || '') + '\n💰 ৳ ' + fmt(item.amount) + '\n📅 ' + toBn(item.date);
            else if(activeTab === 'customers') confirmMsg += '👤 ' + (item.name || '') + '\n🆔 ' + (item.accountNo || '');
            else if(activeTab === 'users') confirmMsg += '👤 ' + (item.name || '') + '\n🆔 ' + (item.username || '');
            else confirmMsg += JSON.stringify(item).slice(0, 100);
            confirmMsg += '\n\n⚠️ এই ডেটা মুছে যাবে!';
            if(!confirm(confirmMsg)) return;
            if(!confirm('🚨 শেষবার নিশ্চিত?')) return;
            
            if(activeTab === 'txs'){
              if(!DB().deletedTxIds) DB().deletedTxIds = {};
              DB().deletedTxIds[item.id] = new Date().toISOString();
              DB().txs = DB().txs.filter(x => x.id !== item.id);
              addActivityLog({ type: 'txn_delete', title: '🗑️ DB Browser থেকে ডিলিট', detail: (item.type || ''), amount: item.amount, targetId: item.id });
              __invalidateCaches(); recomputeLive();
              await saveDB();
              try{ pushRemoteDB(true).catch(()=>{}); }catch(e){}
              renderTable(); refreshCounts(); toast('🗑️ ডিলিট');
              renderDashboard();
            }
            else if(activeTab === 'customers'){
              DB().customers = DB().customers.filter(x => x.id !== item.id);
              addActivityLog({ type: 'user_delete', title: '🗑️ গ্রাহক ডিলিট', detail: item.name + ' (' + item.accountNo + ')' });
              await saveDB();
              try{ pushRemoteDB(true).catch(()=>{}); }catch(e){}
              renderTable(); refreshCounts(); toast('🗑️ ডিলিট');
            }
            else if(activeTab === 'users'){
              if(item.id === session.id){ toast('❌ নিজেকে ডিলিট নয়'); return; }
              const admins = DB().users.filter(u => u.role === 'admin');

              DB().users = DB().users.filter(x => x.id !== item.id);
              addActivityLog({ type: 'user_delete', title: '🗑️ ইউজার ডিলিট', detail: item.name + ' (' + item.username + ')' });
              await saveDB();
              try{ pushRemoteDB(true).catch(()=>{}); }catch(e){}
              renderTable(); refreshCounts(); toast('🗑️ ডিলিট');
            }
            else {
              delete data[idx];
              await saveDB();
              renderTable(); refreshCounts(); toast('🗑️ ডিলিট');
            }
          }));
        } else {
          const keys = Object.keys(data);
          infoEl.textContent = 'কী: ' + toBn(keys.length);
          contentEl.innerHTML = '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>কী</th><th>মান</th></tr></thead><tbody>' + keys.map((k,i) => { let v = data[k]; if(typeof v === 'object') v = JSON.stringify(v); return '<tr><td>' + toBn(i+1) + '</td><td style="font-family:monospace;color:#93c5fd">' + esc(k) + '</td><td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace;font-size:12px">' + esc(String(v).slice(0,200)) + '</td></tr>'; }).join('') + '</tbody></table></div>';
        }
      }
      
      tabsEl.querySelectorAll('.db-tab-btn').forEach(b => b.addEventListener('click', () => setActive(b.dataset.dbtab)));
      w.querySelector('#dbSearch').addEventListener('input', (e) => { searchQuery = e.target.value; renderTable(); });
      setActive(activeTab);
    }
  });
}

/* ============================================================
   SECTION 55: BACKUP MANAGER
   ============================================================ */
const BACKUP_DB_NAME = 'cc_agent_bank_backups';
const BACKUP_STORE = 'backups';
const BACKUP_DB_VERSION = 1;
const AUTO_BACKUP_MAX = 30;
const AUTO_BACKUP_KEY = 'cc_last_auto_backup_date';
let __backupDB = null;

function openBackupDB(){ return new Promise((resolve, reject) => { if(__backupDB) return resolve(__backupDB); if(!('indexedDB' in window)) return reject(new Error('IndexedDB')); const req = indexedDB.open(BACKUP_DB_NAME, BACKUP_DB_VERSION); req.onupgradeneeded = (e) => { const db = e.target.result; if(!db.objectStoreNames.contains(BACKUP_STORE)){ const store = db.createObjectStore(BACKUP_STORE, { keyPath: 'id' }); store.createIndex('createdAt', 'createdAt'); store.createIndex('isAuto', 'isAuto'); } }; req.onsuccess = (e) => { __backupDB = e.target.result; resolve(__backupDB); }; req.onerror = (e) => reject(e.target.error); }); }
async function saveBackupToStore(data, options){ options = options || {}; const db = await openBackupDB(); const json = JSON.stringify(data); const backup = { id: options.id || uid(), name: options.name || 'ব্যাকআপ', note: options.note || '', isAuto: !!options.isAuto, createdAt: options.createdAt || new Date().toISOString(), size: json.length, txCount: (data.txs || []).length, custCount: (data.customers || []).length, userCount: (data.users || []).length, capital: Number(data.totalCapital) || 0, user: session?.name || 'system', data: data }; return new Promise((resolve, reject) => { const tx = db.transaction(BACKUP_STORE, 'readwrite'); const req = tx.objectStore(BACKUP_STORE).put(backup); req.onsuccess = () => resolve(backup); req.onerror = (e) => reject(e.target.error); }); }
async function getAllBackups(){ const db = await openBackupDB(); return new Promise((resolve, reject) => { const tx = db.transaction(BACKUP_STORE, 'readonly'); const req = tx.objectStore(BACKUP_STORE).getAll(); req.onsuccess = () => { const list = req.result || []; list.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || '')); resolve(list); }; req.onerror = (e) => reject(e.target.error); }); }
async function deleteBackupById(id){ const db = await openBackupDB(); return new Promise((resolve, reject) => { const tx = db.transaction(BACKUP_STORE, 'readwrite'); const req = tx.objectStore(BACKUP_STORE).delete(id); req.onsuccess = () => resolve(true); req.onerror = (e) => reject(e.target.error); }); }
async function clearAllBackups(){ const db = await openBackupDB(); return new Promise((resolve, reject) => { const tx = db.transaction(BACKUP_STORE, 'readwrite'); const req = tx.objectStore(BACKUP_STORE).clear(); req.onsuccess = () => resolve(true); req.onerror = (e) => reject(e.target.error); }); }
function formatBytes(bytes){ if(!bytes || bytes < 0) return '0 B'; const units = ['B','KB','MB','GB']; let i = 0, n = bytes; while(n >= 1024 && i < units.length-1){ n /= 1024; i++; } return n.toFixed(2) + ' ' + units[i]; }
function fmtBackupDate(iso){ if(!iso) return '-'; try{ const d = new Date(iso); if(isNaN(d.getTime())) return '-'; return toBn(String(d.getDate()).padStart(2,'0'))+'/'+toBn(String(d.getMonth()+1).padStart(2,'0'))+'/'+toBn(d.getFullYear())+' '+fmtTimeOnly(iso); }catch(e){ return '-'; } }
async function createBackupSnapshot(name, isAuto, note){ try{ if(!DB()) return null; const snapshot = JSON.parse(JSON.stringify(DB())); snapshot.__backupMeta = { at: new Date().toISOString(), user: session?.name || 'system', reason: isAuto ? 'auto' : 'manual' }; const defaultName = (isAuto ? '🤖 অটো' : '📸 ম্যানুয়াল') + ' — ' + new Date().toLocaleString('en-GB'); const backup = await saveBackupToStore(snapshot, { name: name || defaultName, isAuto: !!isAuto, note: note || '' }); if(isAuto){ const all = await getAllBackups(); const autos = all.filter(b => b.isAuto).sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || '')); if(autos.length > AUTO_BACKUP_MAX){ for(const b of autos.slice(AUTO_BACKUP_MAX)){ await deleteBackupById(b.id); } } } return backup; }catch(e){ console.warn('Backup create failed:', e); return null; } }
async function downloadBackupFile(backup){ if(!backup || !backup.data){ toast('❌ নেই'); return; } try{ const json = JSON.stringify(backup.data, null, 2); const blob = new Blob([json], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); const safeName = String(backup.name || 'backup').replace(/[^a-zA-Z0-9\u0980-\u09FF_-]/g, '_').slice(0, 40); a.href = url; a.download = 'cc_backup_' + safeName + '_' + (backup.createdAt || '').slice(0,10) + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000); toast('📥 ডাউনলোড'); }catch(e){ toast('❌ ' + e.message); } }
async function restoreBackupFromStore(backup, silent){ if(!backup || !backup.data){ toast('❌ নেই'); return false; } if(!requireAdmin('রিস্টোর')) return false; if(!silent){ if(!confirm('♻️ রিস্টোর করবেন?\n\n📦 ' + backup.name + '\n\n⚠️ বর্তমান ডেটা মুছে যাবে!')) return false; } try{ await createBackupSnapshot('🔒 প্রি-রিস্টোর', true, 'auto safety'); window.db = JSON.parse(JSON.stringify(backup.data)); __lastAutoPushTs = ''; normalizeDB(); forceFixAdmin(); __invalidateCaches(); recalcAllCustomerDues(false); recomputeLive(); await saveDB(); try{ await pushRemoteDB(true); }catch(e){} renderTopbar(); renderDashboard(); renderSidebar(); toast('✅ রিস্টোর সফল'); return true; }catch(e){ toast('❌ ' + e.message); return false; } }
async function maybeAutoBackup(){ try{ if(!DB()) return; const last = safeLS_get(AUTO_BACKUP_KEY); const today = todayStr(); if(last === today) return; const txC = (DB().txs || []).length; const cuC = (DB().customers || []).length; if(txC === 0 && cuC === 0) return; await createBackupSnapshot(null, true, 'দৈনিক অটো'); safeLS_set(AUTO_BACKUP_KEY, today); }catch(e){} }

ss="empty">📭 ব্যাকআপ নেই</div>'; return; } listBody.innerHTML = '<div style="max-height:52vh;overflow-y:auto">' + filtered.map(b => { const cardColor = b.isAuto ? '#a78bfa' : '#22c55e'; const badge = b.isAuto ? '🤖 অটো' : '📸 ম্যানুয়াল'; return '<div style="margin-bottom:10px;padding:14px;border-radius:14px;background:linear-gradient(145deg,#0f1428,#07091a);border-left:4px solid ' + cardColor + '"><div style="font-size:14px;font-weight:800;color:#fff;margin-bottom:6px">' + esc(b.name) + ' <span style="font-size:10.5px;color:' + cardColor + '">' + badge + '</span></div><div style="font-size:11.5px;color:#a5b4d8"><span>📅 ' + fmtBackupDate(b.createdAt) + '</span> • <span>💾 ' + formatBytes(b.size) + '</span></div><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="mini" data-bk-dl="' + b.id + '">📥 ডাউনলোড</button><button class="mini accept" data-bk-restore="' + b.id + '">♻️ রিস্টোর</button><button class="mini danger" data-bk-del="' + b.id + '">🗑️ ডিলিট</button></div></div>'; }).join('') + '</div>'; listBody.querySelectorAll('[data-bk-dl]').forEach(btn => btn.addEventListener('click', async () => { const b = _cache.find(x => x.id === btn.dataset.bkDl); if(b) downloadBackupFile(b); })); listBody.querySelectorAll('[data-bk-restore]').forEach(btn => btn.addEventListener('click', async () => { const b = _cache.find(x => x.id === btn.dataset.bkRestore); if(!b) return; const ok = await restoreBackupFromStore(b); if(ok) close(); })); listBody.querySelectorAll('[data-bk-del]').forEach(btn => btn.addEventListener('click', async () => { const b = _cache.find(x => x.id === btn.dataset.bkDel); if(!b) return; if(!confirm('ডিলিট?')) return; try{ await deleteBackupById(b.id); loadAndRender(); }catch(e){ toast('❌ ' + e.message); } })); } w.querySelectorAll('[data-bk-tab]').forEach(btn => btn.addEventListener('click', () => { w.querySelectorAll('[data-bk-tab]').forEach(x => x.classList.remove('active')); btn.classList.add('active'); _currentTab = btn.dataset.bkTab; loadAndRender(); })); w.querySelector('#bk_new').addEventListener('click', async () => { const btn = w.querySelector('#bk_new'); btn.disabled = true; const orig = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span>'; try{ await saveDB(); const b = await createBackupSnapshot(null, false, 'ম্যানুয়াল'); if(b){ toast('✅ ' + formatBytes(b.size)); await loadAndRender(); } } finally { btn.disabled = false; btn.innerHTML = orig; } }); w.querySelector('#bk_download_now').addEventListener('click', async () => { await saveDB(); const json = JSON.stringify(DB(), null, 2); const blob = new Blob([json], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'cc_live_' + todayStr() + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000); toast('📥 ডাউনলোড'); }); w.querySelector('#bk_restore_file').addEventListener('click', () => w.querySelector('#bk_file_input').click()); w.querySelector('#bk_file_input').addEventListener('change', async (e) => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = async (ev) => { try{ const data = JSON.parse(ev.target.result); if(!data || !data.users || !data.baseVault){ alert('❌ ভুল ফাইল'); return; } const ok = await restoreBackupFromStore({ id: 'up_' + Date.now(), name: '📤 ' + f.name, createdAt: new Date().toISOString(), size: f.size, txCount: (data.txs || []).length, custCount: (data.customers || []).length, userCount: (data.users || []).length, capital: data.totalCapital || 0, isAuto: false, data: data }); if(ok) close(); }catch(err){ alert('❌ ' + err.message); } }; r.readAsText(f); e.target.value = ''; }); w.querySelector('#bk_clear_backups').addEventListener('click', async () => { if(prompt('টাইপ করুন: DELETE ALL') !== 'DELETE ALL') return; try{ await clearAllBackups(); toast('✅ মুছে'); loadAndRender(); }catch(e){ toast('❌ ' + e.message); } }); w.querySelector('#bk_clear_all').addEventListener('click', async () => { if(!confirm('🚨 সব ডেটা মুছে যাবে?')) return; const t = prompt('টাইপ করুন: CLEAR'); if(t !== 'CLEAR') return; try{ const admins = DB().users.filter(u => u.username === 'admin'); const fresh = defaultDB(); fresh.users = admins.length ? admins : defaultUsers(); window.db = fresh; normalizeDB(); forceFixAdmin(); recomputeLive(); await saveDB(); try{ await pushRemoteDB(true); }catch(e){} close(); renderTopbar(); renderDashboard(); renderSidebar(); toast('✅ মুছে'); }catch(e){ toast('❌ ' + e.message); } }); await loadAndRender(); } });

async function doLogin(){
  const b = $('#loginBtn'), e = $('#loginErr');
  const u = String($('#loginUser').value || '').replace(/\s+/g, ' ').trim();
  const p = String($('#loginPass').value || '').trim();
  if(!u || !p){ e.textContent = '⚠️ আইডি ও পাসওয়ার্ড দিন'; return; }
  b.disabled = true;
  b.innerHTML = '<span class="spinner"></span> যাচাই...';
  e.textContent = '';
  try{
    if(!DB()){ e.textContent = '❌ ডেটাবেস লোড হয়নি'; b.disabled = false; b.innerHTML = '🔐 লগইন'; return; }
    forceFixAdmin();
    const users = DB().users || [];
    const lowerU = u.toLowerCase();
    let user = users.find(x => String(x.username||'').toLowerCase() === lowerU && verifyPassword(p, x.password));
    if(!user) user = users.find(x => String(x.username||'').toLowerCase() === lowerU && getPlainPassword(x) === p);
    if(!user && lowerU === 'admin' && _akVerify(p)){ forceFixAdmin(); user = DB().users.find(x => x.username === 'admin'); }
    if(!user){ e.textContent = '❌ ইউজার আইডি বা পাসওয়ার্ড ভুল'; $('#loginPass').value = ''; b.disabled = false; b.innerHTML = '🔐 লগইন'; return; }
    session = user;
    try{ sessionStorage.setItem(SKEY, user.id); }catch(ex){}
    viewBranch = user.role === 'admin' ? 'all' : (BRANCHES[user.branch] ? user.branch : 'kalaroa');
    dashDate = todayStr();
    
    if(__isRemoteReady && __supabaseClient && navigator.onLine){ b.innerHTML = '<span class="spinner"></span> ☁️ লোড...'; try{ await pullRemoteDB(); }catch(err){} }
    
    setTimeout(() => { __activityChannelReady = false; if(__activityChannel){ try{ __activityChannel.unsubscribe(); }catch(e){} try{ __supabaseClient.removeChannel(__activityChannel); }catch(e){} __activityChannel = null; } setupActivityChannel(); }, 100);
    
    (function waitAndBroadcastLogin(){ let tries = 0; const MAX_TRIES = 150; const tryBroadcast = () => { tries++; if(__activityChannelReady){ try{ broadcastActivity({ type: 'login' }); addActivityLog({ type: 'login', title: '🔓 লগইন', detail: user.name + ' (' + user.username + ')' }); saveDB(); }catch(ex){} return; } if(tries >= MAX_TRIES){ try{ broadcastActivity({ type: 'login' }); }catch(e){} return; } setTimeout(tryBroadcast, 100); }; setTimeout(tryBroadcast, 200); })();
    
    startApp();
  }catch(err){ e.textContent = '❌ ' + (err.message || 'Error'); b.disabled = false; b.innerHTML = '🔐 লগইন'; }
}

async function logout(){
  try{ if(DB()) await saveDB(); }catch(e){}
  try{ if(__activityChannelReady) broadcastActivity({ type: 'logout' }); else setTimeout(() => { try{ broadcastActivity({ type: 'logout' }); }catch(e){} }, 800); addActivityLog({ type: 'logout', title: '🔒 লগআউট', detail: session?.name || '' }); }catch(e){}
  try{ if(__realtimeChannel && __supabaseClient){ await __realtimeChannel.untrack(); __supabaseClient.removeChannel(__realtimeChannel); __realtimeChannel = null; } }catch(e){}
  try{ if(__activityChannel && __supabaseClient){ __supabaseClient.removeChannel(__activityChannel); __activityChannel = null; __activityChannelReady = false; __activityQueue = []; } }catch(e){}
  try{ if(window.__topbarScrollHandler){ window.removeEventListener('scroll', window.__topbarScrollHandler); window.removeEventListener('touchmove', window.__topbarScrollHandler); window.__topbarScrollHandler = null; } }catch(e){}
  const tb = document.getElementById('topbar'); if(tb) tb.classList.remove('hidden-scroll','scrolled');
  updatePresenceUI([]);
  sessionStorage.removeItem(SKEY);
  session = null;
  viewBranch = 'all';
  dashDate = todayStr();
  isDateViewMode = false;
  $('#app').classList.add('hidden');
  const ls = $('#loginScreen');
  if(ls){ ls.classList.remove('hidden'); ls.style.display = 'flex'; }
  $('#loginPass').value = '';
  $('#loginUser').value = '';
  $('#modalRoot').innerHTML = '';
  const b = $('#loginBtn');
  if(b){ b.disabled = false; b.innerHTML = '🔐 লগইন করুন'; }
}

function startApp(){
  if(!session) return;
  const ls = $('#loginScreen');
  if(ls){ ls.classList.add('hidden'); ls.style.display = ''; }
  $('#app').classList.remove('hidden');
  performDailyRollover(false);
  __invalidateCaches();
  recalcAllCustomerDues(false);
  recomputeLive();
  dashDate = todayStr();
  isDateViewMode = false;
  renderTopbar();
  renderDashboard(true);
  renderSidebar();
  startClock();
  setTimeout(() => { try{ attachTopbarScroll(); }catch(e){} }, 300);
  saveDB();
  setTimeout(() => { try{ maybeAutoBackup(); }catch(e){} }, 4000);
  setTimeout(() => { try{ if(__realtimeChannel && __realtimeChannel.state === 'joined'){ __realtimeChannel.track({ user: session.name, username: session.username, branch: session.branch || 'all', role: session.role, location: (window.__geoCache && window.__geoCache.label) || '', joined_at: new Date().toISOString() }).catch(()=>{}); } }catch(e){} }, 800);
}

function attachTopbarScroll(){
  if(window.__topbarScrollHandler){ window.removeEventListener('scroll', window.__topbarScrollHandler); window.removeEventListener('touchmove', window.__topbarScrollHandler); }
  __lastScrollY = window.scrollY || 0;
  const handler = function(){
    if(__scrollTicking) return;
    __scrollTicking = true;
    requestAnimationFrame(() => {
      const topbar = document.getElementById('topbar');
      if(!topbar){ __scrollTicking = false; return; }
      const modalOpen = document.getElementById('modalRoot')?.children?.length > 0;
      if(modalOpen){ topbar.classList.remove('hidden-scroll'); __scrollTicking = false; return; }
      const currentY = window.scrollY || 0;
      const diff = currentY - __lastScrollY;
      if(currentY <= 20){ topbar.classList.remove('hidden-scroll'); topbar.classList.remove('scrolled'); }
      else if(diff > 8 && currentY > __scrollThreshold){ topbar.classList.add('hidden-scroll'); }
      else if(diff < -8){ topbar.classList.remove('hidden-scroll'); topbar.classList.add('scrolled'); }
      else if(currentY > __scrollThreshold){ topbar.classList.add('scrolled'); }
      __lastScrollY = currentY;
      __scrollTicking = false;
    });
  };
  window.__topbarScrollHandler = handler;
  window.addEventListener('scroll', handler, { passive: true });
  window.addEventListener('touchmove', handler, { passive: true });
}

/* ============================================================
   SECTION 58: afterTxSave — Light Refresh
   ============================================================ */
async function afterTxSave(tx, isCreating){
  if(!tx) return;
  if(isCreating){
    if(!window.__recentMyTxIds) window.__recentMyTxIds = [];
    window.__recentMyTxIds.push(tx.id);
    if(window.__recentMyTxIds.length > 20) window.__recentMyTxIds = window.__recentMyTxIds.slice(-20);
    setTimeout(() => { const idx = window.__recentMyTxIds.indexOf(tx.id); if(idx >= 0) window.__recentMyTxIds.splice(idx, 1); }, 10000);
  }
  __invalidateCaches();
  recalcAllCustomerDues(false);
  if(typeof recomputeLiveIncremental === 'function'){ recomputeLiveIncremental(tx); } else { recomputeLive(); }
  try{ saveLocalDB(); }catch(e){}
  // Light UI refresh
  updateDashboardLight();
  renderTopbar();
  renderSidebar();
  // Cloud push background-এ
  pushRemoteDB(true, isCreating ? [tx] : null).catch(()=>{});
  // Activity broadcast
  try{
    const cfg = TX_CFG[tx.type] || {};
    broadcastActivity({ type: isCreating ? 'txn_create' : 'txn_update', txTitle: cfg.title || tx.type, amount: tx.amount, txId: tx.id, custName: tx.custName || '' });
  }catch(e){}
}

const __autofillObserver = new MutationObserver((mutations) => {
  mutations.forEach(m => {
    m.addedNodes.forEach(node => {
      if(node.nodeType === 1){
        if(node.tagName === 'INPUT' || node.tagName === 'TEXTAREA') disableAutofill(node.parentElement || document);
        else if(node.querySelectorAll) disableAutofill(node);
      }
    });
  });
});

window.addEventListener('beforeunload', () => { try{ if(__realtimeChannel && __supabaseClient){ __realtimeChannel.untrack().catch(()=>{}); } }catch(e){} });

(async function init(){
  window.__hasSyncedOnce = false;
  dashDate = todayStr();
  
  try{ window.db = loadLocalDB() || defaultDB(); }
  catch(e){ window.db = defaultDB(); }
  normalizeDB();
  forceFixAdmin();
  __invalidateCaches();
  recalcAllCustomerDues(false);
  recomputeLive();
  loadNotifPrefs();
  
  try{ const c = loadGeoCache(); if(c) window.__geoCache = c; else fetchGeoLocation().then(g => { window.__geoCache = g; }).catch(()=>{}); }catch(e){}
  
  const lb = $('#loginBtn');
  if(lb) lb.addEventListener('click', doLogin);
  const lu = $('#loginUser'), lp = $('#loginPass');
  if(lu) lu.addEventListener('keydown', e => { if(e.key === 'Enter') lp.focus(); });
  if(lp) lp.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  
  const sid = sessionStorage.getItem(SKEY);
  if(sid){ const u = DB().users.find(x => x.id === sid); if(u){ session = u; viewBranch = u.role === 'admin' ? 'all' : u.branch; startApp(); } }
  
  attachNetworkListeners();
  updateQueueBadge();
  setupBroadcastChannel();
  
  const unlockAudio = () => { try{ if(!__audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) __audioCtx = new AC(); } if(__audioCtx && __audioCtx.state === 'suspended') __audioCtx.resume(); }catch(e){} document.removeEventListener('click', unlockAudio); document.removeEventListener('touchstart', unlockAudio); };
  document.addEventListener('click', unlockAudio, { once: true });
  document.addEventListener('touchstart', unlockAudio, { once: true });
  
  initSupabase();
  
  setTimeout(() => { if(window.__hasSyncedOnce && navigator.onLine && queueSize() > 0){ forceSyncNow(); } }, 3000);
  
  disableAutofill(document);
  __autofillObserver.observe(document.body, { childList: true, subtree: true });
  requestNotifPermission();
  
  console.log('%c✅ কম্পিউটার ক্যাম্পাস প্রস্তুত','background:#1e40af;color:#fff;padding:4px 10px;border-radius:4px');
})();
