/* ============================================================
   ⚠️ DUPLICATE LIST MODAL — সব ডুপ্লিকেট এন্ট্রি এক জায়গায়
   ============================================================ */
function getDuplicateGroups(){
  const all = getAllTxs();
  const groups = new Map();
  all.forEach(t => {
    const fp = makeTxFingerprint(t);
    if(!groups.has(fp)) groups.set(fp, []);
    groups.get(fp).push(t);
  });
  const dupGroups = [];
  groups.forEach((txs, fp) => {
    if(txs.length >= 2){
      txs.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
      dupGroups.push({ fingerprint: fp, txs });
    }
  });
  dupGroups.sort((a,b)=> {
    const aLast = a.txs[a.txs.length-1].createdAt || '';
    const bLast = b.txs[b.txs.length-1].createdAt || '';
    return bLast.localeCompare(aLast);
  });
  return dupGroups;
}
function openDuplicateListModal(){
  if(!session) return;
  const bf = currentBranchFilter();
  let groups = getDuplicateGroups();
  if(session.role !== 'admin'){
    groups = groups.map(g => ({
      fingerprint: g.fingerprint,
      txs: g.txs.filter(t => t.branch === session.branch || t.custBranch === session.branch)
    })).filter(g => g.txs.length >= 2);
  } else if(bf !== 'all'){
    groups = groups.map(g => ({
      fingerprint: g.fingerprint,
      txs: g.txs.filter(t => t.branch === bf || t.custBranch === bf)
    })).filter(g => g.txs.length >= 2);
  }
  const totalDupEntries = groups.reduce((s,g)=> s + (g.txs.length - 1), 0);
  const isAdmin = session.role === 'admin';

  let groupsHTML = '';
  if(!groups.length){
    groupsHTML = `<div class="empty" style="color:#4ade80;border:1px solid rgba(34,197,94,.4);background:linear-gradient(145deg,rgba(34,197,94,.08),rgba(34,197,94,.02))">🎉 কোনো ডুপ্লিকেট পাওয়া যায়নি</div>`;
  } else {
    groups.forEach((g, gi) => {
      const first = g.txs[0];
      const cfg = TX_CFG[first.type] || { title: first.type, icon: '📌' };
      groupsHTML += `
        <div class="vault-box" style="margin-bottom:14px;padding:0;border-color:rgba(220,38,38,.35)">
          <div style="padding:12px 16px;background:linear-gradient(180deg,rgba(220,38,38,.12),transparent);border-bottom:1px solid var(--line-2)">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
              <div>
                <div style="font-size:14px;font-weight:800;color:#fff">${cfg.icon||''} ${esc(cfg.title||first.type)}</div>
                <div style="font-size:11.5px;color:var(--muted);margin-top:3px">
                  📅 ${toBn(first.date)} • 🏦 ${esc(BRANCHES[first.branch]?.name||'-')}
                  ${first.custAcc ? ` • 👤 ${esc(first.custName||'-')} (${esc(first.custAcc)})` : ''}
                </div>
              </div>
              <span class="badge due" style="font-size:12px">⚠️ ${toBn(g.txs.length)} টি একই</span>
            </div>
          </div>
          <div class="table-wrap" style="border:none;border-radius:0">
            <table class="tbl" style="min-width:auto">
              <thead><tr>
                <th>#</th><th>পরিমাণ</th><th>ইউজার</th><th>সময়</th><th>বিবরণ</th><th>অ্যাকশন</th>
              </tr></thead>
              <tbody>
                ${g.txs.map((t, ti)=>`
                  <tr data-dup-txid="${esc(t.id)}" class="${ti === 0 ? 'cust-row' : 'cust-row has-due'}">
                    <td><b style="color:${ti === 0 ? '#4ade80' : '#f87171'}">${toBn(ti+1)}</b>${ti === 0 ? ' <small style="color:#4ade80">(রাখুন)</small>' : ''}</td>
                    <td class="amt" style="color:#fff">৳ ${fmt(t.amount)}</td>
                    <td>${esc(t.user||'-')}</td>
                    <td style="font-size:11px;white-space:nowrap">${esc(fmtDateTime(t.createdAt))}</td>
                    <td style="font-size:12px;color:var(--muted);max-width:260px;word-break:break-word">${esc(t.note||'-')}</td>
                    <td style="white-space:nowrap">
                      <button class="mini" data-dup-edit="${esc(t.id)}" title="এডিট">✏️</button>
                      <button class="mini danger" data-dup-del="${esc(t.id)}" title="ডিলিট">🗑️</button>
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
          ${isAdmin ? `
          <div style="padding:12px 16px;background:rgba(0,0,0,.2);border-top:1px dashed var(--line-2);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
            <button class="mini danger" data-dup-keepfirst="${gi}" style="padding:8px 14px;font-size:12.5px">🗑️ প্রথমটি রেখে বাকিসব ডিলিট (${toBn(g.txs.length-1)} টি)</button>
          </div>` : ''}
        </div>`;
    });
  }

  const body = `
    <div class="accept-head" style="background:linear-gradient(145deg,rgba(220,38,38,.1),rgba(245,158,11,.04));border-color:rgba(220,38,38,.5)">
      <div style="font-size:13.5px;line-height:1.9">
        ⚠️ <b>সম্ভাব্য ডুপ্লিকেট এন্ট্রি তালিকা</b><br>
        মোট <b style="color:#fff">${toBn(groups.length)}</b> টি গ্রুপে <b style="color:#fff">${toBn(totalDupEntries)}</b> টি অতিরিক্ত এন্ট্রি পাওয়া গেছে।
        <br><small style="color:var(--muted)">নিচে প্রতিটি গ্রুপে দেখানো হয়েছে — একই ধরনের লেনদেনগুলো। প্রয়োজনে এডিট বা ডিলিট করুন।</small>
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn pdf" id="dup_pdf">📄 PDF</button>
      <button class="btn xlsx" id="dup_xlsx">📊 XLSX</button>
    </div>
    <div id="dup_body">${groupsHTML}</div>`;

  openModal({
    title: '⚠️ ডুপ্লিকেট এন্ট্রি ম্যানেজমেন্ট',
    bodyHTML: body,
    wide: true,
    onMount: (w, cl) => {
      w.querySelectorAll('[data-dup-edit]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const t = getAllTxs().find(x => x.id === b.dataset.dupEdit);
          if(!t) return;
          cl();
          setTimeout(()=> openTxModal(t.type, t.id), 100);
        });
      });
      w.querySelectorAll('[data-dup-del]').forEach(b=>{
        b.addEventListener('click', async ()=>{
          const id = b.dataset.dupDel;
          const t = getAllTxs().find(x => x.id === id);
          if(!t) return;
          if(!confirm('⚠️ এই লেনদেনটি ডিলিট করবেন?\n\n৳ ' + fmt(t.amount) + '\n' + fmtDateTime(t.createdAt) + '\nইউজার: ' + (t.user||'-'))) return;
          await deleteTx(id);
          cl();
          setTimeout(()=> openDuplicateListModal(), 200);
        });
      });
      w.querySelectorAll('[data-dup-keepfirst]').forEach(b=>{
        b.addEventListener('click', async ()=>{
          const gi = parseInt(b.dataset.dupKeepfirst, 10);
          const g = groups[gi];
          if(!g) return;
          if(!confirm('⚠️ প্রথম এন্ট্রি রেখে বাকি ' + (g.txs.length - 1) + ' টি ডিলিট করবেন?')) return;
          for(let i = 1; i < g.txs.length; i++){
            await deleteTx(g.txs[i].id);
          }
          cl();
          setTimeout(()=> openDuplicateListModal(), 200);
        });
      });
      w.querySelector('#dup_pdf').addEventListener('click', ()=>{
        const headers = ['Group','#','Date','Type','Branch','Customer','Amount','User','Time','Description'];
        const rows = [];
        groups.forEach((g, gi) => {
          g.txs.forEach((t, ti) => {
            const cfg = TX_CFG[t.type] || { title: t.type };
            rows.push([
              String(gi+1), String(ti+1), t.date || '-', cfg.title || t.type,
              BRANCHES[t.branch]?.en || '-',
              (t.custName || '-') + (t.custAcc ? ' (' + t.custAcc + ')' : ''),
              'BDT ' + fmt(t.amount), t.user || '-',
              fmtDateTimeEN(t.createdAt), (t.note || '-').substring(0, 80)
            ]);
          });
        });
        exportToPDF('Duplicate Entries Report', headers, rows, 'duplicate_entries.pdf');
      });
      w.querySelector('#dup_xlsx').addEventListener('click', ()=>{
        const headers = ['Group','#','Date','Type','Branch','Customer','Amount','User','Time','Description'];
        const rows = [];
        groups.forEach((g, gi) => {
          g.txs.forEach((t, ti) => {
            const cfg = TX_CFG[t.type] || { title: t.type };
            rows.push([
              String(gi+1), String(ti+1), t.date || '-', cfg.title || t.type,
              BRANCHES[t.branch]?.en || '-',
              (t.custName || '-') + (t.custAcc ? ' (' + t.custAcc + ')' : ''),
              'BDT ' + fmt(t.amount), t.user || '-',
              fmtDateTimeEN(t.createdAt), (t.note || '-').substring(0, 80)
            ]);
          });
        });
        exportToXLSX('Duplicate Entries Report', headers, rows, 'duplicate_entries.xlsx');
      });
    }
  });
}

function showBankNamePopup(onDone, initialValue, existingValue){
  const initial = initialValue || existingValue || '';
  const popupBody = `
    <div class="accept-head" style="background:linear-gradient(145deg,rgba(34,197,94,.1),rgba(59,130,246,.04));border-color:rgba(34,197,94,.5)">

        <small style="color:var(--muted)">অনুগ্রহ করে যে ব্যাংক থেকে ফান্ড ট্রান্সফার করা হয়েছে তার নাম লিখুন। না লিখলে লেনদেন বাতিল হবে।</small>
      </div>
    </div>
    <div class="field">
      <label>🏦 ব্যাংকের নাম *</label>
      <input type="text" id="bp_bankName" placeholder="যেমন: আল আরাফাহ ইসলামী ব্যাংক" value="${esc(initial)}" style="font-size:15px;font-weight:700;color:#fff;padding:14px">
    </div>
    <div class="field">
      <label>দ্রুত নির্বাচন</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="bp_quickBanks">
        ${Object.entries(BANKS).map(([k,v]) =>
          `<button type="button" class="btn gray" data-bank-quick="${esc(v.name)}" style="padding:8px 14px;font-size:12.5px">${esc(v.name)}</button>`
        ).join('')}
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
      <button class="btn green" id="bp_confirm" style="flex:1;min-width:180px">✅ নিশ্চিত করুন</button>
      <button class="btn gray" id="bp_cancel" style="flex:1;min-width:120px">❌ বাতিল (লেনদেন হবে না)</button>
    </div>`;
  let resolved = false;
  openModal({
    title: '🏦 ব্যাংকের নাম দিন',
    bodyHTML: popupBody,
    onMount: (w, close)=>{
      const inputEl = w.querySelector('#bp_bankName');
      setTimeout(()=> inputEl.focus(), 100);
      w.querySelectorAll('[data-bank-quick]').forEach(b=>{
        b.addEventListener('click', ()=>{
          inputEl.value = b.dataset.bankQuick;
          inputEl.focus();
        });
      });
      const finalize = (val)=>{
        if(resolved) return;
        resolved = true;
        close();
        onDone(val);
      };
      w.querySelector('#bp_confirm').addEventListener('click', ()=>{
        const v = inputEl.value.trim();
        if(!v){
          alert('⚠️ ব্যাংকের নাম না লিখলে লেনদেন সংরক্ষণ করা যাবে না।');
          inputEl.focus();
          return;
        }
        finalize(v);
      });
      w.querySelector('#bp_cancel').addEventListener('click', ()=>{ finalize(null); });
      w.querySelector('.x').addEventListener('click', ()=>{ finalize(null); }, true);
      inputEl.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){ e.preventDefault(); w.querySelector('#bp_confirm').click(); }
      });
    }
  });
}

<script>
/* ============ Branch Setup / Setup Wizard / Backup ============ */
function openBranchSetup(){

      <div class="field"><label>🏛️ অন্যান্য ব্যাংকে জমা</label>

    </div>
    <h4 style="font-size:13.5px;color:#fff;margin:18px 0 10px;font-weight:800">📦 ভল্টের নোট</h4>
    <div class="notes-col">
      <div class="notes-row">
        ${DENOMS.map(d => `
          <div class="note-item"><label>৳ ${toBn(d)}</label>

        let t = 0;
        wrap.querySelectorAll('[id^="bs_note_"]').forEach(inp=>{
          const v = parseInt(String(inp.value).replace(/[^0-9]/g,''),10) || 0;
          t += v * Number(inp.dataset.denom);

function isSystemEmpty(){
  if(DB().__firstSetupDone === true) return false;
  const anyMoney = Object.keys(BRANCHES).some(br=>{
    const acc = DB().baseAccounts[br] || {}, vault = DB().baseVault[br] || {};
    const hasM = (Number(acc.bank)||0) + (Number(acc.cash)||0) + (Number(acc.other)||0);
    const hasN = DENOMS.reduce((s,d)=> s + (Number(vault[d])||0), 0);
    return hasM > 0 || hasN > 0;
  });
  const hasTx = (DB().txs||[]).length > 0;
  return !anyMoney && !hasTx;
}

            <input type="text" id="online_ref" placeholder="TXN" value="${editing && editing.onlineRef ? esc(editing.onlineRef) : ''}"></div>
        </div>
        <div class="total-preview"><div class="l">পরিমাণ</div><div class="v" id="onlineAmountPreview">৳ 0.00</div></div>
      </div>
    ` : ''}
    ${showOnlineSupport ? `
      <div class="online-box" id="onlineSupportBox">
        <h4>🌐 অনলাইন সাপোর্ট তথ্য</h4>
        <div class="desc">💡 গ্রাহকের তথ্য উপরের <b>🔍 সার্চ বক্স</b>-এ নাম/অ্যাকাউন্ট দিয়ে সিলেক্ট করুন।</div>
        <div class="form-row">
          <div class="field"><label>পরিমাণ (৳) <span style="color:#fff">*</span></label>
            <input type="text" inputmode="decimal" id="support_amount" placeholder="0.00" value="${editing && editing.onlineAmount ? editing.onlineAmount : (editing && editing.amount ? editing.amount : '')}"></div>
        </div>
        <div class="field" style="margin-top:6px"><label>📝 বিবরণ / মন্তব্য</label>
          <input type="text" id="support_note" placeholder="সংক্ষিপ্ত বিবরণ..." value="${editing && editing.note ? esc(editing.note) : ''}"></div>
        <div class="total-preview"><div class="l">পরিমাণ</div><div class="v" id="supportAmountPreview">৳ 0.00</div></div>
      </div>
    ` : ''}
    <div class="notes-cols" id="notesCols" style="margin-top:6px">
      <div class="notes-col out" id="outCol">
        <h4>💸 প্রদান</h4>
        ${notesRowHTML('out', editing ? editing.notesOut : null)}
        <div class="sum-line"><span>মোট</span><b id="sumOut">৳ 0.00</b></div>
      </div>
      <div class="notes-col in" id="inCol">
        <h4>📥 গ্রহণ</h4>
        ${notesRowHTML('in', editing ? editing.notesIn : null)}
        <div class="sum-line"><span>মোট</span><b id="sumIn">৳ 0.00</b></div>
      </div>
    </div>
    <div class="total-preview" id="netPreview"><div class="l">নেট</div><div class="v" id="netAmt">৳ 0.00</div></div>
    <div class="note-detail-box" id="noteDetailBox"><div class="ttl">🧾 বিবরণী</div><div id="noteDetailContent">—</div></div>
    <div class="field" style="margin-top:14px"><label>মন্তব্য</label><input type="text" id="f_note" value="${editing ? esc(editing.note||'') : ''}"></div>
    <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
      <button class="btn green" id="f_save" style="flex:1;min-width:160px">💾 সংরক্ষণ</button>
      <button class="btn gray" id="f_close" style="flex:1;min-width:120px">বাতিল</button>
    </div>
    ${isTransfer ? `<div id="pendingArea"></div>` : ''}
    <div class="report-area">
      <div class="report-head">
        <h4>📑 রিপোর্ট — ${esc(cfg.title)}</h4>
        <div class="report-tools">
          <input type="date" id="r_date" value="${editing ? editing.date : dashDate}" style="padding:8px 10px;border-radius:10px;background:#0a0f1e;border:1px solid var(--line);color:#fff;font-family:inherit">
          <button class="btn gray" id="r_all" style="padding:8px 14px;font-size:12.5px">সব</button>
          <button class="btn pdf" id="r_pdf" style="padding:8px 14px;font-size:12.5px">📄 PDF</button>
          <button class="btn xlsx" id="r_xlsx" style="padding:8px 14px;font-size:12.5px">📊 XLSX</button>
          <button class="btn" id="r_print" style="padding:8px 14px;font-size:12.5px;background:linear-gradient(135deg,#3b82f6,#22c55e)">🖨️ Print</button>
        </div>
      </div>
      <div id="r_body"></div>
    </div>`;

  openModal({
    title: `${cfg.icon} ${cfg.title}`,
    bodyHTML: body, wide: true,
    onMount: (w, close) => setupTxForm(w, type, editing, close, activeBranchForForm)
  });
}

function setupTxForm(wrap, type, editing, close, activeBranchForForm){
  if(!session) return;
  const cfg = TX_CFG[type];
  const sumOutEl = wrap.querySelector('#sumOut');
  const sumInEl = wrap.querySelector('#sumIn');
  const netEl = wrap.querySelector('#netAmt');
  const noteBox = wrap.querySelector('#noteDetailContent');
  const isTransfer = type === 'branch_transfer';
  const hasDir = !!cfg.dir;
  const hasOnline = !!cfg.online;
  const hasOnlineSupport = !!cfg.onlineSupport;
  const hasBranchToggle = !!cfg.cust && type !== 'support';
  const isSupportType = type === 'support';
  const dueInlineBox = wrap.querySelector('#dueInlineBox');

  /* ✅ Loan Given — Online Transfer Tick handler */
  if(type === 'loan_given'){
    const tickEl = wrap.querySelector('#f_onlineTransferTick');
    const bankNameHidden = wrap.querySelector('#f_onlineBankName');
    const infoBox = wrap.querySelector('#onlineBankInfoBox');
    const bankNameDisplay = wrap.querySelector('#onlineBankNameDisplay');
    const noteInputEl = wrap.querySelector('#f_note');

    function refreshBankInfo(){
      if(!tickEl) return;
      const isTicked = tickEl.checked;
      const bankName = bankNameHidden ? bankNameHidden.value.trim() : '';
      if(isTicked && bankName){
        if(infoBox) infoBox.style.display = 'block';
        if(bankNameDisplay) bankNameDisplay.textContent = bankName;
      } else {
        if(infoBox) infoBox.style.display = 'none';
      }
    }
    refreshBankInfo();

    if(tickEl){
      tickEl.addEventListener('change', ()=>{
        if(!tickEl.checked){
          if(bankNameHidden) bankNameHidden.value = '';
          refreshBankInfo();
          return;
        }
        showBankNamePopup((bankName)=>{
          if(!bankName){
            tickEl.checked = false;
            if(bankNameHidden) bankNameHidden.value = '';
            refreshBankInfo();
            return;
          }
          if(bankNameHidden) bankNameHidden.value = bankName;
          if(noteInputEl) noteInputEl.value = 'লোন অফিসার ও গ্রাহকের সম্মতিতে অনলাইনে ফান্ড ট্রান্সফার করা হয়েছে। (' + bankName + ')';
          refreshBankInfo();
        }, bankNameHidden ? bankNameHidden.value : '', editing ? editing.onlineBankName : '');
      });
    }
  }

  function refreshInlineDue(){
    if(!dueInlineBox) return;
    const acc = wrap.querySelector('#f_acc')?.value.trim() || '';
    const name = wrap.querySelector('#f_name')?.value.trim() || '';
    if(!acc && !name){ dueInlineBox.innerHTML = ''; return; }
    const lookupAcc = acc || (DB().customers.find(c=>c.name===name)?.accountNo) || '';
    if(!lookupAcc){ dueInlineBox.innerHTML = `<div class="bank-hint" style="margin:0">ℹ️ নতুন গ্রাহক</div>`; return; }
    const due = calculateCustomerDue(lookupAcc);
    if(due.count === 0){ dueInlineBox.innerHTML = `<div class="bank-hint" style="margin:0">📭 সাপোর্ট লেনদেন নেই</div>`; return; }
    const isDue = due.net > 0;
    const label = isDue ? '⚠️ বকেয়া আছে' : '✅ বকেয়া নেই';
    dueInlineBox.innerHTML = `
      <div style="padding:12px;border-radius:12px;background:#0a0f1e;border:1px solid var(--line-3)">
        <div style="font-size:13px;font-weight:800;color:#fff;margin-bottom:6px">${label}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;font-size:12.5px;line-height:1.8">
          <div>প্রদান: <b style="color:#fff">৳ ${fmt(due.paid)}</b></div>
          <div>ফেরত: <b style="color:#fff">৳ ${fmt(due.refund)}</b></div>
          <div>নেট: <b style="color:#fff">৳ ${fmt(Math.abs(due.net))}</b></div>
          <div>লেনদেন: <b>${toBn(due.count)} টি</b></div>
        </div>
      </div>`;
  }
  function isOnlineSupportMode(){
    if(!hasOnlineSupport) return false;
    const dirEl = wrap.querySelector('#f_dir');
    return dirEl && (dirEl.value === 'online_support_out' || dirEl.value === 'online_support_in');
  }
  function updateCrossBranchNote(){
    const noteEl = wrap.querySelector('#crossBranchNote');
    if(!noteEl) return;
    const hidden = wrap.querySelector('#f_custBranch_hidden');
    const custBranch = hidden ? hidden.value : null;
    const txnBranchEl = wrap.querySelector('#f_branch');
    const txnBranch = txnBranchEl ? txnBranchEl.value : null;
    if(custBranch && txnBranch && custBranch !== txnBranch){
      noteEl.style.display = 'block';
      if(wrap.querySelector('#cbCust')) wrap.querySelector('#cbCust').textContent = BRANCHES[custBranch].name;
      if(wrap.querySelector('#cbTxn')) wrap.querySelector('#cbTxn').textContent = BRANCHES[txnBranch].name;
    } else noteEl.style.display = 'none';
  }
  if(hasBranchToggle || isSupportType){
    const btns = wrap.querySelectorAll('.branch-toggle-btn');
    const hidden = wrap.querySelector('#f_custBranch_hidden');
    btns.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        btns.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        hidden.value = btn.dataset.bbranch;
        updateCrossBranchNote();
      });
    });
    const txnBranchEl = wrap.querySelector('#f_branch');
    if(txnBranchEl) txnBranchEl.addEventListener('change', updateCrossBranchNote);
    updateCrossBranchNote();
  }
  let autoCopyEnabled = true;
  wrap.querySelectorAll('[id^="in_"]').forEach(inp=>{
    inp.addEventListener('focus', ()=>{ autoCopyEnabled = false; });
  });
  function isOnlineMode(){
    if(!hasOnline) return false;
    const dirEl = wrap.querySelector('#f_dir');
    return dirEl && (dirEl.value === 'online_in' || dirEl.value === 'online_out');
  }
  function applyDirectionState(){
    if(!hasDir) return;
    const dirEl = wrap.querySelector('#f_dir');
    if(!dirEl) return;
    const dir = dirEl.value;
    const outCol = wrap.querySelector('#outCol'), inCol = wrap.querySelector('#inCol');
    const notesCols = wrap.querySelector('#notesCols');
    const onlineBox = wrap.querySelector('#onlineBox');
    const onlineSupportBox = wrap.querySelector('#onlineSupportBox');
    const noteDetailBox = wrap.querySelector('#noteDetailBox');
    const isOnlineSup = (dir === 'online_support_out' || dir === 'online_support_in');
    if(isOnlineSup){
      wrap.querySelectorAll('[id^="out_"]').forEach(i=>i.value='');
      wrap.querySelectorAll('[id^="in_"]').forEach(i=>i.value='');
      if(notesCols) notesCols.style.display = 'none';
      if(noteDetailBox) noteDetailBox.style.display = 'none';
      if(onlineBox) onlineBox.classList.remove('active');
      if(onlineSupportBox) onlineSupportBox.classList.add('active');
      recalc();
      return;
    } else if(onlineSupportBox) onlineSupportBox.classList.remove('active');
    const clearNotes = (p)=>{ wrap.querySelectorAll('[id^="'+p+'_"]').forEach(inp=> inp.value=''); };
    if(dir === 'online_in' || dir === 'online_out'){
      clearNotes('out'); clearNotes('in');
      if(notesCols) notesCols.style.display = 'none';
      if(noteDetailBox) noteDetailBox.style.display = 'none';
      if(onlineBox){
        onlineBox.classList.add('active');
        const desc = wrap.querySelector('#onlineDesc');
        desc.className = 'desc';
        desc.innerHTML = dir === 'online_in' ? '💡 অনলাইনে আসা — <b style="color:#fff">যোগ</b>' : '💡 অনলাইন পাঠানো — <b style="color:#fff">বিয়োগ</b>';
      }
    } else {
      if(notesCols) notesCols.style.display = 'grid';
      if(noteDetailBox) noteDetailBox.style.display = 'block';
      if(onlineBox) onlineBox.classList.remove('active');
    }
    if(type === 'other_bank'){
      if(dir === 'in'){ outCol.classList.add('disabled'); inCol.classList.remove('disabled'); clearNotes('out'); }
      else if(dir === 'out'){ outCol.classList.remove('disabled'); inCol.classList.add('disabled'); clearNotes('in'); }
      else { outCol.classList.remove('disabled'); inCol.classList.remove('disabled'); }
    } else if(type === 'support'){
      outCol.classList.remove('disabled'); inCol.classList.remove('disabled');
    }
  }
  if(hasDir){
    const dirEl = wrap.querySelector('#f_dir');
    if(dirEl) dirEl.addEventListener('change', ()=>{ applyDirectionState(); recalc(); refreshInlineDue(); });
    applyDirectionState();
  }
  const onlineAmt = wrap.querySelector('#online_amount');
  if(onlineAmt){
    onlineAmt.addEventListener('input', ()=>{
      onlineAmt.value = onlineAmt.value.replace(/[^0-9.]/g,'');
      const v = parseFloat(onlineAmt.value) || 0;
      const pv = wrap.querySelector('#onlineAmountPreview');
      if(pv) pv.textContent = '৳ ' + fmt(v);
      recalc();
    });
    const v = parseFloat(onlineAmt.value) || 0;
    const pv = wrap.querySelector('#onlineAmountPreview');
    if(pv) pv.textContent = '৳ ' + fmt(v);
  }
  const supportAmtInput = wrap.querySelector('#support_amount');
  if(supportAmtInput){
    supportAmtInput.addEventListener('input', ()=>{
      supportAmtInput.value = supportAmtInput.value.replace(/[^0-9.]/g,'');
      const v = parseFloat(supportAmtInput.value) || 0;
      const pv = wrap.querySelector('#supportAmountPreview');
      if(pv) pv.textContent = '৳ ' + fmt(v);
      recalc();
    });
    const v = parseFloat(supportAmtInput.value) || 0;
    const pv = wrap.querySelector('#supportAmountPreview');
    if(pv) pv.textContent = '৳ ' + fmt(v);
  }
  function recalc(){
    if(isTransfer && autoCopyEnabled){
      const outNotes = readNotes(wrap, 'out');
      wrap.querySelectorAll('[id^="in_"]').forEach(inp=>{
        const d = inp.dataset.denom;
        const tgt = outNotes[d] || '';
        if(inp.value === '' || inp.dataset.autofilled === 'true'){
          inp.value = tgt;
          inp.dataset.autofilled = tgt ? 'true' : 'false';
        }
      });
    }
    const outNotes = readNotes(wrap, 'out');
    const inNotes = readNotes(wrap, 'in');
    const out = noteSum(outNotes), inSum = noteSum(inNotes);
    sumOutEl.textContent = '৳ ' + fmt(out);
    sumInEl.textContent = '৳ ' + fmt(inSum);
    if(isOnlineSupportMode()){
      const v = parseFloat(wrap.querySelector('#support_amount')?.value) || 0;
      netEl.textContent = '৳ ' + fmt(v);
    } else if(isOnlineMode()){
      const v = parseFloat(wrap.querySelector('#online_amount')?.value) || 0;
      netEl.textContent = '৳ ' + fmt(v);
    } else if(isTransfer){
      netEl.textContent = '৳ ' + fmt(Math.max(out, inSum));
    } else {
      netEl.textContent = '৳ ' + fmt(Math.abs(out - inSum));
    }
    let html = '';
    if(Object.keys(outNotes).length) html += `<div style="margin-bottom:6px"><span style="color:#fff;font-weight:700">📤</span><br>${noteDetailHTML(outNotes)}</div>`;
    if(Object.keys(inNotes).length) html += `<div><span style="color:#fff;font-weight:700">📥</span><br>${noteDetailHTML(inNotes)}</div>`;
    noteBox.innerHTML = html || '—';
  }
  wrap.querySelectorAll('.note-item input').forEach(i=> i.addEventListener('input', recalc));
  recalc();

  function renderPending(){
    if(!isTransfer) return;
    const box = wrap.querySelector('#pendingArea');
    if(!box) return;
    const bf = currentBranchFilter();
    const myBranch = session.role === 'admin' ? (bf === 'all' ? null : bf) : session.branch;
    let pending = DB().txs.filter(t=> t.type === 'branch_transfer' && !t.accepted);
    if(myBranch) pending = pending.filter(t=> t.to === myBranch);
    if(!pending.length){
      box.innerHTML = `<div class="pending-box"><h4>⏳ অপেক্ষমাণ</h4><div class="pending-empty">নেই ✅</div></div>`;
      return;
    }
    box.innerHTML = `
      <div class="pending-box">
        <h4>⏳ অপেক্ষমাণ শাখা-থেকে-শাখা</h4>
        ${pending.map(t=>`
          <div class="pending-item">
            <div class="info"><b>${esc(BRANCHES[t.from]?.name||t.from)}</b> ➜ <b>${esc(BRANCHES[t.to]?.name||t.to)}</b>
              <small>${toBn(t.date)} • ৳ ${fmt(t.amount)} • ${esc(t.user||'')}</small></div>
            <div style="display:flex;gap:6px">
              <button class="mini accept" data-accept="${t.id}">✅</button>
              ${session.role === 'admin' ? `<button class="mini danger" data-del="${t.id}">🗑️</button>` : ''}
            </div>
          </div>`).join('')}
      </div>`;
    box.querySelectorAll('[data-accept]').forEach(b=> b.addEventListener('click', ()=> acceptTransfer(b.dataset.accept, wrap, type, close)));
    box.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', async ()=>{
      if(confirm('ডিলিট?')){ await deleteTx(b.dataset.del); close(); openTxModal(type); }
    }));
  }
  renderPending();

  const searchEl = wrap.querySelector('#f_search');
  const sugEl = wrap.querySelector('#f_suggest');
  if(searchEl){
    searchEl.addEventListener('input', ()=>{
      let list = searchCustomers(searchEl.value);
      if(!list.length){ sugEl.innerHTML = ''; return; }
      sugEl.innerHTML = list.map(c=>{
        const due = calculateCustomerDue(c.accountNo);
        let tag = '';
        if(due.net > 0) tag = `<span class="due-tag">⚠️ বকেয়া ৳${fmt(due.net)}</span>`;
        else if(due.count > 0) tag = `<span class="paid-tag">✅ পরিশোধিত</span>`;
        return `<div class="sug-item" data-id="${c.id}"><b>${esc(c.name)}</b> — <small>${esc(c.accountNo)}</small>${tag}<br>
          <small>📱 ${esc(c.mobile||'-')} • 📍 ${esc(c.address||'-')} • 🏦 ${esc(BRANCHES[c.branch]?.name||'')}</small></div>`;
      }).join('');
      sugEl.querySelectorAll('.sug-item').forEach(el=>{
        el.addEventListener('click', ()=>{
          const c = DB().customers.find(x=>x.id===el.dataset.id);
          if(!c) return;
          wrap.querySelector('#f_acc').value = c.accountNo || '';
          wrap.querySelector('#f_name').value = c.name || '';
          wrap.querySelector('#f_mobile').value = c.mobile || '';
          wrap.querySelector('#f_addr').value = c.address || '';
          searchEl.value = c.accountNo || c.name;
          sugEl.innerHTML = '';
          if(c.branch && (hasBranchToggle || isSupportType)){
            wrap.querySelectorAll('.branch-toggle-btn').forEach(b=>{
              if(b.dataset.bbranch === c.branch) b.classList.add('active');
              else b.classList.remove('active');
            });
            const hiddenB = wrap.querySelector('#f_custBranch_hidden');
            if(hiddenB) hiddenB.value = c.branch;
            updateCrossBranchNote();
          }
          refreshInlineDue();
          const due = calculateCustomerDue(c.accountNo);
          if(due.net > 0) setTimeout(()=> showDuePopup(c, { force:false }), 150);
        });
      });
    });
  }
  const checkDueBtn = wrap.querySelector('#f_checkDue');
  if(checkDueBtn){
    checkDueBtn.addEventListener('click', ()=>{
      const acc = wrap.querySelector('#f_acc')?.value.trim();
      const name = wrap.querySelector('#f_name')?.value.trim();
      let c = null;
      if(acc) c = DB().customers.find(x=>x.accountNo===acc);
      if(!c && name) c = DB().customers.find(x=>x.name===name);
      if(!c){
        if(acc || name) c = { accountNo: acc||'—', name: name||'—', branch: wrap.querySelector('#f_custBranch_hidden')?.value||session.branch, mobile:'', address:'' };
        else { toast('⚠️ আগে অ্যাকাউন্ট বা নাম দিন'); return; }
      }
      showDuePopup(c, { force:true });
    });
  }
  ['#f_acc','#f_name'].forEach(sel=>{
    const el = wrap.querySelector(sel);
    if(el) el.addEventListener('input', ()=>{
      clearTimeout(el.__dueT);
      el.__dueT = setTimeout(refreshInlineDue, 250);
    });
  });
  refreshInlineDue();

  const editCustBtn = wrap.querySelector('#f_editCust');
  if(editCustBtn){
    editCustBtn.addEventListener('click', async ()=>{
      const hiddenB = wrap.querySelector('#f_custBranch_hidden');
      const selB = wrap.querySelector('#f_branch');
      let br = hiddenB?.value || selB?.value || (editing?.custBranch || editing?.branch) || session.branch;
      if(!BRANCHES[br]) br = 'kalaroa';
      const data = {
        accountNo: wrap.querySelector('#f_acc').value.trim(),
        name: wrap.querySelector('#f_name').value.trim(),
        mobile: wrap.querySelector('#f_mobile').value.trim(),
        address: wrap.querySelector('#f_addr').value.trim(),
        branch: br
      };
      if(!data.accountNo && !data.name){ alert('অ্যাকাউন্ট বা নাম দিন'); return; }
      const c = upsertCustomer(data);
      if(c) updateCustomerDueInDB(c.accountNo, false);
      await saveDB();
      editCustBtn.textContent = '✅ সেভ';
      setTimeout(()=> editCustBtn.textContent = '✏️ গ্রাহক সেভ', 1500);
      refreshInlineDue();
    });
  }

  const rDate = wrap.querySelector('#r_date');
  const rBody = wrap.querySelector('#r_body');
  let currentReportList = [];
  function renderReport(){
    const dateVal = rDate.value;
    let list = getAllTxs().filter(t=> t.type === type);
    const bf = currentBranchFilter();
    if(session.role !== 'admin') list = list.filter(t => t.branch === session.branch || t.from === session.branch || t.to === session.branch || t.custBranch === session.branch);
    else if(bf !== 'all') list = list.filter(t => t.branch === bf || t.from === bf || t.to === bf || t.custBranch === bf);
    if(dateVal){
      list = list.filter(t=>{
        if(t.type === 'branch_transfer'){
          if(session.role === 'admin'){
            if(bf === 'all') return t.date === dateVal || t.acceptedDate === dateVal;
            if(t.from === bf) return t.date === dateVal;
            if(t.to === bf) return t.acceptedDate === dateVal;
          } else {
            if(t.from === session.branch) return t.date === dateVal;
            if(t.to === session.branch) return t.acceptedDate === dateVal;
          }
        }
        return t.date === dateVal;
      });
    }
    list.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
    currentReportList = list;
    rBody.innerHTML = txListHTML(list, { admin: session.role === 'admin', transfer: isTransfer });
    rBody.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', async ()=>{ close(); openTxModal(type, b.dataset.edit); }));
    rBody.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', async ()=>{
      if(confirm('ডিলিট?')){ await deleteTx(b.dataset.del); close(); openTxModal(type); }
    }));
    rBody.querySelectorAll('[data-accept]').forEach(b=> b.addEventListener('click', ()=> acceptTransfer(b.dataset.accept, wrap, type, close)));
  }
  if(rDate) rDate.addEventListener('change', renderReport);
  const allBtn = wrap.querySelector('#r_all');
  if(allBtn) allBtn.addEventListener('click', ()=>{ rDate.value=''; renderReport(); });
  renderReport();

  const pdfBtn = wrap.querySelector('#r_pdf');
  const printBtn = wrap.querySelector('#r_print');
  if(printBtn) printBtn.addEventListener('click', ()=>{
    const rows = currentReportList.map(t=> buildReportRow(t));
    const total = currentReportList.reduce((s,t)=> s + Number(t.amount||0), 0);
    rows.push(['', '', '', '', 'TOTAL', 'BDT ' + fmt(total), '', '', '', '', '']);
    printReport('Report: ' + txEN(type), REPORT_HEADERS, rows, 'report_' + type);
  });
  if(pdfBtn) pdfBtn.addEventListener('click', ()=>{
    const rows = currentReportList.map(t=> buildReportRow(t));
    const total = currentReportList.reduce((s,t)=> s + Number(t.amount||0), 0);
    rows.push(['', '', '', '', 'TOTAL', 'BDT ' + fmt(total), '', '', '', '']);
    exportToPDF('Report: ' + txEN(type), REPORT_HEADERS, rows, 'report_' + type + '.pdf');
  });
  const xlsxBtn = wrap.querySelector('#r_xlsx');
  if(xlsxBtn) xlsxBtn.addEventListener('click', ()=>{
    const rows = currentReportList.map(t=> buildReportRow(t));
    const total = currentReportList.reduce((s,t)=> s + Number(t.amount||0), 0);
    rows.push(['', '', '', '', 'TOTAL', 'BDT ' + fmt(total), '', '', '', '']);
    exportToXLSX('Report: ' + txEN(type), REPORT_HEADERS, rows, 'report_' + type + '.xlsx');
  });

  /* ============================================================
     SAVE HANDLER
     ============================================================ */
  const saveBtn = wrap.querySelector('#f_save');
  saveBtn.addEventListener('click', async ()=>{
    if(saveBtn.disabled) return;
    saveBtn.disabled = true;
    const originalBtnText = saveBtn.innerHTML;
    saveBtn.innerHTML = '<span class="spinner"></span> সংরক্ষণ হচ্ছে...';
    try {
      const date = wrap.querySelector('#f_date').value || todayStr();
      const outNotes = readNotes(wrap, 'out');
      const inNotes = readNotes(wrap, 'in');
      const outSum = noteSum(outNotes), inSum = noteSum(inNotes);
      const amount = Math.abs(outSum - inSum);
      let dir = wrap.querySelector('#f_dir') ? wrap.querySelector('#f_dir').value : null;
      let onlineAmount = 0;
      let onlineSupportAcc = '', onlineSupportName = '', onlineSupportAmount = 0, onlineSupportNote = '';
      const isOnlineSup = (dir === 'online_support_out' || dir === 'online_support_in');
      if(isOnlineSup){
        onlineSupportAcc = wrap.querySelector('#f_acc')?.value.trim() || '';
        onlineSupportName = wrap.querySelector('#f_name')?.value.trim() || '';
        onlineSupportAmount = parseFloat(wrap.querySelector('#support_amount')?.value) || 0;
        onlineSupportNote = wrap.querySelector('#support_note')?.value.trim() || '';
        if(!onlineSupportAcc && !onlineSupportName){ alert('🌐 গ্রাহকের নাম/অ্যাকাউন্ট দিন'); saveBtn.disabled = false; saveBtn.innerHTML = originalBtnText; return; }
        if(onlineSupportAmount <= 0){ alert('🌐 পরিমাণ দিন'); saveBtn.disabled = false; saveBtn.innerHTML = originalBtnText; return; }
      }
      if(isOnlineMode()){
        onlineAmount = parseFloat(wrap.querySelector('#online_amount').value) || 0;
        if(onlineAmount <= 0){ alert('পরিমাণ দিন'); saveBtn.disabled = false; saveBtn.innerHTML = originalBtnText; return; }
      } else if(isOnlineSup){}
      else if(type === 'branch_transfer'){
        if(outSum <= 0 && inSum <= 0){ alert('অন্তত একটি নোট'); saveBtn.disabled = false; saveBtn.innerHTML = originalBtnText; return; }
      }
      else if(type === 'other_bank'){
        if(dir === 'in' && inSum <= 0){ alert('📥 কলামে নোট দিন'); saveBtn.disabled = false; saveBtn.innerHTML = originalBtnText; return; }
        if(dir === 'out' && outSum <= 0){ alert('💸 কলামে নোট দিন'); saveBtn.disabled = false; saveBtn.innerHTML = originalBtnText; return; }
      }
      else if(type === 'support'){
        if(outSum <= 0 && inSum <= 0){ alert('💸 বা 📥 অন্তত একটি নোট দিন'); saveBtn.disabled = false; saveBtn.innerHTML = originalBtnText; return; }
        const pAcc = wrap.querySelector('#f_acc')?.value.trim() || '';
        const pName = wrap.querySelector('#f_name')?.value.trim() || '';
        if(!pAcc && !pName){ alert('🤝 গ্রাহকের নাম/অ্যাকাউন্ট দিন'); saveBtn.disabled = false; saveBtn.innerHTML = originalBtnText; return; }
      }
      else if(amount <= 0){ alert('অন্তত একটি নোট'); saveBtn.disabled = false; saveBtn.innerHTML = originalBtnText; return; }

      /* ✅ Loan Given — Online Transfer check */
      let onlineTransfer = false;
      let onlineBankName = '';
      if(type === 'loan_given'){
        const tickEl = wrap.querySelector('#f_onlineTransferTick');
        const bnHidden = wrap.querySelector('#f_onlineBankName');
        if(tickEl && tickEl.checked){
          onlineBankName = bnHidden ? bnHidden.value.trim() : '';
          if(!onlineBankName){
            alert('⚠️ ব্যাংকের নাম দেওয়া হয়নি। লেনদেন বাতিল।');
            saveBtn.disabled = false;
            saveBtn.innerHTML = originalBtnText;
            return;
          }
          onlineTransfer = true;
        }
      }

      let txnBranch, custBranch;
      if(type === 'branch_transfer'){
        const from = wrap.querySelector('#f_from').value;
        const to = wrap.querySelector('#f_to').value;
        if(from === to){ alert('একই শাখা নয়'); saveBtn.disabled = false; saveBtn.innerHTML = originalBtnText; return; }
        txnBranch = from;
        custBranch = from;
      } else if(type === 'support'){
        const hiddenB = wrap.querySelector('#f_custBranch_hidden');
        const br = hiddenB?.value || (session.role === 'admin' ? (viewBranch === 'all' ? 'kalaroa' : viewBranch) : session.branch);
        txnBranch = BRANCHES[br] ? br : 'kalaroa';
        custBranch = txnBranch;
      } else if(cfg.cust){
        const bs = wrap.querySelector('#f_branch');
        const bsVal = bs ? bs.value : null;
        if(bsVal && BRANCHES[bsVal]){ txnBranch = bsVal; }
        else if(session.role !== 'admin' && BRANCHES[session.branch]){ txnBranch = session.branch; }
        else { txnBranch = (viewBranch === 'all' || !BRANCHES[viewBranch]) ? 'kalaroa' : viewBranch; }
        const hiddenCustB = wrap.querySelector('#f_custBranch_hidden');
        if(hiddenCustB && hiddenCustB.value && BRANCHES[hiddenCustB.value]){ custBranch = hiddenCustB.value; }
        else if(editing && editing.custBranch && BRANCHES[editing.custBranch]){ custBranch = editing.custBranch; }
        else {
          const acc = wrap.querySelector('#f_acc')?.value.trim() || '';
          const existingCust = acc ? DB().customers.find(c => c.accountNo === acc) : null;
          custBranch = (existingCust?.branch && BRANCHES[existingCust.branch]) ? existingCust.branch : txnBranch;
        }
      } else {
        const bs = wrap.querySelector('#f_branch');
        const bsVal = bs ? bs.value : null;
        if(bsVal && BRANCHES[bsVal]){ txnBranch = bsVal; }
        else if(editing && BRANCHES[editing.branch]){ txnBranch = editing.branch; }
        else if(session.role !== 'admin' && BRANCHES[session.branch]){ txnBranch = session.branch; }
        else { txnBranch = (viewBranch === 'all' || !BRANCHES[viewBranch]) ? 'kalaroa' : viewBranch; }
        custBranch = txnBranch;
      }

      const bankKey = wrap.querySelector('#f_bank') ? wrap.querySelector('#f_bank').value : null;
      let txAmount;
      if(isOnlineSup) txAmount = onlineSupportAmount;
      else if(isOnlineMode()) txAmount = onlineAmount;
      else if(type === 'branch_transfer') txAmount = Math.max(outSum, inSum);
      else if(type === 'support') txAmount = Math.abs(outSum - inSum);
      else if(dir === 'in') txAmount = inSum;
      else if(dir === 'out') txAmount = outSum;
      else txAmount = amount;

      let finalNote;
      if(onlineTransfer){
        finalNote = 'লোন অফিসার ও গ্রাহকের সম্মতিতে অনলাইনে ফান্ড ট্রান্সফার করা হয়েছে। (' + onlineBankName + ')';
      } else if(isOnlineSup){
        finalNote = onlineSupportNote || ('সাপোর্ট — ' + onlineSupportName);
      } else {
        finalNote = (!cfg.cust && wrap.querySelector('#f_name') ? wrap.querySelector('#f_name').value.trim() : '') || wrap.querySelector('#f_note').value.trim();
      }

      const tx = {
        id: editing ? editing.id : uid(),
        type, date, branch: txnBranch, custBranch, bank: bankKey,
        from: type === 'branch_transfer' ? wrap.querySelector('#f_from').value : null,
        to: type === 'branch_transfer' ? wrap.querySelector('#f_to').value : null,
        dir, amount: Math.round(txAmount*100)/100,
        onlineAmount: (isOnlineMode() || isOnlineSup) ? txAmount : null,
        onlineRef: isOnlineMode() ? (wrap.querySelector('#online_ref')?.value.trim() || '') : null,
        supportAcc: isOnlineSup ? onlineSupportAcc : '',
        supportName: isOnlineSup ? onlineSupportName : '',
        notesOut: outNotes, notesIn: inNotes,
        custAcc: (isOnlineSup ? onlineSupportAcc : '') || (wrap.querySelector('#f_acc') ? wrap.querySelector('#f_acc').value.trim() : ''),
        custName: (isOnlineSup ? onlineSupportName : '') || (wrap.querySelector('#f_name') ? wrap.querySelector('#f_name').value.trim() : ''),
        custMobile: wrap.querySelector('#f_mobile') ? wrap.querySelector('#f_mobile').value.trim() : '',
        custAddr: wrap.querySelector('#f_addr') ? wrap.querySelector('#f_addr').value.trim() : '',
        note: finalNote,
        user: session.name, userUsername: session.username,
        createdAt: editing ? editing.createdAt : new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        year: date.slice(0,4),
        accepted: type === 'branch_transfer' ? false : true,
        acceptedDate: null, acceptedBy: null, acceptedByUsername: null, acceptedAt: null,
        onlineTransfer: onlineTransfer || false,
        onlineBankName: onlineBankName || null
      };

      if(!editing){
        const confirmed = await confirmDuplicate(tx, 60);
        if(!confirmed){
          saveBtn.disabled = false;
          saveBtn.innerHTML = originalBtnText;
          toast('❌ ডাবল এন্ট্রি বাতিল');
          return;
        }
      }

      if(cfg.cust && (tx.custAcc || tx.custName)){
        const c = upsertCustomer({
          accountNo: tx.custAcc,
          name: tx.custName,
          mobile: tx.custMobile,
          address: tx.custAddr,
          branch: custBranch
        });
        if(c){
          tx.custAcc = c.accountNo;
          if(!tx.custName) tx.custName = c.name;
          tx.custBranch = c.branch;
        }
      }

      let prevTxBackup = null;
      if(editing){
        const i = DB().txs.findIndex(t=>t.id === editing.id);
        if(i >= 0){
          prevTxBackup = JSON.parse(JSON.stringify(DB().txs[i]));
          tx.accepted = DB().txs[i].accepted;
          tx.acceptedDate = DB().txs[i].acceptedDate;
          tx.acceptedBy = DB().txs[i].acceptedBy;
          tx.acceptedByUsername = DB().txs[i].acceptedByUsername;
          tx.acceptedAt = DB().txs[i].acceptedAt;
          DB().txs[i] = tx;
          logTxEdit(tx.id, 'update', prevTxBackup, tx);
        } else {
          for(const y in DB().yearlyArchive){
            const arr = DB().yearlyArchive[y];
            const idx = arr.findIndex(t=>t.id === editing.id);
            if(idx >= 0){
              prevTxBackup = JSON.parse(JSON.stringify(arr[idx]));
              tx.accepted = arr[idx].accepted;
              tx.acceptedDate = arr[idx].acceptedDate;
              tx.acceptedBy = arr[idx].acceptedBy;
              tx.acceptedByUsername = arr[idx].acceptedByUsername;
              tx.acceptedAt = arr[idx].acceptedAt;
              arr[idx] = tx;
              logTxEdit(tx.id, 'update', prevTxBackup, tx);
              break;
            }
          }
        }
      } else {
        DB().txs.push(tx);
        logTxEdit(tx.id, 'create', null, tx);
      }
      if(type === 'support' && tx.custAcc) updateCustomerDueInDB(tx.custAcc, false);
      if(editing && editing.type === 'support' && editing.custAcc && editing.custAcc !== tx.custAcc){
        const oldCust = DB().customers.find(x=>x.accountNo === editing.custAcc);
        if(oldCust) updateCustomerDueInDB(editing.custAcc, false);
      }
      recomputeLive();
      await saveDB();
      close();
      renderDashboard();
      toast('✅ সংরক্ষিত — ৳' + fmt(txAmount));

      if(editing){
        offerUndoForTx(tx, prevTxBackup);
      } else {
        offerUndoForTx(tx, null);
      }

      if(type === 'support' && tx.custAcc){
        setTimeout(()=>{
          const c = DB().customers.find(x=>x.accountNo === tx.custAcc);
          if(c) showDuePopup(c, { force:true });
        }, 400);
      }
    } catch(err){
      console.error('Save error:', err);
      alert('❌ সেভ করতে সমস্যা: ' + err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = originalBtnText;
    }
  });
  wrap.querySelector('#f_close').addEventListener('click', close);
}

async function acceptTransfer(id, wrap, type, close){
  const t = DB().txs.find(x=>x.id === id);
  if(!t || t.accepted) return;
  if(session.role !== 'admin' && session.branch !== t.to){ alert('শুধু গ্রহণকারী শাখা'); return; }
  if(!confirm('গ্রহণ করবেন?')) return;
  const idx = DB().txs.findIndex(x => x.id === id);
  if(idx < 0) return;
  if(DB().txs[idx].accepted) return;
  const __oldTxForLog2 = JSON.parse(JSON.stringify(DB().txs[idx]));
  DB().txs[idx].accepted = true;
  DB().txs[idx].acceptedDate = todayStr();
  DB().txs[idx].acceptedAt = new Date().toISOString();
  DB().txs[idx].acceptedBy = session.name;
  DB().txs[idx].acceptedByUsername = session.username;
  logTxEdit(id, 'accept', __oldTxForLog2, DB().txs[idx]);
  recomputeLive();
  await saveDB();
  if(close) close();
  renderTopbar();
  renderDashboard();
  toast('✅ গৃহীত');
}
async function deleteTx(id){
  const t = DB().txs.find(x=>x.id === id);
  if(t) logTxEdit(id, 'delete', t, null);
  DB().txs = DB().txs.filter(x=>x.id !== id);
  if(t && t.type === 'support' && t.custAcc) updateCustomerDueInDB(t.custAcc, false);
  recomputeLive();
  await saveDB();
  renderDashboard();
  toast('🗑️ ডিলিট');
}
