  dailyClose: { label:'📅 Daily Close', icon:'📅' }
};
function getTableData(n){ const d = DB(); if(!d) return null; return d[n]; }
function getTableCount(n){ const d = getTableData(n); if(d == null) return 0; if(Array.isArray(d)) return d.length; if(typeof d === 'object') return Object.keys(d).length; return 1; }
function openDatabaseBrowser(){
  if(session.role !== 'admin'){ toast('❌ শুধু Admin'); return; }
  let activeTab = 'txs', searchQuery = '';
  const tabsHTML = Object.entries(DB_TABLES).map(([k,v]) => '<button class="db-tab-btn" data-dbtab="' + k + '">' + v.icon + ' ' + v.label + ' <span class="cnt">' + toBn(getTableCount(k)) + '</span></button>').join('');
  openModal({ title: '🗄️ Database Browser', xwide: true,
    bodyHTML: '<div class="db-tabs" id="dbTabs">' + tabsHTML + '</div>' +
      '<div class="db-toolbar"><input type="text" class="db-search" id="dbSearch" placeholder="🔍 Search..."><span class="db-info" id="dbInfo">—</span><button class="btn sm green" id="dbAddBtn">➕ Add Row</button><button class="btn sm gray" id="dbRefreshBtn">🔄 Refresh</button></div>' +
      '<div id="dbContent"></div>',
    onMount: (w) => {
      const tabsEl = w.querySelector('#dbTabs'), contentEl = w.querySelector('#dbContent'), infoEl = w.querySelector('#dbInfo');
      function setActive(t){ activeTab = t; tabsEl.querySelectorAll('.db-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.dbtab === t)); renderTable(); }
      tabsEl.querySelectorAll('.db-tab-btn').forEach(b => b.addEventListener('click', () => setActive(b.dataset.dbtab)));
      w.querySelector('#dbSearch').addEventListener('input', (e) => { searchQuery = e.target.value; renderTable(); });
      w.querySelector('#dbRefreshBtn').addEventListener('click', () => renderTable());
      w.querySelector('#dbAddBtn').addEventListener('click', () => openAddRowModal(activeTab, renderTable));
      function renderTable(){
        const data = getTableData(activeTab);
        if(data == null){ contentEl.innerHTML = '<div class="empty">📭 খালি</div>'; infoEl.textContent = '0'; return; }
        if(Array.isArray(data)) renderArrayTable(data, contentEl, infoEl, searchQuery, activeTab, renderTable);
        else renderObjectTable(data, contentEl, infoEl, searchQuery, activeTab, renderTable);
      }
      setActive(activeTab);
    }
  });
}
function renderArrayTable(arr, contentEl, infoEl, search, tableName, onRefresh){
  let list = arr.slice();
  if(search){ const q = search.toLowerCase(); list = list.filter(item => JSON.stringify(item).toLowerCase().includes(q)); }
  infoEl.textContent = 'মোট: ' + toBn(arr.length) + ' • দেখানো: ' + toBn(list.length);
  if(!list.length){ contentEl.innerHTML = '<div class="empty">📭 নেই</div>'; return; }
  const allKeys = new Set();
  list.forEach(item => { if(item && typeof item === 'object') Object.keys(item).forEach(k => allKeys.add(k)); });
  const dk = Array.from(allKeys).slice(0, 8);
  const rowsHTML = list.slice(0, 200).map((item, i) => {
    const cells = dk.map(k => { let v = item[k]; if(v == null) return '<td>—</td>'; if(typeof v === 'object') v = JSON.stringify(v).slice(0,50)+'…'; v = String(v); if(v.length > 60) v = v.slice(0,60)+'…'; return '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(v) + '</td>'; }).join('');
    return '<tr><td>' + toBn(i+1) + '</td>' + cells + '<td style="white-space:nowrap"><button class="mini" data-dbview="' + i + '">👁️</button><button class="mini" data-dbedit="' + i + '">✏️</button><button class="mini danger" data-dbdel="' + i + '">🗑️</button></td></tr>';
  }).join('');
  contentEl.innerHTML = '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th>' + dk.map(k => '<th>' + esc(k) + '</th>').join('') + '<th>Actions</th></tr></thead><tbody>' + rowsHTML + '</tbody></table></div>';
  contentEl.querySelectorAll('[data-dbview]').forEach(b => b.addEventListener('click', () => openRowViewModal(list[+b.dataset.dbview], tableName)));
  contentEl.querySelectorAll('[data-dbedit]').forEach(b => b.addEventListener('click', () => openRowEditModal(list[+b.dataset.dbedit], +b.dataset.dbedit, tableName, onRefresh)));
  contentEl.querySelectorAll('[data-dbdel]').forEach(b => b.addEventListener('click', () => deleteRow(list[+b.dataset.dbdel], +b.dataset.dbdel, tableName, onRefresh)));
}
function renderObjectTable(obj, contentEl, infoEl, search, tableName, onRefresh){
  const keys = Object.keys(obj);
  let list = keys.map(k => ({ __key: k, __value: obj[k] }));
  if(search){ const q = search.toLowerCase(); list = list.filter(item => JSON.stringify(item).toLowerCase().includes(q)); }
  infoEl.textContent = 'Keys: ' + toBn(keys.length);
  if(!list.length){ contentEl.innerHTML = '<div class="empty">📭 খালি</div>'; return; }
  const rowsHTML = list.map((item, i) => {
    let v = item.__value; if(typeof v === 'object') v = JSON.stringify(v);
    const vs = String(v);
    return '<tr><td>' + toBn(i+1) + '</td><td style="font-family:monospace;color:#93c5fd">' + esc(item.__key) + '</td><td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace;font-size:12px">' + esc(vs.slice(0,200)) + (vs.length>200?'…':'') + '</td>' +
      '<td style="white-space:nowrap"><button class="mini" data-dbview="' + esc(item.__key) + '">👁️</button><button class="mini" data-dbedit="' + esc(item.__key) + '">✏️</button><button class="mini danger" data-dbdel="' + esc(item.__key) + '">🗑️</button></td></tr>';
  }).join('');
  contentEl.innerHTML = '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>Key</th><th>Value</th><th>Actions</th></tr></thead><tbody>' + rowsHTML + '</tbody></table></div>';
  contentEl.querySelectorAll('[data-dbview]').forEach(b => b.addEventListener('click', () => openJsonViewModal(b.dataset.dbview, obj[b.dataset.dbview])));
  contentEl.querySelectorAll('[data-dbedit]').forEach(b => b.addEventListener('click', () => openJsonEditModal(b.dataset.dbview, obj[b.dataset.dbview], tableName, onRefresh)));
  contentEl.querySelectorAll('[data-dbdel]').forEach(b => b.addEventListener('click', () => { if(!confirm('Delete "' + b.dataset.dbdel + '"?')) return; delete obj[b.dataset.dbdel]; DB().__lastUpdate = new Date().toISOString(); saveDB().then(() => { toast('🗑️ Deleted'); onRefresh(); }); }));
}
function openRowViewModal(row, tn){ openModal({ title: '👁️ View — ' + esc(tn), wide: true, bodyHTML: '<div class="db-json">' + esc(JSON.stringify(row, null, 2)) + '</div>' }); }
function openJsonViewModal(key, val){ openModal({ title: '👁️ ' + esc(key), wide: true, bodyHTML: '<div class="db-json">' + esc(typeof val === 'object' ? JSON.stringify(val, null, 2) : String(val)) + '</div>' }); }
function openRowEditModal(row, index, tn, onRefresh){
  const fh = Object.keys(row || {}).map(k => { const v = row[k]; const isO = v && typeof v === 'object'; const sv = isO ? JSON.stringify(v, null, 2) : (v == null ? '' : String(v)); return '<div class="db-edit-field"><label>' + esc(k) + ' ' + (isO?'(JSON)':'') + '</label>' + (isO ? '<textarea data-field="' + esc(k) + '" data-type="json">' + esc(sv) + '</textarea>' : '<input type="text" data-field="' + esc(k) + '" data-type="text" value="' + esc(sv) + '">') + '</div>'; }).join('');
  openModal({ title: '✏️ Edit Row — ' + esc(tn), wide: true, bodyHTML: '<div style="max-height:520px;overflow-y:auto;padding-right:6px">' + fh + '</div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn green" id="dbRowSave" style="flex:1">💾 Save</button><button class="btn gray" id="dbRowCancel" style="flex:1">Cancel</button></div>',
    onMount: (w, close) => {
      w.querySelector('#dbRowCancel').addEventListener('click', close);
      w.querySelector('#dbRowSave').addEventListener('click', async () => {
        const upd = {}; let err = false;
        w.querySelectorAll('[data-field]').forEach(el => { const k = el.dataset.field, t = el.dataset.type, raw = el.value; if(t === 'json'){ try{ upd[k] = JSON.parse(raw); }catch(e){ err = true; alert('❌ JSON error: '+e.message); } } else { if(raw === '') upd[k] = ''; else if(/^-?\d+(\.\d+)?$/.test(raw)) upd[k] = Number(raw); else if(raw === 'true') upd[k] = true; else if(raw === 'false') upd[k] = false; else upd[k] = raw; } });
        if(err) return;
        const arr = DB()[tn]; if(Array.isArray(arr) && arr[index]) arr[index] = { ...arr[index], ...upd };
        await saveDB(); close(); toast('✅ Updated');
        if(onRefresh) onRefresh(); renderDashboard();
      });
    }
  });
}
function openJsonEditModal(key, val, tn, onRefresh){
  const isO = val && typeof val === 'object';
  openModal({ title: '✏️ Edit — ' + esc(key), wide: true, bodyHTML: '<div class="db-edit-field"><label>Value ' + (isO?'(JSON)':'') + '</label><textarea id="dbJsonVal" style="min-height:240px">' + esc(isO ? JSON.stringify(val, null, 2) : String(val)) + '</textarea></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn green" id="dbJsonSave" style="flex:1">💾 Save</button><button class="btn gray" id="dbJsonCancel" style="flex:1">Cancel</button></div>',
    onMount: (w, close) => {
      w.querySelector('#dbJsonCancel').addEventListener('click', close);
      w.querySelector('#dbJsonSave').addEventListener('click', async () => {
        const raw = w.querySelector('#dbJsonVal').value;
        let parsed; try{ parsed = isO ? JSON.parse(raw) : raw; }catch(e){ alert('❌ JSON error'); return; }
        DB()[tn][key] = parsed;
        await saveDB(); close(); toast('✅ Updated');
        if(onRefresh) onRefresh();
      });
    }
  });
}
async function deleteRow(row, index, tn, onRefresh){
  if(!confirm('Delete from ' + tn + '?')) return;
  const arr = DB()[tn]; if(!Array.isArray(arr)) return;
  const rm = arr.splice(index, 1)[0];
  if(tn === 'txs' && rm && rm.id){ if(!DB().deletedTxIds) DB().deletedTxIds = {}; DB().deletedTxIds[rm.id] = new Date().toISOString(); }
  await saveDB(); toast('🗑️ Deleted');
  if(onRefresh) onRefresh(); renderDashboard();
}
function openAddRowModal(tn, onRefresh){
  openModal({ title: '➕ Add Row — ' + esc(tn), wide: true, bodyHTML: '<div class="db-edit-field"><label>JSON</label><textarea id="dbAddJson" style="min-height:280px">{\n  "id": "new_' + Date.now() + '",\n  "date": "' + todayStr() + '"\n}</textarea></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn green" id="dbAddSave" style="flex:1">💾 Add</button><button class="btn gray" id="dbAddCancel" style="flex:1">Cancel</button></div>',

        if(onRefresh) onRefresh();
      });
    }
  });
}

/* ═══ AUTH ═══ */
async function doLogin(){
  const b = $('#loginBtn'), e = $('#loginErr');
  const u = $('#loginUser').value.trim(), p = $('#loginPass').value.trim();
  if(!u || !p){ e.textContent = '⚠️ আইডি ও পাসওয়ার্ড দিন'; return; }
  b.disabled = true; b.innerHTML = '<span class="spinner"></span> যাচাই...'; e.textContent = '';
  try{
    if(!DB()){ e.textContent = '❌ DB load হয়নি'; b.disabled = false; b.innerHTML = '🔐 লগইন করুন'; return; }
    forceFixAdmin();
    let user = DB().users.find(x => x.username === u && verifyPassword(p, x.password));
    if(!user && u === 'admin' && verifyPassword(p, DEFAULT_ADMIN_HASH)){ forceFixAdmin(); user = DB().users.find(x => x.username === 'admin'); }
    if(!user){ e.textContent = '❌ ভুল'; $('#loginPass').value = ''; b.disabled = false; b.innerHTML = '🔐 লগইন করুন'; return; }
    session = user;
    sessionStorage.setItem(SKEY, user.id);
    viewBranch = user.role === 'admin' ? 'all' : user.branch;
    dashDate = todayStr();
    startApp();
  }catch(err){ e.textContent = '❌ ' + err.message; b.disabled = false; b.innerHTML = '🔐 লগইন করুন'; }
}
async function logout(){
  try{ if(DB()) await saveDB(); }catch(e){}
  try{
    if(__realtimeChannel && __supabaseClient){
      await __realtimeChannel.untrack();
      __supabaseClient.removeChannel(__realtimeChannel);
      __realtimeChannel = null;
    }
  }catch(e){}
  updateRealtimeIndicator('offline');
  updatePresenceUI([]);
  sessionStorage.removeItem(SKEY);
  session = null; viewBranch = 'all'; dashDate = todayStr(); isDateViewMode = false;
  $('#app').classList.add('hidden');
  const ls = $('#loginScreen'); if(ls){ ls.classList.remove('hidden'); ls.style.display = 'flex'; }
  $('#loginPass').value = ''; $('#loginUser').value = '';
  $('#modalRoot').innerHTML = '';
  const b = $('#loginBtn'); if(b){ b.disabled = false; b.innerHTML = '🔐 লগইন করুন'; }
}
function startApp(){
  if(!session) return;
  const ls = $('#loginScreen'); if(ls){ ls.classList.add('hidden'); ls.style.display = ''; }
  $('#app').classList.remove('hidden');
  performDailyRollover(false);
  recalcAllCustomerDues(false);
  recomputeLive();
  dashDate = todayStr(); isDateViewMode = false;
  renderTopbar(); renderDashboard(); renderSidebar();
  startClock(); saveDB();
  // ⚡ Realtime-এ নিজের presence ট্র্যাক
  setTimeout(() => {
    try{
      if(__realtimeChannel && __realtimeChannel.state === 'joined'){
        __realtimeChannel.track({
          user: session.name,
          username: session.username,
          branch: session.branch || 'all',
          role: session.role,
          joined_at: new Date().toISOString()
        }).catch(()=>{});
      }
    }catch(e){}
  }, 800);
}

document.getElementById('sidebarOverlay')?.addEventListener('click', closeSidebar);
document.getElementById('sidebarClose')?.addEventListener('click', closeSidebar);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSidebar(); });
setupEnterNavigation();
window.addEventListener('beforeunload', () => {
  try{
    if(__realtimeChannel && __supabaseClient){
      __realtimeChannel.untrack().catch(()=>{});
    }
  }catch(e){}
});

(async function init(){
  console.log('🚀 Computer Campus v28');
  try{ window.db = loadLocalDB() || defaultDB(); }catch(e){ window.db = defaultDB(); }
  normalizeDB();
  forceFixAdmin();
  recalcAllCustomerDues(false);
  recomputeLive();
  const lb = $('#loginBtn'); if(lb) lb.addEventListener('click', doLogin);
  const lu = $('#loginUser'), lp = $('#loginPass');
  if(lu) lu.addEventListener('keydown', e => { if(e.key === 'Enter') lp.focus(); });
  if(lp) lp.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  const sid = sessionStorage.getItem(SKEY);
  if(sid){ const u = DB().users.find(x => x.id === sid); if(u){ session = u; viewBranch = u.role === 'admin' ? 'all' : u.branch; startApp(); } }
  initSupabase();
  console.log('✅ v28 initialized. Login: admin / 8182');
})();
</script>
