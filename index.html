function setupMoneyExchange(wrap, close, initialBranch){
  const sumOutEl = wrap.querySelector('#me_sumOut');
  const sumInEl = wrap.querySelector('#me_sumIn');
  const netEl = wrap.querySelector('#me_netAmt');
  const hintEl = wrap.querySelector('#me_hint');
  function currentBranch(){ return wrap.querySelector('#me_branch')?.value || initialBranch; }
  function currentDir(){ return wrap.querySelector('#me_dir')?.value || 'in_physical'; }
  function currentBank(){ return wrap.querySelector('#me_bank')?.value || 'general'; }
  function isNoteChange(){ return currentDir() === 'note_change'; }
  function recalc(){
    const outNotes = readNotes(wrap, 'me_out');
    const inNotes = readNotes(wrap, 'me_in');
    const outSum = noteSum(outNotes), inSum = noteSum(inNotes);
    sumOutEl.textContent = '৳ ' + fmt(outSum);
    sumInEl.textContent = '৳ ' + fmt(inSum);
    if(isNoteChange()){
      const diff = Math.abs(outSum - inSum);
      netEl.textContent = '৳ ' + fmt(diff);
      netEl.style.color = (diff === 0) ? '#4ade80' : '#facc15';
    } else {
      netEl.textContent = '৳ ' + fmt(Math.abs(outSum - inSum));
      netEl.style.color = '';
    }
  }
  function updateHint(){
    if(!hintEl) return;
    if(isNoteChange()){
      hintEl.innerHTML = '🔁 <b>নোট পরিবর্তন মোড:</b> প্রদান ও গ্রহণ — <b>সমান</b> হতে হবে।';
      hintEl.style.background = 'rgba(34,197,94,.08)';
      hintEl.style.borderColor = 'rgba(34,197,94,.4)';
      hintEl.style.color = '#86efac';
    } else {
      hintEl.innerHTML = '💡 <b>প্রদান</b> = আমি দিলাম | <b>গ্রহণ</b> = আমি নিলাম';
      hintEl.style.background = '';
      hintEl.style.borderColor = '';
      hintEl.style.color = '';
    }
  }
  wrap.querySelectorAll('.note-item input').forEach(i => i.addEventListener('input', recalc));
  const dirSel = wrap.querySelector('#me_dir');
  if(dirSel) dirSel.addEventListener('change', ()=>{ updateHint(); recalc(); });
  updateHint();
  recalc();
  const meRDate = wrap.querySelector('#me_r_date');
  const meRBody = wrap.querySelector('#me_r_body');
  let currentReportList = [];
  function renderReport(){
    const dateVal = meRDate.value;
    let list = getAllTxs().filter(t => t.type === 'money_exchange');
    const bf = currentBranchFilter();
    if(session.role !== 'admin') list = list.filter(t => t.branch === session.branch);
    else if(bf !== 'all') list = list.filter(t => t.branch === bf);
    if(dateVal) list = list.filter(t => t.date === dateVal);
    list.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
    currentReportList = list;
    meRBody.innerHTML = txListHTML(list, { admin: session.role === 'admin' });
    meRBody.querySelectorAll('[data-edit]').forEach(b =>
      b.addEventListener('click', async () => { close(); openTxModal('money_exchange', b.dataset.edit); }));
    meRBody.querySelectorAll('[data-del]').forEach(b =>
      b.addEventListener('click', async () => {
        if(confirm('ডিলিট?')){ await deleteTx(b.dataset.del); renderReport(); }
      }));
  }
  if(meRDate) meRDate.addEventListener('change', renderReport);
  const meAllBtn = wrap.querySelector('#me_r_all');
  if(meAllBtn) meAllBtn.addEventListener('click', ()=>{ meRDate.value=''; renderReport(); });
  renderReport();
  const mePdfBtn = wrap.querySelector('#me_r_pdf');
  const mePrintBtn = wrap.querySelector('#me_r_print');
  if(mePrintBtn) mePrintBtn.addEventListener('click', ()=>{
    const rows = currentReportList.map(t => buildReportRow(t));
    const total = currentReportList.reduce((s,t)=> s + Number(t.amount||0), 0);
    rows.push(['', '', '', '', 'TOTAL', 'BDT ' + fmt(total), '', '', '', '', '']);
    printReport('Money Exchange Report', REPORT_HEADERS, rows, 'money_exchange');
  });
  if(mePdfBtn) mePdfBtn.addEventListener('click', ()=>{
    const rows = currentReportList.map(t => buildReportRow(t));
    const total = currentReportList.reduce((s,t)=> s + Number(t.amount||0), 0);
    rows.push(['', '', '', '', 'TOTAL', 'BDT ' + fmt(total), '', '', '', '']);
    exportToPDF('Money Exchange Report', REPORT_HEADERS, rows, 'money_exchange.pdf');
  });
  const meXlsxBtn = wrap.querySelector('#me_r_xlsx');
  if(meXlsxBtn) meXlsxBtn.addEventListener('click', ()=>{
    const rows = currentReportList.map(t => buildReportRow(t));
    const total = currentReportList.reduce((s,t)=> s + Number(t.amount||0), 0);
    rows.push(['', '', '', '', 'TOTAL', 'BDT ' + fmt(total), '', '', '', '']);
    exportToXLSX('Money Exchange Report', REPORT_HEADERS, rows, 'money_exchange.xlsx');
  });
  const meSaveBtn = wrap.querySelector('#me_save');
  meSaveBtn.addEventListener('click', async ()=>{
    if(meSaveBtn.disabled) return;
    meSaveBtn.disabled = true;
    const originalMeBtnText = meSaveBtn.innerHTML;
    meSaveBtn.innerHTML = '<span class="spinner"></span> সংরক্ষণ হচ্ছে...';
    try {
      const br = currentBranch();
      const bankKey = currentBank();
      const dirVal = currentDir();
      const desc = wrap.querySelector('#me_desc').value.trim();
      const isNoteChg = (dirVal === 'note_change');
      const outNotes = readNotes(wrap, 'me_out');
      const inNotes = readNotes(wrap, 'me_in');
      const outSum = noteSum(outNotes), inSum = noteSum(inNotes);
      if(outSum === 0 && inSum === 0){ alert('অন্তত একটি নোট দিন'); meSaveBtn.disabled = false; meSaveBtn.innerHTML = originalMeBtnText; return; }
      if(isNoteChg && outSum !== inSum){
        alert('🔁 নোট পরিবর্তন মোডে প্রদান ও গ্রহণ সমান হতে হবে!');
        meSaveBtn.disabled = false; meSaveBtn.innerHTML = originalMeBtnText; return;
      }
      const dateVal = wrap.querySelector('#me_date').value || dashDate;
      const tx = {
        id: uid(), type: 'money_exchange',
        date: dateVal, branch: br, custBranch: br, from: null, to: null,
        bank: bankKey, dir: dirVal,
        amount: Math.round(Math.abs(outSum - inSum) * 100) / 100,
        notesOutSum: Math.round(outSum * 100) / 100,
        notesInSum: Math.round(inSum * 100) / 100,
        notesOut: outNotes, notesIn: inNotes,
        custAcc: '', custName: '', custMobile: '', custAddr: '',
        note: desc || (isNoteChg ? 'নোট পরিবর্তন' : 'মানি এক্সচেঞ্জ'),
        user: session.name, userUsername: session.username,
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
        year: dateVal.slice(0,4),
        accepted: true, acceptedDate: dateVal,
        acceptedBy: session.name, acceptedByUsername: session.username,
        acceptedAt: new Date().toISOString()
      };
      const confirmed = await confirmDuplicate(tx, 60);
      if(!confirmed){
        toast('❌ ডাবল এন্ট্রি বাতিল');
        meSaveBtn.disabled = false;
        meSaveBtn.innerHTML = originalMeBtnText;
        return;
      }
      DB().txs.push(tx);
      logTxEdit(tx.id, 'create', null, tx);
      recomputeLive();
      await saveDB();
      close();
      renderDashboard();
      if(isNoteChg) toast('✅ নোট পরিবর্তন সম্পন্ন — ৳' + fmt(outSum));
      else toast('✅ মানি এক্সচেঞ্জ — ৳' + fmt(Math.abs(outSum - inSum)));
      offerUndoForTx(tx, null);
    } catch(err){
      console.error('ME Save error:', err);
      alert('❌ সেভ করতে সমস্যা: ' + err.message);
    } finally {
      meSaveBtn.disabled = false;
      meSaveBtn.innerHTML = originalMeBtnText;
    }
  });
  wrap.querySelector('#me_close').addEventListener('click', close);
}
</script>

<script>
/* ============ Export / Print ============ */
const REPORT_HEADERS = ['Date','Type','Txn Branch','Customer','Direction','Amount','Description','Notes','User','Time','Cust Branch'];

function exportToPDF(title, headers, rows, filename, opts){
  opts = opts || {};
  const mode = opts.mode || 'a4-dark';
  try{
    const { jsPDF } = window.jspdf;
    if(!jsPDF){ toast('❌ PDF নেই'); return; }
    const isThermal = mode.startsWith('thermal');
    const isDark = mode.includes('dark');
    const thermalWidth = mode === 'thermal-58' ? 58 : 80;
    let doc, pageW, pageH;
    if(isThermal){
      doc = new jsPDF({ orientation:'portrait', unit:'mm', format:[thermalWidth, 200] });
      pageW = thermalWidth; pageH = 200;
    } else {
      doc = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
      pageW = doc.internal.pageSize.getWidth();
      pageH = doc.internal.pageSize.getHeight();
    }
    if(isThermal){
      let y = 6;
      const cx = thermalWidth / 2;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.text('COMPUTER CAMPUS', cx, y, { align:'center' }); y += 5;
      doc.setFontSize(8);
      doc.setFont('helvetica', 'normal');
      doc.text('Agent Banking System', cx, y, { align:'center' }); y += 4;
      doc.text('--------------------------------', cx, y, { align:'center' }); y += 4;
      doc.setFontSize(9);
      doc.setFont('helvetica', 'bold');
      doc.text(title, cx, y, { align:'center' }); y += 4;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7);
      doc.text('Generated: ' + fmtDateTimeEN(new Date().toISOString()), cx, y, { align:'center' }); y += 3;
      doc.text('By: ' + (session?.username || 'System'), cx, y, { align:'center' }); y += 4;
      doc.text('--------------------------------', cx, y, { align:'center' }); y += 4;
      doc.setFontSize(7);
      rows.forEach((row)=>{
        if(y > pageH - 15){ doc.addPage([thermalWidth, 200]); y = 10; }
        headers.forEach((h, i)=>{
          if(i >= row.length) return;
          const cellVal = String(row[i] || '-').substring(0, 30);
          doc.text(cellVal, 3, y); y += 3.2;
        });
        y += 1;
        doc.text('--------------------------------', cx, y, { align:'center' }); y += 3.5;
      });
    } else {
      if(isDark){ doc.setFillColor(4, 6, 13); doc.rect(0, 0, pageW, pageH, 'F'); }
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(16);
      doc.setTextColor(isDark ? 255 : 0, isDark ? 255 : 0, isDark ? 255 : 0);
      doc.text(title, 40, 40);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(isDark ? 180 : 80, isDark ? 190 : 80, isDark ? 220 : 80);
      doc.text('Generated: ' + fmtDateTimeEN(new Date().toISOString()) + ' | By: ' + (session?.username || 'System'), 40, 55);
      doc.autoTable({
        head: [headers], body: rows, startY: 70,
        styles: { font: 'helvetica', fontSize: 7.5, cellPadding: 3.5, overflow: 'linebreak',
          textColor: isDark ? [220, 230, 250] : [20, 20, 20],
          fillColor: isDark ? [12, 18, 35] : [255, 255, 255],
          lineColor: isDark ? [40, 50, 80] : [200, 200, 200], lineWidth: 0.5 },
        headStyles: { fillColor: isDark ? [59, 130, 246] : [15, 20, 40], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8.5 },
        alternateRowStyles: { fillColor: isDark ? [8, 12, 26] : [240, 244, 255] },
        margin: { left: 30, right: 30, top: 70 }
      });
    }
    doc.save(filename || 'report.pdf');
    toast('📄 PDF তৈরি');
  }catch(e){ console.error(e); toast('❌ PDF failed'); }
}

function printReport(title, headers, rows, filenameBase){
  const wrap = document.createElement('div');
  wrap.className = 'modal-overlay';
  wrap.innerHTML = `
    <div class="modal" style="max-width:460px">
      <div class="modal-head">
        <h3>🖨️ প্রিন্ট অপশন</h3>
        <button class="x" type="button">✕</button>
      </div>
      <div class="modal-body">
        <div class="bank-hint" style="margin-bottom:14px">
          💡 <b>Direct Print</b> — Bluetooth বা WiFi printer সিলেক্ট করে সরাসরি প্রিন্ট করুন।
        </div>
        <div style="display:grid;gap:10px;margin-bottom:16px">
          <button class="btn" data-action="print-a4" style="padding:14px;font-size:14px">📄 A4 Paper — Bluetooth / WiFi Printer</button>
          <button class="btn" data-action="print-thermal-58" style="padding:14px;font-size:14px;background:linear-gradient(135deg,#8b5cf6,#6366f1)">🧾 Thermal 58mm</button>
          <button class="btn" data-action="print-thermal-80" style="padding:14px;font-size:14px;background:linear-gradient(135deg,#8b5cf6,#6366f1)">🧾 Thermal 80mm</button>
        </div>
        <div style="display:grid;gap:10px;margin-bottom:16px">
          <button class="btn gray" data-action="pdf-a4-dark" style="padding:12px;font-size:13px">🖤 A4 PDF (Dark)</button>
          <button class="btn gray" data-action="pdf-a4-light" style="padding:12px;font-size:13px">📄 A4 PDF (Light)</button>
          <button class="btn gray" data-action="pdf-thermal" style="padding:12px;font-size:13px">🧾 Thermal PDF</button>
        </div>
        <button class="btn gray" data-action="cancel" style="width:100%;padding:12px">বাতিল</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.querySelector('.x').addEventListener('click', close);
  wrap.addEventListener('click', e => { if(e.target === wrap) close(); });
  wrap.querySelector('[data-action="cancel"]').addEventListener('click', close);
  wrap.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', ()=>{
      const action = btn.dataset.action;
      close();
      if(action === 'print-a4'){ directPrintHTML(title, headers, rows, 'a4'); }
      else if(action === 'print-thermal-58'){ directPrintHTML(title, headers, rows, 'thermal-58'); }
      else if(action === 'print-thermal-80'){ directPrintHTML(title, headers, rows, 'thermal-80'); }
      else if(action === 'pdf-a4-dark'){ exportToPDF(title, headers, rows, filenameBase + '_dark.pdf', { mode:'a4-dark' }); }
      else if(action === 'pdf-a4-light'){ exportToPDF(title, headers, rows, filenameBase + '_light.pdf', { mode:'a4-light' }); }
      else if(action === 'pdf-thermal'){ exportToPDF(title, headers, rows, filenameBase + '_thermal.pdf', { mode:'thermal-80' }); }
    });
  });
}

function directPrintHTML(title, headers, rows, format){
  const isThermal = format.startsWith('thermal');
  const width = format === 'thermal-58' ? '58mm' : (format === 'thermal-80' ? '80mm' : 'auto');
  const printWindow = window.open('', '_blank', 'width=900,height=700');
  if(!printWindow){ alert('❌ Popup blocked! Browser-এ popup allow করুন।'); return; }
  let tableHTML = '';
  if(isThermal){
    tableHTML = rows.map((row) => {
      let rowHTML = '<div style="padding:6px 0;border-bottom:1px dashed #000;page-break-inside:avoid">';
      headers.forEach((h, i) => {
        if(i >= row.length) return;
        const val = String(row[i] || '-');
        rowHTML += `<div style="display:flex;justify-content:space-between;font-size:11px;line-height:1.5">
          <span style="font-weight:600;color:#000;min-width:35%">${h}:</span>
          <span style="text-align:right;flex:1;word-break:break-word;margin-left:6px">${val}</span>
        </div>`;
      });
      rowHTML += '</div>';
      return rowHTML;
    }).join('');
  } else {
    tableHTML = `<table style="width:100%;border-collapse:collapse;font-size:10px">
      <thead>
        <tr>${headers.map(h => `<th style="background:#111827;color:#fff;padding:8px 6px;border:1px solid #333;text-align:left;font-size:10px;font-weight:700">${h}</th>`).join('')}</tr>
      </thead>
      <tbody>
        ${rows.map((row, idx) => `
          <tr style="page-break-inside:avoid;${idx % 2 === 0 ? 'background:#f9fafb;' : ''}">
            ${headers.map((_, i) => {
              const val = String(row[i] || '-');
              return `<td style="padding:6px;border:1px solid #ddd;font-size:10px;word-break:break-word">${val}</td>`;
            }).join('')}
          </tr>`).join('')}
      </tbody>
    </table>`;
  }
  const dateStr = fmtDateTimeEN(new Date().toISOString());
  const htmlContent = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>${title}</title>
      <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family: 'Noto Sans Bengali', 'Segoe UI', Arial, sans-serif;color:#000;background:#fff;padding:${isThermal ? '4mm' : '10mm'};font-size:${isThermal ? '10px' : '11px'};}
        @page{size: ${isThermal ? `${width} auto` : 'A4 landscape'};margin:${isThermal ? '2mm' : '8mm'};}
        @media print{body{padding:0;}.no-print{display:none;}}
        .header{text-align:center;padding-bottom:8px;margin-bottom:10px;border-bottom:${isThermal ? '1px dashed #000' : '2px solid #000'};}
        .header h1{font-size:${isThermal ? '13px' : '20px'};font-weight:800;margin-bottom:4px;}
        .header .sub{font-size:${isThermal ? '9px' : '11px'};color:#555;margin-bottom:2px;}
        .header .title{font-size:${isThermal ? '11px' : '14px'};font-weight:700;margin-top:6px;color:#000;}
        .print-btn{position:fixed;top:12px;right:12px;padding:10px 20px;background:#22c55e;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(34,197,94,.4);z-index:999;}
        .close-btn{position:fixed;top:12px;right:140px;padding:10px 20px;background:#6b7280;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;z-index:999;}
        .footer{margin-top:12px;padding-top:8px;border-top:${isThermal ? '1px dashed #000' : '1px solid #ccc'};text-align:center;font-size:${isThermal ? '8px' : '10px'};color:#666;}
        ${isThermal ? `body{ width: ${width}; max-width: ${width}; margin: 0 auto; }` : ''}
      </style>
    </head>
    <body>
      <button class="print-btn no-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>
      <button class="close-btn no-print" onclick="window.close()">✕ বন্ধ</button>
      <div class="header">
        <h1>কম্পিউটার ক্যাম্পাস</h1>
        <div class="sub">Agent Banking System</div>
        <div class="title">${title}</div>
        <div class="sub" style="margin-top:4px">Generated: ${dateStr} | By: ${session?.username || 'System'}</div>
      </div>
      ${tableHTML}
      <div class="footer">Computer Campus • Agent Banking<br>এই রশিদটি কম্পিউটার জেনারেটেড</div>
      <script>
        window.addEventListener('load', function(){ setTimeout(function(){ window.print(); }, 500); });
      <\/script>
    </body>
    </html>`;
  printWindow.document.open();
  printWindow.document.write(htmlContent);
  printWindow.document.close();
}

function exportToXLSX(title, headers, rows, filename){
  try{
    const aoa = [[title], [], headers, ...rows];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = headers.map(()=> ({ wch: 18 }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Report');
    XLSX.writeFile(wb, filename || 'report.xlsx');
    toast('📊 XLSX');
  }catch(e){ console.error(e); toast('❌ XLSX failed'); }
}

function buildReportRow(t){
  const typeEn = txEN(t.type);
  const branchEn = branchEN(t.branch);
  const custBranchEn = branchEN(t.custBranch || t.branch);
  const isCrossBranch = t.custBranch && t.custBranch !== t.branch;
  let description = '', dirText = '';
  if(t.type === 'branch_transfer'){
    description = branchEN(t.from) + ' -> ' + branchEN(t.to);
    description += t.accepted ? ' [ACCEPTED]' : ' [PENDING]';
  } else if(t.type === 'other_bank'){
    const bn = (!t.bank || t.bank === 'general') ? '' : bankEN(t.bank);
    if(t.dir === 'online_in'){ dirText = 'Online In'; description = bn; }
    else if(t.dir === 'online_out'){ dirText = 'Online Out'; description = bn; }
    else if(t.dir === 'in'){ dirText = 'In'; description = bn; }
    else if(t.dir === 'out'){ dirText = 'Out'; description = bn; }
  } else if(t.type === 'support'){
    if(t.dir === 'online_support_out'){ dirText = 'Online Support Paid'; description = (safeEN(t.custName||'', '') || '') + (t.custAcc ? ' (' + t.custAcc + ')' : ''); }
    else if(t.dir === 'online_support_in'){ dirText = 'Online Support Refund'; description = (safeEN(t.custName||'', '') || '') + (t.custAcc ? ' (' + t.custAcc + ')' : ''); }
    else { dirText = t.dir === 'in' ? 'Refund' : 'Paid'; description = (t.custName && !hasBengali(t.custName) ? t.custName : '') + (t.custAcc ? ' (' + t.custAcc + ')' : ''); }
  } else if(t.type === 'money_exchange'){
    const mBank = (!t.bank || t.bank === 'general') ? 'General' : (BANKS[t.bank]?.en || t.bank);
    const mDir = t.dir === 'in_physical' ? 'Physically In' : t.dir === 'in_online' ? 'Online In' : t.dir === 'out_physical' ? 'Physically Out' : t.dir === 'out_online' ? 'Online Out' : t.dir === 'note_change' ? 'Note Change' : '';
    description = [mBank, mDir].filter(x=>x).join(' | ') || 'Money Exchange';
    if(t.note && t.note !== 'মানি এক্সচেঞ্জ' && t.note !== 'নোট পরিবর্তন'){ description += ' | Note: ' + t.note; }
  } else if(t.type === 'loan_given' && t.onlineTransfer){
    dirText = 'Give (Online Transfer)';
    description = 'Bank: ' + (t.onlineBankName || '-');
  } else if(t.dir){ dirText = t.dir === 'in' ? 'Receive' : 'Give'; }
  const notesOut = t.notesOut && Object.keys(t.notesOut).length ? noteTextPlain(t.notesOut) : '';
  const notesIn = t.notesIn && Object.keys(t.notesIn).length ? noteTextPlain(t.notesIn) : '';
  let notesStr = '';
  if(notesOut) notesStr += 'OUT: ' + notesOut;
  if(notesIn) notesStr += (notesStr ? ' | ' : '') + 'IN: ' + notesIn;
  if(t.onlineRef) notesStr += (notesStr ? ' | ' : '') + 'Ref: ' + t.onlineRef;
  const custName = t.custName || '', custAcc = t.custAcc || '';
  let customer = '';
  if(hasBengali(custName)){ customer = custAcc ? '(' + custAcc + ')' : '-'; }
  else { customer = (custName || '-') + (custAcc ? ' (' + custAcc + ')' : ''); }
  let userDisplay = t.userUsername || '';
  if(!userDisplay){ const u = (DB().users||[]).find(x=>x.name === t.user); if(u) userDisplay = u.username; }
  if(!userDisplay) userDisplay = safeEN(t.user, '-');
  let branchDisplay = branchEn;
  let custBranchDisplay = '';
  if(isCrossBranch){ branchDisplay = 'TXN: ' + branchEn; custBranchDisplay = 'CUST: ' + custBranchEn; }
  return [
    t.date || '-', typeEn, branchDisplay, customer, dirText || '-',
    'BDT ' + fmt(t.amount), description || '-', notesStr || '-',
    userDisplay, fmtDateTimeEN(t.createdAt), custBranchDisplay
  ];
}

function txListHTML(list, opts){
  opts = opts || {};
  if(!list.length) return `<div class="empty">📭 কোনো লেনদেন নেই</div>`;
  const rows = list.map(t => {
    const cfg = TX_CFG[t.type] || { title:t.type };
    const isArchived = t.year && (new Date().getFullYear() - parseInt(t.year,10)) >= ARCHIVE_YEARS_AFTER;
    let extra = '', dirBadge = '';
    if(t.type === 'branch_transfer'){
      extra = `${BRANCHES[t.from]?.name||''} ➜ ${BRANCHES[t.to]?.name||''}`;
    } else if(t.type === 'other_bank'){
      const bn = t.bank && BANKS[t.bank] ? BANKS[t.bank].name : '';
      let dirLabel = '';
      if(t.dir === 'online_in'){ dirLabel = '💳 অনলাইনে আসা'; dirBadge = ' <span class="badge online">💳</span>'; }
      else if(t.dir === 'online_out'){ dirLabel = '💳 অনলাইন পাঠানো'; dirBadge = ' <span class="badge online">💳</span>'; }
      else if(t.dir === 'in'){ dirLabel = '📥 ফিজিক্যালি আসা'; }
      else if(t.dir === 'out'){ dirLabel = '📤 ফিজিক্যালি পাঠানো'; }
      extra = (bn ? bn + ' • ' : '') + dirLabel;
      if(t.note && t.note !== '-') extra += '<br><small style="color:#888">📝 ' + esc(t.note) + '</small>';
    }
    else if(t.type === 'support' && (t.dir === 'online_support_out' || t.dir === 'online_support_in')){
      const isOut = t.dir === 'online_support_out';
      const lbl = isOut ? '🌐 অনলাইন সাপোর্ট প্রদান' : '🌐 অনলাইন সাপোর্ট ফেরত';
      extra = `<span style="color:#fff;font-weight:700">${lbl}</span>`;
      if(t.custName) extra += `<br><small style="color:#ccc">👤 ${esc(t.custName)}</small>`;
      if(t.custAcc) extra += `<br><small style="color:#fff;cursor:pointer;text-decoration:underline" class="support-acc-link" data-support-acc="${esc(t.custAcc)}">🔗 ${esc(t.custAcc)} (হিস্টরি)</small>`;
      if(t.note) extra += `<br><small style="color:#888">📝 ${esc(t.note)}</small>`;
    }
    else if(t.type === 'support'){
      const isPaid = t.dir === 'out';
      extra = `<span style="color:#fff;font-weight:700">${isPaid?'🤝 সাপোর্ট প্রদান':'↩️ সাপোর্ট ফেরত'}</span>`;
      if(t.custName && !hasBengali(t.custName)) extra += ` <small>(${esc(t.custName)})</small>`;
      if(t.custAcc) extra += `<br><small style="color:#fff;cursor:pointer;text-decoration:underline" class="support-acc-link" data-support-acc="${esc(t.custAcc)}">🔗 ${esc(t.custAcc)} (হিস্টরি)</small>`;
    }
    else if(t.type === 'money_exchange'){
      const bankName = (!t.bank || t.bank === 'general') ? 'সাধারণ' : (BANKS[t.bank]?.name || t.bank);
      const dirLabel = t.dir === 'in_physical' ? '📥 ফিজিক্যালি আনা (+)'
                     : t.dir === 'in_online' ? '💳 অনলাইনে আনা (+)'
                     : t.dir === 'out_physical' ? '📤 ফিজিক্যালি পাঠানো (−)'
                     : t.dir === 'out_online' ? '📤 অনলাইনে পাঠানো (−)'
                     : t.dir === 'note_change' ? '🔁 শুধু নোট পরিবর্তন'
                     : (t.dir === 'in' ? '📥 গ্রহণ' : t.dir === 'out' ? '📤 প্রদান' : '');
      const outSum = t.notesOutSum || (t.notesOut ? Object.keys(t.notesOut).reduce((s,k)=> s + Number(k)*Number(t.notesOut[k]), 0) : 0);
      const inSum  = t.notesInSum  || (t.notesIn  ? Object.keys(t.notesIn).reduce((s,k)=> s + Number(k)*Number(t.notesIn[k]), 0) : 0);
      const isNoteChg = t.dir === 'note_change';
      const dirColor = isNoteChg ? '#4ade80' : '#facc15';
      extra = `🏦 <b>${bankName}</b><br><span style="color:${dirColor};font-weight:700">${dirLabel}</span>${t.note && t.note !== 'মানি এক্সচেঞ্জ' && t.note !== 'নোট পরিবর্তন' ? '<br><small style="color:#888">📝 ' + esc(t.note) + '</small>' : ''}<br><small>📤 প্রদান: ৳ ${fmt(outSum)} • 📥 গ্রহণ: ৳ ${fmt(inSum)}</small>`;
    }
    else if(t.dir){ extra = t.dir === 'in' ? 'গ্রহণ' : 'প্রদান'; }

    if(t.type === 'loan_given' && t.onlineTransfer){
      extra = `<span style="color:#4ade80;font-weight:700">🌐 অনলাইন ফান্ড ট্রান্সফার</span>`;
      if(t.onlineBankName) extra += `<br><small style="color:#ccc">🏦 ${esc(t.onlineBankName)}</small>`;
      if(t.note) extra += `<br><small style="color:#888">📝 ${esc(t.note)}</small>`;
      dirBadge = ' <span class="badge online-tx">🌐 অনলাইন</span>';
    }
    let notesHTML = '';
    if(t.notesOut && Object.keys(t.notesOut).length) notesHTML += `<div style="margin-top:3px"><small style="color:#ccc">📤</small>${noteListInline(t.notesOut,'out')}</div>`;
    if(t.notesIn && Object.keys(t.notesIn).length) notesHTML += `<div style="margin-top:3px"><small style="color:#ccc">📥</small>${noteListInline(t.notesIn,'in')}</div>`;
    if(t.onlineRef) notesHTML += `<div style="margin-top:3px"><small style="color:#fff">🔗 ${esc(t.onlineRef)}</small></div>`;
    let statusBadge = '';
    if(t.type === 'branch_transfer'){
      statusBadge = t.accepted
        ? `<div style="margin-top:4px"><span class="badge accepted">✅</span></div>`
        : '<div style="margin-top:4px"><span class="badge pending">⏳</span></div>';
    }
    if(isArchived) statusBadge += `<div style="margin-top:4px"><span class="badge archive">📚 ${toBn(t.year)}</span></div>`;
    let actionBtns = '';
    if(t.type === 'branch_transfer' && !t.accepted){
      const canAccept = session && (session.role === 'admin' || session.branch === t.to);
      if(canAccept) actionBtns += `<button class="mini accept" data-accept="${t.id}">✅</button> `;
    }
    if(opts.admin && !isArchived){
      actionBtns += `<button class="mini" data-edit="${t.id}">✏️</button>
                     <button class="mini danger" data-del="${t.id}">🗑️</button>`;
    }
    return `<tr>
      <td>${toBn(t.date)}</td>
      <td>${cfg.icon||''} ${esc(cfg.title||t.type)}${dirBadge}</td>
      <td>${esc(t.custName||'-')}<br><small style="color:#888">${esc(t.custAcc||'')}</small><br>
        <span style="font-size:9.5px;padding:2px 6px;border-radius:5px;background:rgba(250,204,21,.15);border:1px solid rgba(250,204,21,.4);color:#facc15;display:inline-block;margin-top:3px">📍 লেনদেন: ${esc(BRANCHES[t.branch]?.name||'-')}</span>
        ${t.custBranch && t.custBranch !== t.branch ? `<br><span style="font-size:9.5px;padding:2px 6px;border-radius:5px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);color:#4ade80;display:inline-block;margin-top:3px">👤 গ্রাহক: ${esc(BRANCHES[t.custBranch]?.name||'-')}</span>` : ''}
      </td>
      <td>${extra || esc(t.note || '-')}${notesHTML}${statusBadge}</td>
      <td class="amt">৳ ${fmt(t.amount)}</td>
      <td>${esc(t.user||'-')}</td>
      <td style="font-size:11px;white-space:nowrap">${esc(fmtDateTime(t.createdAt))}</td>
      ${opts.admin ? `<td>${actionBtns}</td>` : ''}
    </tr>`;
  }).join('');
  const html = `<div class="table-wrap"><table class="tbl">
    <thead><tr>
      <th>তারিখ</th><th>ধরন</th><th>গ্রাহক</th><th>বিবরণ ও নোট</th><th>টাকা</th>
      <th>ইউজার</th><th>সময়</th>
      ${opts.admin ? '<th>অ্যাকশন</th>' : ''}
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
  setTimeout(()=>{
    document.querySelectorAll('.support-acc-link').forEach(el=>{
      if(el.dataset.bound) return;
      el.dataset.bound = '1';
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const acc = el.dataset.supportAcc;
        if(acc) showCustomerAllTxns(acc);
      });
    });
  }, 50);
  return html;
}

function showCustomerAllTxns(accountNo){
  const cust = DB().customers.find(c=>c.accountNo === accountNo);
  const list = getAllTxs()
    .filter(t=> t.custAcc === accountNo || t.supportAcc === accountNo)
    .sort((a,b)=> (b.date + (b.createdAt||'') < a.date + (a.createdAt||'') ? 1 : -1));
  const sTxns = list.filter(t=> t.type === 'support');
  const sPaid = sTxns.filter(t=> t.dir === 'out' || t.dir === 'online_support_out').reduce((s,t)=> s + Number(t.amount||0), 0);
  const sRefund = sTxns.filter(t=> t.dir === 'in' || t.dir === 'online_support_in').reduce((s,t)=> s + Number(t.amount||0), 0);
  const sNet = sPaid - sRefund;
  const isDue = sNet > 0;
  let rows = '';
  if(list.length){
    rows = list.map((t, i)=>{
      const cfg = TX_CFG[t.type] || { title:t.type, icon:'' };
      let dirTxt = '';
      if(t.type === 'support' && t.dir === 'online_support_out') dirTxt = '🌐 অনলাইন সাপোর্ট প্রদান';
      else if(t.type === 'support' && t.dir === 'online_support_in') dirTxt = '🌐 অনলাইন সাপোর্ট ফেরত';
      else if(t.type === 'support' && t.dir === 'out') dirTxt = '🤝 সাপোর্ট প্রদান';
      else if(t.type === 'support' && t.dir === 'in') dirTxt = '↩️ সাপোর্ট ফেরত';
      else if(t.type === 'loan_given' && t.onlineTransfer) dirTxt = '🌐 অনলাইন ফান্ড ট্রান্সফার';
      else if(t.dir === 'in') dirTxt = 'গ্রহণ';
      else if(t.dir === 'out') dirTxt = 'প্রদান';
      const isArchived = t.year && (new Date().getFullYear() - parseInt(t.year,10)) >= ARCHIVE_YEARS_AFTER;
      return `<tr>
        <td>${toBn(i+1)}</td>
        <td>${toBn(t.date)}</td>
        <td>${cfg.icon||''} ${esc(cfg.title||t.type)}${dirTxt ? '<br><small>' + dirTxt + '</small>' : ''}${isArchived ? '<br><span class="badge archive">📚</span>' : ''}</td>
        <td><span class="badge online" style="font-size:10px">${esc(BRANCHES[t.branch]?.name||'')}</span></td>
        <td class="amt" style="color:#fff">৳ ${fmt(t.amount)}</td>
        <td>${esc(t.user||'-')}</td>
        <td style="font-size:11px">${esc(fmtDateTime(t.createdAt))}</td>
      </tr>`;
    }).join('');
  } else {
    rows = `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">📭 কোনো লেনদেন নেই</td></tr>`;
  }
  const custName = cust ? (cust.name||'-') : (list[0]?.custName || list[0]?.supportName || 'অজানা');
  const custMobile = cust ? (cust.mobile||'-') : '-';
  const custBranch = cust ? (BRANCHES[cust.branch]?.name||'-') : (list[0] ? BRANCHES[list[0].custBranch||list[0].branch]?.name : '-');
  const custAddr = cust ? (cust.address||'-') : '-';
  const body = `
    <div class="cust-box" style="margin-bottom:14px">
      <div class="head"><h4>👤 ${esc(custName)}</h4></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;font-size:13px;line-height:2">
        <div><span style="color:var(--muted)">অ্যাকাউন্ট:</span> <b style="color:#fff">${esc(accountNo)}</b></div>
        <div><span style="color:var(--muted)">মোবাইল:</span> <b>${esc(custMobile)}</b></div>
        <div><span style="color:var(--muted)">শাখা:</span> <b>${esc(custBranch)}</b></div>
        <div><span style="color:var(--muted)">ঠিকানা:</span> <b>${esc(custAddr)}</b></div>
        <div style="grid-column:1/-1"><span style="color:var(--muted)">মোট লেনদেন:</span> <b style="color:#fff">${toBn(list.length)} টি</b></div>
      </div>
      ${sTxns.length ? `
      <div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;font-size:13px;line-height:2">
        <div><span style="color:var(--muted)">🤝 সাপোর্ট প্রদান:</span> <b style="color:#fff">৳ ${fmt(sPaid)}</b></div>
        <div><span style="color:var(--muted)">↩️ সাপোর্ট ফেরত:</span> <b style="color:#fff">৳ ${fmt(sRefund)}</b></div>
        <div style="grid-column:1/-1">
          <span style="color:var(--muted)">📊 নেট ${isDue?'বকেয়া':'ব্যালেন্স'}:</span>
          <b style="color:#fff;font-size:18px">৳ ${fmt(Math.abs(sNet))}</b>
        </div>
      </div>` : ''}
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn pdf" id="cust_pdf">📄 PDF</button>
      <button class="btn xlsx" id="cust_xlsx">📊 XLSX</button>
      <button class="btn" id="cust_print" style="background:linear-gradient(135deg,#3b82f6,#22c55e)">🖨️ Print</button>
    </div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>#</th><th>তারিখ</th><th>ধরন</th><th>শাখা</th><th>টাকা</th><th>ইউজার</th><th>সময়</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  openModal({
    title: '📄 গ্রাহকের সম্পূর্ণ লেনদেন হিস্টরি',
    bodyHTML: body, wide: true,
    onMount: (w, close)=>{
      const headers = ['#','Date','Type','Branch','Amount','User','Time'];
      const reportRows = list.map((t, i)=>{
        const cfg = TX_CFG[t.type] || { title:t.type };
        let dirTxt = '';
        if(t.type === 'support' && t.dir === 'online_support_out') dirTxt = 'Online Support Paid';
        else if(t.type === 'support' && t.dir === 'online_support_in') dirTxt = 'Online Support Refund';
        else if(t.type === 'support' && t.dir === 'out') dirTxt = 'Support Paid';
        else if(t.type === 'support' && t.dir === 'in') dirTxt = 'Support Refund';
        else if(t.type === 'loan_given' && t.onlineTransfer) dirTxt = 'Online Fund Transfer';
        else if(t.dir === 'in') dirTxt = 'Receive';
        else if(t.dir === 'out') dirTxt = 'Give';
        const typeStr = ((cfg.icon||'') + ' ' + (cfg.title||t.type) + (dirTxt ? ' (' + dirTxt + ')' : '')).trim();
        return [
          String(i+1),
          t.date || '-',
          typeStr,
          BRANCHES[t.branch]?.en || '-',
          'BDT ' + fmt(t.amount),
          t.user || '-',
          fmtDateTimeEN(t.createdAt)
        ];
      });
      const totalAmt = list.reduce((s,t)=> s + Number(t.amount||0), 0);
      const totalDueStr = isDue ? 'DUE BDT ' + fmt(sNet) : 'CLEARED';
      reportRows.push(['', '', '', '', 'TOTAL BDT ' + fmt(totalAmt), '', totalDueStr]);
      w.querySelector('#cust_pdf').addEventListener('click', ()=>{
        exportToPDF('Customer Ledger — ' + custName, headers, reportRows, 'customer_' + accountNo + '.pdf');
      });
      w.querySelector('#cust_xlsx').addEventListener('click', ()=>{
        exportToXLSX('Customer Ledger — ' + custName, headers, reportRows, 'customer_' + accountNo + '.xlsx');
      });
      w.querySelector('#cust_print').addEventListener('click', ()=>{
        printReport('Customer Ledger — ' + custName, headers, reportRows, 'customer_' + accountNo);
      });
    }
  });
}
</script>

<script>
/* ============ Customer List / Due List / All Data / Year Archive / Snapshot ============ */
function openCustomerList(){
  if(!session) return;
  const isAdmin = session.role === 'admin';
  const html = `
    <div class="cust-box" style="margin-bottom:18px">
      <div class="head"><h4>➕ নতুন গ্রাহক</h4></div>
      <div class="form-row">
        <div class="field"><label>অ্যাকাউন্ট</label><input type="text" id="nc_acc"></div>
        <div class="field"><label>নাম *</label><input type="text" id="nc_name"></div>
        <div class="field"><label>মোবাইল</label><input type="text" id="nc_mobile"></div>
        <div class="field"><label>ঠিকানা</label><input type="text" id="nc_addr"></div>
        ${isAdmin ? `<div class="field"><label>শাখা</label>
          <select id="nc_branch"><option value="kalaroa">কলারোয়া</option><option value="jhaudanga">ঝাউডাঙ্গা</option></select></div>` : ''}
      </div>
      <button class="btn green" id="nc_save" style="margin-top:10px;padding:10px 22px">💾 সংরক্ষণ</button>
    </div>
    <div class="form-row" style="margin-bottom:12px">
      <div class="field" style="margin:0"><input type="text" id="cust_search" placeholder="🔍 নাম / অ্যাকাউন্ট / মোবাইল দিয়ে খুঁজুন..."></div>
      <div class="field" style="margin:0">
        <select id="cust_due_filter">
          <option value="all">সব গ্রাহক</option>
          <option value="due">⚠️ শুধু বকেয়াধারী</option>
          <option value="clear">✅ বকেয়া নেই</option>
        </select>
      </div>
    </div>
    <div id="cust_list"></div>`;
  openModal({
    title: '👥 গ্রাহক তালিকা',
    bodyHTML: html, wide: true,
    onMount: (wrap, close)=>{
      const listBox = wrap.querySelector('#cust_list');
      const searchEl = wrap.querySelector('#cust_search');
      const dueFilterEl = wrap.querySelector('#cust_due_filter');
      function renderList(filterText){
        filterText = (filterText||'').trim().toLowerCase();
        const dueF = dueFilterEl.value;
        let list = DB().customers.slice();
        list.forEach(c=>{
          const d = calculateCustomerDue(c.accountNo);
          c.supportPaid = d.paid; c.supportRefund = d.refund;
          c.supportDue = d.net; c.supportCount = d.count;
        });
        if(dueF === 'due') list = list.filter(c=> (c.supportDue||0) > 0);
        if(dueF === 'clear') list = list.filter(c=> (c.supportDue||0) <= 0);
        if(filterText){
          list = list.filter(c =>
            (c.accountNo||'').toLowerCase().includes(filterText) ||
            (c.name||'').toLowerCase().includes(filterText) ||
            (c.mobile||'').toLowerCase().includes(filterText) ||
            (c.address||'').toLowerCase().includes(filterText));
        }
        list.sort((a,b)=> (b.supportDue||0) - (a.supportDue||0));
        if(!list.length){
          listBox.innerHTML = `<div class="table-wrap"><div class="empty">📭 কোনো গ্রাহক নেই</div></div>`;
          return;
        }
        const totalDue = list.reduce((s,c)=> s + (c.supportDue||0), 0);
        let tbl = `<div class="table-wrap"><table class="tbl">
          <thead><tr>
            <th>#</th><th>অ্যাকাউন্ট</th><th>নাম</th><th>মোবাইল</th><th>শাখা</th>
            <th>লেনদেন</th><th>বকেয়া</th><th>অ্যাকশন</th>
          </tr></thead><tbody>`;
        list.forEach((c, i)=>{
          const isDue = (c.supportDue||0) > 0;
          const cleared = (c.supportCount||0) > 0 && !isDue;
          let dueBadge = '';
          if(isDue) dueBadge = `<span class="badge due">⚠️ ৳${fmt(c.supportDue)}</span>`;
          else if(cleared) dueBadge = `<span class="badge cleared">✅ পরিশোধিত</span>`;
          else dueBadge = `<span style="color:var(--muted);font-size:11.5px">— নতুন —</span>`;
          tbl += `<tr class="cust-row ${isDue?'has-due':''}" data-cacc="${esc(c.accountNo)}">
            <td>${toBn(i+1)}</td>
            <td><b style="color:#fff;font-size:13px">${esc(c.accountNo)}</b></td>
            <td>${esc(c.name||'-')}</td>
            <td>${esc(c.mobile||'-')}</td>
            <td><span class="badge online" style="font-size:10.5px">${esc(BRANCHES[c.branch]?.name||'')}</span></td>
            <td><span class="badge accepted">${toBn(c.supportCount||0)} টি</span></td>
            <td>${dueBadge}</td>
            <td>
              <button class="mini due-btn" data-due="${esc(c.accountNo)}">⚠️ দেখুন</button>
              <button class="mini show" data-hist="${esc(c.accountNo)}">📄</button>
              ${isAdmin ? `<button class="mini danger" data-cdel="${c.id}">🗑️</button>` : ''}
            </td>
          </tr>`;
        });
        tbl += `</tbody></table></div>
          <div style="text-align:center;margin-top:12px;color:var(--muted);font-size:12.5px">
            মোট <b style="color:#fff">${toBn(list.length)}</b> জন • মোট বকেয়া <b style="color:#fff">৳ ${fmt(totalDue)}</b>
          </div>`;
        listBox.innerHTML = tbl;
        listBox.querySelectorAll('tr[data-cacc]').forEach(tr=>{
          tr.addEventListener('click', (e)=>{
            if(e.target.closest('button')) return;
            const c = DB().customers.find(x=>x.accountNo === tr.dataset.cacc);
            if(!c) return;
            showCustomerAllTxns(c.accountNo);
          });
        });
        listBox.querySelectorAll('[data-due]').forEach(b=>{
          b.addEventListener('click', (e)=>{
            e.stopPropagation();
            const c = DB().customers.find(x=>x.accountNo === b.dataset.due);
            if(c) showDuePopup(c, { force:true });
          });
        });
        listBox.querySelectorAll('[data-hist]').forEach(b=>{
          b.addEventListener('click', (e)=>{ e.stopPropagation(); showCustomerAllTxns(b.dataset.hist); });
        });
        listBox.querySelectorAll('[data-cdel]').forEach(b=>{
          b.addEventListener('click', async (e)=>{
            e.stopPropagation();
            const cust = DB().customers.find(x=>x.id === b.dataset.cdel);
            if(!cust) return;
            if(!confirm('ডিলিট করবেন: ' + cust.name + '?')) return;
            DB().customers = DB().customers.filter(x=>x.id !== b.dataset.cdel);
            await saveDB();
            renderList(searchEl.value);
          });
        });
      }
      searchEl.addEventListener('input', ()=> renderList(searchEl.value));
      dueFilterEl.addEventListener('change', ()=> renderList(searchEl.value));
      wrap.querySelector('#nc_save').addEventListener('click', async ()=>{
        const acc = wrap.querySelector('#nc_acc').value.trim();
        const name = wrap.querySelector('#nc_name').value.trim();
        const mobile = wrap.querySelector('#nc_mobile').value.trim();
        const addr = wrap.querySelector('#nc_addr').value.trim();
        const brSel = wrap.querySelector('#nc_branch');
        let cbr;
        if(brSel) cbr = brSel.value;
        else if(session.role !== 'admin') cbr = session.branch;
        else cbr = 'kalaroa';
        if(!BRANCHES[cbr]) cbr = 'kalaroa';
        if(!name){ alert('নাম দিন'); return; }
        if(acc && DB().customers.some(c=>c.accountNo === acc)){ alert('এই অ্যাকাউন্ট আছে'); return; }
        DB().customers.push({
          id: uid(),
          accountNo: acc || ('ACC'+Math.floor(Math.random()*900000+100000)),
          name, mobile, address: addr, branch: cbr,
          createdAt: new Date().toISOString(),
          supportPaid:0, supportRefund:0, supportDue:0, supportCount:0,
          dueUpdatedAt: new Date().toISOString()
        });
        await saveDB();
        wrap.querySelector('#nc_acc').value = '';
        wrap.querySelector('#nc_name').value = '';
        wrap.querySelector('#nc_mobile').value = '';
        wrap.querySelector('#nc_addr').value = '';
        renderList(searchEl.value);
        toast('✅ গ্রাহক যোগ হয়েছে');
      });
      renderList('');
    }
  });
}

          }).join('')}
        </select>

          DENOMS.forEach(den => { totalNotes[den] += Number(v[den]) || 0; });

        Object.keys(BRANCHES).forEach(br=>{

            <div class="bal-card"><div class="t">👥 মোট গ্রাহক</div><div class="v" style="color:#fff">${toBn((snap.customers||[]).length)} জন</div></div>

          <div class="section-title"><span class="bar"></span> 🗄️ ভল্ট নোট (সেই দিনের)</div>
          <div class="vault-box" style="margin-bottom:14px">
            <div class="vault-row">
              ${DENOMS.map(den => `
                <div class="vault-item"><div class="d">৳ ${toBn(den)}</div><div class="c">${toBn(totalNotes[den])}</div></div>`).join('')}
            </div>
          </div>
          <div class="section-title"><span class="bar"></span> 📋 লেনদেন তালিকা</div>
          ${txListHTML(txs, { admin: session.role === 'admin' })}`;
      }
      dateSel.addEventListener('change', render);
      render();
    }
  });

                  <span class="pw-visible">
                    <span class="pw-mask" data-mask>••••••</span>
                    <span class="pw-text" data-text style="display:none">${esc(u.password||'—')}</span>
                    ${u.password ? `<button class="mini show" data-toggle-pw style="margin-left:6px">👁️</button>` : ''}
                  </span>
                </td>
                <td>${u.branch === 'all' ? '<span class="badge cross">সব শাখা</span>' : esc(BRANCHES[u.branch]?.name||'')}</td>
                <td>${u.role === 'admin' ? '<span class="badge accepted">👑</span>' : '<span class="badge online">👤</span>'}</td>
                <td style="white-space:nowrap">
                  <button class="mini edit" data-edit="${u.id}" title="এডিট">✏️</button>
                  <button class="mini" data-chpw="${u.id}" title="পাসওয়ার্ড পরিবর্তন" style="background:rgba(250,204,21,.15);color:#facc15;border-color:rgba(250,204,21,.4)">🔑</button>
                  ${isLastAdmin ? '—' : `<button class="mini danger" data-del="${u.id}" title="ডিলিট">🗑️</button>`}
                </td>
              </tr>`;
            }).join('')}</tbody>
          </table></div>`;
        listBox.querySelectorAll('[data-toggle-pw]').forEach(b=>{
          b.addEventListener('click', ()=>{
            const cell = b.closest('.pw-visible');
            const mask = cell.querySelector('[data-mask]');
            const text = cell.querySelector('[data-text]');
            if(mask.style.display === 'none'){
              mask.style.display = 'inline';
              text.style.display = 'none';
              b.textContent = '👁️';
            } else {
              mask.style.display = 'none';
              text.style.display = 'inline';
              b.textContent = '🙈';
            }
          });
        });
        listBox.querySelectorAll('[data-edit]').forEach(b=>{
          b.addEventListener('click', ()=> openUserEditModal(b.dataset.edit));
        });
        listBox.querySelectorAll('[data-chpw]').forEach(b=>{
          b.addEventListener('click', ()=> openPasswordChangeModal(b.dataset.chpw, renderList));
        });
        listBox.querySelectorAll('[data-del]').forEach(b=>{
          b.addEventListener('click', async ()=>{
            const userId = b.dataset.del;
            const u = DB().users.find(x=>x.id === userId);
            if(!u) return;
            const totalAdmins = DB().users.filter(x=>x.role === 'admin').length;
            if(u.role === 'admin' && totalAdmins <= 1){ alert('⚠️ শেষ অ্যাডমিন ডিলিট করা যাবে না।'); return; }
            if(session.id === userId){ alert('⚠️ নিজের অ্যাকাউন্ট ডিলিট করা যাবে না।'); return; }
            if(!confirm('ইউজার ডিলিট করবেন: ' + u.name + ' (' + u.username + ')?')) return;
            DB().users = DB().users.filter(x=>x.id !== userId);
            await saveDB();
            renderList();
            toast('🗑️ ইউজার ডিলিট: ' + u.username);
          });
        });
      }
      renderList();
      wrap.querySelector('#u_add').addEventListener('click', async ()=>{
        const name = wrap.querySelector('#u_name').value.trim();
        const user = wrap.querySelector('#u_user').value.trim();
        const pass = wrap.querySelector('#u_pass').value.trim();
        let br = wrap.querySelector('#u_branch').value;
        let role = wrap.querySelector('#u_role').value;
        if(!name || !user || !pass){ alert('নাম, আইডি, পাসওয়ার্ড — সব দিন'); return; }
        if(DB().users.some(u=>u.username === user)){ alert('⚠️ এই আইডি আগেই আছে'); return; }
        if(role === 'admin') br = 'all';
        DB().users.push({ id: uid(), name, username: user, password: pass, role, branch: br });
        await saveDB();
        wrap.querySelector('#u_name').value = '';
        wrap.querySelector('#u_user').value = '';
        wrap.querySelector('#u_pass').value = '';
        renderList();
        toast('✅ ইউজার তৈরি: ' + user);
      });
    }
  });
}
function openPasswordChangeModal(userId, onDone){
  const user = DB().users.find(u=>u.id === userId);
  if(!user) return;
  const body = `
    <div class="accept-head">
      <div>👤 <b>${esc(user.name)}</b> — <b style="color:#fff">${esc(user.username)}</b></div>
    </div>
    <div class="field">
      <label>🔑 বর্তমান পাসওয়ার্ড</label>
      <input type="text" id="pc_current" value="${esc(user.password||'')}" readonly style="color:var(--green-2);font-family:monospace;font-weight:700">
    </div>
    <div class="field">
      <label>🆕 নতুন পাসওয়ার্ড</label>
      <input type="text" id="pc_new" placeholder="নতুন পাসওয়ার্ড" autocomplete="off" style="font-family:monospace;font-weight:700">
    </div>
    <div class="field">
      <label>✅ নতুন পাসওয়ার্ড আবার লিখুন</label>
      <input type="text" id="pc_confirm" placeholder="আবার লিখুন" autocomplete="off" style="font-family:monospace;font-weight:700">
    </div>
    <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
      <button class="btn green" id="pc_save" style="flex:1;min-width:160px">💾 সংরক্ষণ</button>
      <button class="btn gray" id="pc_cancel" style="flex:1;min-width:120px">বাতিল</button>
    </div>`;
  openModal({
    title: '🔑 পাসওয়ার্ড পরিবর্তন', bodyHTML: body,
    onMount: (w, close)=>{
      w.querySelector('#pc_save').addEventListener('click', async ()=>{
        const nw = w.querySelector('#pc_new').value.trim();
        const cf = w.querySelector('#pc_confirm').value.trim();
        if(!nw){ alert('নতুন পাসওয়ার্ড দিন'); return; }
        if(nw.length < 3){ alert('⚠️ পাসওয়ার্ড কমপক্ষে ৩ অক্ষর'); return; }
        if(nw !== cf){ alert('❌ দুইবার লেখা পাসওয়ার্ড মিলছে না'); return; }
        const idx = DB().users.findIndex(u=>u.id === userId);
        if(idx < 0) return;
        DB().users[idx].password = nw;
        delete DB().users[idx].passwordHash;
        await saveDB();
        close();
        if(onDone) onDone();
        toast('✅ পাসওয়ার্ড পরিবর্তন: ' + user.username);
      });
      w.querySelector('#pc_cancel').addEventListener('click', close);
    }
  });
}
function openUserEditModal(userId){
  const user = DB().users.find(u=>u.id === userId);
  if(!user) return;
  const isLastAdmin = user.role === 'admin' && DB().users.filter(u=>u.role === 'admin').length <= 1;
  const body = `
    <div class="accept-head"><div>👤 <b>${esc(user.name)}</b> — <b style="color:#fff">${esc(user.username)}</b></div></div>
    <div class="form-row">
      <div class="field"><label>নাম</label><input type="text" id="ue_name" value="${esc(user.name)}"></div>
      <div class="field"><label>আইডি</label><input type="text" id="ue_user" value="${esc(user.username)}"></div>
      <div class="field"><label>পাসওয়ার্ড</label><input type="text" id="ue_pass" value="${esc(user.password||'')}" style="font-family:monospace;font-weight:700"></div>
      <div class="field"><label>শাখা</label>
        <select id="ue_branch">
          <option value="kalaroa" ${user.branch==='kalaroa'?'selected':''}>কলারোয়া</option>
          <option value="jhaudanga" ${user.branch==='jhaudanga'?'selected':''}>ঝাউডাঙ্গা</option>
          <option value="all" ${user.branch==='all'?'selected':''}>সব শাখা</option>
        </select></div>
      <div class="field"><label>রোল</label>
        <select id="ue_role">
          <option value="user" ${user.role==='user'?'selected':''}>👤 ইউজার</option>
          <option value="admin" ${user.role==='admin'?'selected':''}>👑 অ্যাডমিন</option>
        </select></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
      <button class="btn green" id="ue_save" style="flex:1;min-width:160px">💾 সংরক্ষণ</button>
      <button class="btn gray" id="ue_cancel" style="flex:1;min-width:120px">বাতিল</button>
    </div>`;
  openModal({
    title: '✏️ ইউজার এডিট', bodyHTML: body,
    onMount: (w, close)=>{
      w.querySelector('#ue_save').addEventListener('click', async ()=>{
        const newName = w.querySelector('#ue_name').value.trim();
        const newUser = w.querySelector('#ue_user').value.trim();
        const newPass = w.querySelector('#ue_pass').value.trim();
        let newBr = w.querySelector('#ue_branch').value;
        let newRole = w.querySelector('#ue_role').value;
        if(!newName || !newUser){ alert('নাম ও আইডি দিন'); return; }
        if(!newPass){ alert('পাসওয়ার্ড দিন'); return; }
        if(DB().users.some(u=>u.username === newUser && u.id !== user.id)){ alert('⚠️ এই আইডি আগেই আছে'); return; }
        if(isLastAdmin && newRole !== 'admin'){ if(!confirm('একমাত্র অ্যাডমিন। রোল পরিবর্তন করবেন?')) return; }
        if(newRole === 'admin') newBr = 'all';
        const idx = DB().users.findIndex(u=>u.id === user.id);
        if(idx < 0) return;
        const wasCurrent = session.id === user.id;
        DB().users[idx].name = newName;
        DB().users[idx].username = newUser;
        DB().users[idx].password = newPass;
        delete DB().users[idx].passwordHash;
        DB().users[idx].branch = newBr;
        DB().users[idx].role = newRole;
        await saveDB();
        if(wasCurrent){
          session = DB().users[idx];
          viewBranch = session.role === 'admin' ? (viewBranch || 'all') : session.branch;
          if(session.role !== 'admin') viewBranch = session.branch;
        }
        close();
        setTimeout(()=>{
          document.querySelectorAll('.modal-overlay').forEach(x=> x.remove());
          if(wasCurrent){ renderTopbar(); renderDashboard(); }
          openUserManager();
        }, 100);
        toast('✅ আপডেট হয়েছে');
      });
      w.querySelector('#ue_cancel').addEventListener('click', close);
    }
  });
}
function toast(msg){
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:#fff;color:#000;padding:13px 24px;border-radius:14px;font-weight:800;font-size:14px;z-index:999;
    box-shadow:0 16px 40px rgba(0,0,0,.8);opacity:0;transition:.3s;font-family:inherit;max-width:90%;`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{
    el.style.opacity = '1';
    el.style.transform = 'translateX(-50%) translateY(0)';
  });
  setTimeout(()=>{
    el.style.opacity = '0';
    el.style.transform = 'translateX(-50%) translateY(20px)';
    setTimeout(()=>el.remove(), 320);
  }, 2500);
}

/* ============ Init ============ */
(async function init(){
  console.log('🚀 Starting Computer Campus AB System —', APP_VERSION);
  initSupabase();
  try{ await loadDB(); }
  catch(e){
    console.warn('DB load error:', e);
    const local = loadLocalDB();
    window.db = local || defaultDB();
    normalizeDB();
    forceFixAdmin();
  }
  bindActivityListeners();
  $('#loginBtn').addEventListener('click', doLogin);
  $('#loginUser').addEventListener('keydown', e=>{ if(e.key === 'Enter') $('#loginPass').focus(); });
  $('#loginPass').addEventListener('keydown', e=>{ if(e.key === 'Enter') doLogin(); });
  const sid = sessionStorage.getItem(SKEY);
  if(sid){
    const u = DB().users.find(x=>x.id === sid);
    if(u){
      session = u;
      viewBranch = u.role === 'admin' ? 'all' : u.branch;
      startApp();
    }
  }
  console.log('✅ App ready. Login: admin / 8182');
  setInterval(async ()=>{
    if(supabaseReady){
      try{ await supabaseClient.from(window.SUPABASE_TABLE).select('id').eq('id', window.SUPABASE_ROW_ID).maybeSingle(); }catch(e){}
    }
  }, 24 * 60 * 60 * 1000);
})();
</script>
