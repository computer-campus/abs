<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Campus | Agent Banking System</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23000' stroke='%23fff' stroke-width='3'/%3E%3Cg transform='translate(50,50)' fill='%23fff'%3E%3Cpath d='M -22 -12 L 0 -28 L 22 -12 Z'/%3E%3Crect x='-18' y='-8' width='4' height='22' rx='1'/%3E%3Crect x='-8' y='-8' width='4' height='22' rx='1'/%3E%3Crect x='4' y='-8' width='4' height='22' rx='1'/%3E%3Crect x='14' y='-8' width='4' height='22' rx='1'/%3E%3Crect x='-22' y='14' width='44' height='4' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after, html, body, button, input, select, textarea,
h1, h2, h3, h4, h5, h6, p, span, div, label, td, th, a {
  font-family: 'Noto Sans Bengali', 'Noto Sans', system-ui, -apple-system, sans-serif !important;
  box-sizing: border-box;
}
*{margin:0;padding:0}
:root{
  --bg:#04060d; --card:#0a0f1e;
  --line:rgba(59,130,246,.12); --line-2:rgba(59,130,246,.22); --line-3:rgba(59,130,246,.4);
  --blue:#3b82f6; --blue-2:#60a5fa; --blue-3:#93c5fd;
  --yellow:#facc15; --yellow-2:#fde047;
  --green:#22c55e; --green-2:#4ade80; --green-3:#86efac;
  --red:#dc2626;
  --txt:#f0f4ff; --txt-2:#c8d4f0; --muted:#7a8ab8; --dim:#4a5680;
  --shadow-sm:0 2px 8px rgba(0,0,0,.7); --shadow-md:0 8px 24px rgba(0,0,0,.75); --shadow-lg:0 20px 50px rgba(0,0,0,.9);
  --radius-md:16px; --radius-lg:22px; --radius-xl:28px;
}
html,body{height:100%}
body{
  font-family:'Noto Sans Bengali',system-ui,sans-serif; color:var(--txt);
  background:#04060d;
  background-image:
    radial-gradient(circle at 15% 5%, rgba(59,130,246,.15), transparent 45%),
    radial-gradient(circle at 85% 95%, rgba(34,197,94,.12), transparent 45%);
  background-attachment:fixed; min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:#050810;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--blue),var(--green));border-radius:10px;border:2px solid #050810;}
.hidden{display:none !important;}
@keyframes shimmer{0%{background-position:0% 0;}100%{background-position:300% 0;}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes popIn{0%{opacity:0;transform:translateY(22px) scale(.96);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5);}50%{box-shadow:0 0 0 12px rgba(34,197,94,0);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@keyframes gradientMove{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes slideInRight{from{opacity:0;transform:translateX(400px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideOutRight{from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(400px);}}
.rgb{
  background:linear-gradient(90deg,var(--blue),var(--yellow),var(--green),var(--blue),var(--yellow));
  background-size:300% 100%; -webkit-background-clip:text;background-clip:text;
  color:transparent; animation:shimmer 6s linear infinite; font-weight:800;letter-spacing:.3px;
  filter:drop-shadow(0 0 12px rgba(59,130,246,.4));
}
.cust-count-num{font-size:48px;line-height:1.1;font-weight:900;background:linear-gradient(135deg,var(--blue-2),var(--green-2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px;font-variant-numeric:tabular-nums;}
.cust-count-unit{font-size:20px;font-weight:700;color:var(--green-2);}
.cust-ico-big{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,rgba(59,130,246,.2),rgba(34,197,94,.1));border:1px solid var(--line-3);box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 4px 12px rgba(0,0,0,.6);}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 30%, #0a1020, #04060d 70%);position:relative;overflow:hidden;}
.login-wrap::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(59,130,246,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(59,130,246,.06) 1px, transparent 1px);background-size:44px 44px;pointer-events:none;mask-image:radial-gradient(circle at 50% 50%, #000 30%, transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 50%, #000 30%, transparent 70%);}
.login-box{width:100%;max-width:440px;background:linear-gradient(165deg,#0f1428,#060a18);border:1px solid var(--line-2);border-radius:var(--radius-xl);padding:38px 30px;box-shadow:var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.08), 0 0 80px rgba(59,130,246,.15);position:relative;overflow:hidden;animation:popIn .5s cubic-bezier(.2,.9,.3,1.2);}
.login-box::before{content:'';position:absolute;inset:-2px;border-radius:var(--radius-xl);padding:2px;background:linear-gradient(135deg,var(--blue),var(--yellow),var(--green),var(--blue));background-size:200% 200%;animation:gradientMove 6s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7;}
.login-logo{width:88px;height:88px;margin:0 auto 18px;display:grid;place-items:center;animation:float 3s ease-in-out infinite;position:relative;z-index:1;}
.login-logo svg{filter:drop-shadow(0 0 24px rgba(59,130,246,.6)) drop-shadow(0 0 40px rgba(250,204,21,.3));}
.login-box h1{text-align:center;font-size:24px;font-weight:800;color:#fff;letter-spacing:.5px;position:relative;z-index:1;}
.login-box h2{text-align:center;font-size:12.5px;color:var(--muted);font-weight:500;margin:8px 0 26px;position:relative;z-index:1;letter-spacing:.3px;}
.field{position:relative;z-index:1;margin-bottom:16px;}
.field label{display:block;font-size:12px;color:var(--blue-3);margin-bottom:7px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.field input,.field select{width:100%;padding:13px 16px;border-radius:12px;background:#050810;border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:14.5px;outline:none;transition:all .25s ease;box-shadow:inset 0 1px 2px rgba(0,0,0,.7);}
.field input:hover,.field select:hover{border-color:var(--line-3);}
.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2), inset 0 1px 2px rgba(0,0,0,.7);background:#080c1a;}
.field input:disabled{opacity:.5;cursor:not-allowed;}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;padding:12px 20px;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--blue),#2563eb);transition:all .2s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 4px 16px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.15);position:relative;overflow:hidden;letter-spacing:.3px;white-space:nowrap;}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);transform:translateX(-100%);transition:transform .6s;}
.btn:hover::before{transform:translateX(100%);}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(59,130,246,.5);filter:brightness(1.1);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;filter:grayscale(.3);}
.btn.block{width:100%;}
.btn.pink{background:linear-gradient(135deg,var(--blue),var(--green));}
.btn.green{background:linear-gradient(135deg,var(--green),#16a34a);}
.btn.gray{background:linear-gradient(145deg,#141a30,#0a0f1e);color:var(--txt);border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);}
.btn.gray:hover{background:linear-gradient(145deg,#1a2140,#0f1428);border-color:var(--blue);}
.btn.red{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:1px solid rgba(220,38,38,.4);}
.btn.pdf{background:linear-gradient(135deg,#dc2626,#f59e0b);color:#fff;border:none;}
.btn.xlsx{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;border:none;}
.btn.dup{background:linear-gradient(135deg,#dc2626,#f59e0b);color:#fff;border:none;box-shadow:0 4px 16px rgba(220,38,38,.35);}
.btn.dup:hover{box-shadow:0 8px 24px rgba(220,38,38,.5);filter:brightness(1.1);}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 22px;background:rgba(4,6,13,.9);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line-2);box-shadow:0 4px 24px rgba(0,0,0,.7), 0 0 40px rgba(59,130,246,.08);}
.brand{display:flex;align-items:center;gap:14px;}
.brand .logo{width:50px;height:50px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.1));border:1px solid var(--line-3);box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 4px 16px rgba(59,130,246,.25);transition:transform .3s;}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.3px;}
.brand p{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500;}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.top-actions input[type=date],.top-actions select{padding:9px 14px;border-radius:11px;background:#080c1a;border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:13px;outline:none;transition:.2s;}
.who{font-size:12.5px;padding:9px 14px;border-radius:11px;background:linear-gradient(145deg,rgba(59,130,246,.12),rgba(34,197,94,.06));border:1px solid var(--line-3);white-space:nowrap;}
.who b{color:var(--green-2);font-weight:700;}
.sync-status{font-size:11px;padding:6px 12px;border-radius:20px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:var(--green-2);font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
.sync-status::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green-2);animation:pulseGreen 1.8s ease-in-out infinite;}
.sync-status.offline{background:rgba(220,38,38,.12);border-color:rgba(220,38,38,.4);color:#f87171;}
.sync-status.offline::before{background:#dc2626;animation:none;}
.sync-status.syncing{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.4);color:var(--yellow-2);}
.sync-status.syncing::before{background:var(--yellow);}
main{max-width:1500px;margin:0 auto;padding:26px 20px 80px;display:flex;flex-direction:column;gap:26px;align-items:center;animation:fadeInUp .5s ease;}
.section{width:100%;}
.section-title{display:flex;align-items:center;gap:11px;margin-bottom:16px;font-size:15.5px;font-weight:800;color:#fff;flex-wrap:wrap;letter-spacing:.3px;}
.section-title span.bar{width:4px;height:22px;border-radius:4px;background:linear-gradient(180deg,var(--blue),var(--yellow),var(--green));box-shadow:0 0 16px rgba(59,130,246,.6);}
.grid{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.card{position:relative;cursor:pointer;overflow:hidden;border-radius:var(--radius-lg);padding:20px 20px 18px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);box-shadow:var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.05);transition:all .35s cubic-bezier(.2,.9,.3,1.2);animation:fadeInUp .4s ease backwards;}
.card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--yellow),var(--green));}
.card::before{content:'';position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle, rgba(59,130,246,.15), transparent 70%);filter:blur(20px);pointer-events:none;}
.card:hover{transform:translateY(-6px) scale(1.01);border-color:var(--line-3);box-shadow:0 24px 60px rgba(0,0,0,.9), 0 0 40px rgba(59,130,246,.15);background:linear-gradient(155deg,#131a35,#0a0f1e);}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.card-top .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(145deg,rgba(59,130,246,.2),rgba(34,197,94,.08));border:1px solid var(--line-3);transition:transform .3s;}
.card:hover .card-top .ico{transform:scale(1.1) rotate(-5deg);}
.card-top h3{font-size:13.5px;font-weight:700;color:#e8eeff;}
.big-amt{font-size:30px;line-height:1.25;letter-spacing:-.5px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;}
.big-amt.sm{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.big-amt.sm .lbl{color:var(--muted);font-size:12.5px;font-weight:600;min-width:62px;}
.card-sub{margin-top:10px;font-size:12.5px;color:var(--muted);font-weight:500;}
.card-sub b{color:var(--green-2);font-weight:700;}
.card-sub.warn{color:var(--yellow-2);}
.card-sub.warn b{color:var(--yellow);}
.card-tap{position:absolute;right:16px;bottom:14px;font-size:11px;color:var(--dim);opacity:.7;font-weight:600;}
.vault-box{width:100%;border-radius:var(--radius-lg);padding:20px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);box-shadow:var(--shadow-md);}
.vault-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;}
.vault-item{flex:1 1 84px;min-width:78px;text-align:center;padding:13px 6px;border-radius:14px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1px solid var(--line-2);transition:all .25s;}
.vault-item:hover{background:linear-gradient(145deg,rgba(59,130,246,.15),rgba(34,197,94,.08));border-color:var(--line-3);transform:translateY(-2px);}
.vault-item .d{font-size:12px;color:var(--muted);font-weight:600;}
.vault-item .c{font-size:20px;font-weight:800;margin-top:4px;color:var(--green-2);font-variant-numeric:tabular-nums;}
.vault-total{margin-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-top:14px;border-top:1px dashed var(--line-2);}
.vault-total span{font-size:13px;color:var(--muted);font-weight:600;}
.vault-total b{color:var(--green-2);}
.balance-panel{width:100%;border-radius:var(--radius-lg);background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);box-shadow:var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.05);padding:18px;position:relative;overflow:hidden;}
.balance-panel::before{content:'';position:absolute;top:-80px;right:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle, rgba(59,130,246,.12), transparent 70%);filter:blur(30px);pointer-events:none;}
.balance-panel::after{content:'';position:absolute;bottom:-80px;left:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle, rgba(34,197,94,.1), transparent 70%);filter:blur(30px);pointer-events:none;}
.balance-row{display:grid;gap:12px;position:relative;z-index:1;}
.balance-row-top{grid-template-columns:repeat(4, 1fr);}
.balance-cell{padding:16px 14px;border-radius:16px;background:linear-gradient(145deg, rgba(255,255,255,.03), rgba(0,0,0,.15));border:1px solid var(--line-2);text-align:center;transition:all .3s cubic-bezier(.2,.9,.3,1.2);position:relative;overflow:hidden;}
.balance-cell::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg, transparent, currentColor, transparent);opacity:.5;}
.balance-cell:hover{transform:translateY(-3px);border-color:var(--line-3);box-shadow:0 12px 32px rgba(0,0,0,.6);}
.balance-cell .bc-ico{font-size:22px;margin-bottom:6px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));}
.balance-cell .bc-lbl{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
.balance-cell .bc-lbl.big-label{font-size:14px !important;font-weight:800 !important;color:var(--blue-2) !important;text-transform:none !important;letter-spacing:.2px !important;line-height:1.35;}
.balance-cell .bc-val{font-size:18px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.3px;word-break:break-all;}
.balance-cell.blue{color:var(--blue-2);}
.balance-cell.blue .bc-val{color:var(--blue-2);}
.balance-cell.green{color:var(--green-2);}
.balance-cell.green .bc-val{color:var(--green-2);}
.balance-cell.purple{color:#a78bfa;}
.balance-cell.purple .bc-val{color:#a78bfa;}
.balance-cell.yellow{color:var(--yellow-2);}
.balance-cell.yellow .bc-val{color:var(--yellow-2);}
.bal-grid{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:16px;}
.bal-card{border-radius:var(--radius-lg);padding:22px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);box-shadow:var(--shadow-md);position:relative;overflow:hidden;transition:all .3s;}
.bal-card:hover{border-color:var(--line-3);transform:translateY(-3px);}
.bal-card .t{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:10px;letter-spacing:.4px;text-transform:uppercase;}
.bal-card .v{font-size:28px;font-weight:800;line-height:1.3;color:#fff;font-variant-numeric:tabular-nums;}
.bal-card.main{background:linear-gradient(135deg,#131a35,#0a0f1e 60%,#0f1428);border-color:var(--blue);}
.bal-card.main .v{font-size:46px;background:linear-gradient(135deg,var(--blue-2),var(--green-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.bal-card.capital{border-color:rgba(250,204,21,.45);background:linear-gradient(155deg,rgba(250,204,21,.08),#07091a);}
.bal-card.capital .v{color:var(--yellow-2);}
.bal-card.deficit{border-color:rgba(220,38,38,.45);background:linear-gradient(155deg,rgba(220,38,38,.08),#07091a);}
.bal-card.deficit .v{color:#f87171;}
.bal-card.surplus{border-color:rgba(34,197,94,.45);background:linear-gradient(155deg,rgba(34,197,94,.08),#07091a);}
.bal-card.surplus .v{color:var(--green-2);}
.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%;}
.actions .btn{padding:15px 28px;font-size:15px;border-radius:14px;}
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(2,4,10,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto;animation:fadeIn .2s ease;}
.modal{width:100%;max-width:760px;border-radius:var(--radius-lg);overflow:hidden;background:linear-gradient(165deg,#0f1428,#06091a);border:1px solid var(--line-3);box-shadow:0 40px 100px rgba(0,0,0,.95);animation:popIn .3s cubic-bezier(.2,.9,.3,1.2);}
.modal.wide{max-width:1100px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,rgba(59,130,246,.08),transparent);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px);}
.modal-head h3{font-size:16px;font-weight:800;color:#fff;display:flex;align-items:center;gap:9px;}
.modal-head .x{border:none;background:rgba(59,130,246,.15);color:var(--blue-3);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:15px;transition:all .2s;border:1px solid var(--line-3);display:grid;place-items:center;}
.modal-head .x:hover{background:var(--blue);color:#fff;transform:rotate(90deg);}
.modal-body{padding:20px 22px 26px;}
.form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
.cust-box{margin-top:8px;padding:16px;border-radius:var(--radius-md);background:linear-gradient(145deg,rgba(59,130,246,.06),rgba(34,197,94,.03));border:1px solid var(--line-2);}
.cust-box .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.cust-box .head h4{font-size:13px;color:var(--blue-3);font-weight:700;text-transform:uppercase;}
.suggest{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);background:#06091a;max-height:240px;overflow-y:auto;}
.suggest:empty{display:none;}
.sug-item{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px;color:#e8eeff;line-height:1.6;}
.sug-item:hover{background:linear-gradient(90deg,rgba(59,130,246,.15),rgba(34,197,94,.08));}
.sug-item b{color:var(--green-2);}
.sug-item small{color:var(--muted);}
.sug-item .due-tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:8px;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.5);color:#f87171;font-size:10.5px;font-weight:800;}
.sug-item .paid-tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:8px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.5);color:var(--green-2);font-size:10.5px;font-weight:800;}
.notes-cols{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:8px;}
@media(max-width:700px){.notes-cols{grid-template-columns:1fr;}}
.notes-col{padding:16px;border-radius:var(--radius-md);border:1px solid var(--line-2);background:linear-gradient(145deg,#0a0f1e,#050810);}
.notes-col.out{border-color:rgba(250,204,21,.3);background:linear-gradient(145deg,rgba(250,204,21,.06),rgba(250,204,21,.02));}
.notes-col.in{border-color:rgba(34,197,94,.3);background:linear-gradient(145deg,rgba(34,197,94,.06),rgba(34,197,94,.02));}
.notes-col.disabled{opacity:.3;pointer-events:none;}
.notes-col h4{font-size:20px;margin-bottom:14px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.5px;}
.notes-col.out h4{color:var(--yellow-2);}
.notes-col.in h4{color:var(--green-2);}
.notes-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:space-between;}
.note-item{flex:1 1 54px;min-width:52px;text-align:center;}
.note-item label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700;}
.note-item input{width:100%;padding:8px 3px;text-align:center;border-radius:9px;background:#03060d;border:1px solid var(--line-2);color:#fff;font-family:inherit;font-size:13px;font-weight:700;outline:none;}
.note-item input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2);}
.notes-col.out .note-item input{color:var(--yellow-2);}
.notes-col.in .note-item input{color:var(--green-2);}
.sum-line{margin-top:12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--line-2);font-weight:600;}
.sum-line b{font-size:15px;}
.notes-col.out .sum-line b{color:var(--yellow-2);}
.notes-col.in .sum-line b{color:var(--green-2);}
.total-preview{margin-top:18px;padding:18px;border-radius:var(--radius-md);text-align:center;background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(34,197,94,.06));border:1px solid var(--line-3);}
.total-preview .l{font-size:11.5px;color:var(--blue-3);font-weight:700;text-transform:uppercase;}
.total-preview .v{font-size:32px;margin-top:6px;color:#fff;font-weight:800;font-variant-numeric:tabular-nums;}
.note-detail-box{margin-top:14px;padding:14px 16px;border-radius:var(--radius-md);background:linear-gradient(145deg,#080c1a,#050810);border:1px solid var(--line-2);font-size:12.5px;color:var(--muted);line-height:1.9;}
.note-detail-box .ttl{font-size:11px;color:var(--blue-3);font-weight:700;margin-bottom:6px;text-transform:uppercase;}
.note-detail-box .tag{display:inline-block;padding:3px 9px;margin:3px 5px 3px 0;border-radius:8px;background:rgba(59,130,246,.12);border:1px solid var(--line-3);color:var(--blue-3);font-size:11.5px;font-weight:600;}
.note-detail-box .tag.out{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.4);color:var(--yellow-2);}
.note-detail-box .tag.in{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:var(--green-2);}
.pending-box{margin-top:16px;padding:16px;border-radius:var(--radius-md);background:linear-gradient(145deg,rgba(250,204,21,.08),rgba(250,204,21,.02));border:1px solid rgba(250,204,21,.35);}
.pending-box h4{font-size:13px;color:var(--yellow);font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.pending-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;margin-bottom:8px;background:rgba(0,0,0,.3);border:1px solid var(--line-2);flex-wrap:wrap;}
.pending-item .info{font-size:12.5px;color:#eee;flex:1;min-width:180px;line-height:1.6;}
.pending-item .info b{color:var(--yellow);}
.pending-item .info small{color:var(--muted);display:block;margin-top:3px;}
.pending-empty{padding:16px;text-align:center;color:var(--muted);font-size:12.5px;}
.accept-head{padding:16px;border-radius:var(--radius-md);margin-bottom:16px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1px solid var(--line-3);font-size:13px;line-height:1.9;color:#e0eaff;}
.accept-head b{color:var(--green-2);font-weight:700;}
.online-box{margin-top:16px;padding:18px;border-radius:var(--radius-md);background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1.5px solid var(--blue);display:none;}
.online-box.active{display:block;animation:fadeInUp .3s ease;}
.online-box h4{font-size:13px;color:var(--blue-3);font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.online-box .desc{font-size:12px;color:#c8d4f0;margin-bottom:12px;line-height:1.7;padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line-2);}
.online-box .desc b{color:var(--green-2);}
.cust-branch-toggle{padding:16px 18px;border-radius:var(--radius-md);margin-top:8px;margin-bottom:16px;background:linear-gradient(145deg,rgba(59,130,246,.06),rgba(34,197,94,.03));border:1px solid var(--line-2);}
.cust-branch-toggle .toggle-title{font-size:12.5px;font-weight:800;color:#fff;margin-bottom:12px;text-transform:uppercase;}
.branch-toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:600px){.branch-toggle-row{grid-template-columns:1fr;}}
.branch-toggle-btn{padding:13px 20px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;border:1px solid var(--line-2);background:linear-gradient(145deg,#0f1428,#080c1a);color:var(--muted);transition:all .25s;}
.branch-toggle-btn:hover{background:linear-gradient(145deg,rgba(59,130,246,.15),rgba(59,130,246,.05));border-color:var(--blue);color:#fff;}
.branch-toggle-btn.active{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;border-color:transparent;box-shadow:0 8px 24px rgba(59,130,246,.4);}
.cross-branch-note{margin-top:12px;padding:12px 14px;border-radius:12px;background:linear-gradient(145deg,rgba(250,204,21,.08),rgba(34,197,94,.04));border:1px solid rgba(250,204,21,.35);font-size:12px;line-height:1.8;color:#e0eaff;}
.cross-branch-note b{color:var(--yellow);}
.report-area{margin-top:26px;border-top:1px solid var(--line-2);padding-top:18px;}
.report-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.report-head h4{font-size:14px;font-weight:800;color:#fff;}
.report-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--line-2);}
table.tbl{width:100%;border-collapse:collapse;font-size:12.8px;min-width:640px;}
table.tbl th{background:linear-gradient(180deg,rgba(59,130,246,.18),rgba(59,130,246,.06));padding:13px 14px;text-align:left;font-weight:700;color:var(--blue-3);white-space:nowrap;font-size:11.5px;border-bottom:1px solid var(--line-3);text-transform:uppercase;position:sticky;top:0;z-index:2;}
table.tbl td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top;color:#d8e0f5;line-height:1.6;}
table.tbl tr:hover td{background:rgba(59,130,246,.06);}
table.tbl td.amt{font-weight:800;color:var(--green-2);white-space:nowrap;font-variant-numeric:tabular-nums;}
.note-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.note-list span{font-size:10.5px;padding:3px 7px;border-radius:6px;background:rgba(59,130,246,.12);border:1px solid var(--line-2);color:var(--blue-3);font-weight:600;}
.note-list span.out{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.35);color:var(--yellow-2);}
.note-list span.in{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35);color:var(--green-2);}
.badge{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap;background:rgba(59,130,246,.15);border:1px solid var(--line-3);color:var(--blue-3);display:inline-block;}
.badge.pending{background:rgba(250,204,21,.15);border-color:rgba(250,204,21,.5);color:var(--yellow-2);}
.badge.accepted{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:var(--green-2);}
.badge.online{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.5);color:var(--blue-3);}
.badge.cross{background:rgba(250,204,21,.15);border-color:rgba(250,204,21,.5);color:var(--yellow-2);}
.badge.hist{background:rgba(250,204,21,.18);border-color:rgba(250,204,21,.5);color:var(--yellow-2);font-size:10.5px;}
.badge.due{background:rgba(220,38,38,.18);border-color:rgba(220,38,38,.5);color:#f87171;font-size:11px;font-weight:800;}
.badge.cleared{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:var(--green-2);font-size:11px;font-weight:800;}
.badge.archive{background:rgba(122,138,184,.15);border-color:rgba(122,138,184,.4);color:#a5b4d8;font-size:10px;font-weight:700;}
.badge.online-tx{background:linear-gradient(135deg,rgba(34,197,94,.2),rgba(59,130,246,.15));border:1px solid rgba(34,197,94,.6);color:#4ade80;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;display:inline-block;margin-top:4px;}
.mini{border:none;cursor:pointer;background:rgba(59,130,246,.15);color:var(--blue-3);padding:6px 10px;border-radius:8px;font-size:12px;transition:all .2s;border:1px solid var(--line-3);font-weight:600;}
.mini:hover{background:var(--blue);color:#fff;border-color:var(--blue);transform:translateY(-1px);}
.mini.danger{background:rgba(220,38,38,.15);color:#f87171;border-color:rgba(220,38,38,.4);}
.mini.danger:hover{background:#dc2626;color:#fff;border-color:#dc2626;}
.mini.accept{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;font-weight:700;border-color:transparent;}
.mini.edit{background:rgba(59,130,246,.2);color:var(--blue-3);border-color:var(--line-3);}
.mini.show{background:rgba(34,197,94,.2);color:var(--green-2);border-color:rgba(34,197,94,.4);}
.mini.due-btn{background:linear-gradient(135deg,#dc2626,#f59e0b);color:#fff;font-weight:700;border-color:transparent;}
.mini.tick{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border-color:transparent;font-weight:800;}
.empty{padding:36px 24px;text-align:center;color:var(--muted);font-size:13.5px;background:linear-gradient(145deg,#080c1a,#050810);border-radius:var(--radius-md);}
.bank-hint{font-size:11.5px;color:var(--blue-3);background:rgba(59,130,246,.08);padding:10px 14px;border-radius:10px;margin-bottom:12px;border:1px dashed rgba(59,130,246,.35);line-height:1.7;}
.bank-hint b{color:var(--green-2);}
.cust-row{cursor:pointer;}
.cust-row:hover td{background:rgba(59,130,246,.06) !important;}
.cust-row.has-due td{background:rgba(220,38,38,.05);}
.cust-row.has-due:hover td{background:rgba(220,38,38,.1) !important;}
.date-mode-banner{width:100%;padding:14px 20px;border-radius:var(--radius-md);background:linear-gradient(145deg,rgba(250,204,21,.12),rgba(250,204,21,.04));border:1px solid rgba(250,204,21,.4);color:var(--yellow-2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.date-mode-banner b{color:#fff;font-weight:800;}
.date-mode-banner .close-mode{margin-left:auto;background:rgba(250,204,21,.2);color:var(--yellow-2);border:1px solid rgba(250,204,21,.5);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.auto-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.5);color:var(--green-2);font-size:11px;font-weight:700;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--blue-3);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px;}
.pw-cell{display:flex;align-items:center;gap:8px;}
.pw-value{font-family:monospace;font-weight:700;color:var(--green-2);background:rgba(0,0,0,.4);padding:4px 9px;border-radius:6px;letter-spacing:1px;border:1px solid var(--line-2);font-size:12px;}
.pw-hidden{color:var(--muted);letter-spacing:3px;}
.pw-visible{display:inline-flex;align-items:center;gap:6px;}
.pw-visible .pw-mask{font-family:monospace;font-weight:700;color:var(--muted);letter-spacing:3px;}
.pw-visible .pw-text{font-family:monospace;font-weight:700;color:var(--green-2);}
.due-hero{padding:24px 20px;border-radius:var(--radius-lg);text-align:center;background:linear-gradient(155deg,rgba(220,38,38,.15),rgba(245,158,11,.08));border:1.5px solid rgba(220,38,38,.5);margin-bottom:16px;}
.due-hero.cleared{background:linear-gradient(155deg,rgba(34,197,94,.12),rgba(59,130,246,.08));border-color:rgba(34,197,94,.5);}
.due-hero .lbl{font-size:12.5px;color:#ccc;font-weight:700;text-transform:uppercase;}
.due-hero .amt{font-size:44px;font-weight:900;margin-top:8px;letter-spacing:-1px;color:#fff;font-variant-numeric:tabular-nums;}
.due-hero .sub{font-size:12.5px;color:var(--muted);margin-top:8px;}
.due-actions{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
.due-actions .btn{flex:1;min-width:140px;}
.rt-stack{position:fixed;top:80px;right:20px;z-index:1500;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:380px;}
.rt-toast{pointer-events:auto;padding:14px 18px;border-radius:14px;background:linear-gradient(135deg,#131a35,#0a0f1e);border:1px solid var(--line-3);box-shadow:0 20px 50px rgba(0,0,0,.9), 0 0 40px rgba(59,130,246,.25);color:#fff;font-size:13px;line-height:1.6;animation:slideInRight .35s cubic-bezier(.2,.9,.3,1.2);position:relative;overflow:hidden;}
.rt-toast::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--green));}
.rt-toast.closing{animation:slideOutRight .3s ease forwards;}
.rt-toast .rt-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;margin-bottom:4px;}
.rt-toast .rt-head .rt-icon{font-size:18px;}
.rt-toast .rt-body{font-size:12.5px;color:var(--txt-2);}
.rt-toast .rt-body b{color:var(--green-2);font-weight:700;}
.rt-toast .rt-close{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--muted);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;display:grid;place-items:center;}
.rt-toast .rt-close:hover{background:rgba(220,38,38,.5);color:#fff;}
.rt-toast.new-tx::before{background:linear-gradient(180deg,#3b82f6,#22c55e);}
.rt-toast.accept::before{background:linear-gradient(180deg,#22c55e,#16a34a);}
.rt-toast.delete::before{background:linear-gradient(180deg,#dc2626,#991b1b);}
.online-tick-box{padding:16px 18px;border-radius:var(--radius-md);margin-top:8px;margin-bottom:16px;background:linear-gradient(145deg,rgba(34,197,94,.08),rgba(59,130,246,.04));border:1px solid rgba(34,197,94,.4);}
.online-tick-label{display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line-2);transition:all .2s;}
.online-tick-label:hover{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.5);}
.online-tick-label input[type="checkbox"]{width:22px;height:22px;cursor:pointer;accent-color:#22c55e;flex-shrink:0;}
.online-tick-text{flex:1;}
.online-tick-text .title{font-size:13.5px;font-weight:800;color:#fff;}
.online-tick-text .sub{font-size:11.5px;color:var(--muted);margin-top:3px;}
.online-bank-display{margin-top:12px;padding:12px;border-radius:12px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.4);}
.online-bank-display .lbl{font-size:11.5px;color:#86efac;font-weight:700;margin-bottom:5px;}
.online-bank-display .name{font-size:14.5px;color:#fff;font-weight:800;word-break:break-word;}
@media(max-width:640px){
  .brand h1{font-size:15px;}
  .big-amt{font-size:24px;}
  .topbar{padding:10px 14px;}
  main{padding:18px 12px 60px;gap:20px;}
  .bal-card.main .v{font-size:34px;}
  .cust-count-num{font-size:38px;}
  .due-hero .amt{font-size:34px;}
  .modal-body{padding:16px 16px 22px;}
  .card{padding:16px;}
  .vault-item{padding:10px 4px;}
  .vault-item .c{font-size:17px;}
  .rt-stack{top:auto;bottom:20px;right:10px;left:10px;max-width:none;}
}
::selection{background:var(--blue);color:#fff;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
input, select, button{transition:all .2s;}
@media(max-width:900px){.balance-row-top{grid-template-columns:repeat(2, 1fr);}}
@media(max-width:560px){.balance-row-top{grid-template-columns:1fr;}.balance-cell .bc-val{font-size:16px;}}
</style>
</head>

/* ============================================================

function mergeTxs(localArr, remoteArr){
  const map = new Map();
  const seen = new Set();
  (localArr||[]).forEach(t => { map.set(t.id, t); seen.add(t.id); });
  const newOnes = [];
  (remoteArr||[]).forEach(rt => {
    if(!rt || !rt.id) return;
    if(!seen.has(rt.id)){
      map.set(rt.id, rt);
      newOnes.push(rt);
    } else {
      const lt = map.get(rt.id);
      const ltTime = lt.updatedAt || lt.createdAt || lt.date || '';
      const rtTime = rt.updatedAt || rt.createdAt || rt.date || '';
      if(rtTime > ltTime){ map.set(rt.id, rt); }
    }
  });
  return { merged: Array.from(map.values()), newOnes };
}
function mergeCustomers(localArr, remoteArr){
  const map = new Map();
  const seen = new Set();
  (localArr||[]).forEach(c => { map.set(c.id, c); seen.add(c.id); });
  (remoteArr||[]).forEach(rc => {
    if(!rc || !rc.id) return;
    if(!seen.has(rc.id)) map.set(rc.id, rc);
    else {
      const lc = map.get(rc.id);
      const ltTime = lc.dueUpdatedAt || lc.createdAt || '';
      const rtTime = rc.dueUpdatedAt || rc.createdAt || '';
      if(rtTime > ltTime) map.set(rc.id, rc);
    }
  });
  return Array.from(map.values());
}
function mergeUsers(localArr, remoteArr){
  const map = new Map();
  (localArr||[]).forEach(u => map.set(u.id, u));
  (remoteArr||[]).forEach(ru => {
    if(!ru || !ru.id) return;
    if(!map.has(ru.id)) map.set(ru.id, ru);
    else {
      const lu = map.get(ru.id);
      if(lu.username === 'admin'){
        lu.password = DEFAULT_ADMIN_PASSWORD;
        delete lu.passwordHash;
        map.set(ru.id, lu);
      } else {
        map.set(ru.id, ru);
      }
    }
  });
  return Array.from(map.values());
}
function mergeYearlyArchive(localArch, remoteArch){
  const result = {};
  const allYears = new Set([...Object.keys(localArch||{}), ...Object.keys(remoteArch||{})]);
  allYears.forEach(y => {
    const map = new Map();
    (localArch?.[y]||[]).forEach(t => map.set(t.id, t));
    (remoteArch?.[y]||[]).forEach(rt => { if(!map.has(rt.id)) map.set(rt.id, rt); });
    result[y] = Array.from(map.values());
  });
  return result;
}
function mergeDailyClose(localDC, remoteDC){
  const result = { ...(localDC||{}) };
  Object.keys(remoteDC||{}).forEach(d => {
    if(!result[d]) result[d] = remoteDC[d];
    else {
      const localTime = result[d].savedAt || '';
      const remoteTime = remoteDC[d].savedAt || '';
      if(remoteTime > localTime) result[d] = remoteDC[d];
    }
  });
  return result;
}
function mergeDailyFullSnapshots(localSnaps, remoteSnaps){
  const result = { ...(localSnaps||{}) };
  Object.keys(remoteSnaps||{}).forEach(d => {
    if(!result[d]) result[d] = remoteSnaps[d];
    else {
      const lt = result[d].savedAt || '';
      const rt = remoteSnaps[d].savedAt || '';
      if(rt > lt) result[d] = remoteSnaps[d];
    }
  });

}
function mergeRemoteIntoLocal(remote){
  const local = DB();
  const result = { ...local };
  const txMerge = mergeTxs(local.txs, remote.txs);
  result.txs = txMerge.merged;
  result.customers = mergeCustomers(local.customers, remote.customers);
  result.users = mergeUsers(local.users, remote.users);

  result.dailyClose = mergeDailyClose(local.dailyClose, remote.dailyClose);

  (remote.txEditLog||[]).forEach(r => { if(!logMap.has(r.id)) logMap.set(r.id, r); });
  result.txEditLog = Array.from(logMap.values());
  result.totalCapital = Math.max(Number(local.totalCapital)||0, Number(remote.totalCapital)||0);
  if(remote.lastBaseDate && (!result.lastBaseDate || remote.lastBaseDate > result.lastBaseDate)){
    result.baseAccounts = remote.baseAccounts || result.baseAccounts;
    result.baseVault = remote.baseVault || result.baseVault;

/* ============================================================
   DUPLICATE PREVENTION SYSTEM — 4 Layers
   ============================================================ */
function makeTxFingerprint(tx){
  return [
    tx.date || '',
    tx.type || '',
    tx.branch || '',
    tx.custBranch || '',
    tx.dir || '',
    Math.round((Number(tx.amount) || 0) * 100) / 100,
    tx.custAcc || tx.supportAcc || '',
    JSON.stringify(tx.notesOut || {}),
    JSON.stringify(tx.notesIn || {}),
    tx.from || '',
    tx.to || ''
  ].join('|');
}
function findRecentDuplicateTx(tx, withinSeconds){
  const cutoff = Date.now() - (withinSeconds * 1000);
  const fp = makeTxFingerprint(tx);
  const all = getAllTxs();
  for(let i = all.length - 1; i >= 0; i--){
    const t = all[i];
    if(t.id === tx.id) continue;
    const tTime = new Date(t.createdAt || t.updatedAt || t.date).getTime();
    if(isNaN(tTime) || tTime < cutoff) continue;
    if(makeTxFingerprint(t) === fp) return t;
  }
  return null;
}
function findSameAccountSameAmountSameDay(tx, withinMinutes){
  const cutoff = Date.now() - (withinMinutes * 60 * 1000);
  const all = getAllTxs();
  const myAcc = String(tx.custAcc || tx.supportAcc || '').trim();
  for(let i = all.length - 1; i >= 0; i--){
    const t = all[i];
    if(t.id === tx.id) continue;
    if(t.type !== tx.type) continue;
    if(t.date !== tx.date) continue;
    const tAcc = String(t.custAcc || t.supportAcc || '').trim();
    if(tAcc !== myAcc) continue;
    if(Math.abs((Number(t.amount)||0) - (Number(tx.amount)||0)) > 0.01) continue;
    const tTime = new Date(t.createdAt || t.updatedAt || t.date).getTime();
    if(isNaN(tTime) || tTime < cutoff) continue;
    return t;
  }
  return null;
}

      __lastSavedTimer = null;

      el.classList.add('closing');
      setTimeout(()=> el.remove(), 320);
    }
  }, 1000);
  const close = () => {
    if(__lastSavedTimer) clearInterval(__lastSavedTimer);
    __lastSavedTimer = null;
    __lastSavedTx = null;
    el.classList.add('closing');
    setTimeout(()=> el.remove(), 320);
  };
  el.querySelector('.rt-close').addEventListener('click', close);
  el.querySelector('#undo_btn_' + tx.id).addEventListener('click', async () => {
    if(!__lastSavedTx){ close(); return; }
    const saved = __lastSavedTx;
    close();
    try{
      if(saved.oldTx){
        const i = DB().txs.findIndex(x => x.id === saved.oldTx.id);
        if(i >= 0){ DB().txs[i] = saved.oldTx; }
      } else {
        DB().txs = DB().txs.filter(x => x.id !== tx.id);
        if(tx.type === 'support' && tx.custAcc) updateCustomerDueInDB(tx.custAcc, false);
      }
      recomputeLive();
      await saveDB();
      renderDashboard();
      toast('↶ লেনদেন বাতিল হয়েছে');
    }catch(e){ console.error('Undo error:', e); toast('❌ Undo ব্যর্থ'); }
  });
}

/* Realtime notification toast */
function showRealtimeToast(kind, title, bodyHTML, opts){
  opts = opts || {};
  const stack = document.getElementById('rtStack');
  if(!stack) return;
  const el = document.createElement('div');
  el.className = 'rt-toast ' + (kind || 'new-tx');
  el.innerHTML = `
    <button class="rt-close" type="button">✕</button>
    <div class="rt-head"><span class="rt-icon">${opts.icon||'🔔'}</span>${title}</div>
    <div class="rt-body">${bodyHTML}</div>
  `;
  stack.appendChild(el);
  const close = () => {
    el.classList.add('closing');
    setTimeout(()=> el.remove(), 320);
  };
  el.querySelector('.rt-close').addEventListener('click', close);
  const ttl = opts.ttl || 7000;
  setTimeout(() => { if(el.parentNode) close(); }, ttl);
}

function stopSupabaseListener(){
  if(realtimeChannel && supabaseClient){
    try{ supabaseClient.removeChannel(realtimeChannel); }catch(e){}
    realtimeChannel = null;
  }
}
function startSupabaseListener(){
  if(!supabaseReady) return;
  stopSupabaseListener();
  realtimeChannel = supabaseClient.channel('agent_bank_changes_' + APP_VERSION)
    .on('postgres_changes', { event:'*', schema:'public', table:window.SUPABASE_TABLE }, (payload)=>{
      const remote = payload.new && payload.new.data;
      if(!remote) return;
      if(__isApplyingRemote) return;
      if(remote.__version && remote.__version !== APP_VERSION){
        return;
      }
      const __now = Date.now();
      if(__now - (window.__lastSaveAt||0) < 2000) return;
      try{
        const mergedResult = mergeRemoteIntoLocal(remote);
        const { mergedDB, newTxs } = mergedResult;
        const localTxCount = (DB().txs||[]).length;
        if(mergedDB.txs.length === localTxCount && newTxs.length === 0){
          return;
        }
        __isApplyingRemote = true;
        try{
          window.db = mergedDB;
          try{ normalizeDB(); forceFixAdmin(); recalcAllCustomerDues(false); recomputeLive(); }catch(e){}
          saveLocalDB();
          if(session){ renderTopbar(); renderDashboard(); }
          newTxs.forEach(tx => {
            if(__rtEventSeen.has(tx.id)) return;
            __rtEventSeen.add(tx.id);
            if(__rtEventSeen.size > 500){
              __rtEventSeen = new Set(Array.from(__rtEventSeen).slice(-200));
            }
            const cfg = TX_CFG[tx.type] || { title: tx.type, icon: '📌' };
            const branchName = BRANCHES[tx.branch]?.name || tx.branch || '-';
            const kind = tx.accepted === false && tx.type === 'branch_transfer' ? 'accept' : 'new-tx';
            const title = `🔔 নতুন লেনদেন (${branchName})`;
            const body = `
              <div style="margin-bottom:4px">${cfg.icon||''} <b>${esc(cfg.title||tx.type)}</b></div>
              <div style="margin-bottom:4px">💰 পরিমাণ: <b>৳ ${fmt(tx.amount)}</b></div>
              ${tx.custName ? `<div style="margin-bottom:4px">👤 ${esc(tx.custName)}</div>` : ''}
              <div style="font-size:11.5px;color:var(--muted)">👤 ${esc(tx.user||'-')} • ${esc(fmtDateTime(tx.createdAt))}</div>
            `;
            showRealtimeToast(kind, title, body, { icon: cfg.icon || '🔔', ttl: 8000 });
          });
        } finally {
          setTimeout(()=>{ __isApplyingRemote = false; }, 500);
        }
      }catch(e){ console.warn('Realtime merge error:', e); }
    })
    .subscribe((status)=>{
      if(status === 'SUBSCRIBED') updateConnStatus('online');
      else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') updateConnStatus('offline');
    });
}

/* ===== DB ===== */
window.db = null;
function DB(){ return window.db; }
let __savePending = false, __saveAgain = false;
let __lastSnapshotDate = null;
let __lastRolloverCheck = null;

async function saveDB(){
  if(__savePending){ __saveAgain = true; return; }
  __savePending = true;
  window.__lastSaveAt = Date.now();
  try{
    if(!DB()){ __savePending = false; return; }
    const today = todayStr();
    if(__lastRolloverCheck !== today){
      if((DB().lastBaseDate || '') !== today){
        performDailyRollover(false);
      }
      __lastRolloverCheck = today;
    }
    DB().__saveToken = uid();
    DB().__lastUpdate = new Date().toISOString();
    DB().__version = APP_VERSION;
    if(!DB().dailyClose) DB().dailyClose = {};
    const d = today;
    if(!DB().dailyClose[d]) DB().dailyClose[d] = { accounts:{}, vault:{} };
    Object.keys(BRANCHES).forEach(br=>{
      DB().dailyClose[d].accounts[br] = {
        bank: Number(DB().liveAccounts[br]?.bank) || 0,
        cash: Number(DB().liveAccounts[br]?.cash) || 0,
        other: Number(DB().liveAccounts[br]?.other) || 0
      };
      DB().dailyClose[d].vault[br] = {};
      DENOMS.forEach(x => { DB().dailyClose[d].vault[br][x] = Number(DB().liveVault[br]?.[x]) || 0; });
    });
    if(!DB().dailyClose[d].baseAccounts) DB().dailyClose[d].baseAccounts = {};
    if(!DB().dailyClose[d].baseVault) DB().dailyClose[d].baseVault = {};
    Object.keys(BRANCHES).forEach(br=>{
      DB().dailyClose[d].baseAccounts[br] = {
        bank: Number(DB().baseAccounts[br]?.bank) || 0,
        cash: Number(DB().baseAccounts[br]?.cash) || 0,
        other: Number(DB().baseAccounts[br]?.other) || 0
      };
      DB().dailyClose[d].baseVault[br] = {};
      DENOMS.forEach(x => { DB().dailyClose[d].baseVault[br][x] = Number(DB().baseVault[br]?.[x]) || 0; });
    });
    if(__lastSnapshotDate !== d){
      if(!DB().dailyFullSnapshots) DB().dailyFullSnapshots = {};
      DB().dailyFullSnapshots[d] = {
        txs: JSON.parse(JSON.stringify(DB().txs||[])),
        customers: JSON.parse(JSON.stringify(DB().customers||[])),
        liveAccounts: JSON.parse(JSON.stringify(DB().liveAccounts||{})),
        liveVault: JSON.parse(JSON.stringify(DB().liveVault||{})),
        baseAccounts: JSON.parse(JSON.stringify(DB().baseAccounts||{})),
        baseVault: JSON.parse(JSON.stringify(DB().baseVault||{})),
        savedAt: new Date().toISOString()
      };
      __lastSnapshotDate = d;
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - KEEP_FULL_SNAPSHOT_DAYS);
      const cutoffStr = cutoff.toISOString().slice(0,10);
      Object.keys(DB().dailyFullSnapshots).forEach(dt=>{ if(dt < cutoffStr) delete DB().dailyFullSnapshots[dt]; });
    }
    saveLocalDB();
    if(supabaseReady) await saveToSupabase(DB());
  } finally {
    __savePending = false;
    if(__saveAgain){ __saveAgain = false; setTimeout(saveDB, 50); }
  }
}

function performDailyRollover(force){
  const today = todayStr();
  const last = DB().lastBaseDate || '';
  if(!force && last === today) return false;
  Object.keys(BRANCHES).forEach(br=>{
    const la = DB().liveAccounts[br] || {bank:0,cash:0,other:0};
    DB().baseAccounts[br] = {
      bank: Number(la.bank)||0,
      cash: Number(la.cash)||0,
      other: Number(la.other)||0
    };
    const lv = DB().liveVault[br] || {};
    DB().baseVault[br] = {};
    DENOMS.forEach(d => { DB().baseVault[br][d] = Number(lv[d])||0; });
  });
  if(!DB().yearlyArchive) DB().yearlyArchive = {};
  (DB().txs||[]).forEach(t => { if(!t.year && t.date) t.year = t.date.slice(0,4); });
  const currentYear = new Date().getFullYear();
  const keepInMain = [];
  (DB().txs||[]).forEach(t => {
    const txnYear = parseInt((t.date||'').slice(0,4),10);
    if(!isNaN(txnYear) && (currentYear - txnYear) >= ARCHIVE_YEARS_AFTER){
      const y = String(txnYear);
      if(!DB().yearlyArchive[y]) DB().yearlyArchive[y] = [];
      DB().yearlyArchive[y].push(t);
    } else keepInMain.push(t);
  });
  DB().txs = keepInMain;
  DB().lastBaseDate = today;
  if(!DB().dailyClose) DB().dailyClose = {};
  if(!DB().dailyClose[today]) DB().dailyClose[today] = { accounts:{}, vault:{} };
  Object.keys(BRANCHES).forEach(br=>{
    DB().dailyClose[today].accounts[br] = {
      bank: Number(DB().baseAccounts[br].bank)||0,
      cash: Number(DB().baseAccounts[br].cash)||0,
      other: Number(DB().baseAccounts[br].other)||0
    };
    DB().dailyClose[today].vault[br] = {};
    DENOMS.forEach(d => { DB().dailyClose[today].vault[br][d] = Number(DB().baseVault[br][d])||0; });
  });
  return true;
}

function fixBranchKeys(obj){
  if(!obj || typeof obj !== 'object') return obj;
  if(obj.kalaroja !== undefined && obj.kalaroa === undefined){ obj.kalaroa = obj.kalaroja; delete obj.kalaroja; }
  return obj;
}
function normalizeDB(){
  const d = DB();
  Object.keys(BRANCHES).forEach(b=>{
    if(!d.baseVault) d.baseVault = {};
    if(!d.baseVault[b]){ d.baseVault[b] = {}; DENOMS.forEach(x=> d.baseVault[b][x]=0); }
    DENOMS.forEach(x=>{ const v=Number(d.baseVault[b][x]); d.baseVault[b][x]=Number.isFinite(v)?v:0; });
    if(!d.liveVault) d.liveVault = {};
    if(!d.liveVault[b]){ d.liveVault[b] = {}; DENOMS.forEach(x=> d.liveVault[b][x]=0); }
    DENOMS.forEach(x=>{ const v=Number(d.liveVault[b][x]); d.liveVault[b][x]=Number.isFinite(v)?v:0; });
    if(!d.baseAccounts) d.baseAccounts = {};
    if(!d.baseAccounts[b]) d.baseAccounts[b] = { bank:0, cash:0, other:0 };
    if(!d.liveAccounts) d.liveAccounts = {};
    if(!d.liveAccounts[b]) d.liveAccounts[b] = { bank:0, cash:0, other:0 };
  });
  if(!Array.isArray(d.customers)) d.customers = [];
  if(!Array.isArray(d.txs)) d.txs = [];
  if(!Array.isArray(d.users) || !d.users.length) d.users = defaultUsers();
  if(!d.lastBaseDate) d.lastBaseDate = todayStr();
  if(!d.dailyClose) d.dailyClose = {};
  if(!d.yearlyArchive || typeof d.yearlyArchive !== 'object') d.yearlyArchive = {};
  if(!d.dailyFullSnapshots || typeof d.dailyFullSnapshots !== 'object') d.dailyFullSnapshots = {};
  if(!Array.isArray(d.txEditLog)) d.txEditLog = [];
  if(typeof d.totalCapital !== 'number') d.totalCapital = 0;
  (d.txs||[]).forEach(t=>{ if(!t.year && t.date) t.year = t.date.slice(0,4); });
  Object.values(d.yearlyArchive).forEach(arr=>{
    if(Array.isArray(arr)) arr.forEach(t=>{ if(!t.year && t.date) t.year = t.date.slice(0,4); });
  });
  if(typeof d.__firstSetupDone !== 'boolean'){
    const hasData = (d.txs||[]).length > 0 || (d.customers||[]).length > 0 ||
      Object.keys(BRANCHES).some(br => {
        const acc = d.baseAccounts[br]||{}, vault = d.baseVault[br]||{};
        return (Number(acc.bank)||0)+(Number(acc.cash)||0)+(Number(acc.other)||0) > 0 ||
               DENOMS.some(x => (Number(vault[x])||0) > 0);
      });
    d.__firstSetupDone = hasData;
  }
  (d.txs||[]).forEach(t=>{
    if(t.branch === 'kalaroja') t.branch = 'kalaroa';
    if(t.from === 'kalaroja') t.from = 'kalaroa';
    if(t.to === 'kalaroja') t.to = 'kalaroa';
    if(t.custBranch === 'kalaroja') t.custBranch = 'kalaroa';
    if(!t.custBranch) t.custBranch = t.branch || 'kalaroa';
    if(!t.userUsername && t.user){
      const u=(d.users||[]).find(x=>x.name===t.user);
      if(u) t.userUsername = u.username;
    }
  });
  Object.values(d.yearlyArchive).forEach(arr=>{
    if(Array.isArray(arr)) arr.forEach(t=>{
      if(t.branch === 'kalaroja') t.branch = 'kalaroa';
      if(t.from === 'kalaroja') t.from = 'kalaroa';
      if(t.to === 'kalaroja') t.to = 'kalaroa';
      if(t.custBranch === 'kalaroja') t.custBranch = 'kalaroa';
      if(!t.custBranch) t.custBranch = t.branch || 'kalaroa';
    });
  });
  (d.users||[]).forEach(u=>{ if(u.branch === 'kalaroja') u.branch = 'kalaroa'; });
}

/* ===== Vault + Live ===== */
function recomputeLive(){
  const d = DB();
  Object.keys(BRANCHES).forEach(b=>{
    d.liveVault[b] = {};
    DENOMS.forEach(x => d.liveVault[b][x] = Number(d.baseVault[b][x]) || 0);
    d.liveAccounts[b] = {
      bank: Number(d.baseAccounts[b].bank) || 0,
      cash: Number(d.baseAccounts[b].cash) || 0,
      other: Number(d.baseAccounts[b].other) || 0
    };
  });
  const sorted = (d.txs||[]).slice().sort((a,b)=>
    (a.createdAt || a.date || '').localeCompare(b.createdAt || b.date || ''));
  sorted.forEach(tx=>{
    if(tx.type === 'branch_transfer'){
      applyTxToLive(tx, 'send');
      if(tx.accepted === true) applyTxToLive(tx, 'accept');
    } else {
      applyTxToLive(tx);
    }
  });
  syncLiveCashFromVault();
}
function applyTxToLive(tx, phase){
  const d = DB();
  const bankBranch = tx.branch || 'kalaroa';
  const vaultBranch = tx.custBranch || tx.branch || 'kalaroa';
  const ensure = (br)=>{
    if(!br) return;
    if(!d.liveAccounts[br]) d.liveAccounts[br] = {bank:0,cash:0,other:0};
    if(!d.liveVault[br]) d.liveVault[br] = {};
    DENOMS.forEach(x=>{ if(typeof d.liveVault[br][x] !== 'number') d.liveVault[br][x]=0; });
  };
  ensure(bankBranch); ensure(vaultBranch);
  const amount = Number(tx.amount) || 0;
  const nIn = tx.notesIn || {};
  const nOut = tx.notesOut || {};
  switch(tx.type){
    case 'loan_given':
      d.liveAccounts[bankBranch].bank += amount;
      adjustNotes(d.liveVault[vaultBranch], nOut, -1);
      adjustNotes(d.liveVault[vaultBranch], nIn, +1); break;
    case 'loan_received':
      d.liveAccounts[bankBranch].bank -= amount;
      adjustNotes(d.liveVault[vaultBranch], nIn, +1);
      adjustNotes(d.liveVault[vaultBranch], nOut, -1); break;
    case 'deposit':
      d.liveAccounts[bankBranch].bank -= amount;
      adjustNotes(d.liveVault[vaultBranch], nIn, +1);
      adjustNotes(d.liveVault[vaultBranch], nOut, -1); break;
    case 'withdrawal':
      d.liveAccounts[bankBranch].bank += amount;
      adjustNotes(d.liveVault[vaultBranch], nOut, -1);
      adjustNotes(d.liveVault[vaultBranch], nIn, +1); break;
    case 'expense':
      adjustNotes(d.liveVault[bankBranch], nOut, -1);
      adjustNotes(d.liveVault[bankBranch], nIn, +1); break;
    case 'branch_transfer': {
      const from = tx.from, to = tx.to;
      if(!from || !to || from === to) break;
      ensure(from); ensure(to);
      if(phase === 'send'){
        const sendUse = Object.keys(nOut).length ? nOut : nIn;
        adjustNotes(d.liveVault[from], sendUse, -1);
      } else if(phase === 'accept'){
        const recvUse = Object.keys(nIn).length ? nIn : nOut;
        adjustNotes(d.liveVault[to], recvUse, +1);
      }
      break;
    }
    case 'other_bank':
      if(tx.dir === 'online_in'){ d.liveAccounts[bankBranch].bank += amount; }
      else if(tx.dir === 'online_out'){ d.liveAccounts[bankBranch].bank -= amount; }
      else if(tx.dir === 'in'){
        d.liveAccounts[bankBranch].bank += amount;
        adjustNotes(d.liveVault[vaultBranch], nIn, +1);
        adjustNotes(d.liveVault[vaultBranch], nOut, -1);
      } else {
        d.liveAccounts[bankBranch].bank -= amount;
        adjustNotes(d.liveVault[vaultBranch], nOut, -1);
        adjustNotes(d.liveVault[vaultBranch], nIn, +1);
      }
      break;
    case 'support':
      if(tx.dir === 'online_support_out'){ d.liveAccounts[bankBranch].bank -= amount; }
      else if(tx.dir === 'online_support_in'){ d.liveAccounts[bankBranch].bank += amount; }
      else if(tx.dir === 'out'){
        adjustNotes(d.liveVault[vaultBranch], nOut, -1);
        adjustNotes(d.liveVault[vaultBranch], nIn, +1);
      } else {
        adjustNotes(d.liveVault[vaultBranch], nIn, +1);
        adjustNotes(d.liveVault[vaultBranch], nOut, -1);
      }
      break;
    case 'customer':
      if(tx.dir === 'in'){
        adjustNotes(d.liveVault[vaultBranch], nIn, +1);
        adjustNotes(d.liveVault[vaultBranch], nOut, -1);
      } else {
        adjustNotes(d.liveVault[vaultBranch], nOut, -1);
        adjustNotes(d.liveVault[vaultBranch], nIn, +1);
      }
      break;
    case 'money_exchange':
      adjustNotes(d.liveVault[vaultBranch], nOut, -1);
      adjustNotes(d.liveVault[vaultBranch], nIn, +1); break;
  }
  syncLiveCashFromVault();
}
function syncLiveCashFromVault(){
  const d = DB();
  Object.keys(BRANCHES).forEach(br=>{
    let total = 0;
    DENOMS.forEach(x => total += (Number(d.liveVault[br][x])||0) * x);
    d.liveAccounts[br].cash = Math.round(total*100)/100;
  });
}
function adjustNotes(target, notes, sign){
  if(!notes || !target) return;
  for(const k in notes){
    target[k] = (target[k]||0) + sign * (Number(notes[k])||0);
    if(target[k] < 0) target[k] = 0;
  }
}
function getAllTxs(){
  let pool = [...(DB().txs || [])];
  Object.values(DB().yearlyArchive || {}).forEach(arr=>{
    if(Array.isArray(arr)) pool = pool.concat(arr);
  });
  return pool;
}
function getAllTxsForYear(year){
  year = String(year);
  const fromArchive = (DB().yearlyArchive?.[year]) || [];
  const fromMain = (DB().txs||[]).filter(t => (t.date||'').startsWith(year));
  const all = [...fromArchive, ...fromMain];
  all.sort((a,b)=> (a.createdAt || a.date || '').localeCompare(b.createdAt || b.date || ''));
  return all;
}
function getTxsBetween(fromDate, toDate){
  const pool = getAllTxs();
  return pool.filter(t=>{
    if(fromDate && (t.date||'') < fromDate) return false;
    if(toDate && (t.date||'') > toDate) return false;
    return true;
  }).sort((a,b)=> (a.createdAt || a.date || '').localeCompare(b.createdAt || b.date || ''));
}

/* ===== Due ===== */
function calculateCustomerDue(accountNo){
  const res = { paid:0, refund:0, net:0, count:0 };
  if(!accountNo) return res;
  const acc = String(accountNo).trim();
  if(!acc) return res;
  getAllTxs().forEach(t=>{
    if(t.type !== 'support') return;
    const key = t.custAcc || t.supportAcc || '';
    if(String(key).trim() !== acc) return;
    res.count++;
    const amt = Number(t.amount) || 0;
    if(t.dir === 'out' || t.dir === 'online_support_out') res.paid += amt;
    else if(t.dir === 'in' || t.dir === 'online_support_in') res.refund += amt;
  });
  res.paid = Math.round(res.paid*100)/100;
  res.refund = Math.round(res.refund*100)/100;
  res.net = Math.round((res.paid - res.refund)*100)/100;
  return res;
}
function recalcAllCustomerDues(save){
  let changed = false;
  (DB().customers || []).forEach(c=>{
    const d = calculateCustomerDue(c.accountNo);
    if(c.supportPaid !== d.paid || c.supportRefund !== d.refund ||
       c.supportDue !== d.net || c.supportCount !== d.count) changed = true;
    c.supportPaid = d.paid;
    c.supportRefund = d.refund;
    c.supportDue = d.net;
    c.supportCount = d.count;
    c.dueUpdatedAt = new Date().toISOString();
  });
  if(save && changed){ try{ saveDB(); }catch(e){} }
  return changed;
}
function updateCustomerDueInDB(accountNo, save){
  if(!accountNo) return null;
  const acc = String(accountNo).trim();
  const c = (DB().customers || []).find(x => x.accountNo === acc);
  if(!c) return null;
  const d = calculateCustomerDue(acc);
  c.supportPaid = d.paid;
  c.supportRefund = d.refund;
  c.supportDue = d.net;
  c.supportCount = d.count;
  c.dueUpdatedAt = new Date().toISOString();
  if(save){ try{ saveDB(); }catch(e){} }
  return c;
}

/* ===== Historical ===== */
function reconstructAtDate(dateStr, bf){
  const branches = bf === 'all' ? Object.keys(BRANCHES) : [bf];
  const vault = {}; DENOMS.forEach(d=> vault[d] = 0);
  const accounts = { bank:0, cash:0, other:0 };
  const close = DB().dailyClose?.[dateStr];
  if(close && close.accounts && close.vault){
    branches.forEach(b=>{
      const sa = close.accounts[b] || {bank:0,cash:0,other:0};
      const sv = close.vault[b] || {};
      accounts.bank += Number(sa.bank) || 0;
      accounts.other += Number(sa.other) || 0;
      DENOMS.forEach(d=>{ vault[d] += Number(sv[d]) || 0; });
    });
    let cash = 0; DENOMS.forEach(d=> cash += vault[d]*d);
    accounts.cash = cash;
    return { vault, accounts, source:'snapshot' };
  }
  const allTxs = getAllTxs();
  const branchStart = {};
  branches.forEach(br=>{
    const dates = Object.keys(DB().dailyClose || {}).filter(d=> d <= dateStr).sort();
    let snap = null;
    for(let i = dates.length-1; i >= 0; i--){
      const dc = DB().dailyClose[dates[i]];
      if(dc && dc.accounts && dc.accounts[br] && dc.vault && dc.vault[br]){
        snap = { date: dates[i], acc: dc.accounts[br], vault: dc.vault[br] };
        break;
      }
    }
    if(snap) branchStart[br] = { date:snap.date, vault:{...snap.vault}, accounts:{...snap.acc} };
    else branchStart[br] = {
      date: (DB().lastBaseDate || '0000-00-00'),
      vault: { ...(DB().baseVault[br]||{}) },
      accounts: { ...(DB().baseAccounts[br]||{bank:0,cash:0,other:0}) }
    };
  });
  const sorted = allTxs.slice().sort((a,b)=>
    (a.createdAt || a.date || '').localeCompare(b.createdAt || b.date || ''));
  branches.forEach(br=>{
    const start = branchStart[br]; if(!start) return;
    const acc = { ...start.accounts };
    const vlt = { ...start.vault };
    sorted.forEach(tx=>{
      const txDate = tx.date;
      const txBranch = tx.custBranch || tx.branch;
      if(tx.type === 'branch_transfer'){
        if(tx.from === br && txDate > start.date && txDate <= dateStr){
          const nOut = tx.notesOut||{}, nIn = tx.notesIn||{};
          const use = Object.keys(nOut).length ? nOut : nIn;
          for(const k in use){ vlt[k] = (vlt[k]||0) - (Number(use[k])||0); if(vlt[k] < 0) vlt[k] = 0; }
        }
        if(tx.to === br && tx.accepted && tx.acceptedDate){
          const ad = tx.acceptedDate;
          if(ad > start.date && ad <= dateStr){
            const nIn = tx.notesIn||{}, nOut = tx.notesOut||{};
            const use = Object.keys(nIn).length ? nIn : nOut;
            for(const k in use) vlt[k] = (vlt[k]||0) + (Number(use[k])||0);
          }
        }
        return;
      }
      if(txDate <= start.date || txDate > dateStr) return;
      if(txBranch !== br && tx.branch !== br) return;
      const amt = Number(tx.amount) || 0;
      const nIn = tx.notesIn||{}, nOut = tx.notesOut||{};
      switch(tx.type){
        case 'loan_given':
          if(tx.branch === br) acc.bank += amt;
          for(const k in nOut) vlt[k] = (vlt[k]||0) - Number(nOut[k]);
          for(const k in nIn) vlt[k] = (vlt[k]||0) + Number(nIn[k]); break;
        case 'loan_received':
          if(tx.branch === br) acc.bank -= amt;
          for(const k in nIn) vlt[k] = (vlt[k]||0) + Number(nIn[k]);
          for(const k in nOut) vlt[k] = (vlt[k]||0) - Number(nOut[k]); break;
        case 'deposit':
          if(tx.branch === br) acc.bank -= amt;
          for(const k in nIn) vlt[k] = (vlt[k]||0) + Number(nIn[k]);
          for(const k in nOut) vlt[k] = (vlt[k]||0) - Number(nOut[k]); break;
        case 'withdrawal':
          if(tx.branch === br) acc.bank += amt;
          for(const k in nOut) vlt[k] = (vlt[k]||0) - Number(nOut[k]);
          for(const k in nIn) vlt[k] = (vlt[k]||0) + Number(nIn[k]); break;
        case 'expense':
          for(const k in nOut) vlt[k] = (vlt[k]||0) - Number(nOut[k]);
          for(const k in nIn) vlt[k] = (vlt[k]||0) + Number(nIn[k]); break;
        case 'other_bank':
          if(tx.dir === 'online_in'){ if(tx.branch === br) acc.bank += amt; }
          else if(tx.dir === 'online_out'){ if(tx.branch === br) acc.bank -= amt; }
          else if(tx.dir === 'in'){
            if(tx.branch === br) acc.bank += amt;
            for(const k in nIn) vlt[k] = (vlt[k]||0) + Number(nIn[k]);
            for(const k in nOut) vlt[k] = (vlt[k]||0) - Number(nOut[k]);
          } else {
            if(tx.branch === br) acc.bank -= amt;
            for(const k in nOut) vlt[k] = (vlt[k]||0) - Number(nOut[k]);
            for(const k in nIn) vlt[k] = (vlt[k]||0) + Number(nIn[k]);
          }
          break;
        case 'support':
          if(tx.dir === 'online_support_out'){ if(tx.branch === br) acc.bank -= amt; }
          else if(tx.dir === 'online_support_in'){ if(tx.branch === br) acc.bank += amt; }
          else if(tx.dir === 'out'){
            for(const k in nOut) vlt[k] = (vlt[k]||0) - Number(nOut[k]);
            for(const k in nIn) vlt[k] = (vlt[k]||0) + Number(nIn[k]);
          } else {
            for(const k in nIn) vlt[k] = (vlt[k]||0) + Number(nIn[k]);
            for(const k in nOut) vlt[k] = (vlt[k]||0) - Number(nOut[k]);
          }
          break;
        case 'money_exchange':
          for(const k in nOut) vlt[k] = (vlt[k]||0) - Number(nOut[k]);
          for(const k in nIn) vlt[k] = (vlt[k]||0) + Number(nIn[k]); break;
      }
    });
    DENOMS.forEach(d=>{ if(vlt[d] < 0) vlt[d] = 0; });
    accounts.bank += Number(acc.bank) || 0;
    accounts.other += Number(acc.other) || 0;
    DENOMS.forEach(d=>{ vault[d] += Number(vlt[d]) || 0; });
  });
  let cash = 0; DENOMS.forEach(d=> cash += vault[d]*d);
  accounts.cash = cash;
  return { vault, accounts, source:'reconstructed' };
}
function getBalancesForDate(dateStr, bf){
  if(dateStr === todayStr()){
    const branches = bf === 'all' ? Object.keys(BRANCHES) : [bf];
    const r = { bank:0, cash:0, other:0, isHistorical:false };
    branches.forEach(b=>{
      const la = DB().liveAccounts[b] || {bank:0,cash:0,other:0};
      r.bank += Number(la.bank) || 0;
      r.cash += Number(la.cash) || 0;
      r.other += Number(la.other) || 0;
    });
    return r;
  }
  const r = reconstructAtDate(dateStr, bf);
  return { bank:r.accounts.bank, cash:r.accounts.cash, other:r.accounts.other, isHistorical:true };
}
function getVaultForDate(dateStr, bf){
  if(dateStr === todayStr()){
    const branches = bf === 'all' ? Object.keys(BRANCHES) : [bf];
    const totals = {}; DENOMS.forEach(d=> totals[d]=0);
    branches.forEach(b=>{
      const lv = DB().liveVault[b] || {};
      DENOMS.forEach(d=>{ totals[d] += Number(lv[d]) || 0; });
    });
    return { totals, isHistorical:false };
  }
  const r = reconstructAtDate(dateStr, bf);
  return { totals: r.vault, isHistorical:true };
}
function computeStats(bf, date){
  const r = {
    loan_given:{amt:0,cnt:0}, loan_received:{amt:0,cnt:0},
    deposit:{amt:0,cnt:0}, withdrawal:{amt:0,cnt:0},
    transfer:{in:0,out:0,cnt:0,pending:0,pendingCnt:0},
    expense:{amt:0,cnt:0},
    other:{in:0,out:0,cnt:0, onlineIn:0, onlineOut:0},
    support:{in:0,out:0,cnt:0, onlineIn:0, onlineOut:0},
    customer:{in:0,out:0,cnt:0},
    money_exchange:{in:0,out:0,cnt:0,net:0}
  };
  getAllTxs().forEach(t=>{
    const ok = (bf === 'all') || (t.branch === bf) ||
               (t.type === 'branch_transfer' && (t.from === bf || t.to === bf));
    if(!ok) return;
    if(date && t.date !== date && !(t.type === 'branch_transfer' && t.acceptedDate === date)) return;
    switch(t.type){
      case 'loan_given':    r.loan_given.amt += t.amount; r.loan_given.cnt++; break;
      case 'loan_received': r.loan_received.amt += t.amount; r.loan_received.cnt++; break;
      case 'deposit':       r.deposit.amt += t.amount; r.deposit.cnt++; break;
      case 'withdrawal':    r.withdrawal.amt += t.amount; r.withdrawal.cnt++; break;
      case 'expense':       r.expense.amt += t.amount; r.expense.cnt++; break;
      case 'branch_transfer': {
        const accepted = !!t.accepted;
        if(bf === 'all'){
          if(accepted){ r.transfer.in += t.amount; r.transfer.out += t.amount; }
          else { r.transfer.out += t.amount; r.transfer.pending += t.amount; r.transfer.pendingCnt++; }
          r.transfer.cnt++;
        } else {
          if(t.to === bf){
            if(accepted){ if(!date || t.acceptedDate === date){ r.transfer.in += t.amount; r.transfer.cnt++; } }
            else { if(!date || t.date === date){ r.transfer.pending += t.amount; r.transfer.pendingCnt++; } }
          }
          if(t.from === bf){ if(!date || t.date === date){ r.transfer.out += t.amount; r.transfer.cnt++; } }
        }
        break;
      }
      case 'other_bank':
        if(t.dir === 'in'){ r.other.in += t.amount; r.other.cnt++; }
        else if(t.dir === 'online_in'){ r.other.onlineIn += t.amount; r.other.cnt++; }
        else if(t.dir === 'out'){ r.other.out += t.amount; r.other.cnt++; }
        else if(t.dir === 'online_out'){ r.other.onlineOut += t.amount; r.other.cnt++; }
        break;
      case 'support':
        if(t.dir === 'online_support_out'){ r.support.out += t.amount; r.support.onlineOut += t.amount; r.support.cnt++; }
        else if(t.dir === 'online_support_in'){ r.support.in += t.amount; r.support.onlineIn += t.amount; r.support.cnt++; }
        else if(t.dir === 'out'){ r.support.out += t.amount; r.support.cnt++; }
        else { r.support.in += t.amount; r.support.cnt++; }
        break;
      case 'customer':
        if(t.dir === 'in') r.customer.in += t.amount;
        else r.customer.out += t.amount;
        r.customer.cnt++;
        break;
      case 'money_exchange': {
        const outSum = Number(t.notesOutSum) || (t.notesOut ? Object.keys(t.notesOut).reduce((s,k)=> s + Number(k)*Number(t.notesOut[k]), 0) : 0);
        const inSum = Number(t.notesInSum) || (t.notesIn ? Object.keys(t.notesIn).reduce((s,k)=> s + Number(k)*Number(t.notesIn[k]), 0) : 0);
        r.money_exchange.out += outSum;
        r.money_exchange.in += inSum;
        r.money_exchange.net += (inSum - outSum);
        r.money_exchange.cnt++;
        break;
      }
    }
  });
  return r;
}

async function doLogin(){
  const btn = $('#loginBtn');
  const err = $('#loginErr');
  const u = $('#loginUser').value.trim();
  const p = $('#loginPass').value.trim();
  if(!u || !p){ err.textContent = '⚠️ আইডি ও পাসওয়ার্ড দিন'; return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> যাচাই হচ্ছে...';
  err.textContent = '';
  try{
    if(!DB()){ err.textContent = '❌ ডেটাবেস লোড হয়নি। পেজ রিফ্রেশ করুন।'; btn.disabled = false; btn.innerHTML = '🔐 লগইন করুন'; return; }
    forceFixAdmin();
    let user = null;
    user = DB().users.find(x => x.username === u && x.password === p);
    if(!user && u === 'admin' && p === DEFAULT_ADMIN_PASSWORD){
      forceFixAdmin();
      user = DB().users.find(x => x.username === 'admin');
    }
    if(!user){
      const hash = await trySha256(p);
      if(hash){
        const hashUser = DB().users.find(x => x.username === u && x.passwordHash === hash);
        if(hashUser){
          hashUser.password = p;
          delete hashUser.passwordHash;
          await saveDB();
          user = hashUser;
        }
      }
    }
    if(!user){
      err.textContent = '❌ ভুল আইডি বা পাসওয়ার্ড';
      $('#loginPass').value = '';
      btn.disabled = false;
      btn.innerHTML = '🔐 লগইন করুন';
      return;
    }
    session = user;
    sessionStorage.setItem(SKEY, user.id);
    viewBranch = user.role === 'admin' ? 'all' : user.branch;
    dashDate = todayStr();
    startApp();
  }catch(e){
    console.error('Login error:', e);
    err.textContent = '❌ সমস্যা: ' + (e.message || 'Unknown error');
    btn.disabled = false;
    btn.innerHTML = '🔐 লগইন করুন';
  }
}

function openModal({ title, bodyHTML, wide=false, onMount }){
  const wrap = document.createElement('div');
  wrap.className = 'modal-overlay';
  wrap.innerHTML = `
    <div class="modal ${wide?'wide':''}">
      <div class="modal-head"><h3>${title}</h3><button class="x" type="button">✕</button></div>
      <div class="modal-body">${bodyHTML}</div>
    </div>`;
  $('#modalRoot').appendChild(wrap);
  const close = () => wrap.remove();
  wrap.querySelector('.x').addEventListener('click', close);
  wrap.addEventListener('click', e=>{ if(e.target === wrap) close(); });
  if(onMount) onMount(wrap, close);
  return { wrap, close };
}
function showDuePopup(customer, opts){
  opts = opts || {};
  if(!customer) return;
  const due = calculateCustomerDue(customer.accountNo || customer.supportAcc);
  const isDue = due.net > 0;
  const cleared = due.net <= 0 && due.count > 0;
  if(!opts.force && !isDue) return;
  let heroClass = 'due-hero', heroLabel='', heroAmt='', heroSub='';
  if(isDue){
    heroLabel = '⚠️ এই গ্রাহকের কাছে বকেয়া';
