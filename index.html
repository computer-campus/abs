<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Campus | Agent Banking v28</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--blue:#3b82f6;--blue-2:#60a5fa;--blue-3:#93c5fd;--yellow:#facc15;--yellow-2:#fde047;--green:#22c55e;--green-2:#4ade80;--red:#dc2626;--txt:#f0f4ff;--muted:#7a8ab8;--dim:#4a5680;--line:rgba(59,130,246,.12);--line-2:rgba(59,130,246,.22);--line-3:rgba(59,130,246,.4);--pink:#ec4899;--pink-2:#f9a8d4;}
body{font-family:'Noto Sans Bengali',sans-serif;color:var(--txt);background:#04060d;background-image:radial-gradient(circle at 15% 5%,rgba(59,130,246,.15),transparent 45%),radial-gradient(circle at 85% 95%,rgba(34,197,94,.12),transparent 45%);background-attachment:fixed;min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#050810}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--blue),var(--green));border-radius:10px;border:2px solid #050810}
.hidden{display:none!important}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 12px rgba(34,197,94,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.rgb{background:linear-gradient(90deg,var(--blue),var(--yellow),var(--green),var(--blue));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.sidebar-overlay{position:fixed;inset:0;z-index:400;background:rgba(2,4,10,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.sidebar-overlay.active{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:320px;max-width:88vw;z-index:500;background:linear-gradient(165deg,#0f1428,#06091a);border-right:1px solid var(--line-3);box-shadow:20px 0 60px rgba(0,0,0,.9);transform:translateX(-100%);transition:transform .35s;display:flex;flex-direction:column;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sidebar-head{padding:18px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.sidebar-head h3{font-size:16px;font-weight:800;color:#fff}
.sidebar-head .sb-close{border:none;background:rgba(220,38,38,.15);color:#f87171;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:14px;border:1px solid rgba(220,38,38,.4)}
.sidebar-body{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:8px}
.sb-section{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;padding:14px 8px 6px;margin-top:4px;border-top:1px dashed var(--line)}
.sb-section:first-child{border-top:none;margin-top:0;padding-top:6px}
.sb-btn{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;background:linear-gradient(145deg,#0f1428,#080c1a);border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;text-align:left;width:100%}
.sb-btn:hover{background:linear-gradient(145deg,rgba(59,130,246,.15),rgba(34,197,94,.06));border-color:var(--line-3);transform:translateX(3px)}
.sb-btn .sb-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.08));border:1px solid var(--line-3);flex-shrink:0}
.sb-btn .sb-lbl{flex:1;display:flex;flex-direction:column;gap:2px}
.sb-btn .sb-lbl .sb-sub{font-size:11.5px;color:var(--muted);font-weight:600}
.sb-btn.primary{background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(34,197,94,.15));border-color:var(--blue)}
.sb-btn.danger{background:linear-gradient(135deg,rgba(220,38,38,.15),rgba(153,27,27,.08));border-color:rgba(220,38,38,.4);color:#f87171}
.sb-btn.warn{background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(245,158,11,.08));border-color:rgba(250,204,21,.4);color:#facc15}
.sb-badge{margin-left:auto;padding:3px 10px;border-radius:8px;font-size:11.5px;font-weight:800;background:rgba(220,38,38,.2);border:1px solid rgba(220,38,38,.5);color:#f87171}
.sb-user{padding:14px 16px;border-radius:14px;background:linear-gradient(145deg,rgba(59,130,246,.1),rgba(34,197,94,.04));border:1px solid var(--line-3);margin-bottom:6px}
.sb-user .name{font-size:15px;font-weight:800;color:#fff}
.sb-user .role{font-size:12px;color:var(--green-2);font-weight:700;margin-top:4px}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;background:rgba(4,6,13,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2)}
.topbar .tb-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar .tb-menu-btn{width:44px;height:44px;border-radius:13px;border:1px solid var(--line-3);background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.08));color:#fff;cursor:pointer;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.1));border:1px solid var(--line-3);flex-shrink:0}
.brand h1{font-size:17px;font-weight:800}
.brand p{font-size:11.5px;color:#a5b4d8;margin-top:1px;font-weight:600}
.topbar .tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.tb-branch{font-size:13px;font-weight:700;padding:9px 14px;border-radius:11px;background:linear-gradient(145deg,rgba(59,130,246,.12),rgba(34,197,94,.06));border:1px solid var(--line-3);white-space:nowrap;color:#fff;display:flex;align-items:center;gap:6px}
.tb-branch b{color:var(--green-2);font-weight:800}
.tb-date{padding:8px 12px;border-radius:11px;background:#080c1a;border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:13px;outline:none}
.tb-select{padding:9px 14px;border-radius:11px;background:#080c1a;border:1px solid var(--line-3);color:var(--green-2);font-family:inherit;font-size:13px;font-weight:800;outline:none;cursor:pointer}
.tb-time{font-size:13.5px;font-weight:800;padding:9px 14px;border-radius:11px;background:linear-gradient(145deg,rgba(59,130,246,.15),rgba(34,197,94,.08));border:1px solid var(--line-3);color:var(--green-2);display:flex;align-items:center;gap:6px}
.tb-time .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green-2);animation:pulseGreen 1.8s ease-in-out infinite}
.sync-status{font-size:11.5px;padding:6px 12px;border-radius:18px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:var(--green-2);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sync-status.offline{background:rgba(220,38,38,.12);border-color:rgba(220,38,38,.4);color:#f87171}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 30%,#0a1020,#04060d 70%)}
.login-box{width:100%;max-width:440px;background:linear-gradient(165deg,#0f1428,#060a18);border:1px solid var(--line-2);border-radius:28px;padding:38px 30px;box-shadow:0 20px 50px rgba(0,0,0,.9);animation:popIn .5s}
.login-logo{width:88px;height:88px;margin:0 auto 18px;display:grid;place-items:center;animation:float 3s ease-in-out infinite}
.login-box h1{text-align:center;font-size:24px;font-weight:800;color:#fff;margin-bottom:8px}
.login-box h2{text-align:center;font-size:13.5px;color:#a5b4d8;font-weight:500;margin-bottom:26px}
.field{position:relative;z-index:1;margin-bottom:16px}
.field label{display:block;font-size:13.5px;color:#b8c8ee;margin-bottom:7px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.field input,.field select{width:100%;padding:14px 16px;border-radius:12px;background:#050810;border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:15.5px;font-weight:500;outline:none}
.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;padding:13px 22px;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--blue),#2563eb);transition:all .2s;box-shadow:0 4px 16px rgba(59,130,246,.35)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.btn.pink{background:linear-gradient(135deg,var(--blue),var(--green))}
.btn.green{background:linear-gradient(135deg,var(--green),#16a34a)}
.btn.gray{background:linear-gradient(145deg,#141a30,#0a0f1e);color:var(--txt);border:1px solid var(--line-2);font-size:14.5px}
.btn.red{background:linear-gradient(135deg,#dc2626,#991b1b)}
.btn.yellow{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000}
.btn.cyan{background:linear-gradient(135deg,#06b6d4,#0891b2)}
.btn.purple{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.btn.sm{padding:8px 14px;font-size:13px}
main{max-width:1500px;margin:0 auto;padding:26px 20px 80px;display:flex;flex-direction:column;gap:26px;align-items:center;animation:fadeInUp .5s}
.section{width:100%}
.section-title{display:flex;align-items:center;gap:11px;margin-bottom:16px;font-size:16.5px;font-weight:800;color:#fff;flex-wrap:wrap}
.section-title span.bar{width:4px;height:26px;border-radius:4px;background:linear-gradient(180deg,var(--blue),var(--yellow),var(--green))}
.grid{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{position:relative;cursor:pointer;overflow:hidden;border-radius:22px;padding:20px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);transition:all .35s;animation:fadeInUp .4s backwards}
.card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--yellow),var(--green))}
.card:hover{transform:translateY(-6px) scale(1.01);border-color:var(--line-3);box-shadow:0 24px 60px rgba(0,0,0,.9)}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.card-top .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(145deg,rgba(59,130,246,.2),rgba(34,197,94,.08));border:1px solid var(--line-3)}
.card-top h3{font-size:15px;font-weight:700;color:#fff}
.big-amt{font-size:30px;line-height:1.25;font-weight:800;color:#fff}
.big-amt.sm{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.big-amt.sm .lbl{color:#a5b4d8;font-size:13px;font-weight:600;min-width:62px}
.card-sub{margin-top:10px;font-size:13.5px;color:#a5b4d8;line-height:1.6}
.card-sub b{color:var(--green-2);font-weight:700}
.card-tap{position:absolute;right:16px;bottom:14px;font-size:12px;color:var(--dim);opacity:.7}
.vault-box{width:100%;border-radius:22px;padding:20px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2)}
.vault-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.vault-item{flex:1 1 84px;min-width:78px;text-align:center;padding:13px 6px;border-radius:14px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1px solid var(--line-2)}
.vault-item .d{font-size:13.5px;color:#a5b4d8;font-weight:700}
.vault-item .c{font-size:22px;font-weight:800;margin-top:4px;color:var(--green-2)}
.vault-total{margin-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-top:14px;border-top:1px dashed var(--line-2)}
.vault-total span{font-size:14.5px;color:#a5b4d8;font-weight:600}
.vault-total b{color:var(--green-2)}
.balance-panel{width:100%;border-radius:22px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);padding:18px}
.balance-row-top{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
.balance-cell{padding:16px 14px;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.03),rgba(0,0,0,.15));border:1px solid var(--line-2);text-align:center}
.balance-cell .bc-ico{font-size:22px;margin-bottom:6px;display:block}
.balance-cell .bc-lbl{font-size:12.5px;color:#a5b4d8;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.balance-cell .bc-lbl.big-label{font-size:15px!important;font-weight:800!important;color:var(--blue-2)!important;text-transform:none!important}
.balance-cell .bc-val{font-size:19px;font-weight:800;color:#fff}
.balance-cell.blue .bc-val{color:var(--blue-2)}
.balance-cell.green .bc-val{color:var(--green-2)}
.balance-cell.purple .bc-val{color:#a78bfa}
.balance-cell.yellow .bc-val{color:var(--yellow-2)}
.bal-grid{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:16px}
.bal-card{border-radius:22px;padding:22px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2)}
.bal-card .t{font-size:13.5px;color:#a5b4d8;font-weight:700;margin-bottom:10px;text-transform:uppercase}
.bal-card .v{font-size:30px;font-weight:800;color:#fff}
.bal-card.main{background:linear-gradient(135deg,#131a35,#0a0f1e 60%,#0f1428);border-color:var(--blue)}
.bal-card.main .v{font-size:46px;background:linear-gradient(135deg,var(--blue-2),var(--green-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bal-card.capital{border-color:rgba(250,204,21,.45)}
.bal-card.capital .v{color:var(--yellow-2)}
.bal-card.deficit{border-color:rgba(220,38,38,.45)}
.bal-card.deficit .v{color:#f87171}
.bal-card.surplus{border-color:rgba(34,197,94,.45)}
.bal-card.surplus .v{color:var(--green-2)}
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(2,4,10,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto;animation:fadeIn .2s}
.modal{width:100%;max-width:760px;border-radius:22px;overflow:hidden;background:linear-gradient(165deg,#0f1428,#06091a);border:1px solid var(--line-3);animation:popIn .3s}
.modal.wide{max-width:1100px}
.modal.xwide{max-width:1400px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:5;background:#0f1428}
.modal-head h3{font-size:17px;font-weight:800;color:#fff;display:flex;align-items:center;gap:9px}
.modal-head .x{border:none;background:rgba(59,130,246,.15);color:var(--blue-3);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:15px;border:1px solid var(--line-3)}
.modal-head .x:hover{background:var(--blue);color:#fff;transform:rotate(90deg)}
.modal-body{padding:20px 22px 26px;font-size:14px}
.form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.cust-box{margin-top:8px;padding:16px;border-radius:16px;background:linear-gradient(145deg,rgba(59,130,246,.06),rgba(34,197,94,.03));border:1px solid var(--line-2)}
.cust-box.mandatory-box{border-color:rgba(250,204,21,.5)}
.cust-box .head{margin-bottom:12px}
.cust-box .head h4{font-size:13px;color:var(--blue-3);font-weight:700;text-transform:uppercase}
.suggest{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);background:#06091a;max-height:240px;overflow-y:auto}
.suggest:empty{display:none}
.sug-item{padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px;color:#e8eeff;line-height:1.7}
.sug-item:hover{background:linear-gradient(90deg,rgba(59,130,246,.15),rgba(34,197,94,.08))}
.sug-item b{color:var(--green-2);font-size:14.5px}
.sug-item small{color:#a5b4d8;font-size:12.5px}
.notes-cols{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:8px}
@media(max-width:700px){.notes-cols{grid-template-columns:1fr}}
.notes-col{padding:16px;border-radius:16px;border:1px solid var(--line-2);background:linear-gradient(145deg,#0a0f1e,#050810)}
.notes-col.out{border-color:rgba(250,204,21,.3)}
.notes-col.in{border-color:rgba(34,197,94,.3)}
.notes-col h4{font-size:20px;margin-bottom:14px;font-weight:800;color:#fff}
.notes-col.out h4{color:var(--yellow-2)}
.notes-col.in h4{color:var(--green-2)}
.notes-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:space-between}
.note-item{flex:1 1 54px;min-width:52px;text-align:center}
.note-item label{display:block;font-size:13.5px;color:#b8c8ee;margin-bottom:6px;font-weight:700}
.note-item input{width:100%;padding:11px 5px;text-align:center;border-radius:9px;background:#03060d;border:1px solid var(--line-2);color:#fff;font-family:inherit;font-size:15px;font-weight:800;outline:none}
.note-item input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.notes-col.out .note-item input{color:var(--yellow-2)}
.notes-col.in .note-item input{color:var(--green-2)}
.sum-line{margin-top:12px;font-size:14px;color:#a5b4d8;display:flex;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--line-2)}
.sum-line b{font-size:17px;color:#fff}
.total-preview{margin-top:18px;padding:18px;border-radius:16px;text-align:center;background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(34,197,94,.06));border:1px solid var(--line-3)}
.total-preview .l{font-size:12.5px;color:var(--blue-3);font-weight:700;text-transform:uppercase}
.total-preview .v{font-size:32px;margin-top:6px;color:#fff;font-weight:800}
.pending-box{margin-top:16px;padding:16px;border-radius:16px;background:linear-gradient(145deg,rgba(250,204,21,.08),rgba(250,204,21,.02));border:1px solid rgba(250,204,21,.35)}
.pending-box h4{font-size:13.5px;color:var(--yellow);font-weight:800;margin-bottom:12px}
.pending-empty{color:#a5b4d8;text-align:center;padding:14px;font-size:13.5px}
.pending-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;margin-bottom:8px;background:rgba(0,0,0,.3);border:1px solid var(--line-2);flex-wrap:wrap}
.pending-item .info{font-size:13.5px;color:#eee;flex:1;min-width:180px;line-height:1.75}
.pending-item .info b{color:var(--yellow)}
.pending-item .info small{color:var(--muted);display:block;margin-top:3px}
.accept-head{padding:16px;border-radius:16px;margin-bottom:16px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1px solid var(--line-3);font-size:14px;line-height:1.9;color:#e0eaff}
.online-box{margin-top:16px;padding:18px;border-radius:16px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1.5px solid var(--blue);display:none}
.online-box.active{display:block}
.online-box h4{font-size:14px;font-weight:800;margin-bottom:12px;color:var(--blue-3)}
.cust-branch-toggle{padding:16px 18px;border-radius:16px;margin-top:8px;margin-bottom:16px;background:linear-gradient(145deg,rgba(59,130,246,.06),rgba(34,197,94,.03));border:1px solid var(--line-2)}
.cust-branch-toggle .toggle-title{font-size:13px;font-weight:800;color:#fff;margin-bottom:12px;text-transform:uppercase}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toBn = s => String(s).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);

function hashPassword(p){
  try{ if(typeof CryptoJS !== 'undefined') return CryptoJS.SHA256(PASS_SALT + String(p)).toString(); }catch(e){}
  let h = 0; const s = PASS_SALT + String(p);
  for(let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return 'fb_' + Math.abs(h).toString(36) + '_' + s.length;
}
function verifyPassword(p, stored){
  if(!stored) return false;
  if(!/^[a-f0-9]{64}$/.test(stored) && !stored.startsWith('fb_')) return String(p) === String(stored);
  return hashPassword(p) === stored;
}
const DEFAULT_ADMIN_HASH = hashPassword('8182');

function parseNum(val){
  if(val == null) return 0;
  const n = Number(String(val).replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}
function attachAmountInput(inputEl, opts){
  opts = opts || {};
  if(!inputEl || inputEl.__smartAttached) return;
  inputEl.__smartAttached = true;
  const allowDecimal = opts.decimal !== false;
  const maxDecimals = opts.maxDecimals != null ? opts.maxDecimals : 2;
  inputEl.addEventListener('keydown', (e)=>{
    const allowed = ['Backspace','Delete','Tab','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','Enter','Escape'];
    if(allowed.includes(e.key)) return;
    if(e.ctrlKey || e.metaKey) return;
    if(e.key === '.'){ if(!allowDecimal) e.preventDefault(); return; }
    if(!/^[0-9]$/.test(e.key)) e.preventDefault();
  });
  inputEl.addEventListener('paste', (e)=>{
    e.preventDefault();
    const txt = (e.clipboardData || window.clipboardData).getData('text');
    let clean = String(txt).replace(/[^0-9.]/g, '');
    if(!allowDecimal) clean = clean.replace(/\./g, '');
    const parts = clean.split('.');
    if(parts.length > 2) clean = parts[0] + '.' + parts.slice(1).join('');
    inputEl.value = clean;
    inputEl.dispatchEvent(new Event('input', { bubbles: true }));
  });
  inputEl.addEventListener('input', ()=>{
    let raw = inputEl.value.replace(/[^0-9.]/g, '');
    if(!allowDecimal) raw = raw.replace(/\./g, '');
    const parts = raw.split('.');
    if(parts.length > 2) raw = parts[0] + '.' + parts.slice(1).join('');
    if(!raw){ inputEl.value = ''; return; }
    if(raw.includes('.')){
      const [intPart, decPart] = raw.split('.');
      const formatted = intPart ? Number(intPart).toLocaleString('en-US') : '0';
      inputEl.value = formatted + '.' + decPart.slice(0, maxDecimals);
    } else {
      inputEl.value = raw ? Number(raw).toLocaleString('en-US') : '';
    }
  });
  inputEl.addEventListener('focus', ()=>{ setTimeout(()=> inputEl.select(), 50); });
}
function setupEnterNavigation(){
  document.addEventListener('keydown', (e)=>{
    if(e.key !== 'Enter') return;
    const el = e.target;
    if(!el || !(el.tagName === 'INPUT' || el.tagName === 'SELECT')) return;
    if(el.type === 'checkbox' || el.type === 'radio') return;
    const container = el.closest('.modal-body') || el.closest('main') || document.body;
    const focusables = Array.from(container.querySelectorAll('input:not([type="hidden"]):not([disabled]), select:not([disabled]), textarea:not([disabled])'));
    const idx = focusables.indexOf(el);
    if(idx >= 0 && idx < focusables.length - 1){
      e.preventDefault();
      focusables[idx + 1].focus();
      if(focusables[idx + 1].select) setTimeout(()=> focusables[idx + 1].select(), 30);
    }
  }, true);
}
function fmtDateTime(iso){
  if(!iso) return '-';
  try{
    const d = new Date(iso); if(isNaN(d.getTime())) return '-';
    let h = d.getHours(); const m = String(d.getMinutes()).padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    return `${toBn(String(d.getDate()).padStart(2,'0'))}/${toBn(String(d.getMonth()+1).padStart(2,'0'))}/${toBn(d.getFullYear())} ${toBn(String(h).padStart(2,'0'))}:${toBn(m)} ${ampm}`;
  }catch(e){ return '-'; }
}
async function withTimeout(promise, ms, fallback){
  return Promise.race([promise, new Promise(resolve => setTimeout(()=> resolve(fallback), ms))]);
}
function safeLS_set(key, value){
  try{ localStorage.setItem(key, value); return { ok: true }; }
  catch(e){
    if(e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)){
      try{
        const raw = localStorage.getItem(LOCAL_DB_KEY);
        if(raw){
          const parsed = JSON.parse(raw);
          if(parsed && parsed.yearlyArchive){
            parsed.yearlyArchive = {};
            parsed.txs = (parsed.txs || []).slice(-200);
            localStorage.setItem(key, JSON.stringify(parsed));
            return { ok: true, cleaned: true };
          }
        }
      }catch(e2){}
      return { ok: false, message: 'স্টোরেজ পূর্ণ।' };
    }
    return { ok: false, message: e?.message || 'Error' };
  }
}

function normalizeDB(){
  const d = DB();
  Object.keys(BRANCHES).forEach(b=>{
    if(!d.baseVault) d.baseVault = {};
    if(!d.baseVault[b]){ d.baseVault[b] = {}; DENOMS.forEach(x=> d.baseVault[b][x]=0); }
    DENOMS.forEach(x=>{ const v=Number(d.baseVault[b][x]); d.baseVault[b][x]=Number.isFinite(v)?v:0; });
    if(!d.liveVault) d.liveVault = {};
    if(!d.liveVault[b]){ d.liveVault[b] = {}; DENOMS.forEach(x=> d.liveVault[b][x]=0); }
    DENOMS.forEach(x=>{ const v=Number(d.liveVault[b][x]); d.liveVault[b][x]=Number.isFinite(v)?v:0; });
    if(!d.baseAccounts) d.baseAccounts = {};
    if(!d.baseAccounts[b]) d.baseAccounts[b] = { bank:0, cash:0, other:0 };
    if(!d.liveAccounts) d.liveAccounts = {};
    if(!d.liveAccounts[b]) d.liveAccounts[b] = { bank:0, cash:0, other:0 };
  });
  if(!Array.isArray(d.customers)) d.customers = [];
  if(!Array.isArray(d.txs)) d.txs = [];
  if(!Array.isArray(d.users) || !d.users.length) d.users = defaultUsers();
  if(!d.lastBaseDate) d.lastBaseDate = todayStr();
  if(!d.__lastRolloverDate) d.__lastRolloverDate = d.lastBaseDate;
  if(!d.dailyClose) d.dailyClose = {};
  if(!d.yearlyArchive) d.yearlyArchive = {};
  if(!d.txEditLog) d.txEditLog = [];
  if(!d.deletedTxIds) d.deletedTxIds = {};
  if(typeof d.totalCapital !== 'number') d.totalCapital = 0;
  if(!d.branchCapital || typeof d.branchCapital !== 'object') d.branchCapital = {};
  Object.keys(BRANCHES).forEach(b=>{ if(typeof d.branchCapital[b] !== 'number') d.branchCapital[b] = 0; });
  d.totalCapital = Object.values(d.branchCapital).reduce((s,v)=> s + (Number(v)||0), 0);
  (d.txs||[]).forEach(t=>{
    if(!t.custBranch) t.custBranch = t.branch || 'kalaroa';
    if(!t.year && t.date) t.year = t.date.slice(0,4);
  });
  (d.users||[]).forEach(u=>{ if(u.password && !u.__hashed){ u.password = hashPassword(u.password); u.__hashed = true; } });
}

/* ═══ SUPABASE SYNC ═══ */
let __supabaseClient = null;
let __remoteSaveTimer = null;
let __isRemoteReady = false;

let __realtimeChannel = null;
let __realtimeStatus = 'offline';
let __isApplyingRemote = false;

function initSupabase(){
  try{
    if(typeof window.supabase === 'undefined' || !window.supabase.createClient){
      console.warn('[Supabase] library not loaded — local-only mode');
      updateRealtimeIndicator('offline');
      return;
    }
    if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) return;
    __supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    __isRemoteReady = true;
    console.log('[Supabase] client initialized');
    const ind = document.getElementById('syncIndicator');
    if(ind){ ind.textContent = 'Cloud ✓'; ind.classList.add('active'); setTimeout(()=>{ ind.classList.remove('active'); ind.textContent = 'Sync'; }, 2000); }
    pullRemoteDB().catch(err => console.warn('[Supabase] initial pull failed:', err.message));
    // ⚡ Realtime চ্যানেল চালু
    setupRealtime();
  }catch(e){
    console.warn('[Supabase] init failed:', e.message);
    __supabaseClient = null;
    __isRemoteReady = false;
    updateRealtimeIndicator('error');
  }
}

/* ═══ REALTIME SETUP ═══ */
function setupRealtime(){
  if(!__isRemoteReady || !__supabaseClient) return;
  try{
    if(__realtimeChannel){ __supabaseClient.removeChannel(__realtimeChannel); __realtimeChannel = null; }
    updateRealtimeIndicator('connecting');
    __realtimeChannel = __supabaseClient
      .channel('agent_bank_rt_' + window.SUPABASE_ROW_ID, { config: { presence: { key: (session?.id || 'anon_' + Date.now()) } } })
      .on('postgres_changes',
        { event: '*', schema: 'public', table: window.SUPABASE_TABLE, filter: 'id=eq.' + window.SUPABASE_ROW_ID },
        (payload) => { handleRealtimeUpdate(payload); }
      )
      .on('presence', { event: 'sync' }, () => {
        try{
          const state = __realtimeChannel.presenceState();
          const flat = Object.values(state).flat();
          updatePresenceUI(flat);
        }catch(e){}
      })
      .subscribe(async (status) => {
        console.log('[Realtime]', status);
        if(status === 'SUBSCRIBED'){
          updateRealtimeIndicator('online');
          try{
            await __realtimeChannel.track({
              user: (session?.name) || 'Anonymous',
              username: (session?.username) || '',
              branch: (session?.branch) || 'all',
              role: (session?.role) || '',
              joined_at: new Date().toISOString()
            });
          }catch(e){}
        } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){
          updateRealtimeIndicator('error');
          setTimeout(() => { try{ setupRealtime(); }catch(e){} }, 5000);
        } else if(status === 'CLOSED'){
          updateRealtimeIndicator('offline');
        }
      });
  }catch(e){
    console.warn('[Realtime] setup error:', e.message);
    updateRealtimeIndicator('error');
  }
}

/* ═══ REALTIME UPDATE HANDLER ═══ */
function handleRealtimeUpdate(payload){
  try{
    if(__isApplyingRemote) return;
    if(!payload || payload.eventType === 'DELETE') return;
    const remote = payload.new && payload.new.data;
    if(!remote || typeof remote !== 'object') return;

    const remoteTs = Date.parse(remote.__lastUpdate || 0) || 0;
    const localTs  = Date.parse((DB() && DB().__lastUpdate) || 0) || 0;

    if(remoteTs <= localTs){
      console.log('[Realtime] local is newer/equal — skip');
      return;
    }

    console.log('[Realtime] applying remote update @', remote.__lastUpdate);
    __isApplyingRemote = true;

    // দৃশ্যাবস্থা মনে রাখুন
    const prevWasDateView = isDateViewMode;
    const prevDashDate = dashDate;
    const prevViewBranch = viewBranch;

    window.db = remote;
    normalizeDB();
    forceFixAdmin();
    recalcAllCustomerDues(false);
    recomputeLive();
    saveLocalDB();

    // পুনঃস্থাপন
    dashDate = prevWasDateView ? prevDashDate : todayStr();
    viewBranch = (session && session.role === 'admin') ? prevViewBranch : viewBranch;

    if(session){
      renderTopbar();
      renderDashboard();
      renderSidebar();
    }

    showRTToast('🔄 অন্য ডিভাইস থেকে আপডেট এসেছে', false);
    __isApplyingRemote = false;
  }catch(e){
    console.error('[Realtime] handler error:', e);
    __isApplyingRemote = false;
  }
}

async function pullRemoteDB(){
  if(!__isRemoteReady || !__supabaseClient) return;
  const res = await withTimeout(
    __supabaseClient.from(window.SUPABASE_TABLE).select('data').eq('id', window.SUPABASE_ROW_ID).maybeSingle(),
    SUPABASE_TIMEOUT_MS,
    { data: null, error: { message: 'timeout' } }
  );
  if(res && res.data && res.data.data && typeof res.data.data === 'object'){
    const remote = res.data.data;
    const localTs = Date.parse((DB() && DB().__lastUpdate) || 0) || 0;
    const remoteTs = Date.parse(remote.__lastUpdate || 0) || 0;
    if(remoteTs > localTs){
      console.log('[Supabase] remote is newer, adopting');
      window.db = remote;
      normalizeDB();
      forceFixAdmin();
      recalcAllCustomerDues(false);
      recomputeLive();
      saveLocalDB();
    }
  }
}
function queueRemoteSave(){
  if(!__isRemoteReady || !__supabaseClient) return;
  if(__remoteSaveTimer) clearTimeout(__remoteSaveTimer);
  __remoteSaveTimer = setTimeout(pushRemoteDB, 800);
}
async function pushRemoteDB(){
  if(!__isRemoteReady || !__supabaseClient) return;
  if(__isApplyingRemote) return; // রিমোট আপডেট থেকে echo প্রতিরোধ
  try{
    const payload = { id: window.SUPABASE_ROW_ID, data: DB(), updated_at: new Date().toISOString() };
    const res = await withTimeout(
      __supabaseClient.from(window.SUPABASE_TABLE).upsert(payload, { onConflict: 'id' }),
      SUPABASE_TIMEOUT_MS,
      { error: { message: 'timeout' } }
    );
    const ind = document.getElementById('syncIndicator');
    if(ind && (!res || !res.error)){ ind.classList.add('active'); ind.textContent = 'Synced ✓'; setTimeout(()=>{ ind.classList.remove('active'); ind.textContent = 'Sync'; }, 1500); }
  }catch(e){
    console.warn('[Supabase] push failed:', e.message);
  }
}

async function saveDB(){
  if(__savePending){ __saveAgain = true; return; }
  __savePending = true;
  try{
    if(!DB()){ __savePending = false; return; }
    DB().__lastUpdate = new Date().toISOString();
    DB().__version = APP_VERSION;
    if(DB().branchCapital) DB().totalCapital = Object.values(DB().branchCapital).reduce((s,v)=> s + (Number(v)||0), 0);
    saveLocalDB();
    queueRemoteSave();
  } finally {
    __savePending = false;
    if(__saveAgain){ __saveAgain = false; setTimeout(saveDB, 50); }
  }
}
function performDailyRollover(force){
  const today = todayStr();
  if(!force && DB().__lastRolloverDate === today) return false;
  if(!DB().yearlyArchive) DB().yearlyArchive = {};
  (DB().txs||[]).forEach(t => { if(!t.year && t.date) t.year = t.date.slice(0,4); });
  const currentYear = new Date().getFullYear();
  const keep = [];
  (DB().txs||[]).forEach(t => {
    const ty = parseInt((t.date||'').slice(0,4),10);
    if(!isNaN(ty) && (currentYear - ty) >= ARCHIVE_YEARS_AFTER){
      const y = String(ty); if(!DB().yearlyArchive[y]) DB().yearlyArchive[y] = [];
      DB().yearlyArchive[y].push(t);
    } else keep.push(t);
  });
  DB().txs = keep;
  DB().lastBaseDate = today;
  DB().__lastRolloverDate = today;
  return true;
}
function recomputeLive(){
  const d = DB();
  Object.keys(BRANCHES).forEach(b=>{
    d.liveVault[b] = {};
    DENOMS.forEach(x => d.liveVault[b][x] = Number(d.baseVault[b][x]) || 0);
    d.liveAccounts[b] = { bank: Number(d.baseAccounts[b].bank) || 0, cash: Number(d.baseAccounts[b].cash) || 0, other: Number(d.baseAccounts[b].other) || 0 };
  });
  const sorted = getAllTxs().slice().sort((a,b)=> (a.createdAt || a.date || '').localeCompare(b.createdAt || b.date || ''));
  sorted.forEach(tx=>{
    if(tx.type === 'branch_transfer'){ applyTxToLive(tx, 'send'); if(tx.accepted) applyTxToLive(tx, 'accept'); }
    else applyTxToLive(tx);
  });
  syncLiveCashFromVault();
}
function applyTxToLive(tx, phase){
  const d = DB();
  const bb = tx.branch || 'kalaroa';
  const vb = tx.custBranch || tx.branch || 'kalaroa';
  const ensure = br => { if(!br) return; if(!d.liveAccounts[br]) d.liveAccounts[br] = { bank:0, cash:0, other:0 }; if(!d.liveVault[br]) d.liveVault[br] = {}; DENOMS.forEach(x=>{ if(typeof d.liveVault[br][x] !== 'number') d.liveVault[br][x] = 0; }); };
  ensure(bb); ensure(vb);
  const amt = Number(tx.amount) || 0;
  const nIn = tx.notesIn || {}, nOut = tx.notesOut || {};
  switch(tx.type){
    case 'loan_given':
      if(tx.cashNotTaken){ d.liveAccounts[bb].bank += amt; }
      else if(tx.onlineTransfer && (Number(tx.onlineAmount)||0) > 0){
        const onlineAmt = Number(tx.onlineAmount) || 0;
        const cashAmt = Number(tx.cashAmount) || (amt - onlineAmt);
        d.liveAccounts[bb].bank -= onlineAmt; d.liveAccounts[bb].bank += cashAmt;
        adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1);
      } else {
        d.liveAccounts[bb].bank += amt;
        adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1);
      }
      break;
    case 'loan_collection':
      if(tx.collectionMode === 'cash'){ adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      else d.liveAccounts[bb].bank -= amt;
      break;
    case 'loan_received': d.liveAccounts[bb].bank -= amt; adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); break;
    case 'deposit': d.liveAccounts[bb].bank -= amt; adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); break;
    case 'withdrawal': d.liveAccounts[bb].bank += amt; adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); break;
    case 'expense': adjustNotes(d.liveVault[bb], nOut, -1); adjustNotes(d.liveVault[bb], nIn, +1); break;
    case 'branch_transfer': {
      const from = tx.from, to = tx.to;
      if(!from || !to || from === to) break;
      ensure(from); ensure(to);
      const transferNotes = (nOut && Object.keys(nOut).length > 0) ? nOut : nIn;
      if(!transferNotes || !Object.keys(transferNotes).length) break;
      if(phase === 'send') adjustNotes(d.liveVault[from], transferNotes, -1);
      else if(phase === 'accept') adjustNotes(d.liveVault[to], transferNotes, +1);
      break;
    }
    case 'bank_transfer':
      if(tx.dir === 'in') d.liveAccounts[bb].bank += amt;
      else if(tx.dir === 'out') d.liveAccounts[bb].bank -= amt;
      break;
    case 'other_bank':
      if(tx.dir === 'online_in') d.liveAccounts[bb].bank += amt;
      else if(tx.dir === 'online_out') d.liveAccounts[bb].bank -= amt;
      else if(tx.dir === 'in'){ d.liveAccounts[bb].bank += amt; adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); }
      else { d.liveAccounts[bb].bank -= amt; adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      break;
    case 'support':
      if(tx.dir === 'online_support_out') d.liveAccounts[bb].bank -= amt;
      else if(tx.dir === 'online_support_in') d.liveAccounts[bb].bank += amt;
      else if(tx.dir === 'out'){ adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      else { adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); }
      break;
    case 'money_exchange': adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); break;
  }
}

function calculateCustomerDue(accountNo){
  const res = { paid:0, refund:0, net:0, count:0 };
  if(!accountNo) return res;

    if(t.dir === 'out' || t.dir === 'online_support_out') res.paid += amt;
    else if(t.dir === 'in' || t.dir === 'online_support_in') res.refund += amt;
  });
  res.paid = Math.round(res.paid*100)/100; res.refund = Math.round(res.refund*100)/100;
  res.net = Math.round((res.paid - res.refund)*100)/100;
  return res;
}
function recalcAllCustomerDues(save){

  getAllTxs().forEach(t => {

    if(t.dir === 'out' || t.dir === 'online_support_out') map[acc].paid += amt;
    else if(t.dir === 'in' || t.dir === 'online_support_in') map[acc].refund += amt;

function getPendingCollections(){

    if(t.type !== 'loan_given' || !t.cashNotTaken || t.collectionStatus === 'collected') return;
    const totalOwed = Number(t.cashNotTakenAmount) || Number(t.amount) || 0;

    const pending = totalOwed - collected;
    if(pending <= 0.01) return;
    result.push({ ...t, _pending: Math.round(pending*100)/100, _owed: totalOwed, _collected: collected });
  });
  result.sort((a,b)=> (a.date||'').localeCompare(b.date||''));

}

function computeStats(bf, date){
  const r = { loan_given:{amt:0,cnt:0}, loan_received:{amt:0,cnt:0}, deposit:{amt:0,cnt:0}, withdrawal:{amt:0,cnt:0},
    transfer:{in:0,out:0,cnt:0}, expense:{amt:0,cnt:0}, other:{in:0,out:0,onlineIn:0,onlineOut:0},
    support:{in:0,out:0,cnt:0}, money_exchange:{in:0,out:0,cnt:0}, bank_transfer:{in:0,out:0,cnt:0} };
  getAllTxs().forEach(t=>{
    const ok = (bf === 'all') || (t.branch === bf) || (t.type === 'branch_transfer' && (t.from === bf || t.to === bf));
    if(!ok) return;
    if(t.type === 'branch_transfer'){
      const accepted = !!t.accepted, sd = t.date || '', ad = t.acceptedDate || '';
      const isS = (t.from === bf), isR = (t.to === bf);
      if(!accepted){ if(bf === 'all'){ r.transfer.out += t.amount; if(!date || sd === date) r.transfer.cnt++; } else { if(isS){ r.transfer.out += t.amount; if(!date || sd === date) r.transfer.cnt++; } } return; }
      if(bf === 'all'){ if(!date || ad === date){ r.transfer.in += t.amount; r.transfer.out += t.amount; r.transfer.cnt++; } }
      else { if(isS){ if(!date || sd === date){ r.transfer.out += t.amount; r.transfer.cnt++; } } if(isR){ if(!date || ad === date){ r.transfer.in += t.amount; if(!isS) r.transfer.cnt++; } } }
      return;
    }
    if(date && t.date !== date) return;
    switch(t.type){
      case 'loan_given': r.loan_given.amt += t.amount; r.loan_given.cnt++; break;
      case 'loan_received': r.loan_received.amt += t.amount; r.loan_received.cnt++; break;
      case 'deposit': r.deposit.amt += t.amount; r.deposit.cnt++; break;
      case 'withdrawal': r.withdrawal.amt += t.amount; r.withdrawal.cnt++; break;
      case 'expense': r.expense.amt += t.amount; r.expense.cnt++; break;
      case 'bank_transfer': if(t.dir === 'in') r.bank_transfer.in += t.amount; else r.bank_transfer.out += t.amount; r.bank_transfer.cnt++; break;
      case 'other_bank':
        if(t.dir === 'in') r.other.in += t.amount; else if(t.dir === 'online_in') r.other.onlineIn += t.amount;
        else if(t.dir === 'out') r.other.out += t.amount; else if(t.dir === 'online_out') r.other.onlineOut += t.amount;
        break;
      case 'support': if(t.dir === 'online_support_out' || t.dir === 'out') r.support.out += t.amount; else r.support.in += t.amount; r.support.cnt++; break;
      case 'money_exchange': r.money_exchange.out += Number(t.notesOutSum)||0; r.money_exchange.in += Number(t.notesInSum)||0; r.money_exchange.cnt++; break;
    }
  });
  return r;
}

function renderVault(bf){
  if(!BRANCHES[bf] && bf !== 'all') bf = session?.branch || 'kalaroa';
  const sl = bf === 'all' ? 'উভয় শাখা' : (BRANCHES[bf]?.name || bf);
  const v = getVaultForDate(dashDate, bf);
  const totals = v.totals;
  const items = DENOMS.map(d => {
    const c = Number(totals[d]) || 0, amt = c * d, empty = c === 0;
    return '<div class="vault-item" style="' + (empty ? 'opacity:0.35;filter:grayscale(.6);' : '') + '"><div class="d" style="' + (empty ? 'color:#666;' : '') + '">৳ ' + toBn(d) + '</div><div class="c" style="' + (empty ? 'color:#4a5680;' : '') + '">' + toBn(c) + '<span style="font-size:13px;color:' + (empty ? '#4a5680' : '#a5b4d8') + ';font-weight:600;margin-left:4px">টি</span></div><div style="font-size:12.5px;color:' + (empty ? '#4a5680' : '#facc15') + ';font-weight:800;margin-top:6px;padding-top:5px;border-top:1px dashed rgba(255,255,255,.1)">= ৳ ' + fmt(amt) + '</div></div>';
  }).join('');
  const totalAmt = DENOMS.reduce((s,d)=> s + d*totals[d], 0);
  const totalNotes = DENOMS.reduce((s,d)=> s + totals[d], 0);
  $('#vaultSection').innerHTML = '<div class="section-title"><span class="bar"></span> 🗄️ ভল্ট নোট ইনভেন্টরি — ' + esc(sl) + '<span class="auto-badge" style="margin-left:auto">⚡ লাইভ</span></div>' +
    '<div class="vault-box"><div class="vault-row">' + items + '</div>' +
      '<div class="vault-total"><span>মোট নোট: <b style="color:#fff">' + toBn(totalNotes) + '</b> টি</span><span>মোট মান: <b style="color:#fff;font-size:19px">৳ ' + fmt(totalAmt) + '</b></span></div>' +
    '</div>';
}

function handleCardClick(type){
  try{
    if(type === 'loan_given'){
      const p = getPendingCountByType('loan_given');
      if(p > 0){ openAllPendingModal(); return; }
    }
    if(type === 'branch_transfer'){
      const p = getPendingCountByType('branch_transfer');
      if(p > 0){ openAllPendingModal(); return; }
    }
    openTxModal(type);
  }catch(err){ console.error('handleCardClick error:', err); toast('❌ Error: ' + err.message); }
}

  if(pending.totalCount === 0){ box.innerHTML = ''; return; }
  const tc = pending.transfers.length, cc = pending.collections.length;
  const ta = pending.transfers.reduce((s,t)=> s + (Number(t.amount)||0), 0);
  const ca = pending.collections.reduce((s,t)=> s + (t._pending||0), 0);
  box.innerHTML = '<div class="section-title"><span class="bar"></span> ⏳ অপেক্ষমাণ<span class="badge pending" style="margin-left:auto">' + toBn(pending.totalCount) + ' টি • ৳ ' + fmt(pending.totalAmount) + '</span></div>' +

function renderPendingCollections(){
  const box = document.getElementById('pendingCollectionsSection');
  if(!box) return;
  if(!session){ box.innerHTML = ''; return; }
  const pending = getPendingCollections();
  const bf = currentBranchFilter();
  const sc = bf === 'all' ? pending : pending.filter(t => t.branch === bf);
  if(!sc.length){ box.innerHTML = ''; return; }
  const total = sc.reduce((s,t)=> s + t._pending, 0);
  box.innerHTML = '<div class="section-title"><span class="bar"></span> ⏳ অপেক্ষমাণ ঋণ সংগ্রহ<span class="badge due" style="margin-left:auto">' + toBn(sc.length) + ' জন • ৳ ' + fmt(total) + '</span></div>' +

    '</div></div>';

function renderDueSection(){
  const box = document.getElementById('dueSection');
  if(!box) return;
  const bf = currentBranchFilter();
  const all = DB().customers || [];
  const sc = bf === 'all' ? all : all.filter(c => c.branch === bf);
  const due = sc.filter(c => (c.supportDue||0) > 0).sort((a,b)=> (b.supportDue||0)-(a.supportDue||0));
  const total = due.reduce((s,c)=> s + (c.supportDue||0), 0);
  if(!due.length){ box.innerHTML = '<div class="section-title"><span class="bar"></span> ⚠️ বকেয়া তালিকা<span class="auto-badge" style="margin-left:auto">✅ সব পরিশোধিত</span></div><div class="vault-box" style="text-align:center;padding:22px;color:#a5b4d8">🎉 কোনো বকেয়া নেই।</div>'; return; }
  box.innerHTML = '<div class="section-title"><span class="bar"></span> ⚠️ বকেয়া তালিকা<span class="badge due" style="margin-left:auto">' + toBn(due.length) + ' জন • ৳ ' + fmt(total) + '</span></div>' +
    '<div class="vault-box" style="padding:0"><div class="table-wrap" style="border:none"><table class="tbl"><thead><tr><th>#</th><th>গ্রাহক</th><th>অ্যাকাউন্ট</th><th>শাখা</th><th>বকেয়া</th><th>অ্যাকশন</th></tr></thead><tbody>' +
      due.map((c,i)=>'<tr class="cust-row has-due clickable-row" data-cust-acc="' + esc(c.accountNo) + '" data-cust-name="' + esc(c.name) + '"><td>' + toBn(i+1) + '</td><td><b>' + esc(c.name||'-') + '</b></td><td>' + esc(c.accountNo||'-') + '</td><td>' + esc(BRANCHES[c.branch]?.name||'-') + '</td><td><span class="badge due">৳ ' + fmt(c.supportDue||0) + '</span></td><td><button class="mini show" data-due-show="' + esc(c.accountNo) + '">⚠️ দেখুন</button></td></tr>').join('') +
    '</tbody></table></div></div>';
  box.querySelectorAll('tr[data-cust-acc]').forEach(el => {
    el.addEventListener('click', (e) => {
      if(e.target.closest('button[data-due-show]')){ const acc = e.target.dataset.dueShow; const c = DB().customers.find(x=>x.accountNo===acc); if(c) openCustomerDetailPopup(c.accountNo, c.name); return; }
      const acc = el.dataset.custAcc;
      if(acc) openCustomerDetailPopup(acc, el.dataset.custName);
    });
  });
}

  const bf = currentBranchFilter();
  let transfers = p.transfers, collections = p.collections;
  if(bf !== 'all'){ transfers = transfers.filter(t => t.to === bf); collections = collections.filter(t => t.branch === bf); }
  const trAmt = transfers.reduce((s,t)=> s + (Number(t.amount)||0), 0);
  const coAmt = collections.reduce((s,t)=> s + t._pending, 0);

  const trRows = transfers.map(t => '<tr>' +
    '<td>' + toBn(t.date) + '</td>' +
    '<td>' + esc(BRANCHES[t.from]?.name||'') + ' ➜ <b style="color:#4ade80">' + esc(BRANCHES[t.to]?.name||'') + '</b></td>' +
    '<td>' + noteListInline(t.notesOut || t.notesIn) +

  const coRows = collections.map(c => '<tr><td>' + toBn(c.date) + '</td><td>👤 <b style="color:#4ade80">' + esc(c.custName||'-') + '</b><br><small>' + esc(c.custAcc||'') + '</small></td><td class="amt" style="color:#facc15">৳ ' + fmt(c._pending) + '</td><td>' + esc(BRANCHES[c.branch]?.name||'') + '</td><td style="white-space:nowrap"><button class="mini cash-btn" data-cash="' + esc(c.id) + '">💵</button> <button class="mini online-btn" data-online="' + esc(c.id) + '">🌐</button></td></tr>').join('');

        '<div><div style="color:#facc15;font-size:12px;font-weight:700">💰 ঋণ সংগ্রহ</div><div style="font-size:20px;font-weight:900;color:#fff">' + toBn(collections.length) + ' টি</div><div style="font-size:13px;color:#facc15">৳ ' + fmt(coAmt) + '</div></div>' +
        '<div><div style="color:#a5b4d8;font-size:12px;font-weight:700">📊 সর্বমোট</div><div style="font-size:20px;font-weight:900;color:#fff">' + toBn(p.totalCount) + ' টি</div><div style="font-size:13px;color:#4ade80">৳ ' + fmt(p.totalAmount) + '</div></div>' +
      '</div></div>' +
      (transfers.length ? '<div class="section-title" style="margin-top:10px"><span class="bar"></span> 🔁 শাখা ট্রান্সফার</div><div class="table-wrap"><table class="tbl"><thead><tr><th>তারিখ</th><th>From ➜ To</th><th>নোট</th><th>টাকা</th><th>ইউজার</th><th>অ্যাকশন</th></tr></thead><tbody>' + trRows + '</tbody></table></div>' : '') +

    onMount: (w, close) => {
      w.querySelectorAll('[data-acc]').forEach(b => b.addEventListener('click', async ()=>{ await receiveTransferDirect(b.dataset.acc); close(); }));

function dirOptions(type, cur){
  if(type === 'bank_transfer') return '<option value="in" ' + (cur==='in'?'selected':'') + '>📥 আসা</option><option value="out" ' + (cur==='out'?'selected':'') + '>📤 পাঠানো</option>';

function notesRowHTML(prefix, values){

function setupTransferForm(wrap, editing, close){
  const so = wrap.querySelector('#sumOut'), si = wrap.querySelector('#sumIn'), ne = wrap.querySelector('#netAmt');
  wrap.querySelectorAll('.note-item input').forEach(inp => attachAmountInput(inp, { decimal: false }));
  function recalc(){
    const on = readNotes(wrap, 'out');
    wrap.querySelectorAll('[id^="in_"]').forEach(inp => { const v = on[inp.dataset.denom] || 0; if(inp.dataset.touched !== 'true') inp.value = v > 0 ? v : ''; });
    const inN = readNotes(wrap, 'in');
    const os = noteSum(on), is = noteSum(inN);
    if(so) so.textContent = '৳ ' + fmt(os);
    if(si) si.textContent = '৳ ' + fmt(is);
    if(ne) ne.textContent = '৳ ' + fmt(Math.max(os, is));
    const wb = wrap.querySelector('#noteAvailabilityWarning');
    if(wb){
      const fb = wrap.querySelector('#f_from')?.value || 'kalaroa';
      const vault = DB().liveVault?.[fb] || {};
      const iss = [];
      Object.keys(on).forEach(d => { const n = Number(on[d]) || 0, h = Number(vault[d]) || 0; if(n > h) iss.push({ d, n, h }); });
      if(iss.length > 0){ wb.innerHTML = '<div style="padding:10px 14px;border-radius:10px;background:rgba(220,38,38,.15);border:1.5px solid rgba(220,38,38,.5);font-size:13px;color:#f87171;font-weight:700">⚠️ কম: ' + iss.map(it => '৳' + it.d + '×' + it.n + '(আছে ' + it.h + ')').join(' • ') + '</div>'; wb.style.display = 'block'; }
      else { wb.innerHTML = ''; wb.style.display = 'none'; }
    }
  }
  wrap.querySelectorAll('.note-item input').forEach(i => { i.addEventListener('focus', ()=>{ if(i.id.startsWith('in_')) i.dataset.touched = 'true'; }); i.addEventListener('input', recalc); });
  recalc();
  const area = wrap.querySelector('#modalHistoryArea');
  const allTx = getAllBranchTransfers().slice(0, 15);
  area.innerHTML = '<div class="modal-history"><div class="modal-history-title"><span class="bar"></span> 📋 সম্প্রতি (' + toBn(allTx.length) + ')</div>' +
    (allTx.length ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>সময়</th><th>From ➜ To</th><th>টাকা</th><th>স্ট্যাটাস</th><th>ইউজার</th></tr></thead><tbody>' + allTx.map(t=>'<tr><td style="font-size:12px">' + esc(fmtDateTime(t.createdAt)) + '</td><td>' + esc(BRANCHES[t.from]?.name||'') + ' ➜ <b style="color:#4ade80">' + esc(BRANCHES[t.to]?.name||'') + '</b></td><td class="amt">৳ ' + fmt(t.amount) + '</td><td>' + (t.accepted ? '<span class="badge accepted">✅</span>' : '<span class="badge pending">⏳</span>') + '</td><td>' + esc(t.user||'-') + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">📭 নেই</div>') + '</div>';
  function renderPending(){
    const box = wrap.querySelector('#pendingArea'); if(!box) return;
    const bf = currentBranchFilter();
    const myB = session.role === 'admin' ? (bf === 'all' ? null : bf) : session.branch;
    let pending = DB().txs.filter(t=> t.type === 'branch_transfer' && !t.accepted);
    if(myB) pending = pending.filter(t=> t.to === myB);
    if(!pending.length){ box.innerHTML = '<div class="pending-box"><h4>⏳ অপেক্ষমাণ</h4><div class="pending-empty">নেই ✅</div></div>'; return; }
    box.innerHTML = '<div class="pending-box"><h4>⏳ (' + toBn(pending.length) + ')</h4>' + pending.map(t=>'<div class="pending-item"><div class="info"><b>' + esc(BRANCHES[t.from]?.name||t.from) + '</b> ➜ <b>' + esc(BRANCHES[t.to]?.name||t.to) + '</b><small>' + toBn(t.date) + ' • ৳ ' + fmt(t.amount) + '</small></div><button class="mini accept" data-acc="' + t.id + '">✅ গ্রহণ</button></div>').join('') + '</div>';
    box.querySelectorAll('[data-acc]').forEach(b => b.addEventListener('click', async ()=>{ await receiveTransferDirect(b.dataset.acc); close(); }));
  }
  renderPending();
  wrap.querySelector('#f_close').addEventListener('click', close);
  wrap.querySelector('#f_save').addEventListener('click', async ()=>{
    const sBtn = wrap.querySelector('#f_save'); if(sBtn.disabled) return;
    sBtn.disabled = true; const orig = sBtn.innerHTML; sBtn.innerHTML = '<span class="spinner"></span>';
    try{
      const date = wrap.querySelector('#f_date').value || todayStr();
      const from = wrap.querySelector('#f_from').value, to = wrap.querySelector('#f_to').value;
      const note = wrap.querySelector('#f_note').value.trim();
      if(from === to){ alert('একই শাখা নয়'); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      const on = readNotes(wrap, 'out'), inN = readNotes(wrap, 'in');
      const os = noteSum(on), is = noteSum(inN);
      if(os <= 0 && is <= 0){ alert('নোট দিন'); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      const vault = DB().liveVault?.[from] || {};
      const miss = [];
      Object.keys(on).forEach(d => { const n = Number(on[d]) || 0, h = Number(vault[d]) || 0; if(n > h) miss.push({ d, n, h }); });
      if(miss.length > 0 && !editing){ alert('⚠️ কম:\n' + miss.map(m => '৳' + m.d + ' — দরকার ' + m.n + ', আছে ' + m.h).join('\n')); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      const amt = Math.max(os, is);
      const tx = { id: editing ? editing.id : uid(), type: 'branch_transfer', date, branch: from, custBranch: from, from, to, dir: 'out', amount: Math.round(amt*100)/100, notesOut: on, notesIn: inN, note: note || (BRANCHES[from].name + ' ➜ ' + BRANCHES[to].name), user: session.name, userUsername: session.username, createdAt: editing ? editing.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString(), year: date.slice(0,4), accepted: false, acceptedDate: null };
      if(!editing){ DB().txs.push(tx); }
      else { const i = DB().txs.findIndex(x => x.id === editing.id); if(i >= 0) DB().txs[i] = tx; }
      recomputeLive(); await saveDB();
      close(); renderDashboard(); renderTopbar(); renderSidebar();
      toast('✅ পাঠানো — ৳ ' + fmt(amt));
    }catch(e){ alert('❌ ' + e.message); sBtn.disabled = false; sBtn.innerHTML = orig; }
  });
}

function setupTxForm(wrap, type, editing, close, activeBranchForForm){
  const cfg = TX_CFG[type];
  const so = wrap.querySelector('#sumOut'), si = wrap.querySelector('#sumIn'), ne = wrap.querySelector('#netAmt');

  const cAmt = wrap.querySelector('#f_cashNotTakenAmount');

  const isOn = () => { const d = wrap.querySelector('#f_dir')?.value; return d === 'online_in' || d === 'online_out'; };
  wrap.querySelectorAll('.note-item input').forEach(inp => attachAmountInput(inp, { decimal: false }));
  wrap.querySelectorAll('input[type="text"][inputmode="decimal"]').forEach(inp => attachAmountInput(inp, { decimal: true }));
  function refreshCT(){ if(!cTick) return; if(cInfo) cInfo.style.display = cTick.checked ? 'block' : 'none'; recalc(); }
  if(cTick) cTick.addEventListener('change', refreshCT);
  refreshCT();
  if(isLG){
    const tickEl = wrap.querySelector('#f_onlineTransferTick');
    const dBox = wrap.querySelector('#onlineTransferDetails');
    const bnI = wrap.querySelector('#f_onlineBankName');
    function refresh(){ if(tickEl) dBox.style.display = tickEl.checked ? 'block' : 'none'; }
    refresh();
    if(tickEl) tickEl.addEventListener('change', refresh);
    wrap.querySelectorAll('[data-bank-quick]').forEach(b => b.addEventListener('click', ()=>{ if(bnI) bnI.value = b.dataset.bankQuick; }));
  }
  if(hasBT){
    wrap.querySelectorAll('.branch-toggle-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ wrap.querySelectorAll('.branch-toggle-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); wrap.querySelector('#f_custBranch_hidden').value = btn.dataset.bbranch; });
    });
  }
  if(hasDir){
    const dirEl = wrap.querySelector('#f_dir');
    function applyDir(){
      const d = dirEl.value;
      const nc = wrap.querySelector('#notesCols'), ob = wrap.querySelector('#onlineBox'), osb = wrap.querySelector('#onlineSupportBox');
      const isOSv = d === 'online_support_out' || d === 'online_support_in';
      const isOv = d === 'online_in' || d === 'online_out';
      if(nc) nc.style.display = (isOSv || isOv) ? 'none' : 'grid';
      if(ob) ob.classList.toggle('active', isOv);
      if(osb) osb.classList.toggle('active', isOSv);
      recalc();
    }
    dirEl.addEventListener('change', applyDir);
    applyDir();
  }
  function recalc(){
    if(isBO){ const v = parseNum(wrap.querySelector('#bt_amount')?.value); if(ne) ne.textContent = '৳ ' + fmt(v); return; }
    if(isLG && cTick?.checked){ const v = parseNum(cAmt?.value); if(ne) ne.textContent = '৳ ' + fmt(v); updateWarn(); return; }
    const on = readNotes(wrap, 'out'), inN = readNotes(wrap, 'in');
    const os = noteSum(on), is = noteSum(inN);
    if(so) so.textContent = '৳ ' + fmt(os);
    if(si) si.textContent = '৳ ' + fmt(is);
    if(isOS()){ const v = parseNum(wrap.querySelector('#support_amount')?.value); if(ne) ne.textContent = '৳ ' + fmt(v); }
    else if(isOn()){ const v = parseNum(wrap.querySelector('#online_amount')?.value); if(ne) ne.textContent = '৳ ' + fmt(v); }
    else { if(ne) ne.textContent = '৳ ' + fmt(Math.abs(os - is)); }
    let html = '';
    if(Object.keys(on).length) html += '<div style="margin-bottom:6px"><b style="color:#fff">📤</b> ' + noteDetailHTML(on) + '</div>';
    if(Object.keys(inN).length) html += '<div><b style="color:#fff">📥</b> ' + noteDetailHTML(inN) + '</div>';
    if(nb) nb.innerHTML = html || '—';
    updateWarn();
  }
  function updateWarn(){
    const wb = wrap.querySelector('#noteAvailabilityWarning'); if(!wb) return;
    let vb = 'kalaroa';
    if(wrap.querySelector('#f_custBranch_hidden')) vb = wrap.querySelector('#f_custBranch_hidden').value || 'kalaroa';
    else if(wrap.querySelector('#f_branch')) vb = wrap.querySelector('#f_branch').value || 'kalaroa';
    const vault = DB().liveVault?.[vb] || {};
    const on = readNotes(wrap, 'out');
    const iss = [];
    Object.keys(on).forEach(d => { const n = Number(on[d]) || 0, h = Number(vault[d]) || 0; if(n > h) iss.push({ d, n, h }); });
    if(iss.length > 0){ wb.innerHTML = '<div style="padding:10px 14px;border-radius:10px;background:rgba(220,38,38,.15);border:1.5px solid rgba(220,38,38,.5);font-size:13px;color:#f87171;font-weight:700">⚠️ কম: ' + iss.map(it => '৳' + it.d + '×' + it.n + '(আছে ' + it.h + ')').join(' • ') + '</div>'; wb.style.display = 'block'; }
    else { wb.innerHTML = ''; wb.style.display = 'none'; }
  }
  wrap.querySelectorAll('.note-item input').forEach(i => i.addEventListener('input', recalc));
  recalc();
  const area = wrap.querySelector('#modalHistoryArea');
  if(area){
    let list = getAllTxs().filter(t => t.type === type).sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
    const disp = list.slice(0, 15);
    area.innerHTML = '<div class="modal-history"><div class="modal-history-title"><span class="bar"></span> 📋 সম্প্রতি (' + toBn(list.length) + ')</div>' +
      (disp.length ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>সময়</th><th>গ্রাহক</th><th>শাখা</th><th>টাকা</th><th>ইউজার</th></tr></thead><tbody>' + disp.map(t=>{
        const cn = t.custName || '-', ca = t.custAcc || '', cl = !!ca;
        return '<tr class="' + (cl?'clickable-row':'') + '" ' + (cl ? 'data-cust-acc="' + esc(ca) + '" data-cust-name="' + esc(cn) + '"' : '') + '><td style="font-size:12px">' + esc(fmtDateTime(t.createdAt)) + '</td><td>' + (cl ? '👤 <b style="color:#4ade80">' + esc(cn) + '</b><br><small>' + esc(ca) + '</small>' : '—') + '</td><td style="font-size:12.5px">' + esc(BRANCHES[t.branch]?.name||'-') + '</td><td class="amt">৳ ' + fmt(t.amount) + '</td><td>' + esc(t.user||'-') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty">📭 নেই</div>') + '</div>';
    attachTxHistoryCustomerClick(area);
  }
  const sEl = wrap.querySelector('#f_search'), sg = wrap.querySelector('#f_suggest');
  if(sEl && sg){
    sEl.addEventListener('input', ()=>{
      const list = searchCustomers(sEl.value);
      if(!list.length){ sg.innerHTML = ''; return; }
      sg.innerHTML = list.map(c=>'<div class="sug-item" data-id="' + c.id + '"><b>' + esc(c.name) + '</b> — <small>' + esc(c.accountNo) + '</small><br><small>📱 ' + esc(c.mobile||'-') + '</small></div>').join('');
      sg.querySelectorAll('.sug-item').forEach(el=>{
        el.addEventListener('click', ()=>{
          const c = DB().customers.find(x=>x.id === el.dataset.id); if(!c) return;
          wrap.querySelector('#f_acc').value = c.accountNo; wrap.querySelector('#f_name').value = c.name; wrap.querySelector('#f_mobile').value = c.mobile || ''; wrap.querySelector('#f_addr').value = c.address || '';
          sEl.value = c.accountNo; sg.innerHTML = '';
        });
      });
    });
  }
  const ec = wrap.querySelector('#f_editCust');
  if(ec) ec.addEventListener('click', async ()=>{
    const acc = wrap.querySelector('#f_acc').value.trim(), name = wrap.querySelector('#f_name').value.trim();
    if(!acc && !name) return;
    const hb = wrap.querySelector('#f_custBranch_hidden'), br = hb?.value || 'kalaroa';
    upsertCustomer({ accountNo: acc, name, mobile: wrap.querySelector('#f_mobile').value.trim(), address: wrap.querySelector('#f_addr').value.trim(), branch: br });
    await saveDB(); toast('✅ সেভ');
  });
  const cd = wrap.querySelector('#f_checkDue');
  if(cd) cd.addEventListener('click', ()=>{
    const acc = wrap.querySelector('#f_acc').value.trim();
    if(!acc){ toast('⚠️ অ্যাকাউন্ট দিন'); return; }
    const c = DB().customers.find(x=>x.accountNo === acc);
    if(c) openCustomerDetailPopup(c.accountNo, c.name); else toast('ℹ️ নেই');
  });
  wrap.querySelector('#f_close').addEventListener('click', close);
  wrap.querySelector('#f_save').addEventListener('click', async ()=>{
    const sBtn = wrap.querySelector('#f_save'); if(sBtn.disabled) return;
    sBtn.disabled = true; const orig = sBtn.innerHTML; sBtn.innerHTML = '<span class="spinner"></span>';
    try{
      const date = wrap.querySelector('#f_date').value || todayStr();
      const on = isBO ? {} : readNotes(wrap, 'out');
      const inN = isBO ? {} : readNotes(wrap, 'in');
      const os = noteSum(on), is = noteSum(inN);
      const dir = wrap.querySelector('#f_dir')?.value || null;
      const osL = isOS(), onL = isOn();
      const cNT = isLG && !!cTick?.checked;
      let cNTA = 0;
      if(cNT){ cNTA = parseNum(cAmt?.value); if(cNTA <= 0){ alert('পরিমাণ দিন'); sBtn.disabled = false; sBtn.innerHTML = orig; return; } if(!wrap.querySelector('#f_name')?.value.trim() || !wrap.querySelector('#f_acc')?.value.trim()){ alert('নাম ও অ্যাকাউন্ট দিন'); sBtn.disabled = false; sBtn.innerHTML = orig; return; } }

      if(osL){ osA = parseNum(wrap.querySelector('#support_amount')?.value); if(osA <= 0){ alert('পরিমাণ দিন'); sBtn.disabled = false; sBtn.innerHTML = orig; return; } }
      if(onL){ onA = parseNum(wrap.querySelector('#online_amount')?.value); if(onA <= 0){ alert('পরিমাণ দিন'); sBtn.disabled = false; sBtn.innerHTML = orig; return; } }
      let btA = 0;
      if(isBO){ btA = parseNum(wrap.querySelector('#bt_amount')?.value); if(btA <= 0){ alert('পরিমাণ দিন'); sBtn.disabled = false; sBtn.innerHTML = orig; return; } }

      let tB, cB;

      if(!isBO && !cNT){

      }

      else if(isLG && oT) fNote = 'ক্যাশ ৳ ' + fmt(cA) + ' + অনলাইন ৳ ' + fmt(oA);
      else fNote = wrap.querySelector('#f_note')?.value.trim() || '';
      const tx = { id: editing ? editing.id : uid(), type, date, branch: tB, custBranch: cB, bank: bk, dir, amount: Math.round(tA*100)/100,
        onlineAmount: isLG ? (oT ? Math.round(oA*100)/100 : 0) : ((onL || osL) ? tA : null),
        notesOut: osL ? {} : on, notesIn: osL ? {} : inN,
        custAcc: wrap.querySelector('#f_acc')?.value.trim() || '', custName: wrap.querySelector('#f_name')?.value.trim() || '',
        custMobile: wrap.querySelector('#f_mobile')?.value.trim() || '', custAddr: wrap.querySelector('#f_addr')?.value.trim() || '',
        note: fNote, user: session.name, userUsername: session.username,
        createdAt: editing ? editing.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString(),
        year: date.slice(0,4), accepted: true, acceptedDate: date,
        onlineTransfer: isLG ? oT : false, onlineBankName: isLG && oT ? oBN : null,
        cashAmount: isLG ? Math.round(cA*100)/100 : null, cashNotTaken: isLG ? cNT : false,
        cashNotTakenAmount: isLG && cNT ? Math.round(cNTA*100)/100 : null };
      if(cNT && !editing){ tx.collectionStatus = 'pending'; tx.collectedAmount = 0; }
      if(!editing){ DB().txs.push(tx); }
      else { const i = DB().txs.findIndex(x => x.id === editing.id); if(i >= 0) DB().txs[i] = tx; }
      if(cfg.cust && (tx.custAcc || tx.custName)){ const c = upsertCustomer({ accountNo: tx.custAcc, name: tx.custName, mobile: tx.custMobile, address: tx.custAddr, branch: cB }); if(c) tx.custAcc = c.accountNo; }
      if(type === 'support' && tx.custAcc) updateCustomerDueInDB(tx.custAcc, false);
      recomputeLive(); await saveDB(); close();
      toast('✅ সংরক্ষিত — ৳ ' + fmt(tA));
      renderDashboard(); renderTopbar(); renderSidebar();
    }catch(e){ console.error(e); alert('❌ ' + e.message); sBtn.disabled = false; sBtn.innerHTML = orig; }
  });
}

function openCollectionChildModal(parentId, mode){
  const found = findTxAnywhere(parentId); if(!found || !found.tx){ toast('❌ নেই'); return; }
  const parent = found.tx;
  const owed = Number(parent.cashNotTakenAmount) || Number(parent.amount) || 0;
  const collected = Number(parent.collectedAmount) || 0;
  const pending = Math.round((owed - collected)*100)/100;
  if(pending <= 0.01){ toast('✅ সম্পূর্ণ'); return; }
  const isC = mode === 'cash';
  openModal({ title: isC ? '💵 ক্যাশ সংগ্রহ' : '🌐 অনলাইন', wide: true,
    bodyHTML: '<div class="accept-head" style="border-color:' + (isC?'rgba(34,197,94,.5)':'rgba(59,130,246,.5)') + '"><div>' + (isC ? '💵 ক্যাশ' : '🌐 অনলাইন') + '<br>👤 <b>' + esc(parent.custName||'-') + '</b><br>মূল ৳ ' + fmt(owed) + ' • বাকি <b style="color:#facc15">৳ ' + fmt(pending) + '</b></div></div>' +

      (!isC ? '<div class="form-row"><div class="field"><label>ব্যাংক</label><select id="cc_bank">' + bankOpts('al_arafah_kalaroa') + '</select></div><div class="field"><label>প্রাপক</label><input type="text" id="cc_partner"></div></div>' : '<div class="notes-col out"><h4>💸 প্রদান</h4>' + notesRowHTML('cc_out', null) + '<div class="sum-line"><span>মোট</span><b id="cc_sumOut">৳ 0.00</b></div></div>') +

      '<div style="display:flex;gap:10px;margin-top:18px"><button class="btn ' + (isC?'green':'') + '" id="cc_save" style="flex:1">✅ সংগ্রহ</button><button class="btn gray" id="cc_cancel" style="flex:1">বাতিল</button></div>',
    onMount: (w, close) => {
      const so = w.querySelector('#cc_sumOut');
      function recalc(){ if(isC && so) so.textContent = '৳ ' + fmt(noteSum(readNotes(w, 'cc_out'))); }
      if(isC) w.querySelectorAll('.note-item input').forEach(inp => { attachAmountInput(inp, { decimal: false }); inp.addEventListener('input', recalc); });
      w.querySelectorAll('input[inputmode="decimal"]').forEach(inp => attachAmountInput(inp, { decimal: true }));
      recalc();
      w.querySelector('#cc_cancel').addEventListener('click', close);
      w.querySelector('#cc_save').addEventListener('click', async ()=>{
        const b = w.querySelector('#cc_save'); b.disabled = true; const og = b.innerHTML; b.innerHTML = '<span class="spinner"></span>';
        try{
          const date = w.querySelector('#cc_date').value, br = w.querySelector('#cc_branch').value;
          const amt = Math.round(parseNum(w.querySelector('#cc_amount').value)*100)/100;
          if(amt <= 0 || amt > pending + 0.01){ alert('সঠিক পরিমাণ'); b.disabled = false; b.innerHTML = og; return; }
          let on = {}, inN = {}, bk = null, pn = '';
          if(isC){ on = readNotes(w, 'cc_out'); if(Math.abs(noteSum(on) - amt) > 0.01){ alert('নোট যোগফল = ' + fmt(amt)); b.disabled = false; b.innerHTML = og; return; } }
          else { bk = w.querySelector('#cc_bank').value; pn = w.querySelector('#cc_partner').value.trim(); if(!pn){ alert('প্রাপক দিন'); b.disabled = false; b.innerHTML = og; return; } }
          const child = { id: uid(), type: 'loan_collection', date, branch: br, custBranch: parent.custBranch || parent.branch, dir: isC ? 'cash' : 'online_out', amount: amt, notesOut: on, notesIn: inN, bank: bk, partnerName: pn, custAcc: parent.custAcc, custName: parent.custName, note: w.querySelector('#cc_note').value.trim(), linkedParentId: parent.id, collectionMode: isC ? 'cash' : 'online', user: session.name, userUsername: session.username, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), year: date.slice(0,4), accepted: true, acceptedDate: date };
          DB().txs.push(child);
          const nc = Math.round(((Number(parent.collectedAmount) || 0) + amt)*100)/100;
          const ns = nc >= owed - 0.01 ? 'collected' : 'partial';
          updateTxAnywhere(parent.id, { collectedAmount: nc, collectionStatus: ns, updatedAt: new Date().toISOString() });
          recomputeLive(); await saveDB(); close();
          renderDashboard(); renderSidebar(); toast('✅ সংগ্রহ ৳ ' + fmt(amt));
        }catch(e){ alert('❌ ' + e.message); b.disabled = false; b.innerHTML = og; }
      });
    }
  });
}

      '</div>' +
      '<div style="font-size:16px;font-weight:800;color:#fff;margin-top:12px">' + title + '</div>' +
      (subtitle ? '<div style="font-size:13.5px;color:#93c5fd;font-weight:700;margin-top:6px">' + subtitle + '</div>' : '') +
      '<div class="meta"><span>📅 <b>' + toBn(now.toLocaleDateString('en-GB')) + '</b></span><span>🕐 <b>' + toBn(now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true})) + '</b></span><span>🏦 <b>' + esc(bl) + '</b></span><span>👤 <b>' + esc(session?.name || '-') + '</b></span></div>' +

async function captureElementAsImage(targetEl, filename, title, subtitle){
  const loading = document.getElementById('printLoading');
  const msg = document.getElementById('printLoadingMsg');
  if(loading){ loading.classList.add('active'); msg.textContent = 'প্রস্তুত হচ্ছে...'; }
  try{
    const wrapper = buildSnapshotWrapper(targetEl, title, subtitle);
    document.body.appendChild(wrapper);
    if(msg) msg.textContent = 'ছবি আঁকা হচ্ছে...';
    await new Promise(r => setTimeout(r, 250));
    const canvas = await html2canvas(wrapper, { backgroundColor: '#04060d', scale: 2, useCORS: true, logging: false, windowWidth: 1250, width: wrapper.offsetWidth });
    document.body.removeChild(wrapper);
    if(msg) msg.textContent = 'ডাউনলোড হচ্ছে...';
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      toast('📸 Snapshot: ' + filename);
    }, 'image/png');
  }catch(e){ console.error(e); toast('❌ ' + e.message); }
  finally { if(loading) loading.classList.remove('active'); }
}
function printDashboardSnapshot(){
  if(!session){ toast('❌ লগইন করুন'); return; }
  const main = document.querySelector('main'); if(!main) return;
  const bf = currentBranchFilter();
  const bl = bf === 'all' ? 'উভয় শাখা' : (BRANCHES[bf]?.name || bf);

}
function printSingleTransaction(tx){
  if(!tx){ toast('❌ নেই'); return; }
  const cfg = TX_CFG[tx.type] || { title: tx.type, icon: '📌' };
