<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Campus | Agent Banking System</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff2e88'/%3E%3Cstop offset='33%25' stop-color='%23a855f7'/%3E%3Cstop offset='66%25' stop-color='%2322e6ff'/%3E%3Cstop offset='100%25' stop-color='%238dff3f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='48' fill='%230b0e1f' stroke='url(%23g)' stroke-width='3'/%3E%3Cg transform='translate(50,50)' fill='url(%23g)'%3E%3Cpath d='M -22 -12 L 0 -28 L 22 -12 Z'/%3E%3Crect x='-18' y='-8' width='4' height='22' rx='1'/%3E%3Crect x='-8' y='-8' width='4' height='22' rx='1'/%3E%3Crect x='4' y='-8' width='4' height='22' rx='1'/%3E%3Crect x='14' y='-8' width='4' height='22' rx='1'/%3E%3Crect x='-22' y='14' width='44' height='4' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#0b0e1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after,
html, body, button, input, select, textarea,
h1, h2, h3, h4, h5, h6, p, span, div, label, td, th, a {
  font-family: 'Noto Sans Bengali', 'Noto Sans', system-ui, -apple-system, sans-serif !important;
  box-sizing: border-box;
}
*{margin:0;padding:0}
:root{
  --bg:#04050a; --card:#0d1020; --card2:#131735;
  --line:rgba(255,255,255,.09); --txt:#e9edff; --muted:#8b95c9;
  --pink:#ff2e88; --cyan:#22e6ff; --lime:#8dff3f; --gold:#ffcb2b;
  --violet:#a855f7; --orange:#ff8a2b; --red:#ff4d6d;
}
html,body{height:100%}
body{
  font-family:'Noto Sans Bengali',system-ui,sans-serif;
  color:var(--txt);
  background:
    radial-gradient(900px 520px at 10% -8%, rgba(168,85,247,.20), transparent 62%),
    radial-gradient(900px 520px at 92% 0%, rgba(34,230,255,.17), transparent 62%),
    radial-gradient(800px 600px at 50% 115%, rgba(255,46,136,.15), transparent 62%),
    #04050a;
  min-height:100vh; overflow-x:hidden;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#080a14}
::-webkit-scrollbar-thumb{background:linear-gradient(#a855f7,#22e6ff);border-radius:10px}
.hidden{display:none !important}
.rgb{
  background:linear-gradient(90deg,#ff2e88,#ff8a2b,#ffcb2b,#8dff3f,#22e6ff,#a855f7,#ff2e88);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent; animation:rgbmove 4s linear infinite;
  filter:drop-shadow(0 0 10px rgba(34,230,255,.55)); font-weight:800;
}
@keyframes rgbmove{to{background-position:300% 0}}
.cust-count-wrap{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px;}
.cust-count-num{
  font-size:44px;line-height:1.1;font-weight:900;
  background:linear-gradient(90deg,#ff2e88,#ff8a2b,#ffcb2b,#8dff3f,#22e6ff,#a855f7,#ff2e88);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;animation:rgbmove 4s linear infinite;
  filter:drop-shadow(0 0 12px rgba(34,230,255,.6));
  letter-spacing:.5px;
}
.cust-count-unit{
  font-size:20px;font-weight:800;
  background:linear-gradient(90deg,#a855f7,#22e6ff,#a855f7);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;animation:rgbmove 3s linear infinite;
}
.cust-ico-big{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  font-size:24px;background:rgba(124,77,255,.15);
  border:1px solid rgba(124,77,255,.4);
  box-shadow:0 0 24px rgba(124,77,255,.35);
}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{
  width:100%;max-width:440px;
  background:linear-gradient(160deg,rgba(20,24,52,.95),rgba(8,10,20,.98));
  border:1px solid var(--line);border-radius:24px;padding:34px 28px;
  box-shadow:0 30px 80px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;overflow:hidden;
}
.login-box::before{
  content:'';position:absolute;inset:-2px;border-radius:26px;padding:2px;
  background:linear-gradient(120deg,#ff2e88,#22e6ff,#8dff3f,#a855f7);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.65;pointer-events:none;animation:spinHue 8s linear infinite;
}
@keyframes spinHue{to{filter:hue-rotate(360deg)}}
.login-logo{width:78px;height:78px;margin:0 auto 14px;display:grid;place-items:center;}
.login-box h1{text-align:center;font-size:22px;font-weight:800}
.login-box h2{text-align:center;font-size:13px;color:var(--muted);font-weight:500;margin:6px 0 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select{
  width:100%;padding:12px 14px;border-radius:12px;
  background:#080b18;border:1px solid var(--line);color:var(--txt);
  font-family:inherit;font-size:14.5px;outline:none;transition:.2s;
}
.field input:focus,.field select:focus{border-color:#22e6ff;box-shadow:0 0 0 3px rgba(34,230,255,.15)}
.field input:disabled{opacity:.55;cursor:not-allowed}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:14.5px;
  padding:12px 18px;border-radius:12px;color:#fff;transition:.2s;
  background:linear-gradient(135deg,#7c3aed,#22e6ff);
  box-shadow:0 8px 26px rgba(34,230,255,.22);}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.btn.pink{background:linear-gradient(135deg,#ff2e88,#a855f7);box-shadow:0 8px 26px rgba(255,46,136,.25)}
.btn.green{background:linear-gradient(135deg,#16a34a,#8dff3f);color:#04120a;box-shadow:0 8px 26px rgba(141,255,63,.2)}
.btn.gray{background:#1a1f3d;box-shadow:none}
.btn.red{background:linear-gradient(135deg,#dc2626,#ff4d6d);box-shadow:0 8px 26px rgba(255,77,109,.25)}
.btn.small{padding:6px 12px;font-size:12px;border-radius:8px}
.btn.pdf{background:linear-gradient(135deg,#dc2626,#ff8a2b);box-shadow:0 6px 20px rgba(220,38,38,.3)}
.btn.xlsx{background:linear-gradient(135deg,#16a34a,#22e6ff);color:#04120a;box-shadow:0 6px 20px rgba(22,163,74,.3)}
.topbar{position:sticky;top:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:12px 20px;background:rgba(6,8,16,.82);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;display:grid;place-items:center;}
.brand h1{font-size:17px;font-weight:800}
.brand p{font-size:11.5px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-actions input[type=date],.top-actions select{
  padding:9px 12px;border-radius:11px;background:#0a0d1c;border:1px solid var(--line);
  color:var(--txt);font-family:inherit;font-size:13px;outline:none;}
.top-actions input[type=date]:focus{border-color:#22e6ff;box-shadow:0 0 0 3px rgba(34,230,255,.18)}
.who{font-size:12.5px;padding:8px 13px;border-radius:11px;
  background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);white-space:nowrap;}
.who b{color:#e9d5ff}
.sync-status{
  font-size:11.5px;padding:6px 11px;border-radius:11px;
  background:rgba(141,255,63,.12);border:1px solid rgba(141,255,63,.4);
  color:#8dff3f;font-weight:700;white-space:nowrap;
}
.sync-status.offline{background:rgba(255,77,109,.12);border-color:rgba(255,77,109,.4);color:#ff4d6d}
.sync-status.syncing{background:rgba(255,203,43,.12);border-color:rgba(255,203,43,.4);color:#ffcb2b}
main{max-width:1500px;margin:0 auto;padding:22px 18px 70px;display:flex;flex-direction:column;gap:22px;align-items:center}
.section{width:100%}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;
  font-size:16px;font-weight:800;color:#cfd6ff;flex-wrap:wrap;}
.section-title span.bar{width:5px;height:22px;border-radius:6px;background:linear-gradient(#ff2e88,#22e6ff)}
.grid{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{position:relative;cursor:pointer;overflow:hidden;
  border-radius:20px;padding:18px 18px 16px;
  background:linear-gradient(155deg,rgba(19,23,53,.95),rgba(8,10,20,.98));
  border:1px solid var(--line);
  box-shadow:0 18px 45px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
  transition:.25s;}
.card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
  background:var(--accent,#22e6ff);box-shadow:0 0 22px var(--accent,#22e6ff);}
.card::before{content:'';position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;
  background:var(--accent,#22e6ff);opacity:.09;filter:blur(10px);}
.card:hover{transform:translateY(-5px);border-color:var(--accent,#22e6ff);box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 0 1px var(--accent,#22e6ff)}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-top .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);}
.card-top h3{font-size:14.5px;font-weight:700;color:#dfe4ff}
.big-amt{font-size:30px;line-height:1.25;letter-spacing:.3px;font-weight:800}
.big-amt.sm{font-size:21px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.big-amt.sm .lbl{color:var(--muted);font-size:13px;font-weight:600;min-width:62px}
.card-sub{margin-top:9px;font-size:12.5px;color:var(--muted);font-weight:500}
.card-sub b{color:#8dff3f}
.card-sub.blue b{color:#22e6ff}
.card-sub.pinkc b{color:#ff2e88}
.card-sub.warn{color:#fbbf24}
.card-sub.warn b{color:#fbbf24}
.card-tap{position:absolute;right:14px;bottom:12px;font-size:11px;color:var(--muted);opacity:.7;font-weight:500}
.vault-box{width:100%;border-radius:20px;padding:18px;
  background:linear-gradient(155deg,rgba(19,23,53,.9),rgba(8,10,20,.97));
  border:1px solid var(--line);box-shadow:0 18px 45px rgba(0,0,0,.5);}
.vault-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.vault-item{flex:1 1 82px;min-width:76px;text-align:center;padding:11px 6px;border-radius:14px;
  background:rgba(255,255,255,.035);border:1px solid var(--line);transition:.2s;}
.vault-item:hover{background:rgba(34,230,255,.09);border-color:rgba(34,230,255,.4)}
.vault-item .d{font-size:12.5px;color:var(--muted);font-weight:600}
.vault-item .c{font-size:19px;font-weight:800;margin-top:3px;color:#8dff3f}
.vault-total{margin-top:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  padding-top:12px;border-top:1px dashed rgba(255,255,255,.12);}
.vault-total span{font-size:13.5px;color:var(--muted);font-weight:600}
.bal-grid{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.bal-card{border-radius:20px;padding:20px;
  background:linear-gradient(150deg,rgba(19,23,53,.95),rgba(8,10,20,.98));
  border:1px solid var(--line);box-shadow:0 18px 45px rgba(0,0,0,.5);
  position:relative;overflow:hidden;}
.bal-card .t{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:8px}
.bal-card .v{font-size:27px;font-weight:800;line-height:1.3}
.bal-card.main{
  background:linear-gradient(120deg,rgba(124,58,237,.22),rgba(34,230,255,.14),rgba(255,46,136,.16));
  border-color:rgba(34,230,255,.35);
}
.bal-card.main .v{font-size:44px}
.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%}
.actions .btn{padding:14px 26px;font-size:15px}
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(2,3,8,.82);backdrop-filter:blur(6px);
  display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto;
  animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:760px;border-radius:22px;overflow:hidden;
  background:linear-gradient(165deg,#12162e,#070912);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 40px 100px rgba(0,0,0,.85);
  animation:pop .22s cubic-bezier(.2,.9,.3,1.2);}
.modal.wide{max-width:1100px}
@keyframes pop{from{transform:translateY(22px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(168,85,247,.16),rgba(34,230,255,.10));
  position:sticky;top:0;z-index:5;backdrop-filter:blur(12px);}
.modal-head h3{font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:9px}
.modal-head .x{border:none;background:rgba(255,255,255,.08);color:#fff;width:34px;height:34px;border-radius:10px;
  cursor:pointer;font-size:16px;transition:.2s;}
.modal-head .x:hover{background:#ff2e88}
.modal-body{padding:18px 20px 24px}
.form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.cust-box{margin-top:6px;padding:14px;border-radius:16px;
  background:rgba(34,230,255,.05);border:1px solid rgba(34,230,255,.22);}
.cust-box .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cust-box .head h4{font-size:13.5px;color:#9fe9ff}
.suggest{margin-top:6px;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  background:#0a0d1c;max-height:230px;overflow-y:auto;}
.suggest:empty{display:none}
.sug-item{padding:10px 13px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;transition:.15s}
.sug-item:hover{background:rgba(34,230,255,.12)}
.sug-item b{color:#8dff3f}
.sug-item small{color:var(--muted)}
.notes-cols{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:6px}
@media(max-width:700px){.notes-cols{grid-template-columns:1fr}}
.notes-col{padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.028);}
.notes-col.out{border-color:rgba(255,46,136,.3);background:rgba(255,46,136,.05)}
.notes-col.in{border-color:rgba(141,255,63,.3);background:rgba(141,255,63,.05)}
.notes-col.disabled{opacity:.35;pointer-events:none}
.notes-col h4{font-size:12.5px;margin-bottom:10px;font-weight:700;color:#dfe4ff}
.notes-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between}
.note-item{flex:1 1 52px;min-width:50px;text-align:center}
.note-item label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
.note-item input{width:100%;padding:7px 3px;text-align:center;border-radius:9px;
  background:#080b18;border:1px solid var(--line);color:#8dff3f;
  font-family:inherit;font-size:13px;font-weight:700;outline:none;}
.note-item input:focus{border-color:#22e6ff;box-shadow:0 0 0 2px rgba(34,230,255,.18)}
.sum-line{margin-top:10px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;
  padding-top:8px;border-top:1px dashed rgba(255,255,255,.12);}
.sum-line b{color:#ffcb2b;font-size:15px}
.total-preview{margin-top:16px;padding:15px;border-radius:16px;text-align:center;
  background:linear-gradient(90deg,rgba(168,85,247,.14),rgba(34,230,255,.12));
  border:1px solid rgba(168,85,247,.3);}
.total-preview .l{font-size:12.5px;color:var(--muted);font-weight:700}
.total-preview .v{font-size:32px;margin-top:4px}
.note-detail-box{
  margin-top:12px;padding:12px 14px;border-radius:14px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);
  font-size:12.5px;color:var(--muted);line-height:1.9;
}
.note-detail-box .ttl{font-size:12px;color:#9fe9ff;font-weight:700;margin-bottom:4px}
.note-detail-box .tag{
  display:inline-block;padding:2px 8px;margin:2px 4px 2px 0;border-radius:8px;
  background:rgba(34,230,255,.12);border:1px solid rgba(34,230,255,.3);color:#9fe9ff;font-size:11.5px;
}
.note-detail-box .tag.out{background:rgba(255,46,136,.12);border-color:rgba(255,46,136,.35);color:#ffb3d1}
.note-detail-box .tag.in{background:rgba(141,255,63,.12);border-color:rgba(141,255,63,.35);color:#d3ffa8}
.pending-box{
  margin-top:14px;padding:14px;border-radius:16px;
  background:linear-gradient(135deg,rgba(251,191,36,.10),rgba(234,88,12,.08));
  border:1px solid rgba(251,191,36,.35);
}
.pending-box h4{font-size:13.5px;color:#fbbf24;font-weight:800;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;}
.pending-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 12px;border-radius:12px;margin-bottom:8px;
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);flex-wrap:wrap;
}
.pending-item .info{font-size:12.5px;color:#e9edff;flex:1;min-width:180px}
.pending-item .info b{color:#fbbf24}
.pending-item .info small{color:var(--muted);display:block;margin-top:3px}
.pending-empty{padding:14px;text-align:center;color:var(--muted);font-size:12.5px}
.accept-head{
  padding:14px;border-radius:14px;margin-bottom:14px;
  background:rgba(34,230,255,.06);border:1px solid rgba(34,230,255,.28);
  font-size:13px;line-height:1.9;
}
.accept-head b{color:#22e6ff}
.online-box{
  margin-top:14px;padding:16px;border-radius:16px;
  background:linear-gradient(135deg,rgba(34,230,255,.08),rgba(168,85,247,.06));
  border:1.5px solid rgba(34,230,255,.4);
  display:none;
}
.online-box.active{display:block;animation:fadeIn .25s ease;}
.online-box h4{
  font-size:13.5px;color:#22e6ff;font-weight:800;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.online-box .desc{
  font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.7;
  padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.2);
}
.online-box .desc b{color:#ffcb2b}
.online-box .desc.pos{background:rgba(141,255,63,.08);border:1px solid rgba(141,255,63,.3)}
.online-box .desc.pos b{color:#8dff3f}
.online-box .desc.neg{background:rgba(255,46,136,.08);border:1px solid rgba(255,46,136,.3)}
.online-box .desc.neg b{color:#ff2e88}
.cust-branch-toggle{
  padding:14px 16px;border-radius:16px;margin-top:6px;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(34,230,255,.06),rgba(141,255,63,.04));
  border:1px solid rgba(34,230,255,.25);
}
.cust-branch-toggle .toggle-title{
  font-size:13.5px;font-weight:800;color:#dfe4ff;margin-bottom:10px;
}
.branch-toggle-row{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}

async function sha256(str){
  const buf = new TextEncoder().encode(str);

/* ============ Supabase ============ */
let supabaseClient = null, supabaseReady = false, realtimeChannel = null;

function initSupabase(){
  const url = window.SUPABASE_URL || '';
  const key = window.SUPABASE_ANON_KEY || '';
  if(!url || !key || url.includes('YOUR-PROJECT')){ 
    updateConnStatus('offline'); supabaseReady = false; return false; 
  }
  try{
    if(typeof window.supabase === 'undefined' || !window.supabase.createClient){
      setTimeout(initSupabase, 500); return false;
    }
    supabaseClient = window.supabase.createClient(url, key, {

  }catch(e){
    console.warn('Supabase init failed:', e);
    updateConnStatus('offline');
    supabaseReady = false;
    return false;
  }

function updateConnStatus(status){
  const top = document.querySelector('.sync-status');
  if(top){
    top.className = 'sync-status ' + (status === 'online' ? '' : status);
    top.textContent = status === 'online' ? '🟢 সিঙ্ক' : (status === 'syncing' ? '🟡 সিঙ্ক...' : '🔴 অফলাইন');
  }

async function loadFromSupabase(){
  if(!supabaseReady) return null;
  try{
    const { data, error } = await supabaseClient
      .from(window.SUPABASE_TABLE)
      .select('data')
      .eq('id', window.SUPABASE_ROW_ID)
      .maybeSingle();
    if(error){ console.warn('Supabase read:', error); return null; }
    return data && data.data ? data.data : null;
  }catch(e){ console.warn('Supabase read:', e); return null; }
}
async function saveToSupabase(data){
  if(!supabaseReady) return false;
  try{
    updateConnStatus('syncing');
    const { error } = await supabaseClient
      .from(window.SUPABASE_TABLE)
      .upsert({ 
        id: window.SUPABASE_ROW_ID, 
        data: data, 
        updated_at: new Date().toISOString() 
      }, { onConflict: 'id' });
    if(error){ 
      console.warn('Supabase write:', error); 
      updateConnStatus('offline'); 
      return false; 
    }
    updateConnStatus('online');
    return true;
  }catch(e){
    console.warn('Supabase write:', e);
    updateConnStatus('offline');
    return false;
  }
}

  if(!supabaseReady) return;
  if(realtimeChannel){ 
    try{ supabaseClient.removeChannel(realtimeChannel); }catch(e){}
    realtimeChannel = null;

  realtimeChannel = supabaseClient
    .channel('agent_bank_changes_' + Date.now())
    .on('postgres_changes', {
      event: '*',

      table: window.SUPABASE_TABLE
    }, (payload) => {
      const remote = payload.new && payload.new.data;
      if(!remote) return;
      
      if(window.__lastSaveToken && remote.__saveToken === window.__lastSaveToken){
        console.log('⏭️ Skip own save echo');
        return;

      else if(status === 'CLOSED') updateConnStatus('offline');
    });
}

  if(supabaseReady) await saveToSupabase(db);

function performDailyRollover(force){
  const today = todayStr();
  const last = db.lastBaseDate || '';
  if(!force && last === today) return false;

  Object.keys(BRANCHES).forEach(br=>{
    const la = db.liveAccounts[br] || {bank:0,cash:0,other:0};
    db.baseAccounts[br] = {
      bank:  Number(la.bank)  || 0,
      cash:  Number(la.cash)  || 0,
      other: Number(la.other) || 0
    };
    const lv = db.liveVault[br] || {};
    db.baseVault[br] = {};
    DENOMS.forEach(d => { db.baseVault[br][d] = Number(lv[d]) || 0; });
  });

  db.txs = [];
  db.lastBaseDate = today;

  if(!db.dailyClose) db.dailyClose = {};
  db.dailyClose[today] = { accounts:{}, vault:{} };
  Object.keys(BRANCHES).forEach(br=>{
    db.dailyClose[today].accounts[br] = {
      bank:  Number(db.baseAccounts[br].bank)  || 0,
      cash:  Number(db.baseAccounts[br].cash)  || 0,
      other: Number(db.baseAccounts[br].other) || 0
    };
    db.dailyClose[today].vault[br] = {};
    DENOMS.forEach(d => { db.dailyClose[today].vault[br][d] = Number(db.baseVault[br][d]) || 0; });
  });

  if(supabaseReady) saveToSupabase(db);
  return true;
}

    { id:'admin1', name:'প্রধান অ্যাডমিন', username:'admin', password: 'admin123', passwordHash: DEFAULT_HASH_ADMIN, role:'admin', branch:'all' }
  ];
}

function defaultDB(){
  const baseVault = {}, baseAccounts = {}, liveVault = {}, liveAccounts = {};
  Object.keys(BRANCHES).forEach(b=>{
    baseVault[b] = {}; DENOMS.forEach(d=> baseVault[b][d] = 0);
    baseAccounts[b] = { bank:0, cash:0, other:0 };
    liveVault[b] = {}; DENOMS.forEach(d=> liveVault[b][d] = 0);
    liveAccounts[b] = { bank:0, cash:0, other:0 };
  });
  return {
    users: defaultUsers(),
    customers: [], txs: [],
    baseVault, baseAccounts,
    liveVault, liveAccounts,
    dailyClose: {},
    lastBaseDate: todayStr(),
    __firstSetupDone: false
  };
}
function fixBranchKeys(obj){
  if(!obj || typeof obj !== 'object') return obj;
  if(obj.kalaroja !== undefined && obj.kalaroa === undefined){
    obj.kalaroa = obj.kalaroja; delete obj.kalaroja;
  }
  return obj;
}
function normalizeDB(){
  Object.keys(BRANCHES).forEach(b=>{
    if(!db.baseVault) db.baseVault = {};
    if(!db.baseVault[b]) { db.baseVault[b] = {}; DENOMS.forEach(d=> db.baseVault[b][d] = 0); }
    DENOMS.forEach(d=>{ const v = Number(db.baseVault[b][d]); db.baseVault[b][d] = Number.isFinite(v) ? v : 0; });
    if(!db.liveVault) db.liveVault = {};
    if(!db.liveVault[b]) { db.liveVault[b] = {}; DENOMS.forEach(d=> db.liveVault[b][d] = 0); }
    DENOMS.forEach(d=>{ const v = Number(db.liveVault[b][d]); db.liveVault[b][d] = Number.isFinite(v) ? v : 0; });
    if(!db.baseAccounts) db.baseAccounts = {};
    if(!db.baseAccounts[b]) db.baseAccounts[b] = { bank:0, cash:0, other:0 };
    if(!db.liveAccounts) db.liveAccounts = {};
    if(!db.liveAccounts[b]) db.liveAccounts[b] = { bank:0, cash:0, other:0 };
  });
  if(!Array.isArray(db.customers)) db.customers = [];
  if(!Array.isArray(db.txs)) db.txs = [];
  if(!Array.isArray(db.users) || !db.users.length) db.users = defaultUsers();
  if(!db.lastBaseDate) db.lastBaseDate = todayStr();
  if(!db.dailyClose) db.dailyClose = {};
  if(typeof db.__firstSetupDone !== 'boolean') db.__firstSetupDone = false;

  for(const u of db.users){
    if(!u.password && !u.passwordHash){ u.password = '1234'; }
  }

  (db.txs || []).forEach(t=>{
    if(t.branch === 'kalaroja') t.branch = 'kalaroa';
    if(t.from === 'kalaroja')   t.from = 'kalaroa';
    if(t.to === 'kalaroja')     t.to = 'kalaroa';
    if(t.custBranch === 'kalaroja') t.custBranch = 'kalaroa';
    if(!t.userUsername && t.user){
      const u = (db.users||[]).find(x => x.name === t.user);
      if(u) t.userUsername = u.username;
    }
    if(!t.custBranch) t.custBranch = t.branch;
  });
  (db.users || []).forEach(u=>{ if(u.branch === 'kalaroja') u.branch = 'kalaroa'; });
}
async function migrateLegacyPasswords(){
  let changed = false;
  for(const u of db.users){
    if(!u.passwordHash && u.password){
      u.passwordHash = await sha256(u.password);
      changed = true;
    }
  }
  if(changed) saveDB();
}
async function ensureDefaultUsers(){
  let changed = false;
  const defaults = defaultUsers();
  for(const du of defaults){
    const existing = db.users.find(u => u.username === du.username);
    if(!existing){
      db.users.push(du);
      changed = true;
    }
  }
  if(changed) await saveDB();
}

async function loadDB(){
  try{
    let cloud = null;
    if(supabaseReady){
      cloud = await Promise.race([
        loadFromSupabase(),
        new Promise(resolve => setTimeout(() => resolve(null), 8000))
      ]);
    }

    if(cloud && Object.keys(cloud).length > 0){ db = cloud; }
    else { db = defaultDB(); }

    if(db && (db.vault || db.accounts) && !db.baseVault){ migrateOldDB(db); }
    if(!db) db = defaultDB();
    if(db.baseVault)    fixBranchKeys(db.baseVault);
    if(db.liveVault)    fixBranchKeys(db.liveVault);
    if(db.baseAccounts) fixBranchKeys(db.baseAccounts);
    if(db.liveAccounts) fixBranchKeys(db.liveAccounts);

    normalizeDB();
    await migrateLegacyPasswords();
    await ensureDefaultUsers();
    recomputeLive();
    window.db = db;
    if(supabaseReady){ startSupabaseListener(); updateConnStatus('online'); }
  }catch(e){
    console.warn('loadDB error:', e);
    db = defaultDB(); window.db = db;
  }
}
function migrateOldDB(old){
  const baseVault = {}, baseAccounts = {};
  Object.keys(BRANCHES).forEach(b=>{
    baseVault[b] = {};
    DENOMS.forEach(d => baseVault[b][d] = Number(old.vault?.[b]?.[d]) || 0);
    baseAccounts[b] = {
      bank:  Number(old.accounts?.[b]?.bank)  || 0,
      cash:  Number(old.accounts?.[b]?.cash)  || 0,
      other: Number(old.accounts?.[b]?.other) || 0
    };
  });
  db = {
    users: old.users || defaultUsers(),
    customers: old.customers || [], txs: old.txs || [],
    baseVault, baseAccounts,
    liveVault: JSON.parse(JSON.stringify(baseVault)),
    liveAccounts: JSON.parse(JSON.stringify(baseAccounts)),
    dailyClose: old.dailyClose || {},
    lastBaseDate: old.lastBaseDate || todayStr(),
    __firstSetupDone: true
  };
}
function recomputeLive(){
  Object.keys(BRANCHES).forEach(b=>{
    db.liveVault[b] = {};
    DENOMS.forEach(d => db.liveVault[b][d] = Number(db.baseVault[b][d]) || 0);
    db.liveAccounts[b] = {
      bank:  Number(db.baseAccounts[b].bank)  || 0,
      cash:  Number(db.baseAccounts[b].cash)  || 0,
      other: Number(db.baseAccounts[b].other) || 0
    };
  });
  (db.txs || []).forEach(tx => {
    if(tx.type === 'branch_transfer'){
      applyTxToLive(tx, +1, 'send');
      if(tx.accepted === true){ applyTxToLive(tx, +1, 'accept'); }
    } else {
      applyTxToLive(tx, +1, undefined);
    }
  });
  syncLiveCashFromVault();
  window.db = db;
}
function syncLiveCashFromVault(){
  Object.keys(BRANCHES).forEach(br=>{
    let total = 0;
    DENOMS.forEach(d => total += (Number(db.liveVault[br][d])||0) * d);
    db.liveAccounts[br].cash = Math.round(total*100)/100;
  });
}

function bindActivityListeners(){
  const events = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'touchmove', 'scroll', 'click'];
  events.forEach(evt => {
    document.addEventListener(evt, () => { if(session) lastActivityTime = Date.now(); }, true);

}

function currentBranchFilter(){

function readNotes(scope, prefix){
  const o = {};
  scope.querySelectorAll('[id^="'+prefix+'_"]').forEach(inp=>{
    const v = parseInt(String(inp.value).replace(/[^0-9]/g,''),10) || 0;
    if(v > 0) o[inp.dataset.denom] = v;
  });
  return o;
}
function noteSum(o){ let s=0; if(!o) return 0; for(const k in o) s += (Number(o[k])||0) * Number(k); return s; }
function adjustNotes(target, notes, sign){
  if(!notes || !target) return;
  for(const k in notes){
    target[k] = (target[k]||0) + sign * (Number(notes[k])||0);
    if(target[k] < 0) target[k] = 0;
  }
}
function noteDetailHTML(notes){
  const keys = Object.keys(notes||{}).filter(k => notes[k] > 0).sort((a,b)=> b-a);
  if(!keys.length) return '<span style="color:#8b95c9">—</span>';
  return keys.map(k => `<span class="tag">৳${toBn(k)} × ${toBn(notes[k])} = ৳${fmt(Number(k)*Number(notes[k]))}</span>`).join('');
}
function noteListInline(notes, cls){
  const keys = Object.keys(notes||{}).filter(k => notes[k] > 0).sort((a,b)=> b-a);
  if(!keys.length) return '';
  return `<div class="note-list">${keys.map(k => `<span class="${cls||''}">৳${toBn(k)}×${toBn(notes[k])}</span>`).join('')}</div>`;
}
function noteTextPlain(notes){
  const keys = Object.keys(notes||{}).filter(k => notes[k] > 0).sort((a,b)=> b-a);
  if(!keys.length) return '';
  return keys.map(k => 'BDT'+k+'x'+notes[k]).join(', ');
}

function applyTxToLive(tx, dir, phase){
  const d = dir;
  const b = tx.branch;
  const custBranch = tx.custBranch || b;
  const ensure = (br) => {
    if(!br) return;
    if(!db.liveAccounts[br]) db.liveAccounts[br] = {bank:0,cash:0,other:0};
    if(!db.liveVault[br]) db.liveVault[br] = {};
    DENOMS.forEach(x => { if(typeof db.liveVault[br][x] !== 'number') db.liveVault[br][x] = 0; });
  };
  ensure(b); ensure(custBranch);
  const amount = (Number(tx.amount)||0) * d;
  const nIn = tx.notesIn || {}, nOut = tx.notesOut || {};

  switch(tx.type){
    case 'loan_given':
      db.liveAccounts[b].bank += amount;
      adjustNotes(db.liveVault[custBranch], nOut, -d);
      adjustNotes(db.liveVault[custBranch], nIn, d); break;
    case 'loan_received':
      db.liveAccounts[b].bank -= amount;
      adjustNotes(db.liveVault[custBranch], nIn, d);
      adjustNotes(db.liveVault[custBranch], nOut, -d); break;
    case 'deposit':
      db.liveAccounts[b].bank -= amount;
      adjustNotes(db.liveVault[custBranch], nIn, d);
      adjustNotes(db.liveVault[custBranch], nOut, -d); break;
    case 'withdrawal':
      db.liveAccounts[b].bank += amount;
      adjustNotes(db.liveVault[custBranch], nOut, -d);
      adjustNotes(db.liveVault[custBranch], nIn, d); break;
    case 'expense':
      adjustNotes(db.liveVault[b], nOut, -d);
      adjustNotes(db.liveVault[b], nIn, d); break;
    case 'branch_transfer': {
      const from = tx.from, to = tx.to;
      if(!from || !to || from === to) break;
      ensure(from); ensure(to);
      if(phase === 'send'){ adjustNotes(db.liveVault[from], nOut, -d); }
      else if(phase === 'accept'){ adjustNotes(db.liveVault[to], nIn, d); }
      break;
    }
    case 'other_bank':
      if(tx.dir === 'online_in')  db.liveAccounts[b].bank += amount;
      else if(tx.dir === 'online_out') db.liveAccounts[b].bank -= amount;
      else if(tx.dir === 'in'){
        db.liveAccounts[b].bank += amount;
        adjustNotes(db.liveVault[custBranch], nIn, d);
        adjustNotes(db.liveVault[custBranch], nOut, -d);
      } else {
        db.liveAccounts[b].bank -= amount;
        adjustNotes(db.liveVault[custBranch], nOut, -d);
        adjustNotes(db.liveVault[custBranch], nIn, d);
      }
      break;
    case 'support':
      if(tx.dir === 'out'){
        adjustNotes(db.liveVault[b], nOut, -d);
        adjustNotes(db.liveVault[b], nIn, d);
      } else {
        adjustNotes(db.liveVault[b], nIn, d);
        adjustNotes(db.liveVault[b], nOut, -d);
      }
      break;
    case 'customer':
      if(tx.dir === 'in'){
        adjustNotes(db.liveVault[custBranch], nIn, d);
        adjustNotes(db.liveVault[custBranch], nOut, -d);
      } else {
        adjustNotes(db.liveVault[custBranch], nOut, -d);
        adjustNotes(db.liveVault[custBranch], nIn, d);
      }
      break;
    case 'money_exchange':
      adjustNotes(db.liveVault[custBranch], nOut, -d);
      adjustNotes(db.liveVault[custBranch], nIn, d);
      break;
  }
  syncLiveCashFromVault();
}

function upsertCustomer(data){
  if(!data.accountNo && !data.name) return null;
  let c = DB().customers.find(x =>
      (data.accountNo && x.accountNo === data.accountNo) ||
      (!data.accountNo && data.name && x.name === data.name && x.branch === data.branch));
  if(c){
    c.name = data.name || c.name;
    c.mobile = data.mobile || c.mobile;
    c.address = data.address || c.address;
    c.branch = data.branch || c.branch;
    return c;
  }
  c = {
    id: uid(),
    accountNo: data.accountNo || ('ACC' + Math.floor(Math.random()*900000+100000)),
    name: data.name || 'অজ্ঞাত',
    mobile: data.mobile || '',
    address: data.address || '',
    branch: data.branch || 'kalaroa',
    createdAt: new Date().toISOString()
  };
  DB().customers.push(c);
  return c;
}
function searchCustomers(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  return DB().customers.filter(c =>
    (c.accountNo||'').toLowerCase().includes(q) ||
    (c.name||'').toLowerCase().includes(q) ||
    (c.mobile||'').toLowerCase().includes(q) ||
    (c.address||'').toLowerCase().includes(q)
  ).slice(0, 8);
}

function getBalancesForDate(dateStr, bf){
  const branches = bf === 'all' ? Object.keys(BRANCHES) : [bf];
  const result = { bank:0, cash:0, other:0, isHistorical:false };

  if(dateStr === todayStr()){
    branches.forEach(b => {
      const la = db.liveAccounts[b] || {bank:0,cash:0,other:0};
      result.bank += Number(la.bank) || 0;
      result.cash += Number(la.cash) || 0;
      result.other += Number(la.other) || 0;
    });
    return result;
  }

  const close = db.dailyClose?.[dateStr];
  if(close && close.accounts){
    result.isHistorical = true;
    branches.forEach(b => {
      const sa = close.accounts[b] || {bank:0,cash:0,other:0};
      result.bank += Number(sa.bank) || 0;
      result.cash += Number(sa.cash) || 0;
      result.other += Number(sa.other) || 0;
    });
    return result;
  }

  result.isHistorical = true;
  branches.forEach(b => {
    const ba = db.baseAccounts[b] || {bank:0,cash:0,other:0};
    result.bank += Number(ba.bank) || 0;
    result.cash += Number(ba.cash) || 0;
    result.other += Number(ba.other) || 0;
  });
  return result;
}

function getVaultForDate(dateStr, bf){
  const branches = bf === 'all' ? Object.keys(BRANCHES) : [bf];
  const totals = {}; DENOMS.forEach(d => totals[d] = 0);

  if(dateStr === todayStr()){
    branches.forEach(b => {
      const lv = db.liveVault[b] || {};
      DENOMS.forEach(d => { totals[d] += Number(lv[d]) || 0; });
    });
    return { totals, isHistorical: false };
  }

  const close = db.dailyClose?.[dateStr];
  if(close && close.vault){
    branches.forEach(b => {
      const sv = close.vault[b] || {};
      DENOMS.forEach(d => { totals[d] += Number(sv[d]) || 0; });
    });
    return { totals, isHistorical: true };
  }

  branches.forEach(b => {
    const bv = db.baseVault[b] || {};
    DENOMS.forEach(d => { totals[d] += Number(bv[d]) || 0; });
  });
  return { totals, isHistorical: true };
}

function computeStats(bf, date){
  const r = {
    loan_given:{amt:0,cnt:0}, loan_received:{amt:0,cnt:0},
    deposit:{amt:0,cnt:0}, withdrawal:{amt:0,cnt:0},
    transfer:{in:0,out:0,cnt:0,pending:0,pendingCnt:0}, expense:{amt:0,cnt:0},
    other:{in:0,out:0,cnt:0, onlineIn:0, onlineOut:0}, support:{in:0,out:0,cnt:0},
    customer:{in:0,out:0,cnt:0}
  };
  DB().txs.forEach(t=>{
    const ok = (bf === 'all') || (t.branch === bf) || (t.type==='branch_transfer' && (t.from===bf || t.to===bf));
    if(!ok) return;
    if(date && t.date !== date && !(t.type==='branch_transfer' && t.acceptedDate === date)) return;
    switch(t.type){
      case 'loan_given':    r.loan_given.amt += t.amount; r.loan_given.cnt++; break;
      case 'loan_received': r.loan_received.amt += t.amount; r.loan_received.cnt++; break;
      case 'deposit':       r.deposit.amt += t.amount; r.deposit.cnt++; break;
      case 'withdrawal':    r.withdrawal.amt += t.amount; r.withdrawal.cnt++; break;
      case 'expense':       r.expense.amt += t.amount; r.expense.cnt++; break;
      case 'branch_transfer': {
        const accepted = !!t.accepted;
        if(bf === 'all'){
          if(accepted){ r.transfer.in += t.amount; r.transfer.out += t.amount; }
          else { r.transfer.out += t.amount; r.transfer.pending += t.amount; r.transfer.pendingCnt++; }
          r.transfer.cnt++;
        } else {
          if(t.to === bf){
            if(accepted){ if(!date || t.acceptedDate === date){ r.transfer.in += t.amount; r.transfer.cnt++; } }
            else { if(!date || t.date === date){ r.transfer.pending += t.amount; r.transfer.pendingCnt++; } }
          }
          if(t.from === bf){ if(!date || t.date === date){ r.transfer.out += t.amount; r.transfer.cnt++; } }
        }
        break;
      }
      case 'other_bank':
        if(t.dir === 'in'){ r.other.in += t.amount; r.other.cnt++; }
        else if(t.dir === 'online_in'){ r.other.onlineIn += t.amount; r.other.cnt++; }
        else if(t.dir === 'out'){ r.other.out += t.amount; r.other.cnt++; }
        else if(t.dir === 'online_out'){ r.other.onlineOut += t.amount; r.other.cnt++; }
        break;
      case 'support':
        if(t.dir === 'out') r.support.out += t.amount; else r.support.in += t.amount;
        r.support.cnt++; break;
      case 'customer':
        if(t.dir === 'in') r.customer.in += t.amount; else r.customer.out += t.amount;
        r.customer.cnt++; break;
    }
  });
  return r;
}
</script>

function openModal({ title, bodyHTML, wide=false, onMount }){
  const wrap = document.createElement('div');
  wrap.className = 'modal-overlay';
  wrap.innerHTML = `
    <div class="modal ${wide?'wide':''}">
      <div class="modal-head">
        <h3>${title}</h3>
        <button class="x" type="button">✕</button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
    </div>`;
  $('#modalRoot').appendChild(wrap);
  const close = () => wrap.remove();
  wrap.querySelector('.x').addEventListener('click', close);
  wrap.addEventListener('click', e => { if(e.target === wrap) close(); });
  if(onMount) onMount(wrap, close);
  return { wrap, close };
}

      function numInput(id){
        const el = wrap.querySelector('#'+id);
        return el ? (Number(String(el.value).replace(/[^0-9.\-]/g,'')) || 0) : 0;
      }
      function calcVaultCash(){
        let total = 0;
        wrap.querySelectorAll('[id^="bs_note_"]').forEach(inp => {
          const v = parseInt(String(inp.value).replace(/[^0-9]/g,''),10) || 0;
          total += v * Number(inp.dataset.denom);
        });
        return total;

        const bank = numInput('bs_bank');
        const other = numInput('bs_other');

        wrap.querySelector('#bs_cash').textContent = '৳ ' + fmt(cash);

      wrap.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTotals));

      loadBranchData(branchSel.value);

        const br = branchSel.value;

        const other = numInput('bs_other');
        const vaultNotes = {};
        DENOMS.forEach(d => {

        });
        const cash = DENOMS.reduce((s,d)=> s + vaultNotes[d]*d, 0);

        DB().baseAccounts[br] = { bank, cash, other };
        DB().liveAccounts[br] = { bank, cash, other };
        DB().baseVault[br] = {};
        DENOMS.forEach(d => { DB().baseVault[br][d] = vaultNotes[d]; });
        DB().liveVault[br] = {};
        DENOMS.forEach(d => { DB().liveVault[br][d] = vaultNotes[d]; });

        if(!DB().dailyClose) DB().dailyClose = {};
        const d0 = todayStr();
        if(!DB().dailyClose[d0]) DB().dailyClose[d0] = { accounts:{}, vault:{} };
        DB().dailyClose[d0].accounts[br] = { bank, cash, other };
        DB().dailyClose[d0].vault[br] = { ...vaultNotes };

        await saveDB();
        close();
        renderDashboard();
        toast('✅ ' + BRANCHES[br].name + ' আপডেট — ৳ ' + fmt(bank + cash + other));
      });

      wrap.querySelector('#bs_cancel').addEventListener('click', close);
    }
  });
}

/* প্রথমবার সেটআপ উইজার্ড */
function isSystemEmpty(){
  if(db.__firstSetupDone === true) return false;
  const anyMoney = Object.keys(BRANCHES).some(br => {
    const acc = DB().baseAccounts[br] || {};
    const vault = DB().baseVault[br] || {};
    const hasM = (Number(acc.bank)||0) + (Number(acc.cash)||0) + (Number(acc.other)||0);
    const hasN = DENOMS.reduce((s,d)=> s + (Number(vault[d])||0), 0);
    return hasM > 0 || hasN > 0;
  });
  const hasTx = (DB().txs || []).length > 0;
  return !anyMoney && !hasTx;
}

      <div class="field"><label>শুরু করার শাখা</label>
        <select id="sw_branch">
          <option value="kalaroa"  ${bf==='kalaroa'?'selected':''}>কলারোয়া শাখা</option>
          <option value="jhaudanga" ${bf==='jhaudanga'?'selected':''}>ঝাউডাঙ্গা শাখা</option>
        </select>
      </div>
    </div>
    <h4 style="font-size:13.5px;color:#9fe9ff;margin:18px 0 10px;font-weight:800">💰 অ্যাকাউন্ট ব্যালেন্স</h4>
    <div class="form-row">
      <div class="field"><label>🏦 ব্যাংক সিস্টেম অ্যাকাউন্ট ব্যালেন্স</label>
        <input type="text" inputmode="decimal" id="sw_bank" placeholder="0.00"
               style="font-size:17px;font-weight:800;color:#22e6ff;padding:14px"></div>
      <div class="field"><label>🏛️ অন্যান্য ব্যাংকে জমা</label>
        <input type="text" inputmode="decimal" id="sw_other" placeholder="0.00"
               style="font-size:17px;font-weight:800;color:#ffcb2b;padding:14px"></div>
    </div>
    <h4 style="font-size:13.5px;color:#d3ffa8;margin:18px 0 10px;font-weight:800">📦 ভল্টের নোট</h4>
    <div class="notes-col">
      <div class="notes-row">
        ${DENOMS.map(d => `
          <div class="note-item">
            <label>৳ ${toBn(d)}</label>
            <input type="text" inputmode="numeric" autocomplete="off"
                   id="sw_note_${d}" data-denom="${d}" value="" placeholder="0">
          </div>`).join('')}
      </div>
      <div class="sum-line">
        <span>💵 ক্যাশ ইন হ্যান্ড</span>
        <b id="sw_cash">৳ 0.00</b>
      </div>
    </div>
    <div class="total-preview" style="margin-top:18px">
      <div class="l">মোট শুরুর ব্যালেন্স</div>
      <div class="v rgb" id="sw_total">৳ 0.00</div>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
      <button class="btn green" id="sw_save" style="flex:1;min-width:200px">💾 সেটআপ শুরু করুন</button>
      <button class="btn gray"  id="sw_cancel" style="flex:1;min-width:120px">বাতিল</button>
    </div>
  `;

  openModal({
    title: '🎬 প্রথমবার সেটআপ উইজার্ড',
    bodyHTML: body, wide: true,
    onMount: (wrap, close) => {
      function getBranch(){ return wrap.querySelector('#sw_branch')?.value || bf; }
      function numInput(id){
        const el = wrap.querySelector('#'+id);
        return el ? (Number(String(el.value).replace(/[^0-9.\-]/g,'')) || 0) : 0;
      }
      function calcVaultCash(){
        let total = 0;
        wrap.querySelectorAll('[id^="sw_note_"]').forEach(inp => {
          const v = parseInt(String(inp.value).replace(/[^0-9]/g,''),10) || 0;
          total += v * Number(inp.dataset.denom);
        });
        return total;
      }
      function updateTotals(){
        const bank = numInput('sw_bank');
        const other = numInput('sw_other');
        const cash = calcVaultCash();
        wrap.querySelector('#sw_cash').textContent = '৳ ' + fmt(cash);
        wrap.querySelector('#sw_total').textContent = '৳ ' + fmt(bank + cash + other);
      }
      wrap.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTotals));
      updateTotals();

      wrap.querySelector('#sw_save').addEventListener('click', async () => {
        const br = getBranch();
        const bank = numInput('sw_bank');
        const other = numInput('sw_other');
        const vaultNotes = {};
        DENOMS.forEach(d => {
          const inp = wrap.querySelector('#sw_note_'+d);
          vaultNotes[d] = inp ? (parseInt(String(inp.value).replace(/[^0-9]/g,''),10) || 0) : 0;
        });
        const cash = DENOMS.reduce((s,d)=> s + vaultNotes[d]*d, 0);

        DB().baseAccounts[br] = { bank, cash, other };
        DB().liveAccounts[br] = { bank, cash, other };
        DB().baseVault[br] = {};
        DENOMS.forEach(d => { DB().baseVault[br][d] = vaultNotes[d]; });
        DB().liveVault[br] = {};
        DENOMS.forEach(d => { DB().liveVault[br][d] = vaultNotes[d]; });

        if(!DB().dailyClose) DB().dailyClose = {};
        const d0 = todayStr();
        if(!DB().dailyClose[d0]) DB().dailyClose[d0] = { accounts:{}, vault:{} };
        DB().dailyClose[d0].accounts[br] = { bank, cash, other };
        DB().dailyClose[d0].vault[br] = { ...vaultNotes };

        DB().lastBaseDate = d0;
        DB().__firstSetupDone = true;

        await saveDB();
        close();
        renderDashboard();
        toast('✅ সেটআপ সম্পন্ন — ৳ ' + fmt(bank + cash + other));
      });

      wrap.querySelector('#sw_cancel').addEventListener('click', () => {
        DB().__firstSetupDone = true;
        saveDB();
        close();
      });
    }
  });
}
</script>

<script>
/* Backup */
function openBackupModal(){
  if(session.role !== 'admin'){ toast('শুধু অ্যাডমিন'); return; }
  openModal({
    title: '💾 ব্যাকআপ / রিস্টোর',
    bodyHTML: `
      <div class="accept-head">📦 পূর্ণ ডেটাবেস JSON ফাইলে ডাউনলোড করুন বা রিস্টোর করুন।</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <button class="btn green" id="bk_down" style="flex:1;min-width:160px">📥 ডাউনলোড</button>
        <button class="btn" id="bk_up_btn" style="flex:1;min-width:160px">📤 রিস্টোর</button>
        <input type="file" id="bk_file" accept=".json" style="display:none">
      </div>
      <div class="bank-hint">💡 প্রতিদিন কাজ শেষে ব্যাকআপ ডাউনলোড করে রাখুন।</div>
      <div class="field" style="margin-top:16px">
        <label>ডেটাবেস স্ট্যাটাস</label>
        <div style="font-size:12.5px;color:#8b95c9;line-height:1.9">
          • লেনদেন: <b style="color:#8dff3f">${toBn(DB().txs.length)}</b><br>
          • গ্রাহক: <b style="color:#8dff3f">${toBn(DB().customers.length)}</b><br>
          • শেষ base তারিখ: <b>${toBn(DB().lastBaseDate || '-')}</b><br>
          • Supabase: <b>${supabaseReady ? '🟢 সক্রিয়' : '🔴 নিষ্ক্রিয়'}</b>
        </div>
      </div>`,
    onMount: (wrap, close) => {
      wrap.querySelector('#bk_down').addEventListener('click', () => {
        const data = JSON.stringify(DB(), null, 2);
        const blob = new Blob([data], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cc_agent_bank_backup_' + todayStr() + '.json';
        a.click();
        URL.revokeObjectURL(url);
        toast('📥 ব্যাকআপ ডাউনলোড');
      });
      wrap.querySelector('#bk_up_btn').addEventListener('click', () => wrap.querySelector('#bk_file').click());
      wrap.querySelector('#bk_file').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if(!f) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try{
            const data = JSON.parse(ev.target.result);
            if(!data.users || !data.baseVault){ alert('❌ ভুল ফাইল'); return; }
            if(!confirm('বর্তমান ডেটা মুছে রিস্টোর হবে। চালিয়ে যাবেন?')) return;
            db = data;
            normalizeDB();
            await ensureDefaultUsers();
            recomputeLive();
            await saveDB();
            close();
            renderTopbar();
            renderDashboard();
            toast('✅ রিস্টোর সফল');
          }catch(err){ alert('❌ ' + err.message); }
        };
        reader.readAsText(f);
      });
    }
  });
}

/* লেনদেন মডাল */
function branchOpts(sel){
  return Object.entries(BRANCHES).map(([k,v]) =>
    `<option value="${k}" ${k===sel?'selected':''}>${v.name}</option>`).join('');
}
function bankOpts(sel){
  return Object.entries(BANKS).map(([k,v]) =>
    `<option value="${k}" ${k===sel?'selected':''}>${v.name}</option>`).join('');
}
function dirOptions(type, cur){
  if(type === 'other_bank') return `
    <option value="in"          ${cur==='in'?'selected':''}>📥 ফিজিক্যালি আসা (+)</option>
    <option value="online_in"   ${cur==='online_in'?'selected':''}>💳 অনলাইনে আসা (+)</option>
    <option value="out"         ${cur==='out'?'selected':''}>📤 ফিজিক্যালি পাঠানো (−)</option>
    <option value="online_out"  ${cur==='online_out'?'selected':''}>💳 অনলাইন পাঠানো (−)</option>`;
  if(type === 'support') return `
    <option value="out" ${cur==='out'?'selected':''}>প্রদান (+)</option>
    <option value="in"  ${cur==='in'?'selected':''}>ফেরত (−)</option>`;
  return `
    <option value="in"  ${cur==='in'?'selected':''}>গ্রহণ (+)</option>
    <option value="out" ${cur==='out'?'selected':''}>পাঠানো (−)</option>`;
}
function notesRowHTML(prefix, values){
  values = values || {};
  return `<div class="notes-row">` + DENOMS.map(d => `
    <div class="note-item">
      <label>৳ ${toBn(d)}</label>
      <input type="text" inputmode="numeric" autocomplete="off"
             id="${prefix}_${d}" data-denom="${d}"
             value="${values[d] ? values[d] : ''}" placeholder="0">
    </div>`).join('') + `</div>`;
}

  openModal({

    onMount: (w, close) => setupTxForm(w, type, editing, close, activeBranchForForm)

function setupTxForm(wrap, type, editing, close, activeBranchForForm){
  const cfg = TX_CFG[type];
  const sumOutEl = wrap.querySelector('#sumOut');
  const sumInEl  = wrap.querySelector('#sumIn');
  const netEl    = wrap.querySelector('#netAmt');
  const noteBox  = wrap.querySelector('#noteDetailContent');
  const isTransfer = type === 'branch_transfer';
  const hasDir = !!cfg.dir;
  const hasOnline = !!cfg.online;
  const hasBranchToggle = !!cfg.cust;

  function updateCrossBranchNote(){
    const noteEl = wrap.querySelector('#crossBranchNote');
    if(!noteEl) return;
    const hidden = wrap.querySelector('#f_custBranch_hidden');
    const custBranch = hidden ? hidden.value : null;
    const txnBranchEl = wrap.querySelector('#f_branch');
    const txnBranch = txnBranchEl ? txnBranchEl.value : null;
    if(custBranch && txnBranch && custBranch !== txnBranch){
      noteEl.style.display = 'block';
      if(wrap.querySelector('#cbCust')) wrap.querySelector('#cbCust').textContent = BRANCHES[custBranch].name;
      if(wrap.querySelector('#cbTxn'))  wrap.querySelector('#cbTxn').textContent = BRANCHES[txnBranch].name;
    } else {
      noteEl.style.display = 'none';
    }
  }

  if(hasBranchToggle){
    const btns = wrap.querySelectorAll('.branch-toggle-btn');
    const hidden = wrap.querySelector('#f_custBranch_hidden');
    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        hidden.value = btn.dataset.bbranch;
        updateCrossBranchNote();
      });
    });
    const txnBranchEl = wrap.querySelector('#f_branch');
    if(txnBranchEl) txnBranchEl.addEventListener('change', updateCrossBranchNote);
    updateCrossBranchNote();
  }

  let autoCopyEnabled = true;
  wrap.querySelectorAll('[id^="in_"]').forEach(inp => {
    inp.addEventListener('focus', () => { autoCopyEnabled = false; });
  });

  function isOnlineMode(){
    if(!hasOnline) return false;
    const dirEl = wrap.querySelector('#f_dir');
    return dirEl && (dirEl.value === 'online_in' || dirEl.value === 'online_out');
  }

  function applyDirectionState(){
    if(!hasDir) return;
    const dirEl = wrap.querySelector('#f_dir');
    if(!dirEl) return;
    const dir = dirEl.value;
    const outCol = wrap.querySelector('#outCol');
    const inCol = wrap.querySelector('#inCol');
    const notesCols = wrap.querySelector('#notesCols');
    const onlineBox = wrap.querySelector('#onlineBox');
    const noteDetailBox = wrap.querySelector('#noteDetailBox');
    const hint = wrap.querySelector('#dirHint');
    const clearNotes = (prefix) => {
      wrap.querySelectorAll('[id^="'+prefix+'_"]').forEach(inp => inp.value = '');
    };
    if(dir === 'online_in' || dir === 'online_out'){
      if(notesCols) notesCols.style.display = 'none';
      if(noteDetailBox) noteDetailBox.style.display = 'none';
      if(onlineBox){
        onlineBox.classList.add('active');
        const desc = wrap.querySelector('#onlineDesc');
        if(dir === 'online_in'){
          desc.className = 'desc pos';
          desc.innerHTML = '💡 অনলাইনে আসা — ব্যাংক সিস্টেমে <b style="color:#8dff3f">যোগ</b>';
        } else {
          desc.className = 'desc neg';
          desc.innerHTML = '💡 অনলাইন পাঠানো — ব্যাংক সিস্টেম থেকে <b style="color:#ff2e88">বিয়োগ</b>';
        }
      }
      if(hint) hint.style.display = 'none';
    } else {
      if(notesCols) notesCols.style.display = 'grid';
      if(noteDetailBox) noteDetailBox.style.display = 'block';
      if(onlineBox) onlineBox.classList.remove('active');
      if(hint) hint.style.display = 'block';
    }
    if(type === 'other_bank'){
      if(dir === 'in'){ outCol.classList.add('disabled'); inCol.classList.remove('disabled'); clearNotes('out'); }
      else if(dir === 'out'){ outCol.classList.remove('disabled'); inCol.classList.add('disabled'); clearNotes('in'); }
      else { outCol.classList.remove('disabled'); inCol.classList.remove('disabled'); }
    } else if(type === 'support'){
      if(dir === 'out'){ outCol.classList.remove('disabled'); inCol.classList.add('disabled'); clearNotes('in'); }
      else { outCol.classList.add('disabled'); inCol.classList.remove('disabled'); clearNotes('out'); }
    }
  }

  if(hasDir){
    const dirEl = wrap.querySelector('#f_dir');
    if(dirEl) dirEl.addEventListener('change', () => { applyDirectionState(); recalc(); });
    applyDirectionState();
  }

  const onlineAmt = wrap.querySelector('#online_amount');
  if(onlineAmt){
    onlineAmt.addEventListener('input', () => {
      onlineAmt.value = onlineAmt.value.replace(/[^0-9.]/g,'');
      const v = parseFloat(onlineAmt.value) || 0;
      const pv = wrap.querySelector('#onlineAmountPreview');
      if(pv) pv.textContent = '৳ ' + fmt(v);
      recalc();
    });
    const v = parseFloat(onlineAmt.value) || 0;
    const pv = wrap.querySelector('#onlineAmountPreview');
    if(pv) pv.textContent = '৳ ' + fmt(v);
  }

  function recalc(){
    if(isTransfer && autoCopyEnabled){
      const outNotes = readNotes(wrap, 'out');
      wrap.querySelectorAll('[id^="in_"]').forEach(inp => {
        const d = inp.dataset.denom;
        const tgt = outNotes[d] || '';
        if(inp.value === '' || inp.dataset.autofilled === 'true'){
          inp.value = tgt;
          inp.dataset.autofilled = tgt ? 'true' : 'false';
        }
      });
    }
    const outNotes = readNotes(wrap, 'out');
    const inNotes = readNotes(wrap, 'in');
    const out = noteSum(outNotes), inSum = noteSum(inNotes);
    sumOutEl.textContent = '৳ ' + fmt(out);
    sumInEl.textContent = '৳ ' + fmt(inSum);
    if(isOnlineMode()){
      const v = parseFloat(wrap.querySelector('#online_amount')?.value) || 0;
      netEl.textContent = '৳ ' + fmt(v);
    } else if(isTransfer){
      netEl.textContent = '৳ ' + fmt(Math.max(out, inSum));
    } else {
      netEl.textContent = '৳ ' + fmt(Math.abs(out - inSum));
    }
    let html = '';
    if(Object.keys(outNotes).length){
      html += `<div style="margin-bottom:6px"><span style="color:#ffb3d1;font-weight:700">📤</span><br>${noteDetailHTML(outNotes)}</div>`;
    }
    if(Object.keys(inNotes).length){
      html += `<div><span style="color:#d3ffa8;font-weight:700">📥</span><br>${noteDetailHTML(inNotes)}</div>`;
    }
    noteBox.innerHTML = html || '—';
  }
  wrap.querySelectorAll('.note-item input').forEach(i => i.addEventListener('input', recalc));
  recalc();

  function renderPending(){
    if(!isTransfer) return;
    const box = wrap.querySelector('#pendingArea');
    if(!box) return;
    const bf = currentBranchFilter();
    const myBranch = session.role === 'admin' ? (bf === 'all' ? null : bf) : session.branch;
    let pending = DB().txs.filter(t => t.type === 'branch_transfer' && !t.accepted);
    if(myBranch) pending = pending.filter(t => t.to === myBranch);
    if(!pending.length){
      box.innerHTML = `<div class="pending-box"><h4>⏳ অপেক্ষমাণ</h4><div class="pending-empty">নেই ✅</div></div>`;
      return;
    }
    box.innerHTML = `
      <div class="pending-box">
        <h4>⏳ অপেক্ষমাণ শাখা-থেকে-শাখা</h4>
        ${pending.map(t => `
          <div class="pending-item">
            <div class="info"><b>${esc(BRANCHES[t.from]?.name || t.from)}</b> ➜ <b>${esc(BRANCHES[t.to]?.name || t.to)}</b>
              <small>${toBn(t.date)} • ৳ ${fmt(t.amount)} • ${esc(t.user||'')}</small></div>
            <div style="display:flex;gap:6px">
              <button class="mini accept" data-accept="${t.id}">✅</button>
              ${session.role === 'admin' ? `<button class="mini danger" data-del="${t.id}">🗑️</button>` : ''}
            </div>
          </div>`).join('')}
      </div>`;
    box.querySelectorAll('[data-accept]').forEach(b =>
      b.addEventListener('click', () => acceptTransfer(b.dataset.accept, wrap, type, close)));
    box.querySelectorAll('[data-del]').forEach(b =>
      b.addEventListener('click', async () => {
        if(confirm('ডিলিট?')){ await deleteTx(b.dataset.del); close(); openTxModal(type); }
      }));
  }
  renderPending();

  const searchEl = wrap.querySelector('#f_search');
  const sugEl = wrap.querySelector('#f_suggest');
  if(searchEl){
    searchEl.addEventListener('input', () => {
      /* ✅ সব শাখার গ্রাহক suggestion এ আসবে */
      let list = searchCustomers(searchEl.value);
      if(!list.length){ sugEl.innerHTML = ''; return; }
      sugEl.innerHTML = list.map(c => `
        <div class="sug-item" data-id="${c.id}">
          <b>${esc(c.name)}</b> — <small>${esc(c.accountNo)}</small><br>
          <small>📱 ${esc(c.mobile||'-')} • 📍 ${esc(c.address||'-')} • 🏦 ${esc(BRANCHES[c.branch]?.name||'')}</small>
        </div>`).join('');
      sugEl.querySelectorAll('.sug-item').forEach(el => {
        el.addEventListener('click', () => {
          const c = DB().customers.find(x => x.id === el.dataset.id);
          if(!c) return;
          wrap.querySelector('#f_acc').value = c.accountNo || '';
          wrap.querySelector('#f_name').value = c.name || '';
          wrap.querySelector('#f_mobile').value = c.mobile || '';
          wrap.querySelector('#f_addr').value = c.address || '';
          searchEl.value = c.accountNo || c.name;
          sugEl.innerHTML = '';

          /* ✅ গ্রাহকের শাখা auto select */
          if(c.branch && hasBranchToggle){
            const btns = wrap.querySelectorAll('.branch-toggle-btn');
            btns.forEach(b => {
              if(b.dataset.bbranch === c.branch){ b.classList.add('active'); }
              else { b.classList.remove('active'); }
            });
            const hiddenB = wrap.querySelector('#f_custBranch_hidden');
            if(hiddenB) hiddenB.value = c.branch;
            updateCrossBranchNote();
          }
        });
      });
    });
  }

  const editCustBtn = wrap.querySelector('#f_editCust');
  if(editCustBtn){
    editCustBtn.addEventListener('click', async () => {
      const hiddenB = wrap.querySelector('#f_custBranch_hidden');
      const selB = wrap.querySelector('#f_branch');
      let br = hiddenB?.value || selB?.value || (editing?.custBranch || editing?.branch) || session.branch;
      const data = {
        accountNo: wrap.querySelector('#f_acc').value.trim(),
        name: wrap.querySelector('#f_name').value.trim(),
        mobile: wrap.querySelector('#f_mobile').value.trim(),
        address: wrap.querySelector('#f_addr').value.trim(),
        branch: br
      };
      if(!data.accountNo && !data.name){ alert('অ্যাকাউন্ট বা নাম দিন'); return; }
      upsertCustomer(data);
      await saveDB();
      editCustBtn.textContent = '✅ সেভ';
      setTimeout(()=> editCustBtn.textContent = '✏️ সেভ', 1500);
    });
  }

  const rDate = wrap.querySelector('#r_date');
  const rBody = wrap.querySelector('#r_body');
  let currentReportList = [];
  function renderReport(){
    const dateVal = rDate.value;
    let list = DB().txs.filter(t => t.type === type);
    const bf = currentBranchFilter();
    if(session.role !== 'admin'){
      list = list.filter(t => t.branch === session.branch || t.from === session.branch || t.to === session.branch || t.custBranch === session.branch);
    } else if(bf !== 'all'){
      list = list.filter(t => t.branch === bf || t.from === bf || t.to === bf || t.custBranch === bf);
    }
    if(dateVal){
      list = list.filter(t => {
        if(t.type === 'branch_transfer'){
          if(session.role === 'admin'){
            if(bf === 'all') return t.date === dateVal || t.acceptedDate === dateVal;
            if(t.from === bf) return t.date === dateVal;
            if(t.to === bf) return t.acceptedDate === dateVal;
          } else {
            if(t.from === session.branch) return t.date === dateVal;
            if(t.to === session.branch) return t.acceptedDate === dateVal;
          }
        }
        return t.date === dateVal;
      });
    }
    list.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
    currentReportList = list;
    rBody.innerHTML = txListHTML(list, { admin: session.role === 'admin', transfer: isTransfer });
    rBody.querySelectorAll('[data-edit]').forEach(b =>
      b.addEventListener('click', async () => { close(); openTxModal(type, b.dataset.edit); }));
    rBody.querySelectorAll('[data-del]').forEach(b =>
      b.addEventListener('click', async () => {
        if(confirm('ডিলিট?')){ await deleteTx(b.dataset.del); close(); openTxModal(type); }
      }));
    rBody.querySelectorAll('[data-accept]').forEach(b =>
      b.addEventListener('click', () => acceptTransfer(b.dataset.accept, wrap, type, close)));
  }
  if(rDate) rDate.addEventListener('change', renderReport);
  const allBtn = wrap.querySelector('#r_all');
  if(allBtn) allBtn.addEventListener('click', ()=>{ rDate.value=''; renderReport(); });
  renderReport();

  const pdfBtn = wrap.querySelector('#r_pdf');
  if(pdfBtn){
    pdfBtn.addEventListener('click', () => {
      const rows = currentReportList.map(t => buildReportRow(t));
      const total = currentReportList.reduce((s,t)=> s + Number(t.amount||0), 0);
      rows.push(['', '', '', '', 'TOTAL', 'BDT ' + fmt(total), '', '', '', '']);
      exportToPDF('Report: ' + txEN(type), REPORT_HEADERS, rows, 'report_' + type + '.pdf');
    });
  }
  const xlsxBtn = wrap.querySelector('#r_xlsx');
  if(xlsxBtn){
    xlsxBtn.addEventListener('click', () => {
      const rows = currentReportList.map(t => buildReportRow(t));
      const total = currentReportList.reduce((s,t)=> s + Number(t.amount||0), 0);
      rows.push(['', '', '', '', 'TOTAL', 'BDT ' + fmt(total), '', '', '', '']);
      exportToXLSX('Report: ' + txEN(type), REPORT_HEADERS, rows, 'report_' + type + '.xlsx');
    });
  }

  wrap.querySelector('#f_save').addEventListener('click', async () => {
    const date = wrap.querySelector('#f_date').value || todayStr();
    const outNotes = readNotes(wrap, 'out');
    const inNotes = readNotes(wrap, 'in');
    const outSum = noteSum(outNotes), inSum = noteSum(inNotes);
    const amount = Math.abs(outSum - inSum);
    let dir = wrap.querySelector('#f_dir') ? wrap.querySelector('#f_dir').value : null;
    let onlineAmount = 0;
    if(isOnlineMode()){
      onlineAmount = parseFloat(wrap.querySelector('#online_amount').value) || 0;
      if(onlineAmount <= 0){ alert('পরিমাণ দিন'); return; }
    } else if(type === 'branch_transfer'){
      if(outSum <= 0 && inSum <= 0){ alert('অন্তত একটি নোট'); return; }
    } else if(type === 'other_bank'){
      if(dir === 'in' && inSum <= 0){ alert('📥 কলামে নোট দিন'); return; }
      if(dir === 'out' && outSum <= 0){ alert('💸 কলামে নোট দিন'); return; }
    } else if(type === 'support'){
      if(dir === 'out' && outSum <= 0){ alert('💸 কলামে নোট দিন'); return; }
      if(dir === 'in' && inSum <= 0){ alert('📥 কলামে নোট দিন'); return; }
    } else if(amount <= 0){ alert('অন্তত একটি নোট'); return; }

    let branch;
    if(type === 'branch_transfer'){
      const from = wrap.querySelector('#f_from').value;
      const to = wrap.querySelector('#f_to').value;
      if(from === to){ alert('একই শাখা নয়'); return; }
      branch = from;
    } else {
      const hiddenB = wrap.querySelector('#f_custBranch_hidden');
      if(hiddenB && hiddenB.value && cfg.cust){ branch = hiddenB.value; }
      else {
        const bs = wrap.querySelector('#f_branch');
        branch = bs ? bs.value : (editing ? editing.branch : (session.role==='admin' ? (viewBranch==='all'?'kalaroa':viewBranch) : session.branch));
      }
    }
    let txnBranch = branch;
    if(cfg.cust){
      const bs = wrap.querySelector('#f_branch');
      if(bs) txnBranch = bs.value;
      else if(session.role !== 'admin') txnBranch = session.branch;
    }
    let custBranch;
    if(cfg.cust){
      const hiddenCustB = wrap.querySelector('#f_custBranch_hidden');
      custBranch = (hiddenCustB && hiddenCustB.value) ? hiddenCustB.value : txnBranch;
    } else custBranch = txnBranch;
    const bankKey = wrap.querySelector('#f_bank') ? wrap.querySelector('#f_bank').value : null;
    let txAmount;
    if(isOnlineMode()) txAmount = onlineAmount;
    else if(type === 'branch_transfer') txAmount = Math.max(outSum, inSum);
    else if(dir === 'in') txAmount = inSum;
    else if(dir === 'out') txAmount = outSum;
    else txAmount = amount;

    const tx = {
      id: editing ? editing.id : uid(),
      type, date, branch: txnBranch, custBranch, bank: bankKey,
      from: type === 'branch_transfer' ? wrap.querySelector('#f_from').value : null,
      to: type === 'branch_transfer' ? wrap.querySelector('#f_to').value : null,
      dir, amount: Math.round(txAmount*100)/100,
      onlineAmount: isOnlineMode() ? onlineAmount : null,
      onlineRef: isOnlineMode() ? (wrap.querySelector('#online_ref')?.value.trim() || '') : null,
      notesOut: outNotes, notesIn: inNotes,
      custAcc: wrap.querySelector('#f_acc') ? wrap.querySelector('#f_acc').value.trim() : '',
      custName: cfg.cust ? (wrap.querySelector('#f_name') ? wrap.querySelector('#f_name').value.trim() : '') : '',
      customNote: !cfg.cust && wrap.querySelector('#f_name') ? wrap.querySelector('#f_name').value.trim() : '',
      custMobile: wrap.querySelector('#f_mobile') ? wrap.querySelector('#f_mobile').value.trim() : '',
      custAddr: wrap.querySelector('#f_addr') ? wrap.querySelector('#f_addr').value.trim() : '',
      note: (!cfg.cust && wrap.querySelector('#f_name') ? wrap.querySelector('#f_name').value.trim() : '') || wrap.querySelector('#f_note').value.trim(),
      user: session.name, userUsername: session.username,
      createdAt: editing ? editing.createdAt : new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      accepted: type === 'branch_transfer' ? false : true,
      acceptedDate: null, acceptedBy: null, acceptedByUsername: null, acceptedAt: null
    };
    if(cfg.cust && (tx.custAcc || tx.custName)){
      upsertCustomer({ accountNo: tx.custAcc, name: tx.custName, mobile: tx.custMobile, address: tx.custAddr, branch: custBranch });
    }
    if(editing){
      const i = DB().txs.findIndex(t => t.id === editing.id);
      if(i >= 0){
        tx.accepted = DB().txs[i].accepted;
        tx.acceptedDate = DB().txs[i].acceptedDate;
        tx.acceptedBy = DB().txs[i].acceptedBy;
        tx.acceptedByUsername = DB().txs[i].acceptedByUsername;
        tx.acceptedAt = DB().txs[i].acceptedAt;
        DB().txs[i] = tx;
      }
    } else DB().txs.push(tx);

    await saveDB();
    close();
    renderDashboard();
    toast('✅ সংরক্ষিত — ৳' + fmt(txAmount));
  });
  wrap.querySelector('#f_close').addEventListener('click', close);
}

async function acceptTransfer(id, wrap, type, close){
  const t = DB().txs.find(x => x.id === id);
  if(!t || t.accepted) return;
  if(session.role !== 'admin' && session.branch !== t.to){ alert('শুধু গ্রহণকারী শাখা'); return; }
  if(!confirm('গ্রহণ করবেন?')) return;
  const idx = DB().txs.findIndex(x => x.id === id);
  if(idx < 0) return;
  DB().txs[idx].accepted = true;
  DB().txs[idx].acceptedDate = todayStr();
  DB().txs[idx].acceptedAt = new Date().toISOString();
  DB().txs[idx].acceptedBy = session.name;
  DB().txs[idx].acceptedByUsername = session.username;
  recomputeLive();
  await saveDB();
  if(close) close();
  renderTopbar(); renderDashboard();
  toast('✅ গৃহীত');
}

async function deleteTx(id){
  DB().txs = DB().txs.filter(x => x.id !== id);
  await saveDB();
  renderDashboard();
  toast('🗑️ ডিলিট');
}
