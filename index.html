<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>কম্পিউটার ক্যাম্পাস | এজেন্ট ব্যাংকিং সিস্টেম</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<!-- CDN Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body>

<!-- ═══════════════════════════════════════════ -->
<!-- LOGIN SCREEN -->
<!-- ═══════════════════════════════════════════ -->
<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:78px;height:78px;">
        <circle cx="50" cy="50" r="47" fill="#000" stroke="#fff" stroke-width="2.5"/>
        <g transform="translate(50,50)" fill="#fff">
          <path d="M -22 -12 L 0 -28 L 22 -12 Z"/>
          <rect x="-18" y="-8" width="4" height="22" rx="1"/>
          <rect x="-8" y="-8" width="4" height="22" rx="1"/>
          <rect x="4" y="-8" width="4" height="22" rx="1"/>
          <rect x="14" y="-8" width="4" height="22" rx="1"/>
          <rect x="-22" y="14" width="44" height="4" rx="1.5"/>
        </g>
      </svg>
    </div>
    <h1 class="rgb">কম্পিউটার ক্যাম্পাস</h1>
    <h2>এজেন্ট ব্যাংকিং সিস্টেম • কলারোয়া ও ঝাউডাঙ্গা আউটলেট</h2>
    <div class="field"><label>ইউজার আইডি</label><input type="text" id="loginUser" placeholder="আপনার আইডি" autocomplete="off"></div>
    <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="loginPass" placeholder="পাসওয়ার্ড" autocomplete="new-password"></div>
    <button class="btn block pink" id="loginBtn">🔐 লগইন করুন</button>
    <div id="loginErr" style="color:#fff;font-size:13px;text-align:center;margin-top:10px;min-height:18px"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- MAIN APP -->
<!-- ═══════════════════════════════════════════ -->
<div id="app" class="hidden">
  <header class="topbar" id="topbar"></header>
  <main>
    <section class="section" id="dateBannerSection"></section>
    <section class="section" id="statsSection"></section>
    <section class="section" id="vaultSection"></section>
    <section class="section" id="balanceSection"></section>
    <div class="dual-sections-wrap">
      <section class="section" id="dueSection"></section>
      <section class="section" id="collectionPendingSection"></section>
    </div>
  </main>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- SIDEBAR -->
<!-- ═══════════════════════════════════════════ -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<aside id="sidebar" class="sidebar">
  <div class="sidebar-head">
    <h3>⚙️ মেনু</h3>
    <button class="sb-close" id="sidebarClose">✕</button>
  </div>
  <div class="sidebar-body" id="sidebarBody"></div>
</aside>

<!-- ═══════════════════════════════════════════ -->
<!-- MODAL ROOT + SYNC INDICATOR -->
<!-- ═══════════════════════════════════════════ -->
<div id="modalRoot"></div>
<div id="syncIndicator" class="sync-indicator">সিঙ্ক</div>

<!-- Phase 6: Render -->

<!-- Phase 7: Login + Init -->
<script src="js/90-login.js"></script>
<script src="js/95-perf-overrides.js"></script>
<script src="js/96-fix-live-sync.js"></script>

</body>
</html>
