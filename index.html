function openCollectionChildModal(parentId, mode){
  const found = findTxAnywhere(parentId); if(!found || !found.tx){ toast('❌ নেই'); return; }
  const parent = found.tx;
  const owed = Number(parent.cashNotTakenAmount) || Number(parent.amount) || 0;
  const collected = Number(parent.collectedAmount) || 0;
  const pending = Math.round((owed - collected)*100)/100;
  if(pending <= 0.01){ toast('✅ সম্পূর্ণ'); return; }
  const isC = mode === 'cash';
  openModal({ title: isC ? '💵 ক্যাশ সংগ্রহ' : '🌐 অনলাইন', wide: true,
    bodyHTML: '<div class="accept-head" style="border-color:' + (isC?'rgba(34,197,94,.5)':'rgba(59,130,246,.5)') + '"><div>' + (isC ? '💵 ক্যাশ' : '🌐 অনলাইন') + '<br>👤 <b>' + esc(parent.custName||'-') + '</b><br>মূল ৳ ' + fmt(owed) + ' • বাকি <b style="color:#facc15">৳ ' + fmt(pending) + '</b>' + (parent.note ? '<div style="margin-top:8px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid rgba(250,204,21,.3);font-size:12.5px;color:#fde047;line-height:1.6">📝 মূল মন্তব্য: <b style="color:#fff">' + esc(parent.note) + '</b></div>' : '') + '</div></div><div class="form-row"><div class="field"><label>তারিখ</label><input type="date" id="cc_date" value="' + todayStr() + '"></div><div class="field"><label>আউটলেট</label>' + (session.role === 'admin' ? '<select id="cc_branch"><option value="kalaroa" ' + (parent.branch==='kalaroa'?'selected':'') + '>কলারোয়া</option><option value="jhaudanga" ' + (parent.branch==='jhaudanga'?'selected':'') + '>ঝাউডাঙ্গা</option></select>' : '<input type="hidden" id="cc_branch" value="' + parent.branch + '"><input type="text" value="' + BRANCHES[parent.branch].name + '" disabled>') + '</div><div class="field"><label>💰 পরিমাণ</label><input type="text" inputmode="decimal" id="cc_amount" value="' + pending.toFixed(2) + '" autocomplete="off"></div></div>' + (!isC ? '<div class="form-row"><div class="field"><label>ব্যাংক</label><select id="cc_bank">' + bankOpts('al_arafah_kalaroa') + '</select></div><div class="field"><label>প্রাপক</label><input type="text" id="cc_partner" autocomplete="off"></div></div>' : '<div class="notes-col out"><h4>💸 প্রদান</h4>' + notesRowHTML('cc_out', null) + '<div class="sum-line"><span>মোট</span><b id="cc_sumOut">৳ 0.00</b></div></div>') + '<div class="field"><label>📝 মন্তব্য</label><input type="text" id="cc_note" value="' + (isC ? 'ক্যাশ সংগ্রহ' : 'অনলাইন') + '" autocomplete="off"></div><div style="display:flex;gap:10px;margin-top:18px"><button class="btn ' + (isC?'green':'') + '" id="cc_save" style="flex:1">✅ সংগ্রহ</button></div>',
    onMount: (w, close) => {
      const so = w.querySelector('#cc_sumOut');
      function recalc(){ if(isC && so) so.textContent = '৳ ' + fmt(noteSum(readNotes(w, 'cc_out'))); }
      if(isC) w.querySelectorAll('.note-item input').forEach(inp => { attachAmountInput(inp, { decimal: false }); inp.addEventListener('input', recalc); });
      w.querySelectorAll('input[inputmode="decimal"]').forEach(inp => attachAmountInput(inp, { decimal: true }));
      recalc();
      w.querySelector('#cc_save').addEventListener('click', async ()=>{
        const b = w.querySelector('#cc_save'); b.disabled = true; const og = b.innerHTML; b.innerHTML = '<span class="spinner"></span>';
        try{
          const date = w.querySelector('#cc_date').value, br = w.querySelector('#cc_branch').value;
          const amt = Math.round(parseNum(w.querySelector('#cc_amount').value)*100)/100;
          /* ✅ নতুন: empty check with sorry message */
          if(isC){
            const _on = readNotes(w, 'cc_out');
            if(Object.keys(_on).length === 0){ sorryNoNote(); b.disabled = false; b.innerHTML = og; return; }
          }
          if(amt <= 0 || amt > pending + 0.01){ sorryNoNote(); b.disabled = false; b.innerHTML = og; return; }
          let on = {}, inN = {}, bk = null, pn = '';
          if(isC){ on = readNotes(w, 'cc_out'); if(Math.abs(noteSum(on) - amt) > 0.01){ alert('নোট যোগফল = ' + fmt(amt)); b.disabled = false; b.innerHTML = og; return; } }
          else { bk = w.querySelector('#cc_bank').value; pn = w.querySelector('#cc_partner').value.trim(); if(!pn){ alert('প্রাপক দিন'); b.disabled = false; b.innerHTML = og; return; } }
          const child = { id: uid(), type: 'loan_collection', date, branch: br, custBranch: parent.custBranch || parent.branch, dir: isC ? 'cash' : 'online_out', amount: amt, notesOut: on, notesIn: inN, bank: bk, partnerName: pn, custAcc: parent.custAcc, custName: parent.custName, note: w.querySelector('#cc_note').value.trim(), linkedParentId: parent.id, collectionMode: isC ? 'cash' : 'online', user: session.name, userUsername: session.username, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), year: date.slice(0,4), accepted: true, acceptedDate: date };
          DB().txs.push(child);
          const nc = Math.round(((Number(parent.collectedAmount) || 0) + amt)*100)/100;
          const ns = nc >= owed - 0.01 ? 'collected' : 'partial';
          updateTxAnywhere(parent.id, { collectedAmount: nc, collectionStatus: ns, updatedAt: new Date().toISOString() });
          addTxLog(parent.id, 'collect', { collectedAmount: { from: collected, to: nc }, collectionStatus: { from: parent.collectionStatus, to: ns } }, parent);
          addTxLog(child.id, 'create', { action: 'collection entry created' }, child);
          recomputeLive(); await saveDB();
          try{ await pushRemoteDB(true, [child]); }catch(e){}
          close(); renderDashboard(); renderSidebar();
          toast('✅ সংগ্রহ ৳ ' + fmt(amt));
        }catch(e){ alert('❌ ' + e.message); b.disabled = false; b.innerHTML = og; }
      });
    }
  });
}

function txListHTML(list, opts){

    if(t.type === 'loan_given' && t.collectionStatus === 'partial') extra = '⏳ আংশিক সংগ্রহ';

async function deleteTx(id){
  if(session.role !== 'admin'){ toast('🔒 শুধু অ্যাডমিন ডিলিট করতে পারবে'); return; }
  const t = DB().txs.find(x => x.id === id);
  if(!DB().deletedTxIds) DB().deletedTxIds = {};
  DB().deletedTxIds[id] = new Date().toISOString();
  DB().txs = DB().txs.filter(x=>x.id !== id);
  addTxLog(id, 'delete', { deleted: { from: 'active', to: 'deleted' } }, t);
  recomputeLive(); await saveDB();
  try{ await pushRemoteDB(true); }catch(e){}
  renderDashboard(); renderSidebar();
  toast('🗑️ ডিলিট');
}

}

function openUserManager(){
  if(session.role !== 'admin'){ toast('শুধু অ্যাডমিন'); return; }
  openModal({ title: '👥 ইউজার ম্যানেজমেন্ট', wide: true,
    bodyHTML: '<div class="cust-box" style="margin-bottom:14px"><div class="head"><h4>➕ নতুন ইউজার তৈরি</h4></div><div class="form-row"><div class="field"><label>নাম</label><input type="text" id="u_name" placeholder="পূর্ণ নাম" autocomplete="off"></div><div class="field"><label>আইডি (লগইন)</label><input type="text" id="u_user" placeholder="username" autocomplete="off"></div><div class="field"><label>পাসওয়ার্ড</label><input type="text" id="u_pass" placeholder="স্পষ্ট পাসওয়ার্ড" autocomplete="off"></div><div class="field"><label>আউটলেট</label><select id="u_branch"><option value="kalaroa">কলারোয়া আউটলেট</option><option value="jhaudanga">ঝাউডাঙ্গা আউটলেট</option><option value="all">সব</option></select></div><div class="field"><label>রোল</label><select id="u_role"><option value="user">ইউজার</option><option value="admin">অ্যাডমিন</option></select></div></div><button class="btn green block" id="u_add" style="margin-top:10px">➕ তৈরি করুন</button></div><div class="bank-hint">💡 <b>🔑</b> = পাসওয়ার্ড পরিবর্তন • <b>✏️</b> = তথ্য এডিট • <b>🗑️</b> = ডিলিট • 🟢 সবুজ = পাসওয়ার্ড জানা</div><div style="margin-top:14px" id="u_list"></div>',
    onMount: (w, close) => {
      const lb = w.querySelector('#u_list');
      function render(){
        const list = DB().users || [];
        if(!list.length){ lb.innerHTML = '<div class="empty">📭 কোনো ইউজার নেই</div>'; return; }
        lb.innerHTML = '<div class="table-wrap"><table class="tbl"><thead><tr><th>নাম</th><th>আইডি</th><th>পাসওয়ার্ড</th><th>আউটলেট</th><th>রোল</th><th>অ্যাকশন</th></tr></thead><tbody>' + list.map(u => {
          const adminCount = list.filter(x => x.role === 'admin').length;
          const isLastAdmin = u.role === 'admin' && adminCount <= 1;
          const plain = getPlainPassword(u);
          let pwdDisplay;
          if(plain){ pwdDisplay = '<span style="color:#4ade80;font-weight:900;font-family:monospace">' + esc(plain) + '</span>'; }
          else if(u.__hashed){ pwdDisplay = '<span style="color:#facc15;font-style:italic">🔒 পুরনো (রিসেট করুন)</span>'; }
          else { pwdDisplay = '<span style="color:#facc15;font-family:monospace">' + esc(u.password || '—') + '</span>'; }
          return '<tr><td><b>' + esc(u.name) + '</b></td><td style="font-family:monospace;color:#93c5fd">' + esc(u.username) + '</td><td>' + pwdDisplay + '</td><td>' + (u.branch === 'all' ? 'সব' : esc(BRANCHES[u.branch]?.name || u.branch || '—')) + '</td><td>' + (u.role === 'admin' ? '👑 অ্যাডমিন' : '👤 ইউজার') + '</td><td style="white-space:nowrap"><button class="mini show" data-pwd="' + u.id + '">🔑</button> <button class="mini" data-edit="' + u.id + '">✏️</button> <button class="mini danger" data-del="' + u.id + '" ' + (isLastAdmin ? 'disabled' : '') + '>🗑️</button></td></tr>';
        }).join('') + '</tbody></table></div>';
        lb.querySelectorAll('[data-pwd]').forEach(b => b.addEventListener('click', async () => {
          const u = DB().users.find(x => x.id === b.dataset.pwd); if(!u) return;
          const cur = getPlainPassword(u) || '(অজানা)';
          const np = prompt('🔑 পাসওয়ার্ড পরিবর্তন\n\n👤 ' + u.name + '\n🆔 ' + u.username + '\n🔒 বর্তমান: ' + cur + '\n\nনতুন পাসওয়ার্ড:', getPlainPassword(u) || '');
          if(np === null) return;
          const trimmed = np.trim();
          if(!trimmed || trimmed.length < 3){ alert('❌ কমপক্ষে ৩ অক্ষর'); return; }
          u.encryptedPassword = encryptPlain(trimmed);
          u.plainPassword = '';
          u.password = hashPassword(trimmed);
          u.__hashed = true;
          u.updatedAt = new Date().toISOString();
          await saveDB(); render();
          toast('✅ পাসওয়ার্ড — ' + u.username + ' → ' + trimmed);
        }));
        lb.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', async () => {
          const u = DB().users.find(x => x.id === b.dataset.edit); if(!u) return;
          const nn = prompt('📝 নাম:', u.name); if(nn === null) return;
          const nu = prompt('🆔 আইডি:', u.username); if(nu === null) return;
          if(DB().users.some(x => x.username === nu.trim() && x.id !== u.id)){ alert('❌ আইডি আছে'); return; }
          const nb = prompt('🏦 আউটলেট (kalaroa/jhaudanga/all):', u.branch); if(nb === null) return;
          const nr = prompt('👤 রোল (user/admin):', u.role); if(nr === null) return;
          u.name = nn.trim(); u.username = nu.trim();
          u.branch = (nr.trim().toLowerCase() === 'admin') ? 'all' : nb.trim().toLowerCase();
          u.role = nr.trim().toLowerCase();
          u.updatedAt = new Date().toISOString();
          await saveDB(); render();
          toast('✅ আপডেট — ' + u.username);
        }));
        lb.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
          const u = DB().users.find(x => x.id === b.dataset.del); if(!u) return;
          if(u.role === 'admin' && DB().users.filter(x => x.role === 'admin').length <= 1){ alert('❌ শেষ অ্যাডমিন'); return; }
          if(u.id === session.id){ alert('❌ নিজেকে ডিলিট করা যাবে না'); return; }
          if(!confirm('🗑️ ডিলিট: ' + u.name + '?')) return;
          DB().users = DB().users.filter(x => x.id !== u.id);
          await saveDB(); render();
          toast('🗑️ ডিলিট — ' + u.username);
        }));
      }
      render();
      w.querySelector('#u_add').addEventListener('click', async () => {
        const name = w.querySelector('#u_name').value.trim();
        const username = w.querySelector('#u_user').value.trim();
        const password = w.querySelector('#u_pass').value.trim();
        let branch = w.querySelector('#u_branch').value;
        const role = w.querySelector('#u_role').value;
        if(!name || !username || !password){ alert('❌ সব ফিল্ড পূরণ করুন'); return; }
        if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){ alert('❌ আইডি ৩-২০ অক্ষর'); return; }
        if(password.length < 3){ alert('❌ পাসওয়ার্ড কমপক্ষে ৩ অক্ষর'); return; }
        if(DB().users.some(u => u.username.toLowerCase() === username.toLowerCase())){ alert('❌ আইডি আছে'); return; }
        if(role === 'admin') branch = 'all';
        DB().users.push({ id: uid(), name, username, password: hashPassword(password), encryptedPassword: encryptPlain(password), role, branch, __hashed: true, createdAt: new Date().toISOString(), createdBy: session.name });
        await saveDB(); render();
        w.querySelector('#u_name').value = ''; w.querySelector('#u_user').value = ''; w.querySelector('#u_pass').value = '';
        showNotifToast({ type: 'success', icon: '✅', badge: 'নতুন ইউজার', title: '👥 ইউজার তৈরি সফল', body: '<b>' + esc(name) + '</b><br>🆔 ' + esc(username) + '<br>🔑 <b style="color:#4ade80">' + esc(password) + '</b>', duration: 10000 });
        toast('✅ তৈরি — লগইন: ' + username + ' / ' + password);
      });
    }
  });
}

        w.querySelector('#bmBody').innerHTML = '<div class="branch-summary-box"><b>' + esc(BRANCHES[br].name) + '</b><br>🏦 বেস: <b>৳ ' + fmt(bt) + '</b>' + (bc > 0 ? ' • <span style="padding:4px 12px;border-radius:8px;background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(245,158,11,.05));border:1px solid rgba(250,204,21,.5);color:#facc15;font-weight:800">💰 ৳ ' + fmt(bc) + '</span>' : '') + '</div><div class="form-row" style="grid-template-columns:1fr"><div class="field"><label style="color:#facc15 !important">💰 মূলধন</label><input type="text" inputmode="decimal" id="bm_capital" value="' + (bc ? bc.toLocaleString('en-US') : '') + '" placeholder="0" style="color:#facc15;font-weight:900;font-size:18px;border-color:rgba(250,204,21,.5)" autocomplete="off"></div></div><div class="form-row"><div class="field"><label>🏦 ব্যাংক</label><input type="text" inputmode="decimal" id="bm_bank" value="' + (a.bank ? Number(a.bank).toLocaleString('en-US') : '') + '" autocomplete="off"></div><div class="field"><label>🏛️ অন্যান্য</label><input type="text" inputmode="decimal" id="bm_other" value="' + (a.other ? Number(a.other).toLocaleString('en-US') : '') + '" autocomplete="off"></div></div><div class="notes-col" style="margin-top:12px"><h4 style="font-size:16px;margin-bottom:12px;color:#93c5fd">🗄️ ভল্টে থাকা নোট</h4><div class="notes-row">' + DENOMS.map(d => '<div class="note-item"><label>৳ ' + toBn(d) + '</label><input type="text" inputmode="numeric" id="bm_note_' + d + '" data-denom="' + d + '" value="' + (v[d]||'') + '" autocomplete="off"></div>').join('') + '</div></div><div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap"><button class="btn green" id="bm_save" style="flex:1;min-width:200px">💾 সেভ</button><button class="btn red" id="bm_reset" style="flex:1;min-width:140px">🔄 রিসেট</button></div>';
        attachAmountInput(w.querySelector('#bm_capital'), { decimal: true });
        attachAmountInput(w.querySelector('#bm_bank'), { decimal: true });
        attachAmountInput(w.querySelector('#bm_other'), { decimal: true });
        DENOMS.forEach(d => { const el = w.querySelector('#bm_note_' + d); if(el) attachAmountInput(el, { decimal: false }); });
        w.querySelector('#bm_save').addEventListener('click', async ()=>{
          const cap = parseNum(w.querySelector('#bm_capital').value);
          const bnk = parseNum(w.querySelector('#bm_bank').value);
          const oth = parseNum(w.querySelector('#bm_other').value);
          const vv = {}; DENOMS.forEach(d => { vv[d] = parseInt(String(w.querySelector('#bm_note_'+d).value).replace(/[^0-9]/g,''), 10) || 0; });
          /* ✅ নতুন: সম্পূর্ণ খালি থাকলে sorry message */
          const _hasAny = cap > 0 || bnk > 0 || oth > 0 || Object.values(vv).some(x => x > 0);
          if(!_hasAny){ sorryNoNote(); return; }
          const csh = DENOMS.reduce((s,d)=> s + vv[d]*d, 0);
          DB().baseAccounts[br] = { bank: bnk, cash: csh, other: oth };
          DB().baseVault[br] = vv;
          if(!DB().branchCapital) DB().branchCapital = {};
          DB().branchCapital[br] = cap;
          DB().totalCapital = Object.values(DB().branchCapital).reduce((s,v) => s + (Number(v)||0), 0);
          recomputeLive(); await saveDB();
          try{ await pushRemoteDB(true); }catch(e){}
          renderDashboard();
          toast('✅ সেভ — মূলধন ৳ ' + fmt(cap));
        });
        w.querySelector('#bm_reset').addEventListener('click', async ()=>{
          if(!confirm('⚠️ রিসেট?')) return;
          DB().baseAccounts[br] = { bank:0, cash:0, other:0 };
          DB().baseVault[br] = {}; DENOMS.forEach(d=> DB().baseVault[br][d]=0);
          if(!DB().branchCapital) DB().branchCapital = {};
          DB().branchCapital[br] = 0;
          DB().totalCapital = Object.values(DB().branchCapital).reduce((s,v) => s + (Number(v)||0), 0);
          recomputeLive(); await saveDB();
          try{ await pushRemoteDB(true); }catch(e){}
          renderDashboard(); render(br);
          toast('🔄 রিসেট');
        });
      }
      w.querySelectorAll('[data-btab]').forEach(b => b.addEventListener('click', ()=>{ w.querySelectorAll('[data-btab]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render(b.dataset.btab); }));
      render('kalaroa');
    }
  });
}

/* ============ ডেটাবেস ব্রাউজার ============ */
const DB_TABLES = { txs:{label:'💸 লেনদেন',icon:'💸'}, txEditLog:{label:'📜 অডিট লগ',icon:'📜'}, customers:{label:'🧑 গ্রাহক',icon:'🧑'}, users:{label:'👥 ইউজার',icon:'👥'}, branchCapital:{label:'💵 মূলধন',icon:'💵'}, baseVault:{label:'🗄️ বেস ভল্ট',icon:'🗄️'}, baseAccounts:{label:'🏦 বেস অ্যাকাউন্ট',icon:'🏦'}, liveVault:{label:'⚡ লাইভ ভল্ট',icon:'⚡'}, liveAccounts:{label:'💵 লাইভ অ্যাকাউন্ট',icon:'💵'}, yearlyArchive:{label:'📚 আর্কাইভ',icon:'📚'}, deletedTxIds:{label:'🗑️ ডিলিটেড',icon:'🗑️'} };
function getTableData(n){ const d = DB(); if(!d) return null; return d[n]; }
function getTableCount(n){ const d = getTableData(n); if(d == null) return 0; if(Array.isArray(d)) return d.length; if(typeof d === 'object') return Object.keys(d).length; return 1; }
function openDatabaseBrowser(){
  if(session.role !== 'admin'){ toast('❌ শুধু অ্যাডমিন'); return; }
  let activeTab = 'txs', searchQuery = '';
  const tabsHTML = Object.entries(DB_TABLES).map(([k,v]) => '<button class="db-tab-btn" data-dbtab="' + k + '">' + v.icon + ' ' + v.label + ' <span class="cnt">' + toBn(getTableCount(k)) + '</span></button>').join('');
  openModal({ title: '🗄️ ডেটাবেস ব্রাউজার', xwide: true,
    bodyHTML: '<div class="db-tabs" id="dbTabs">' + tabsHTML + '</div><div class="db-toolbar"><input type="text" class="db-search" id="dbSearch" placeholder="🔍 খুঁজুন..." autocomplete="off"><span class="db-info" id="dbInfo">—</span><button class="btn sm green" id="dbAddBtn">➕ নতুন সারি</button><button class="btn sm gray" id="dbRefreshBtn">🔄 রিফ্রেশ</button></div><div id="dbContent"></div>',
    onMount: (w) => {
      const tabsEl = w.querySelector('#dbTabs'), contentEl = w.querySelector('#dbContent'), infoEl = w.querySelector('#dbInfo');
      function setActive(t){ activeTab = t; tabsEl.querySelectorAll('.db-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.dbtab === t)); renderTable(); }
      tabsEl.querySelectorAll('.db-tab-btn').forEach(b => b.addEventListener('click', () => setActive(b.dataset.dbtab)));
      w.querySelector('#dbSearch').addEventListener('input', (e) => { searchQuery = e.target.value; renderTable(); });
      w.querySelector('#dbRefreshBtn').addEventListener('click', () => renderTable());
      w.querySelector('#dbAddBtn').addEventListener('click', () => openAddRowModal(activeTab, renderTable));
      function renderTable(){ const data = getTableData(activeTab); if(data == null){ contentEl.innerHTML = '<div class="empty">📭 খালি</div>'; infoEl.textContent = '0'; return; } if(Array.isArray(data)) renderArrayTable(data, contentEl, infoEl, searchQuery, activeTab, renderTable); else renderObjectTable(data, contentEl, infoEl, searchQuery, activeTab, renderTable); }
      setActive(activeTab);
    }
  });
}
function renderArrayTable(arr, contentEl, infoEl, search, tableName, onRefresh){
  let list = arr.slice();
  if(search){ const q = search.toLowerCase(); list = list.filter(item => JSON.stringify(item).toLowerCase().includes(q)); }
  infoEl.textContent = 'মোট: ' + toBn(arr.length) + ' • দেখানো: ' + toBn(list.length);
  if(!list.length){ contentEl.innerHTML = '<div class="empty">📭 নেই</div>'; return; }
  const allKeys = new Set();
  list.forEach(item => { if(item && typeof item === 'object') Object.keys(item).forEach(k => allKeys.add(k)); });
  const dk = Array.from(allKeys).slice(0, 8);
  const rowsHTML = list.slice(0, 200).map((item, i) => {
    const cells = dk.map(k => { let v = item[k]; if(v == null) return '<td>—</td>'; if(typeof v === 'object') v = JSON.stringify(v).slice(0,50)+'…'; v = String(v); if(v.length > 60) v = v.slice(0,60)+'…'; return '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(v) + '</td>'; }).join('');
    return '<tr><td>' + toBn(i+1) + '</td>' + cells + '<td style="white-space:nowrap"><button class="mini" data-dbview="' + i + '">👁️</button><button class="mini" data-dbedit="' + i + '">✏️</button><button class="mini danger" data-dbdel="' + i + '">🗑️</button></td></tr>';
  }).join('');
  contentEl.innerHTML = '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th>' + dk.map(k => '<th>' + esc(k) + '</th>').join('') + '<th>অ্যাকশন</th></tr></thead><tbody>' + rowsHTML + '</tbody></table></div>';
  contentEl.querySelectorAll('[data-dbview]').forEach(b => b.addEventListener('click', () => openRowViewModal(list[+b.dataset.dbview], tableName)));
  contentEl.querySelectorAll('[data-dbedit]').forEach(b => b.addEventListener('click', () => openRowEditModal(list[+b.dataset.dbedit], +b.dataset.dbedit, tableName, onRefresh)));
  contentEl.querySelectorAll('[data-dbdel]').forEach(b => b.addEventListener('click', () => deleteRow(list[+b.dataset.dbdel], +b.dataset.dbdel, tableName, onRefresh)));
}
function renderObjectTable(obj, contentEl, infoEl, search, tableName, onRefresh){
  const keys = Object.keys(obj);
  let list = keys.map(k => ({ __key: k, __value: obj[k] }));
  if(search){ const q = search.toLowerCase(); list = list.filter(item => JSON.stringify(item).toLowerCase().includes(q)); }
  infoEl.textContent = 'কী: ' + toBn(keys.length);
  if(!list.length){ contentEl.innerHTML = '<div class="empty">📭 খালি</div>'; return; }
  const rowsHTML = list.map((item, i) => {
    let v = item.__value; if(typeof v === 'object') v = JSON.stringify(v);
    const vs = String(v);
    return '<tr><td>' + toBn(i+1) + '</td><td style="font-family:monospace;color:#93c5fd">' + esc(item.__key) + '</td><td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace;font-size:12px">' + esc(vs.slice(0,200)) + (vs.length>200?'…':'') + '</td><td style="white-space:nowrap"><button class="mini" data-dbview="' + esc(item.__key) + '">👁️</button><button class="mini" data-dbedit="' + esc(item.__key) + '">✏️</button><button class="mini danger" data-dbdel="' + esc(item.__key) + '">🗑️</button></td></tr>';
  }).join('');
  contentEl.innerHTML = '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>কী</th><th>মান</th><th>অ্যাকশন</th></tr></thead><tbody>' + rowsHTML + '</tbody></table></div>';
  contentEl.querySelectorAll('[data-dbview]').forEach(b => b.addEventListener('click', () => openJsonViewModal(b.dataset.dbview, obj[b.dataset.dbview])));
  contentEl.querySelectorAll('[data-dbedit]').forEach(b => b.addEventListener('click', () => openJsonEditModal(b.dataset.dbview, obj[b.dataset.dbview], tableName, onRefresh)));
  contentEl.querySelectorAll('[data-dbdel]').forEach(b => b.addEventListener('click', () => { if(!confirm('ডিলিট "' + b.dataset.dbdel + '"?')) return; delete obj[b.dataset.dbdel]; DB().__lastUpdate = new Date().toISOString(); saveDB().then(() => { toast('🗑️ ডিলিট'); onRefresh(); }); }));
}
function openRowViewModal(row, tn){ openModal({ title: '👁️ দেখুন — ' + esc(tn), wide: true, bodyHTML: '<div class="db-json">' + esc(JSON.stringify(row, null, 2)) + '</div>' }); }
function openJsonViewModal(key, val){ openModal({ title: '👁️ ' + esc(key), wide: true, bodyHTML: '<div class="db-json">' + esc(typeof val === 'object' ? JSON.stringify(val, null, 2) : String(val)) + '</div>' }); }
function openRowEditModal(row, index, tn, onRefresh){
  const fh = Object.keys(row || {}).map(k => { const v = row[k]; const isO = v && typeof v === 'object'; const sv = isO ? JSON.stringify(v, null, 2) : (v == null ? '' : String(v)); return '<div class="db-edit-field"><label>' + esc(k) + ' ' + (isO?'(JSON)':'') + '</label>' + (isO ? '<textarea data-field="' + esc(k) + '" data-type="json">' + esc(sv) + '</textarea>' : '<input type="text" data-field="' + esc(k) + '" data-type="text" value="' + esc(sv) + '" autocomplete="off">') + '</div>'; }).join('');
  openModal({ title: '✏️ সারি এডিট', wide: true, bodyHTML: '<div style="max-height:520px;overflow-y:auto;padding-right:6px">' + fh + '</div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn green" id="dbRowSave" style="flex:1">💾 সেভ</button><button class="btn gray" id="dbRowCancel" style="flex:1">বাতিল</button></div>',
    onMount: (w, close) => {
      w.querySelector('#dbRowCancel').addEventListener('click', close);
      w.querySelector('#dbRowSave').addEventListener('click', async () => {
        const upd = {}; let err = false;
        w.querySelectorAll('[data-field]').forEach(el => { const k = el.dataset.field, t = el.dataset.type, raw = el.value; if(t === 'json'){ try{ upd[k] = JSON.parse(raw); }catch(e){ err = true; alert('❌ JSON error'); } } else { if(raw === '') upd[k] = ''; else if(/^-?\d+(\.\d+)?$/.test(raw)) upd[k] = Number(raw); else if(raw === 'true') upd[k] = true; else if(raw === 'false') upd[k] = false; else upd[k] = raw; } });
        if(err) return;
        const arr = DB()[tn]; if(Array.isArray(arr) && arr[index]) arr[index] = { ...arr[index], ...upd };
        await saveDB(); close(); toast('✅ আপডেট'); if(onRefresh) onRefresh(); renderDashboard();
      });
    }
  });
}
function openJsonEditModal(key, val, tn, onRefresh){
  const isO = val && typeof val === 'object';
  openModal({ title: '✏️ এডিট — ' + esc(key), wide: true, bodyHTML: '<div class="db-edit-field"><label>মান ' + (isO?'(JSON)':'') + '</label><textarea id="dbJsonVal" style="min-height:240px">' + esc(isO ? JSON.stringify(val, null, 2) : String(val)) + '</textarea></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn green" id="dbJsonSave" style="flex:1">💾 সেভ</button><button class="btn gray" id="dbJsonCancel" style="flex:1">বাতিল</button></div>',
    onMount: (w, close) => {
      w.querySelector('#dbJsonCancel').addEventListener('click', close);
      w.querySelector('#dbJsonSave').addEventListener('click', async () => {
        const raw = w.querySelector('#dbJsonVal').value;
        let parsed; try{ parsed = isO ? JSON.parse(raw) : raw; }catch(e){ alert('❌ JSON error'); return; }
        DB()[tn][key] = parsed; await saveDB(); close(); toast('✅ আপডেট'); if(onRefresh) onRefresh();
      });
    }
  });
}
async function deleteRow(row, index, tn, onRefresh){
  if(!confirm('ডিলিট from ' + tn + '?')) return;
  const arr = DB()[tn]; if(!Array.isArray(arr)) return;
  const rm = arr.splice(index, 1)[0];
  if(tn === 'txs' && rm && rm.id){ if(!DB().deletedTxIds) DB().deletedTxIds = {}; DB().deletedTxIds[rm.id] = new Date().toISOString(); }
  await saveDB(); toast('🗑️ ডিলিট'); if(onRefresh) onRefresh(); renderDashboard();
}
function openAddRowModal(tn, onRefresh){
  openModal({ title: '➕ নতুন সারি', wide: true, bodyHTML: '<div class="db-edit-field"><label>JSON</label><textarea id="dbAddJson" style="min-height:280px">{\n  "id": "new_' + Date.now() + '"\n}</textarea></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn green" id="dbAddSave" style="flex:1">💾 যোগ করুন</button><button class="btn gray" id="dbAddCancel" style="flex:1">বাতিল</button></div>',
    onMount: (w, close) => {
      w.querySelector('#dbAddCancel').addEventListener('click', close);
      w.querySelector('#dbAddSave').addEventListener('click', async () => {
        const raw = w.querySelector('#dbAddJson').value;
        let p; try{ p = JSON.parse(raw); }catch(e){ alert('❌ JSON error'); return; }
        if(!Array.isArray(DB()[tn])){ alert('❌ অ্যারে নয়'); return; }
        if(!p.id) p.id = uid();
        DB()[tn].push(p); await saveDB(); close(); toast('✅ যোগ হয়েছে'); if(onRefresh) onRefresh();
      });
    }
  });
}

/* ============ লগইন / লগআউট ============ */
async function doLogin(){
  const b = $('#loginBtn'), e = $('#loginErr');
  const u = String($('#loginUser').value || '').replace(/\s+/g, ' ').trim();
  const p = String($('#loginPass').value || '').trim();
  if(!u || !p){ e.textContent = '⚠️ আইডি ও পাসওয়ার্ড দিন'; return; }
  b.disabled = true; b.innerHTML = '<span class="spinner"></span> যাচাই...'; e.textContent = '';
  try{
    if(!DB()){ e.textContent = '❌ ডেটাবেস লোড হয়নি'; b.disabled = false; b.innerHTML = '🔐 লগইন করুন'; return; }
    forceFixAdmin();
    const users = DB().users || [];
    const lowerU = u.toLowerCase();
    let user = users.find(x => String(x.username||'').toLowerCase() === lowerU && verifyPassword(p, x.password));
    if(!user){ user = users.find(x => String(x.username||'').toLowerCase() === lowerU && getPlainPassword(x) === p); }
    if(!user && lowerU === 'admin' && _akVerify(p)){ forceFixAdmin(); user = DB().users.find(x => x.username === 'admin'); }
    if(!user){
      e.textContent = '❌ ইউজার আইডি বা পাসওয়ার্ড ভুল';
      $('#loginPass').value = ''; try{ $('#loginPass').focus(); }catch(ex){}
      b.disabled = false; b.innerHTML = '🔐 লগইন করুন'; return;
    }
    session = user;
    try{ sessionStorage.setItem(SKEY, user.id); }catch(ex){ try{ localStorage.setItem(SKEY + '_fb', user.id); }catch(e2){} }
    viewBranch = user.role === 'admin' ? 'all' : (BRANCHES[user.branch] ? user.branch : 'kalaroa');
    dashDate = todayStr();
    try{ fetchGeoLocation().then(g => { window.__geoCache = g; }).catch(()=>{}); }catch(ex){}
    try{ setTimeout(() => { showNotifToast({ type: 'success', icon: '👋', badge: 'স্বাগতম', title: '✅ লগইন সফল', body: '<b>' + esc(user.name) + '</b><br>' + (user.role === 'admin' ? '👑 অ্যাডমিন' : '👤 ইউজার'), duration: 4000 }); }, 300); }catch(ex){}
    startApp();
  }catch(err){ e.textContent = '❌ ' + (err.message || 'Error'); b.disabled = false; b.innerHTML = '🔐 লগইন করুন'; }
}
async function logout(){
  try{ if(DB()) await saveDB(); }catch(e){}
  try{ if(__realtimeChannel && __supabaseClient){ await __realtimeChannel.untrack(); __supabaseClient.removeChannel(__realtimeChannel); __realtimeChannel = null; } }catch(e){}
  try{ if(window.__topbarScrollHandler){ window.removeEventListener('scroll', window.__topbarScrollHandler); window.removeEventListener('touchmove', window.__topbarScrollHandler); window.__topbarScrollHandler = null; } }catch(e){}
  const tb = document.getElementById('topbar'); if(tb) tb.classList.remove('hidden-scroll','scrolled');
  updateRealtimeIndicator('offline'); updatePresenceUI([]);
  sessionStorage.removeItem(SKEY);
  session = null; viewBranch = 'all'; dashDate = todayStr(); isDateViewMode = false;
  $('#app').classList.add('hidden');
  const ls = $('#loginScreen'); if(ls){ ls.classList.remove('hidden'); ls.style.display = 'flex'; }
  $('#loginPass').value = ''; $('#loginUser').value = '';
  $('#modalRoot').innerHTML = '';
  const b = $('#loginBtn'); if(b){ b.disabled = false; b.innerHTML = '🔐 লগইন করুন'; }
}
function startApp(){
  if(!session) return;
  const ls = $('#loginScreen'); if(ls){ ls.classList.add('hidden'); ls.style.display = ''; }
  $('#app').classList.remove('hidden');
  performDailyRollover(false);
  recalcAllCustomerDues(false);
  recomputeLive();
  dashDate = todayStr(); isDateViewMode = false;
  renderTopbar(); renderDashboard(); renderSidebar();
  startClock();
  setTimeout(() => { try{ attachTopbarScroll(); }catch(e){} }, 300);
  saveDB();
  setTimeout(() => {
    try{ if(__realtimeChannel && __realtimeChannel.state === 'joined'){ __realtimeChannel.track({ user: session.name, username: session.username, branch: session.branch || 'all', role: session.role, location: (window.__geoCache && window.__geoCache.label) || '', joined_at: new Date().toISOString() }).catch(()=>{}); } }catch(e){}
  }, 800);
}
function attachTopbarScroll(){
  if(window.__topbarScrollHandler){ window.removeEventListener('scroll', window.__topbarScrollHandler); window.removeEventListener('touchmove', window.__topbarScrollHandler); }
  __lastScrollY = window.scrollY || window.pageYOffset || 0;
  const handler = function(){
    if(__scrollTicking) return;
    __scrollTicking = true;
    requestAnimationFrame(() => {
      const topbar = document.getElementById('topbar');
      if(!topbar){ __scrollTicking = false; return; }
      const modalOpen = document.getElementById('modalRoot')?.children?.length > 0;
      if(modalOpen){ topbar.classList.remove('hidden-scroll'); __scrollTicking = false; return; }
      const currentY = window.scrollY || window.pageYOffset || 0;
      const diff = currentY - __lastScrollY;
      if(currentY <= 20){ topbar.classList.remove('hidden-scroll'); topbar.classList.remove('scrolled'); }
      else if(diff > 8 && currentY > __scrollThreshold){ topbar.classList.add('hidden-scroll'); }
      else if(diff < -8){ topbar.classList.remove('hidden-scroll'); topbar.classList.add('scrolled'); }
      else if(currentY > __scrollThreshold){ topbar.classList.add('scrolled'); }
      __lastScrollY = currentY; __scrollTicking = false;
    });
  };
  window.__topbarScrollHandler = handler;
  window.addEventListener('scroll', handler, { passive: true });
  window.addEventListener('touchmove', handler, { passive: true });
}

/* ============ অটোফিল বন্ধ ============ */
function disableAutofill(scope){
  scope = scope || document;
  const loginScreen = document.getElementById('loginScreen');
  scope.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]):not([type="date"]), textarea').forEach(el => {
    if(loginScreen && loginScreen.contains(el)) return;
    el.setAttribute('autocomplete', 'off');
    el.setAttribute('autocorrect', 'off');
    el.setAttribute('autocapitalize', 'none');
    el.setAttribute('spellcheck', 'false');
    if(!el.dataset.noAutofillApplied){
      el.dataset.noAutofillApplied = '1';
      el.setAttribute('readonly', 'readonly');
      const handler = function(){ this.removeAttribute('readonly'); this.removeEventListener('focus', handler); };
      el.addEventListener('focus', handler);
    }
  });
}

/* ============ ইনিশিয়ালাইজ ============ */
document.getElementById('sidebarOverlay')?.addEventListener('click', closeSidebar);
document.getElementById('sidebarClose')?.addEventListener('click', closeSidebar);

setupEnterNavigation();

const _origOpenModal = openModal;
window.openModal = function(opts){
  const result = _origOpenModal(opts);
  setTimeout(() => { if(result && result.wrap) disableAutofill(result.wrap); }, 50);
  return result;
};
const __autofillObserver = new MutationObserver((mutations) => {
  mutations.forEach(m => {
    m.addedNodes.forEach(node => {
      if(node.nodeType === 1){
        if(node.tagName === 'INPUT' || node.tagName === 'TEXTAREA') disableAutofill(node.parentElement || document);
        else if(node.querySelectorAll) disableAutofill(node);
      }
    });
  });
});
window.addEventListener('beforeunload', () => { try{ if(__realtimeChannel && __supabaseClient){ __realtimeChannel.untrack().catch(()=>{}); } }catch(e){} });

(async function init(){
  window.__hasSyncedOnce = false;
  try{ window.db = loadLocalDB() || defaultDB(); }catch(e){ window.db = defaultDB(); }
  normalizeDB(); forceFixAdmin(); recalcAllCustomerDues(false); recomputeLive(); loadNotifPrefs();
  try{ const c = loadGeoCache(); if(c) window.__geoCache = c; else fetchGeoLocation().then(g => { window.__geoCache = g; }).catch(()=>{}); }catch(e){}
  const lb = $('#loginBtn');
  if(lb){
    lb.addEventListener('click', doLogin);
    lb.addEventListener('touchend', function(e){ e.preventDefault(); setTimeout(doLogin, 50); }, { passive: false });
  }
  const lu = $('#loginUser'), lp = $('#loginPass');
  if(lu) lu.addEventListener('keydown', e => { if(e.key === 'Enter') lp.focus(); });
  if(lp) lp.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  const sid = sessionStorage.getItem(SKEY);
  if(sid){ const u = DB().users.find(x => x.id === sid); if(u){ session = u; viewBranch = u.role === 'admin' ? 'all' : u.branch; startApp(); } }
  attachNetworkListeners(); updateNetStatus(detectNetworkQuality()); updateQueueBadge(); setupBroadcastChannel();
  const unlockAudio = () => { try{ if(!__audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) __audioCtx = new AC(); } if(__audioCtx && __audioCtx.state === 'suspended') __audioCtx.resume(); }catch(e){} document.removeEventListener('click', unlockAudio); document.removeEventListener('touchstart', unlockAudio); document.removeEventListener('keydown', unlockAudio); };
  document.addEventListener('click', unlockAudio, { once: true });
  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('keydown', unlockAudio, { once: true });
  initSupabase();
  setTimeout(() => { if(window.__hasSyncedOnce && navigator.onLine && queueSize() > 0){ forceSyncNow(); } }, 3000);
  disableAutofill(document);
  __autofillObserver.observe(document.body, { childList: true, subtree: true });
  requestNotifPermission();
  console.log('✅ কম্পিউটার ক্যাম্পাস এজেন্ট ব্যাংকিং প্রস্তুত। লগইন: admin');
})();
