<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>কম্পিউটার ক্যাম্পাস | এজেন্ট ব্যাংকিং সিস্টেম</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#3b82f6;--blue-2:#60a5fa;--blue-3:#93c5fd;
  --yellow:#facc15;--yellow-2:#fde047;
  --green:#22c55e;--green-2:#4ade80;
  --red:#dc2626;--txt:#f0f4ff;--muted:#7a8ab8;--dim:#4a5680;
  --line:rgba(59,130,246,.12);--line-2:rgba(59,130,246,.22);--line-3:rgba(59,130,246,.4);
  --pink:#ec4899;--pink-2:#f9a8d4;
}
body{font-family:'Noto Sans Bengali',sans-serif;color:var(--txt);background:#04060d;
  background-image:radial-gradient(circle at 15% 5%,rgba(59,130,246,.15),transparent 45%),
                   radial-gradient(circle at 85% 95%,rgba(34,197,94,.12),transparent 45%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#050810}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--blue),var(--green));border-radius:10px;border:2px solid #050810}
.hidden{display:none!important}
::selection{background:var(--blue);color:#fff}

@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 12px rgba(34,197,94,0)}}
@keyframes pulsePink{0%,100%{box-shadow:0 0 0 0 rgba(236,72,153,.5)}50%{box-shadow:0 0 0 10px rgba(236,72,153,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes notifSlide{from{opacity:0;transform:translateX(420px)}to{opacity:1;transform:translateX(0)}}
@keyframes notifProgress{from{width:100%}to{width:0%}}
@keyframes bellRing{0%,100%{transform:rotate(0)}20%{transform:rotate(20deg)}40%{transform:rotate(-18deg)}60%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ✅ RESPONSIVE BUTTONS & LABELS */
button,.btn,.mini,input,select,.badge{font-size:clamp(11px,2.2vw,15px)}
.btn{padding:clamp(8px,1.5vw,13px) clamp(14px,2.5vw,22px)}
.mini{padding:clamp(4px,1vw,7px) clamp(8px,1.5vw,12px);font-size:clamp(10px,1.9vw,13px)}
label{font-size:clamp(10.5px,2vw,14px)}
table.tbl th,table.tbl td{font-size:clamp(10px,1.9vw,13px);padding:clamp(5px,1vw,12px) clamp(4px,.8vw,10px)}
.field label{font-size:clamp(10.5px,2vw,14px)}
.field input,.field select,.field textarea{font-size:clamp(11px,2.2vw,16px);padding:clamp(9px,1.5vw,14px) clamp(11px,2vw,16px)}
.section-title{font-size:clamp(14px,2.8vw,22px)}
.big-amt{font-size:clamp(24px,5vw,42px)}
.card-sub{font-size:clamp(13px,2.4vw,18px)}
.big-amt.sm{font-size:clamp(15px,3vw,26px)}
.vault-item .d{font-size:clamp(12px,2.4vw,16px)}
.vault-item .c{font-size:clamp(16px,3.2vw,22px)}
.balance-cell .bc-val{font-size:clamp(18px,4vw,26px)}
.bal-card .v{font-size:clamp(20px,4.5vw,32px)}
.badge{font-size:clamp(10px,2vw,12.5px)}
@media (max-width:640px){.btn{width:100%}.mini{padding:8px 12px;min-width:40px}}

.rgb{background:linear-gradient(90deg,var(--blue),var(--yellow),var(--green),var(--blue));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap;padding:10px 14px;background:rgba(4,6,13,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;min-height:68px;transition:transform .35s cubic-bezier(.2,1,.3,1),box-shadow .35s}
.topbar::-webkit-scrollbar{height:5px}
.topbar::-webkit-scrollbar-thumb{background:rgba(59,130,246,.6);border-radius:5px}
.topbar.hidden-scroll{transform:translateY(-110%)}
.topbar.scrolled{box-shadow:0 8px 30px rgba(0,0,0,.6)}
.topbar .tb-left{display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar .tb-right{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;flex-shrink:0;margin-left:auto}
.topbar .tb-menu-btn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line-3);background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.08));color:#fff;cursor:pointer;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.1));border:1px solid var(--line-3);flex-shrink:0}
.brand .logo svg{width:40px;height:40px}
.brand h1{font-size:19px;font-weight:800;line-height:1.2;white-space:nowrap}
.brand p{font-size:13px;color:#a5b4d8;margin-top:2px;font-weight:600;line-height:1.2;white-space:nowrap}
.tb-branch{font-size:14px;font-weight:700;padding:10px 14px;border-radius:12px;background:linear-gradient(145deg,rgba(59,130,246,.12),rgba(34,197,94,.06));border:1px solid var(--line-3);white-space:nowrap;color:#fff;display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-branch b{color:var(--green-2);font-weight:800;font-size:15px}
.tb-date{padding:10px 12px;border-radius:12px;background:#080c1a;border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:14px;font-weight:700;outline:none;white-space:nowrap;color-scheme:dark;flex-shrink:0;max-width:165px}
.tb-select{padding:10px 32px 10px 14px;border-radius:12px;background:#080c1a;border:1px solid var(--line-3);color:var(--green-2);font-family:inherit;font-size:14px;font-weight:800;outline:none;cursor:pointer;white-space:nowrap;min-width:200px;max-width:260px;color-scheme:dark;flex-shrink:0}
.tb-select option{background:#0f1428;color:#f0f4ff;font-weight:700}
.tb-time{font-size:14px;font-weight:800;padding:10px 14px;border-radius:12px;background:linear-gradient(145deg,rgba(59,130,246,.15),rgba(34,197,94,.08));border:1px solid var(--line-3);color:var(--green-2);display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.tb-time .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green-2);animation:pulseGreen 1.8s ease-in-out infinite}
.presence-badge{font-size:14px;padding:8px 14px;border-radius:18px;background:rgba(236,72,153,.12);border:1px solid rgba(236,72,153,.4);color:#f9a8d4;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.presence-badge b{color:#fff;font-weight:900;font-size:15px}
.queue-badge{font-size:14px;padding:8px 14px;border-radius:18px;background:rgba(236,72,153,.15);border:1px solid rgba(236,72,153,.5);color:#f9a8d4;font-weight:800;display:none;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.queue-badge.show{display:inline-flex;animation:pulsePink 2s ease-in-out infinite}
.queue-badge b{color:#fff;font-weight:900;font-size:15px}
.sync-spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite}

/* SIDEBAR */
.sidebar-overlay{position:fixed;inset:0;z-index:400;background:rgba(2,4,10,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.sidebar-overlay.active{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:340px;max-width:90vw;z-index:500;background:linear-gradient(165deg,#0f1428,#06091a);border-right:1px solid var(--line-3);box-shadow:20px 0 60px rgba(0,0,0,.9);transform:translateX(-100%);transition:transform .35s;display:flex;flex-direction:column;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sidebar-head{padding:18px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.sidebar-head h3{font-size:18px;font-weight:800;color:#fff}
.sidebar-head .sb-close{border:none;background:rgba(220,38,38,.15);color:#f87171;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;border:1px solid rgba(220,38,38,.4)}
.sidebar-body{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:8px}
.sb-section{font-size:12px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;padding:14px 8px 6px;margin-top:4px;border-top:1px dashed var(--line)}
.sb-section:first-child{border-top:none;margin-top:0;padding-top:6px}
.sb-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:linear-gradient(145deg,#0f1428,#080c1a);border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:left;width:100%}
.sb-btn:hover{background:linear-gradient(145deg,rgba(59,130,246,.15),rgba(34,197,94,.06));border-color:var(--line-3);transform:translateX(3px)}
.sb-btn .sb-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.08));border:1px solid var(--line-3);flex-shrink:0}
.sb-btn .sb-lbl{flex:1;display:flex;flex-direction:column;gap:2px}
.sb-btn .sb-lbl .sb-sub{font-size:12.5px;color:var(--muted);font-weight:600}
.sb-btn.primary{background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(34,197,94,.15));border-color:var(--blue)}
.sb-btn.danger{background:linear-gradient(135deg,rgba(220,38,38,.15),rgba(153,27,27,.08));border-color:rgba(220,38,38,.4);color:#f87171}
.sb-btn.warn{background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(245,158,11,.08));border-color:rgba(250,204,21,.4);color:#facc15}
.sb-badge{margin-left:auto;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:800;background:rgba(220,38,38,.2);border:1px solid rgba(220,38,38,.5);color:#f87171}
.sb-user{padding:14px 16px;border-radius:14px;background:linear-gradient(145deg,rgba(59,130,246,.1),rgba(34,197,94,.04));border:1px solid var(--line-3);margin-bottom:6px}
.sb-user .name{font-size:16px;font-weight:800;color:#fff}
.sb-user .role{font-size:13px;color:var(--green-2);font-weight:700;margin-top:4px}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 30%,#0a1020,#04060d 70%)}
.login-box{width:100%;max-width:440px;background:linear-gradient(165deg,#0f1428,#060a18);border:1px solid var(--line-2);border-radius:28px;padding:38px 30px;box-shadow:0 20px 50px rgba(0,0,0,.9);animation:popIn .5s}
.login-logo{width:88px;height:88px;margin:0 auto 18px;display:grid;place-items:center;animation:float 3s ease-in-out infinite}
.login-box h1{text-align:center;font-size:24px;font-weight:800;color:#fff;margin-bottom:8px}
.login-box h2{text-align:center;font-size:14px;color:#a5b4d8;font-weight:500;margin-bottom:26px}

.field{position:relative;z-index:1;margin-bottom:16px}
.field label{display:block;font-size:14px;color:#b8c8ee;margin-bottom:7px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;padding:14px 16px;border-radius:12px;background:#050810;border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-weight:500;outline:none;transition:all .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2);background:#060a16}
.field select{color-scheme:dark;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--blue-3) 50%),linear-gradient(135deg,var(--blue-3) 50%,transparent 50%);background-position:calc(100% - 20px) calc(50% - 2px),calc(100% - 15px) calc(50% - 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:42px;appearance:none;-webkit-appearance:none}
.field select option{background:#0f1428;color:#f0f4ff;font-weight:600}
input[type="date"]{color-scheme:dark}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.6) sepia(1) saturate(3) hue-rotate(180deg);cursor:pointer}

/* BUTTONS */
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--blue),#2563eb);transition:all .2s;box-shadow:0 4px 16px rgba(59,130,246,.35);position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.btn.pink{background:linear-gradient(135deg,var(--blue),var(--green))}
.btn.green{background:linear-gradient(135deg,var(--green),#16a34a)}
.btn.gray{background:linear-gradient(145deg,#141a30,#0a0f1e);color:var(--txt);border:1px solid var(--line-2)}
.btn.red{background:linear-gradient(135deg,#dc2626,#991b1b)}
.btn.yellow{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000}
.btn.cyan{background:linear-gradient(135deg,#06b6d4,#0891b2)}
.btn.purple{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.btn.sm{padding:8px 14px;font-size:13px}

/* MAIN */
main{max-width:1280px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:20px;align-items:center;animation:fadeInUp .5s;width:100%}
.section{width:100%;display:flex;flex-direction:column;align-items:center}
.section-title{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:16px;font-weight:900;color:#fff;flex-wrap:wrap;text-align:center;width:100%}
.section-title .auto-badge,.section-title .badge{margin-left:10px}

/* CARDS */
.grid{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{position:relative;cursor:pointer;overflow:hidden;border-radius:22px;padding:20px 18px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);transition:all .35s;text-align:left}
.card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--yellow),var(--green))}
.card:hover{transform:translateY(-6px) scale(1.01);border-color:var(--line-3);box-shadow:0 24px 60px rgba(0,0,0,.9)}
.card-top{display:flex;align-items:center;justify-content:flex-start;text-align:left;width:100%;gap:12px;margin-bottom:14px}
.card-top .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,rgba(59,130,246,.2),rgba(34,197,94,.08));border:1px solid var(--line-3);flex-shrink:0}
.card-top h3{font-size:16px;font-weight:800;color:#fff;text-align:left;line-height:1.4}
.big-amt{line-height:1.2;font-weight:900;color:#fff;text-align:left;width:100%;letter-spacing:-.5px}
.big-amt.sm{display:flex;align-items:center;gap:10px;margin-bottom:10px;justify-content:flex-start;flex-wrap:wrap;text-align:left}
.big-amt.sm .lbl{color:#a5b4d8;font-size:20px;font-weight:700;min-width:90px}
.card-sub{margin-top:12px;color:#a5b4d8;line-height:1.7;font-weight:700;text-align:left;width:100%}
.card-sub b{color:var(--green-2);font-weight:900}

/* VAULT BOX */
.vault-box{width:100%;border-radius:22px;padding:20px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);text-align:center;display:flex;flex-direction:column;align-items:center}
.vault-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%}
.vault-item{flex:1 1 100px;min-width:100px;text-align:center;padding:16px 10px;border-radius:14px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1px solid var(--line-2)}
.vault-item .d{color:#a5b4d8;font-weight:800;text-align:center}
.vault-item .c{font-weight:900;margin-top:6px;color:var(--green-2);text-align:center}
.vault-total{margin-top:18px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:24px;padding-top:18px;border-top:1px dashed var(--line-2);width:100%;text-align:center}
.vault-total span{font-size:18px;color:#a5b4d8;font-weight:700}
.vault-total b{color:var(--green-2);font-size:18px;font-weight:900}

/* BALANCE */
.balance-panel{width:100%;border-radius:22px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);padding:22px;text-align:center}
.balance-row-top{display:grid;gap:16px;grid-template-columns:repeat(4,1fr)}
.balance-cell{padding:22px 16px;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.03),rgba(0,0,0,.15));border:1px solid var(--line-2);text-align:center}
.balance-cell .bc-ico{font-size:32px;margin-bottom:10px;display:block;text-align:center}
.balance-cell .bc-lbl,.balance-cell .bc-lbl.big-label{font-size:17px;color:#a5b4d8;font-weight:800;text-transform:uppercase;margin-bottom:10px;text-align:center}
.balance-cell .bc-lbl.big-label{color:var(--blue-2)!important;text-transform:none!important}
.balance-cell .bc-val{font-weight:900;color:#fff;text-align:center}
.balance-cell.blue .bc-val{color:var(--blue-2)}
.balance-cell.green .bc-val{color:var(--green-2)}
.balance-cell.purple .bc-val{color:#a78bfa}
.balance-cell.yellow .bc-val{color:var(--yellow-2)}
.bal-grid{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:16px}
.bal-card{border-radius:22px;padding:26px 22px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bal-card .t{font-size:18px;color:#a5b4d8;font-weight:800;margin-bottom:12px;text-transform:uppercase;text-align:center;width:100%}
.bal-card .v{font-weight:900;color:#fff;line-height:1.2;text-align:center;width:100%}
.bal-card.main{background:linear-gradient(135deg,#131a35,#0a0f1e 60%,#0f1428);border-color:var(--blue)}
.bal-card.main .v{color:var(--blue-2)}
.bal-card.capital{border-color:rgba(250,204,21,.45)}
.bal-card.capital .v{color:var(--yellow-2)}
.bal-card.deficit{border-color:rgba(220,38,38,.45)}
.bal-card.deficit .v{color:#f87171}
.bal-card.surplus{border-color:rgba(34,197,94,.45)}
.bal-card.surplus .v{color:var(--green-2)}

/* DUAL */
.dual-sections-wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,22px);width:100%;align-items:start}
.dual-sections-wrap .section{width:100%;max-width:100%;min-width:0;margin:0}
.dual-sections-wrap .section-title{font-size:clamp(14px,2.2vw,18px);margin-bottom:clamp(10px,1.5vw,14px);text-align:center;justify-content:center}
.dual-sections-wrap .vault-box{padding:0;overflow:hidden}
.dual-sections-wrap .table-wrap{max-height:480px;overflow-y:auto;border-radius:12px;border:none}
.dual-sections-wrap table.tbl{min-width:0;width:100%;font-size:clamp(10px,1.8vw,13px)}
.dual-sections-wrap table.tbl th{padding:clamp(6px,1.1vw,12px) clamp(4px,.8vw,10px);font-size:clamp(9.5px,1.7vw,12px);white-space:nowrap;text-align:center}
.dual-sections-wrap table.tbl td{padding:clamp(6px,1.1vw,12px) clamp(4px,.8vw,10px);font-size:clamp(10px,1.8vw,13px);text-align:center;word-break:break-word}
.dual-sections-wrap table.tbl td:nth-child(2){text-align:left;max-width:120px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(2,4,10,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;animation:fadeIn .2s}
.modal{width:50%;min-width:min(600px,92vw);max-width:100%;border-radius:22px;overflow:hidden;background:linear-gradient(165deg,#0f1428,#06091a);border:1px solid var(--line-3);animation:popIn .3s;display:flex;flex-direction:column;max-height:92vh;margin:auto}
.modal.wide{width:55%;min-width:min(700px,92vw);max-width:1400px}
.modal.xwide{width:60%;min-width:min(900px,92vw);max-width:1600px}
@media (min-width:1600px){.modal{width:50%;max-width:1200px}.modal.wide{width:55%;max-width:1400px}.modal.xwide{width:60%;max-width:1600px}}
@media (max-width:1600px) and (min-width:1201px){.modal{width:55%;max-width:none}.modal.wide{width:60%;max-width:none}.modal.xwide{width:70%;max-width:none}}
@media (max-width:1200px) and (min-width:993px){.modal{width:70%}.modal.wide{width:75%}.modal.xwide{width:85%}}
@media (max-width:992px) and (min-width:769px){.modal,.modal.wide,.modal.xwide{width:88%;min-width:auto;max-width:100%;max-height:92vh;border-radius:18px}}
@media (max-width:768px){.modal,.modal.wide,.modal.xwide{width:95%;min-width:auto;max-width:100%;max-height:96vh;border-radius:14px}.modal-overlay{padding:8px}}
@media (max-width:480px){.modal,.modal.wide,.modal.xwide{width:100%;max-width:100%;max-height:100vh;border-radius:0;min-width:auto}.modal-overlay{padding:0}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:5;background:#0f1428;flex-shrink:0}
.modal-head h3{font-size:16px;font-weight:800;color:#fff;display:flex;align-items:center;gap:9px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-head .x{border:none;background:rgba(59,130,246,.15);color:var(--blue-3);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:14px;border:1px solid var(--line-3);flex-shrink:0;transition:all .2s}
.modal-head .x:hover{background:var(--blue);color:#fff;transform:rotate(90deg)}
.modal-body{padding:18px 20px 24px;font-size:14px;flex:1;overflow-y:auto;overflow-x:hidden}
.modal-body>*{max-width:100%;box-sizing:border-box}
.modal-body .field input,.modal-body .field select,.modal-body .field textarea{width:100%;box-sizing:border-box}

/* FORM */
.form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr))}
.cust-box{margin-top:8px;padding:16px;border-radius:16px;background:linear-gradient(145deg,rgba(59,130,246,.06),rgba(34,197,94,.03));border:1px solid var(--line-2)}
.cust-box .head{margin-bottom:12px}
.cust-box .head h4{font-size:13px;color:var(--blue-3);font-weight:700;text-transform:uppercase}
.suggest{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);background:#06091a;max-height:240px;overflow-y:auto}
.suggest:empty{display:none}
.sug-item{padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px;color:#e8eeff;line-height:1.7}
.sug-item:hover{background:linear-gradient(90deg,rgba(59,130,246,.15),rgba(34,197,94,.08))}
.sug-item b{color:var(--green-2);font-size:14.5px}
.sug-item small{color:#a5b4d8;font-size:12.5px}
.notes-cols{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:8px}
.notes-col{padding:16px;border-radius:16px;border:1px solid var(--line-2);background:linear-gradient(145deg,#0a0f1e,#050810)}
.notes-col.out{border-color:rgba(250,204,21,.3)}
.notes-col.in{border-color:rgba(34,197,94,.3)}
.notes-col h4{font-size:20px;margin-bottom:14px;font-weight:800;color:#fff}
.notes-col.out h4{color:var(--yellow-2)}
.notes-col.in h4{color:var(--green-2)}
.notes-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:space-between}
.note-item{flex:1 1 54px;min-width:52px;text-align:center}
.note-item label{display:block;font-size:13.5px;color:#b8c8ee;margin-bottom:6px;font-weight:700}
.note-item input{width:100%;padding:11px 5px;text-align:center;border-radius:9px;background:#03060d;border:1px solid var(--line-2);color:#fff;font-family:inherit;font-size:15px;font-weight:800;outline:none;transition:all .2s}
.note-item input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.notes-col.out .note-item input{color:var(--yellow-2)}
.notes-col.in .note-item input{color:var(--green-2)}
.sum-line{margin-top:12px;font-size:14px;color:#a5b4d8;display:flex;justify-content:space-between;padding:10px 6px 0;border-top:1px dashed var(--line-2)}
.sum-line b{font-size:17px;color:#fff}
.total-preview{margin-top:18px;padding:18px;border-radius:16px;text-align:center;background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(34,197,94,.06));border:1px solid var(--line-3)}
.total-preview .l{font-size:12.5px;color:var(--blue-3);font-weight:700;text-transform:uppercase}
.total-preview .v{font-size:32px;margin-top:6px;color:#fff;font-weight:800}

/* PENDING */
.pending-box{margin-top:16px;padding:16px;border-radius:16px;background:linear-gradient(145deg,rgba(250,204,21,.08),rgba(250,204,21,.02));border:1px solid rgba(250,204,21,.35)}
.pending-box h4{font-size:13.5px;color:var(--yellow);font-weight:800;margin-bottom:12px}
.pending-empty{color:#a5b4d8;text-align:center;padding:14px;font-size:13.5px}
.pending-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;margin-bottom:8px;background:rgba(0,0,0,.3);border:1px solid var(--line-2);flex-wrap:wrap}
.pending-item .info{font-size:13.5px;color:#eee;flex:1;min-width:180px;line-height:1.75}
.pending-item .info b{color:var(--yellow)}
.pending-item .info small{color:var(--muted);display:block;margin-top:3px}
.accept-head{padding:16px;border-radius:16px;margin-bottom:16px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1px solid var(--line-3);font-size:14px;line-height:1.9;color:#e0eaff}

.online-box{margin-top:16px;padding:18px;border-radius:16px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1.5px solid var(--blue);display:none}
.online-box.active{display:block}
.online-box h4{font-size:14px;font-weight:800;margin-bottom:12px;color:var(--blue-3)}

.cust-branch-toggle{padding:16px 18px;border-radius:16px;margin-top:8px;margin-bottom:16px;background:linear-gradient(145deg,rgba(59,130,246,.06),rgba(34,197,94,.03));border:1px solid var(--line-2)}
.cust-branch-toggle .toggle-title{font-size:13px;font-weight:800;color:#fff;margin-bottom:12px;text-transform:uppercase}
.branch-toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.branch-toggle-btn{padding:13px 20px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;border:1px solid var(--line-2);background:linear-gradient(145deg,#0f1428,#080c1a);color:var(--muted);transition:all .25s}
.branch-toggle-btn.active{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(59,130,246,.4)}

/* TABLES */
.table-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line-2);width:100%;max-width:100%;-webkit-overflow-scrolling:touch;display:block}
table.tbl{width:100%;border-collapse:collapse;min-width:100%}
table.tbl th{background:linear-gradient(180deg,rgba(59,130,246,.18),rgba(59,130,246,.06));text-align:left;font-weight:700;color:var(--blue-3);border-bottom:1px solid var(--line-3);text-transform:uppercase;white-space:nowrap}
table.tbl td{border-top:1px solid var(--line);color:#e0e8ff;line-height:1.5}
table.tbl td.amt{font-weight:800;color:var(--green-2);white-space:nowrap}
table.tbl tr:hover td{background:rgba(59,130,246,.04)}
table.tbl tr.clickable-row{cursor:pointer}
table.tbl tr.clickable-row:hover td{background:rgba(236,72,153,.08)!important}

/* BADGES */
.badge{padding:5px 11px;border-radius:8px;font-weight:700;white-space:nowrap;background:rgba(59,130,246,.15);border:1px solid var(--line-3);color:var(--blue-3);display:inline-block}
.badge.pending{background:rgba(250,204,21,.15);border-color:rgba(250,204,21,.5);color:var(--yellow-2)}
.badge.accepted{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:var(--green-2)}
.badge.due{background:rgba(220,38,38,.18);border-color:rgba(220,38,38,.5);color:#f87171}
.mini{border:none;cursor:pointer;background:rgba(59,130,246,.15);color:var(--blue-3);border-radius:8px;border:1px solid var(--line-3);font-weight:700;transition:all .2s}
.mini:hover{background:var(--blue);color:#fff}
.mini.danger{background:rgba(220,38,38,.15);color:#f87171;border-color:rgba(220,38,38,.4)}
.mini.danger:hover{background:var(--red);color:#fff}
.mini.accept{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;border-color:transparent}
.mini.cash-btn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border-color:transparent}
.mini.online-btn{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:transparent}
.mini.print-btn{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;border-color:transparent}
.mini.show{background:rgba(34,197,94,.2);color:var(--green-2);border-color:rgba(34,197,94,.4)}
.empty{padding:36px 24px;text-align:center;color:#a5b4d8;font-size:14.5px}
.bank-hint{font-size:13.5px;color:#b8c8ee;background:rgba(59,130,246,.08);padding:12px 16px;border-radius:10px;margin-bottom:12px;border:1px dashed rgba(59,130,246,.35)}
.cust-row{cursor:pointer}
.cust-row:hover td{background:rgba(59,130,246,.06)!important}
.cust-row.has-due td{background:rgba(220,38,38,.05)}
.date-mode-banner{width:100%;padding:14px 20px;border-radius:16px;background:linear-gradient(145deg,rgba(250,204,21,.12),rgba(250,204,21,.04));border:1px solid rgba(250,204,21,.4);color:var(--yellow-2);font-size:14px;font-weight:600;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.date-mode-banner b{color:#fff;font-weight:800}
.date-mode-banner .close-mode{margin-left:auto;background:rgba(250,204,21,.2);color:var(--yellow-2);border:1px solid rgba(250,204,21,.5);padding:8px 15px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.auto-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.5);color:var(--green-2);font-size:12.5px;font-weight:700}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.2);border-top-color:var(--blue-3);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
.sync-indicator{position:fixed;bottom:14px;right:14px;z-index:900;font-size:11px;color:var(--muted);background:rgba(4,6,13,.9);padding:6px 12px;border-radius:20px;border:1px solid var(--line-2);font-weight:600;pointer-events:none}
.sync-indicator.active{color:var(--green-2);border-color:rgba(34,197,94,.5)}

/* BRANCH */
.branch-tab{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.branch-tab-btn{padding:14px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:800;border:1.5px solid var(--line-2);background:linear-gradient(145deg,#0f1428,#080c1a);color:var(--muted)}
.branch-tab-btn.active{background:linear-gradient(135deg,var(--blue),#06b6d4);color:#fff;border-color:transparent}
.branch-summary-box{padding:14px 16px;border-radius:12px;background:linear-gradient(145deg,rgba(6,182,212,.06),rgba(59,130,246,.03));border:1px dashed rgba(6,182,212,.4);margin-bottom:14px;font-size:13px;color:#d0daf5;line-height:1.85}
.online-tick-box{padding:16px 18px;border-radius:16px;margin-top:8px;margin-bottom:16px;background:linear-gradient(145deg,rgba(34,197,94,.08),rgba(59,130,246,.04));border:1px solid rgba(34,197,94,.4)}
.online-tick-label{display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line-2)}
.online-tick-label input[type="checkbox"]{width:22px;height:22px;cursor:pointer;accent-color:#22c55e;flex-shrink:0}
.online-tick-text .title{font-size:14px;font-weight:800;color:#fff}
.online-tick-text .sub{font-size:12.5px;color:#a5b4d8;margin-top:3px;line-height:1.6}
.bank-only-box{padding:16px 18px;border-radius:16px;margin-top:8px;margin-bottom:16px;background:linear-gradient(145deg,rgba(139,92,246,.08),rgba(59,130,246,.04));border:1px solid rgba(139,92,246,.4)}
.bank-only-box .title{font-size:14px;font-weight:800;color:#a78bfa;margin-bottom:12px}

/* DB BROWSER */
.db-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line-2)}
.db-tab-btn{padding:10px 16px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;border:1px solid var(--line-2);background:linear-gradient(145deg,#0f1428,#080c1a);color:var(--muted)}
.db-tab-btn.active{background:linear-gradient(135deg,var(--blue),#2563eb);color:#fff;border-color:transparent}
.db-tab-btn .cnt{margin-left:6px;padding:1px 8px;border-radius:6px;background:rgba(255,255,255,.15);font-size:11px;font-weight:800}
.db-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.db-search{flex:1;min-width:200px;padding:10px 14px;border-radius:10px;background:#050810;border:1px solid var(--line-2);color:#fff;font-family:inherit;font-size:13.5px;outline:none}
.db-info{font-size:12.5px;color:#a5b4d8;padding:8px 12px;border-radius:8px;background:rgba(59,130,246,.08);border:1px solid var(--line-2)}
.db-json{font-family:'Courier New',monospace;font-size:12px;background:#03060d;border:1px solid var(--line-2);border-radius:12px;padding:16px;overflow-x:auto;color:#c9d5f0;line-height:1.7;max-height:520px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}

.modal-history{margin-top:24px;padding-top:18px;border-top:2px dashed var(--line-3)}
.modal-history-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:15px;font-weight:800;color:#fff;flex-wrap:wrap}
.modal-history-title span.bar{width:4px;height:22px;border-radius:4px;background:linear-gradient(180deg,#ec4899,#a855f7)}

.notif-container{position:fixed;top:78px;right:18px;z-index:99999;display:flex;flex-direction:column;gap:12px;max-width:420px;width:calc(100% - 36px);pointer-events:none}
.notif-card{pointer-events:auto;position:relative;overflow:hidden;border-radius:18px;padding:16px 18px;background:linear-gradient(150deg,#0f1428,#06091a);border:1.5px solid rgba(59,130,246,.6);box-shadow:0 24px 60px rgba(0,0,0,.95);animation:notifSlide .35s cubic-bezier(.2,1,.3,1);display:flex;gap:14px;align-items:flex-start;backdrop-filter:blur(14px);cursor:pointer}
.notif-card.success{border-color:rgba(34,197,94,.7);background:linear-gradient(150deg,rgba(34,197,94,.18),rgba(6,9,26,.95))}
.notif-card.warning{border-color:rgba(250,204,21,.7);background:linear-gradient(150deg,rgba(250,204,21,.16),rgba(6,9,26,.95))}
.notif-card.danger{border-color:rgba(220,38,38,.7);background:linear-gradient(150deg,rgba(220,38,38,.18),rgba(6,9,26,.95))}
.notif-card.info{border-color:rgba(59,130,246,.7);background:linear-gradient(150deg,rgba(59,130,246,.16),rgba(6,9,26,.95))}
.notif-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex-shrink:0;background:linear-gradient(145deg,rgba(59,130,246,.25),rgba(34,197,94,.1));border:1px solid rgba(59,130,246,.5)}
.notif-card.success .notif-icon{background:linear-gradient(145deg,rgba(34,197,94,.35),rgba(34,197,94,.1));border-color:rgba(34,197,94,.6)}
.notif-card.warning .notif-icon{background:linear-gradient(145deg,rgba(250,204,21,.35),rgba(250,204,21,.1));border-color:rgba(250,204,21,.6)}
.notif-card.danger .notif-icon{background:linear-gradient(145deg,rgba(220,38,38,.35),rgba(220,38,38,.1));border-color:rgba(220,38,38,.6)}
.notif-icon.ring{animation:bellRing .8s ease-in-out}
.notif-content{flex:1;min-width:0}
.notif-title{font-size:14px;font-weight:900;color:#fff;line-height:1.5;margin-bottom:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notif-body{font-size:12.5px;color:#c9d5f0;line-height:1.85;word-break:break-word}
.notif-body b{color:#fff;font-weight:800}
.notif-body .notif-amt{color:#4ade80;font-weight:900;font-size:15px}
.notif-body .notif-meta{display:block;margin-top:6px;font-size:11px;color:#7a8ab8}
.notif-close{position:absolute;top:8px;right:10px;width:26px;height:26px;border:none;border-radius:8px;background:rgba(255,255,255,.06);color:#a5b4d8;cursor:pointer;font-size:13px;display:grid;place-items:center}
.notif-close:hover{background:rgba(220,38,38,.3);color:#f87171}
.notif-progress{position:absolute;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#3b82f6,#22c55e);animation:notifProgress linear forwards}
.notif-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.notif-actions button{padding:7px 14px;border-radius:9px;border:1px solid rgba(59,130,246,.4);background:rgba(59,130,246,.15);color:#93c5fd;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
.notif-actions button.primary{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent;color:#fff}

.net-banner{position:fixed;top:0;left:0;right:0;z-index:9998;padding:10px 18px;background:linear-gradient(135deg,rgba(220,38,38,.95),rgba(153,27,27,.92));color:#fff;font-weight:800;font-size:13px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.6);transform:translateY(-100%);transition:transform .35s;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.net-banner.show{transform:translateY(0)}
.net-banner.online-banner{background:linear-gradient(135deg,rgba(34,197,94,.95),rgba(22,163,74,.92))}
.net-banner .retry-btn{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);padding:5px 12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}

@media (max-width:900px){
  .topbar{padding:8px 10px;gap:8px;min-height:62px}
  .topbar .tb-menu-btn{width:44px;height:44px;font-size:20px}
  .brand .logo{width:42px;height:42px}
  .brand .logo svg{width:36px;height:36px}
  .brand h1{font-size:17px}
  .brand p{font-size:12px}
  .presence-badge,.queue-badge{font-size:13px;padding:7px 12px}
  .tb-branch{font-size:13px;padding:9px 12px}
  .tb-select{font-size:13px;padding:9px 28px 9px 12px;min-width:170px;max-width:200px}
  .tb-date{font-size:13px;padding:9px 10px;max-width:150px}
  .tb-time{font-size:13px;padding:9px 12px}
  .balance-row-top{grid-template-columns:repeat(2,1fr)}
  .dual-sections-wrap{grid-template-columns:1fr;gap:18px}
  .dual-sections-wrap .table-wrap{max-height:none}
}
@media (max-width:768px){
  .form-row{grid-template-columns:1fr}
  .notes-cols{grid-template-columns:1fr}
  .modal-body{padding:12px !important}
}
@media (max-width:640px){
  main{padding:18px 12px 60px;gap:20px}
  .sidebar{width:88vw}
  .card{padding:16px}
  .notif-container{top:70px;right:10px;left:10px;width:auto;max-width:none}
  .big-amt.sm .lbl{font-size:17px;min-width:78px}
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>

<div id="loginScreen" class="login-wrap">

function attachAmountInput(inputEl, opts){
  opts = opts || {};
  if(!inputEl || inputEl.__smartAttached) return;
  inputEl.__smartAttached = true;
  const allowDecimal = opts.decimal !== false;
  const maxDecimals = opts.maxDecimals != null ? opts.maxDecimals : 2;
  inputEl.addEventListener('keydown', (e)=>{
    const allowed = ['Backspace','Delete','Tab','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','Enter','Escape'];
    if(allowed.includes(e.key)) return;
    if(e.ctrlKey || e.metaKey) return;
    if(e.key === '.'){ if(!allowDecimal) e.preventDefault(); return; }
    if(!/^[0-9]$/.test(e.key)) e.preventDefault();
  });
  inputEl.addEventListener('paste', (e)=>{
    e.preventDefault();
    const txt = (e.clipboardData || window.clipboardData).getData('text');
    let clean = String(txt).replace(/[^0-9.]/g, '');
    if(!allowDecimal) clean = clean.replace(/\./g, '');
    const parts = clean.split('.');
    if(parts.length > 2) clean = parts[0] + '.' + parts.slice(1).join('');
    inputEl.value = clean;
    inputEl.dispatchEvent(new Event('input', { bubbles: true }));
  });
  inputEl.addEventListener('input', ()=>{
    let raw = inputEl.value.replace(/[^0-9.]/g, '');
    if(!allowDecimal) raw = raw.replace(/\./g, '');
    const parts = raw.split('.');
    if(parts.length > 2) raw = parts[0] + '.' + parts.slice(1).join('');
    if(!raw){ inputEl.value = ''; return; }
    if(raw.includes('.')){
      const [intPart, decPart] = raw.split('.');
      const formatted = intPart ? Number(intPart).toLocaleString('en-US') : '0';
      inputEl.value = formatted + '.' + decPart.slice(0, maxDecimals);
    } else {
      inputEl.value = raw ? Number(raw).toLocaleString('en-US') : '';
    }
  });
  inputEl.addEventListener('focus', ()=>{ setTimeout(()=> inputEl.select(), 50); });
}

  const oldNotes = JSON.stringify(oldTx?.notesOut || {}) + '|' + JSON.stringify(oldTx?.notesIn || {});
  const newNotes = JSON.stringify(newTx?.notesOut || {}) + '|' + JSON.stringify(newTx?.notesIn || {});

async function pullRemoteDB(){
  if(!__isRemoteReady || !__supabaseClient) return;

    const res = await withTimeout(__supabaseClient.from(window.SUPABASE_TABLE).select('data').eq('id', window.SUPABASE_ROW_ID).maybeSingle(), SUPABASE_TIMEOUT_MS, { data: null, error: { message: 'timeout' } });
    if(res && res.data && res.data.data && typeof res.data.data === 'object'){
      const remote = res.data.data;
      const remoteTxCount = (remote.txs || []).length;
      const remoteCustCount = (remote.customers || []).length;
      const localTxCount = (DB()?.txs || []).length;
      const localCustCount = (DB()?.customers || []).length;
      if(remoteTxCount === 0 && remoteCustCount === 0 && (localTxCount > 0 || localCustCount > 0)){ window.__hasSyncedOnce = true; return; }
      const localTs = Date.parse((DB() && DB().__lastUpdate) || 0) || 0;
      const remoteTs = Date.parse(remote.__lastUpdate || 0) || 0;
      if(remoteTs >= localTs || localTxCount === 0){
        __isApplyingRemote = true;
        window.db = remote;
        __lastAutoPushTs = remote.__lastUpdate || '';
        normalizeDB(); forceFixAdmin(); __invalidateCaches();
        recalcAllCustomerDues(false); recomputeLive(); saveLocalDB();
        __isApplyingRemote = false;
        window.__hasSyncedOnce = true;
        if(session){ renderTopbar(); renderDashboard(); renderSidebar(); }
      } else { window.__hasSyncedOnce = true; if(navigator.onLine) pushRemoteDB(true).catch(()=>{}); }
    } else { window.__hasSyncedOnce = true; if((DB()?.txs || []).length > 0 && navigator.onLine) pushRemoteDB(true).catch(()=>{}); }
  }catch(e){ console.warn('[pull] Failed:', e); window.__hasSyncedOnce = true; }
}
async function pushRemoteDB(force, newTxs){
  if(!__isRemoteReady || !__supabaseClient) return;
  if(__isApplyingRemote) return;
  if(!navigator.onLine && !force){ queueAdd('push_offline'); return; }
  if(__pushInFlight){ __pushPending = true; return; }
  __pushInFlight = true;
  try{
    const localDb = DB();
    const localTxCount = (localDb?.txs || []).length;
    const localCustCount = (localDb?.customers || []).length;
    const hasLocalData = localTxCount > 0 || localCustCount > 0 || (localDb?.users || []).length > 1;
    if(!window.__hasSyncedOnce && !hasLocalData){ setTimeout(() => pullRemoteDB().catch(()=>{}), 500); return; }
    let deviceInfo = null;
    try{ deviceInfo = await buildDeviceInfo(); }catch(e){}
    const dbCopy = JSON.parse(JSON.stringify(DB()));
    dbCopy.__lastDevice = deviceInfo || { device: getDeviceName(), user: session?.name || 'অজানা', username: session?.username || '', branch: session?.role === 'admin' ? 'অ্যাডমিন' : (BRANCHES[session?.branch]?.name || 'অজানা'), role: session?.role || 'user', location: (window.__geoCache && window.__geoCache.label) || 'Kalaroa, Satkhira, BD' };

    const payload = { id: window.SUPABASE_ROW_ID, data: dbCopy, updated_at: new Date().toISOString() };
    const res = await withTimeout(__supabaseClient.from(window.SUPABASE_TABLE).upsert(payload, { onConflict: 'id' }), SUPABASE_TIMEOUT_MS, { error: { message: 'timeout' } });
    if(res && res.error) throw new Error(res.error.message || 'push error');
    window.__hasSyncedOnce = true;
    __lastAutoPushTs = dbCopy.__lastUpdate || '';
    if(newTxs && newTxs.length){ newTxs.forEach(tx => broadcastTx(tx)); }
    const ind = document.getElementById('syncIndicator');
    if(ind){ ind.classList.add('active'); ind.textContent = '☁️ Synced'; setTimeout(()=>{ ind.classList.remove('active'); ind.textContent = 'সিঙ্ক'; }, 1500); }
    if(queueSize() > 0) queueClear();
    return true;
  }catch(e){ queueAdd('push_fail'); throw e; }
  finally { __pushInFlight = false; if(__pushPending){ __pushPending = false; setTimeout(() => pushRemoteDB(true).catch(()=>{}), 100); } }
}

function setupRealtime(){

      .on('postgres_changes', { event: '*', schema: 'public', table: window.SUPABASE_TABLE, filter: 'id=eq.' + window.SUPABASE_ROW_ID }, (payload) => { handleRealtimeUpdate(payload); })
      .on('presence', { event: 'sync' }, () => { try{ const state = __realtimeChannel.presenceState(); const flat = Object.values(state).flat(); updatePresenceUI(flat); }catch(e){} })
      .subscribe(async (status) => {

          __realtimeReconnectAttempts++;
          const delay = Math.min(1000 * Math.pow(1.5, __realtimeReconnectAttempts - 1), 15000);
          setTimeout(() => { if(navigator.onLine) setupRealtime(); }, delay);
        } else if(status === 'CLOSED'){ setTimeout(() => { if(navigator.onLine) setupRealtime(); }, 3000); }
      });
  }catch(e){ setTimeout(() => { if(navigator.onLine) setupRealtime(); }, 5000); }
}
function handleRealtimeUpdate(payload){

    const localTs = Date.parse((DB() && DB().__lastUpdate) || 0) || 0;
    if(remoteTs <= localTs) return;
    __isApplyingRemote = true;
    const oldTxIds = new Set((DB()?.txs || []).map(t => t.id));

function noteDetailHTML(notes){ const keys = Object.keys(notes||{}).filter(k=>notes[k]>0).sort((a,b)=>b-a); if(!keys.length) return '—'; return keys.map(k => '<span style="display:inline-block;padding:4px 10px;margin:3px 5px 3px 0;border-radius:8px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.4);color:#93c5fd;font-size:12.5px;font-weight:600">৳'+toBn(k)+' × '+toBn(notes[k])+' = ৳'+fmt(Number(k)*Number(notes[k]))+'</span>').join(''); }
function noteListInline(notes){ const keys = Object.keys(notes||{}).filter(k=>notes[k]>0).sort((a,b)=>b-a); if(!keys.length) return ''; return keys.map(k=>'<span>৳'+toBn(k)+'×'+toBn(notes[k])+'</span>').join(' '); }

function notesRowHTML(prefix, values, vault){
  values = values || {};
  vault = vault || {};
  return '<div class="notes-row">' + DENOMS.map(d => {
    const hasValue = values[d] !== undefined && values[d] !== null && Number(values[d]) > 0;
    const val = hasValue ? values[d] : '';
    const avail = Number(vault[d]) || 0;
    const availColor = avail > 0 ? '#4ade80' : '#7a8ab8';
    const availLabel = avail > 0 ? 'আছে ' + toBn(avail) + ' টি' : 'নেই';
    return '<div class="note-item" data-denom-box="' + prefix + '_' + d + '">' +
      '<label>৳ ' + toBn(d) + '</label>' +

    '</div>';
  }).join('') + '</div>';
}

function updateVaultStock(scope, prefix, branchKey){
  if(!scope) return;
  const vault = DB()?.liveVault?.[branchKey] || {};
  DENOMS.forEach(d => {
    const inp = scope.querySelector('#' + prefix + '_' + d);
    const stockEl = scope.querySelector('#stock_' + prefix + '_' + d);
    const box = scope.querySelector('[data-denom-box="' + prefix + '_' + d + '"]');
    if(!inp || !stockEl) return;
    const avail = Number(vault[d]) || 0;
    const entered = parseInt(String(inp.value || '').replace(/[^0-9]/g, ''), 10) || 0;
    const exceeded = entered > avail;
    if(avail <= 0 && entered === 0){ stockEl.textContent = 'নেই'; stockEl.style.color = '#7a8ab8'; }
    else if(exceeded){ stockEl.innerHTML = 'আছে ' + toBn(avail) + ' — <span style="color:#f87171;font-weight:900">কম ' + toBn(entered - avail) + '</span>'; stockEl.style.color = '#facc15'; }
    else { stockEl.textContent = 'আছে ' + toBn(avail) + ' টি'; stockEl.style.color = '#4ade80'; }
    if(exceeded){ inp.style.borderColor = 'rgba(220,38,38,.9)'; inp.style.background = 'rgba(220,38,38,.15)'; inp.style.color = '#f87171'; inp.style.boxShadow = '0 0 0 3px rgba(220,38,38,.2)'; if(box){ box.style.animation = 'shake .3s ease-in-out'; setTimeout(() => { box.style.animation = ''; }, 320); } }
    else if(entered > 0){ inp.style.borderColor = 'rgba(34,197,94,.6)'; inp.style.background = ''; inp.style.color = '#4ade80'; inp.style.boxShadow = ''; }
    else { inp.style.borderColor = ''; inp.style.background = ''; inp.style.color = '#fff'; inp.style.boxShadow = ''; }
  });
}

function __setupDenomInputs(wrap, branchFn, onInput){
  const prefixes = ['out', 'in', 'me_out', 'me_in', 'cc_out'];
  prefixes.forEach(prefix => {
    wrap.querySelectorAll('[id^="' + prefix + '_"]').forEach(inp => {
      if(!inp.dataset.denom) return;
      if(inp.__denomSetup) return;
      inp.__denomSetup = true;
      inp.setAttribute('inputmode', 'numeric');
      inp.setAttribute('autocomplete', 'off');
      inp.setAttribute('maxlength', '5');
      inp.addEventListener('input', (e) => {
        let v = String(e.target.value || '').replace(/[^0-9]/g, '');
        if(v.length > 5) v = v.slice(0, 5);
        if(e.target.value !== v) e.target.value = v;
        const bk = typeof branchFn === 'function' ? branchFn() : branchFn;
        updateVaultStock(wrap, prefix, bk);
        if(typeof onInput === 'function') onInput();
      });
      inp.addEventListener('keydown', (e) => {
        const allowed = ['Backspace','Delete','Tab','ArrowLeft','ArrowRight','Home','End','Enter','Escape'];
        if(allowed.includes(e.key)) return;
        if(e.ctrlKey || e.metaKey) return;
        if(!/^[0-9]$/.test(e.key)) e.preventDefault();
      });
      inp.addEventListener('paste', (e) => {
        e.preventDefault();
        const txt = (e.clipboardData || window.clipboardData).getData('text');
        let v = String(txt).replace(/[^0-9]/g, '').slice(0, 5);
        e.target.value = v;
        e.target.dispatchEvent(new Event('input', { bubbles: true }));
      });
    });
  });
}

function disableAutofill(scope){
  scope = scope || document;
  const loginScreen = document.getElementById('loginScreen');
  scope.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]):not([type="date"]), textarea').forEach(el => {
    if(loginScreen && loginScreen.contains(el)) return;
    el.setAttribute('autocomplete', 'off');
    el.setAttribute('autocorrect', 'off');
    el.setAttribute('autocapitalize', 'none');
    el.setAttribute('spellcheck', 'false');
    if(!el.dataset.noAutofillApplied){
      el.dataset.noAutofillApplied = '1';
      el.setAttribute('readonly', 'readonly');
      const handler = function(){ this.removeAttribute('readonly'); this.removeEventListener('focus', handler); };
      el.addEventListener('focus', handler);
    }
  });
}

function setupLoanGivenForm(wrap, editing, close, defaultBranch){
  const so = wrap.querySelector('#sumOut'), si = wrap.querySelector('#sumIn');

  function updateSummary(){

    const cashNotTaken = Math.max(0, total - online - cashGiven);
    const overUtilized = (online + cashGiven) > (total + 0.01);

        cSub.style.color = '#fde047'; cSub.textContent = '৳ ' + fmt(cashNotTaken) + ' ব্যাংকে থাকবে — Loan Collection-এ সংগ্রহযোগ্য';

        cSub.style.color = '#86efac'; cSub.textContent = 'কোনো Loan Collection থাকবে না';

      wb.style.display = 'block';

  }
  
  function recalc(){
    const on = readNotes(wrap, 'out'), inN = readNotes(wrap, 'in');
    const os = noteSum(on), is = noteSum(inN);
    if(so) so.textContent = '৳ ' + fmt(os);
    if(si) si.textContent = '৳ ' + fmt(is);
    updateSummary();
  }
  
  if(loanTotalInput) loanTotalInput.addEventListener('blur', () => {
    const v = getLoanTotal();
    if(v <= 0){ if(loanTotalError) loanTotalError.style.display = 'block'; loanTotalInput.style.borderColor = 'rgba(220,38,38,.6)'; }
    else { if(loanTotalError) loanTotalError.style.display = 'none'; loanTotalInput.style.borderColor = ''; }
  });
  
  function showCustomerInfo(acc, name){
    if(!acc || !custInfoEl) return;
    const allTxs = getCustomerAllTxs(acc);
    const loanTxs = allTxs.filter(t => t.type === 'loan_given' && !t.cancelled);
    const totalLoan = loanTxs.reduce((s,t) => s + (Number(t.amount) || 0), 0);
    const totalOnline = loanTxs.reduce((s,t) => s + (Number(t.onlineAmount) || 0), 0);
    const totalCash = loanTxs.reduce((s,t) => { const no = t.notesOut || {}; let sum = 0; Object.keys(no).forEach(d => { sum += Number(d) * (Number(no[d]) || 0); }); return s + sum; }, 0);
    const totalNotTaken = loanTxs.reduce((s,t) => s + (Number(t.cashNotTakenAmount) || 0), 0);
    custInfoEl.style.display = 'block';
    custInfoEl.innerHTML = '<div style="padding:12px 14px;border-radius:12px;background:linear-gradient(145deg,rgba(59,130,246,.12),rgba(34,197,94,.05));border:1.5px solid rgba(59,130,246,.4)"><div style="font-size:12.5px;color:#93c5fd;font-weight:800;text-transform:uppercase;margin-bottom:10px">👤 গ্রাহক তথ্য — ' + esc(name || '-') + '</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;font-size:12.5px"><div style="padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(59,130,246,.25)"><div style="color:#a5b4d8;font-size:10.5px;font-weight:700">📊 মোট লেনদেন</div><div style="color:#fff;font-weight:900;font-size:14px;margin-top:2px">' + toBn(allTxs.length) + ' টি</div></div><div style="padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(59,130,246,.25)"><div style="color:#a5b4d8;font-size:10.5px;font-weight:700">🏦 মোট ঋণ</div><div style="color:#93c5fd;font-weight:900;font-size:14px;margin-top:2px">৳ ' + fmt(totalLoan) + '</div></div><div style="padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(59,130,246,.25)"><div style="color:#a5b4d8;font-size:10.5px;font-weight:700">🌐 অনলাইন</div><div style="color:#c4b5fd;font-weight:900;font-size:14px;margin-top:2px">৳ ' + fmt(totalOnline) + '</div></div><div style="padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(59,130,246,.25)"><div style="color:#a5b4d8;font-size:10.5px;font-weight:700">💵 ক্যাশ</div><div style="color:#4ade80;font-weight:900;font-size:14px;margin-top:2px">৳ ' + fmt(totalCash) + '</div></div><div style="padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(59,130,246,.25)"><div style="color:#a5b4d8;font-size:10.5px;font-weight:700">💰 নেয়নি</div><div style="color:#facc15;font-weight:900;font-size:14px;margin-top:2px">৳ ' + fmt(totalNotTaken) + '</div></div></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button type="button" class="btn cyan sm" id="ci_view_history" style="flex:1;min-width:140px;padding:9px 14px;font-size:13px">📜 সম্পূর্ণ হিস্টোরি দেখুন</button></div></div>';
    setTimeout(() => { const btn = custInfoEl.querySelector('#ci_view_history'); if(btn){ btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); if(typeof openCustomerDetailPopup === 'function'){ openCustomerDetailPopup(acc, name); } }); } }, 100);
  }
  
  // Customer search
  const sEl = wrap.querySelector('#f_search'), sg = wrap.querySelector('#f_suggest');
  if(sEl && sg){
    sEl.addEventListener('input', () => {
      const list = searchCustomers(sEl.value);
      if(!list.length){ sg.innerHTML = ''; return; }
      sg.innerHTML = list.map(c => { const d = calculateCustomerDue(c.accountNo); const dueBadge = d.net > 0 ? '<span style="display:inline-block;margin-left:6px;padding:2px 8px;border-radius:6px;background:rgba(220,38,38,.2);border:1px solid rgba(220,38,38,.5);color:#f87171;font-size:11px;font-weight:800">বকেয়া ৳ ' + fmt(d.net) + '</span>' : ''; return '<div class="sug-item" data-id="' + c.id + '" data-acc="' + esc(c.accountNo) + '" data-name="' + esc(c.name) + '"><b>' + esc(c.name) + '</b> — <small>' + esc(c.accountNo) + '</small>' + dueBadge + '<br><small>📱 ' + esc(c.mobile || '-') + '</small></div>'; }).join('');
      sg.querySelectorAll('.sug-item').forEach(el => { el.addEventListener('click', (e) => { e.stopPropagation(); const c = DB().customers.find(x => x.id === el.dataset.id); if(!c) return; accEl.value = c.accountNo; nameEl.value = c.name; wrap.querySelector('#f_mobile').value = c.mobile || ''; wrap.querySelector('#f_addr').value = c.address || ''; sEl.value = c.accountNo; sg.innerHTML = ''; showCustomerInfo(c.accountNo, c.name); }); });
    });
  }
  if(accEl){ accEl.addEventListener('blur', () => { const acc = accEl.value.trim(); if(acc){ const c = DB().customers.find(x => x.accountNo === acc); if(c) showCustomerInfo(acc, c.name); } }); }
  const ec = wrap.querySelector('#f_editCust');
  if(ec) ec.addEventListener('click', async () => { const acc = accEl.value.trim(), name = nameEl.value.trim(); if(!acc && !name) return; const br = getBranchKey(); upsertCustomer({ accountNo: acc, name, mobile: wrap.querySelector('#f_mobile').value.trim(), address: wrap.querySelector('#f_addr').value.trim(), branch: br }); await saveDB(); toast('✅ গ্রাহক সেভ'); if(acc) showCustomerInfo(acc, name); });
  const cd = wrap.querySelector('#f_checkDue');
  if(cd) cd.addEventListener('click', () => { const acc = accEl.value.trim(); if(!acc){ toast('⚠️ অ্যাকাউন্ট দিন'); return; } const c = DB().customers.find(x => x.accountNo === acc); if(c) openCustomerDetailPopup(c.accountNo, c.name); else toast('ℹ️ গ্রাহক পাওয়া যায়নি'); });
  
  // Setup denom inputs
  __setupDenomInputs(wrap, getBranchKey, recalc);
  ['out', 'in'].forEach(p => updateVaultStock(wrap, p, getBranchKey()));
  if(loanTotalInput) loanTotalInput.addEventListener('input', recalc);
  if(onlineAmountInput) onlineAmountInput.addEventListener('input', recalc);
  const branchEl = wrap.querySelector('#f_branch');
  if(branchEl) branchEl.addEventListener('change', () => { ['out', 'in'].forEach(p => updateVaultStock(wrap, p, getBranchKey())); recalc(); });
  recalc();
  
  // History (grouped by customer)

    const allLoans = getAllTxs().filter(t => t.type === 'loan_given' && !t.cancelled);

    const custList = Object.values(custMap).sort((a,b) => (b.lastTime || '').localeCompare(a.lastTime || ''));
    area.innerHTML = '<div class="modal-history"><div class="modal-history-title"><span class="bar"></span> 👥 গ্রাহক ভিত্তিক ঋণ হিস্টোরি (' + toBn(custList.length) + ' জন)</div>' + (custList.length ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>গ্রাহক</th><th>লেনদেন</th><th>মোট ঋণ</th><th>অনলাইন</th><th>ক্যাশ</th><th>নেয়নি</th><th>ভিউ</th></tr></thead><tbody>' + custList.map((c,i) => '<tr class="clickable-row" data-cust-acc="' + esc(c.acc) + '" data-cust-name="' + esc(c.name) + '"><td>' + toBn(i+1) + '</td><td>👤 <b style="color:#4ade80">' + esc(c.name) + '</b><br><small style="color:#7a8ab8;font-family:monospace;font-size:11px">' + esc(c.acc || '-') + '</small></td><td style="text-align:center">' + toBn(c.count) + '</td><td style="color:#93c5fd;font-weight:800;white-space:nowrap">৳ ' + fmt(c.total) + '</td><td style="color:#c4b5fd;font-weight:800;white-space:nowrap">৳ ' + fmt(c.online) + '</td><td style="color:#4ade80;font-weight:800;white-space:nowrap">৳ ' + fmt(c.cash) + '</td><td style="color:#facc15;font-weight:800;white-space:nowrap">৳ ' + fmt(c.notTaken) + '</td><td><button class="mini show" data-view-cust="' + esc(c.acc) + '" data-view-name="' + esc(c.name) + '">👁️</button></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">📭 নেই</div>') + '</div>';

    area.querySelectorAll('[data-view-cust]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); if(btn.dataset.viewCust && typeof openCustomerDetailPopup === 'function') openCustomerDetailPopup(btn.dataset.viewCust, btn.dataset.viewName); }); });
  }
  
  // SAVE
  wrap.querySelector('#f_save').addEventListener('click', async () => {
    const sBtn = wrap.querySelector('#f_save');

    // Validation 2: Online > Total

      alert('⚠️ অনলাইন ফান্ড ট্রান্সফার মূল ঋণের চেয়ে বেশি!\n\nমোট: ৳ ' + fmt(total) + '\nঅনলাইন: ৳ ' + fmt(online));
      return;
    }
    // Validation 3: Over-utilization
    if((online + cashGiven) > total + 0.01){
      alert('⚠️ অতিরিক্ত পরিমাণ!\n\nমোট ঋণ: ৳ ' + fmt(total) + '\n− অনলাইন: ৳ ' + fmt(online) + '\n= ক্যাশ সর্বোচ্চ: ৳ ' + fmt(total - online) + '\n\nআপনি ক্যাশ দিয়েছেন: ৳ ' + fmt(cashGiven) + '\n\n💸 অতিরিক্ত: ৳ ' + fmt((online + cashGiven) - total));
      return;
    }
    // Validation 4: Vault strict check
    if(!editing){
      const vault = DB().liveVault?.[cB] || {};
      const miss = [];
      Object.keys(on).forEach(d => { const n = Number(on[d]) || 0, h = Number(vault[d]) || 0; if(n > h) miss.push({ d, n, h }); });
      if(miss.length > 0){
        miss.forEach(m => { const inp = wrap.querySelector('#out_' + m.d); if(inp){ inp.style.borderColor = 'rgba(220,38,38,.9)'; inp.style.background = 'rgba(220,38,38,.25)'; inp.focus(); inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); } });
        const details = miss.map(m => '৳ ' + toBn(m.d) + ' — দরকার ' + toBn(m.n) + ', আছে ' + toBn(m.h)).join('\n');
        alert('🚫 ভল্টে পর্যাপ্ত নোট নেই!\n\n' + details + '\n\n📌 Modal বন্ধ করা হয়নি — সংশোধন করুন।');
        return;
      }
    }
    // Validation 5: Customer
    const custAcc = accEl.value.trim(), custName = nameEl.value.trim();
    if(!custName || !custAcc){ alert('⚠️ গ্রাহকের নাম ও অ্যাকাউন্ট দিন'); return; }
    
    sBtn.disabled = true;
    const orig = sBtn.innerHTML;
    sBtn.innerHTML = '<span class="spinner"></span>';
    try{
      const tx = {
        id: editing ? editing.id : uid(), type: 'loan_given', date, branch: tB, custBranch: cB, dir: 'out',
        amount: Math.round(total * 100) / 100,
        onlineAmount: online > 0 ? Math.round(online * 100) / 100 : null,
        cashAmount: Math.round(cashGiven * 100) / 100,
        cashNotTaken: cashNotTakenAuto > 0,
        cashNotTakenAmount: cashNotTakenAuto > 0 ? Math.round(cashNotTakenAuto * 100) / 100 : null,
        onlineTransfer: online > 0,
        onlineBankName: online > 0 ? (wrap.querySelector('#f_onlineBankName')?.value || '') : null,
        notesOut: on, notesIn: inN,
        custAcc, custName,
        custMobile: wrap.querySelector('#f_mobile').value.trim(),
        custAddr: wrap.querySelector('#f_addr').value.trim(),
        note: wrap.querySelector('#f_note').value.trim() || '',
        user: session.name, userUsername: session.username,
        createdAt: editing ? editing.createdAt : new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        year: date.slice(0, 4), accepted: true, acceptedDate: date
      };
      if(cashNotTakenAuto > 0){
        tx.collectionStatus = editing?.collectionStatus || 'pending';
        tx.collectedAmount = editing?.collectedAmount || 0;
      } else { tx.collectionStatus = null; tx.collectedAmount = 0; }
      
      const isCreating = !editing;
      if(!editing){ DB().txs.push(tx); } else { const i = DB().txs.findIndex(x => x.id === editing.id); if(i >= 0) DB().txs[i] = tx; }
      upsertCustomer({ accountNo: custAcc, name: custName, mobile: tx.custMobile, address: tx.custAddr, branch: cB });
      addTxLog(tx.id, isCreating ? 'create' : 'update', isCreating ? { action: 'new loan' } : computeTxChanges(editing, tx), tx);
      addActivityLog({ type: isCreating ? 'txn_create' : 'txn_update', title: (isCreating ? '💸 ' : '✏️ ') + 'ঋণ বিতরণ' + (isCreating ? ' তৈরি' : ' আপডেট'), detail: custName, amount: total, targetId: tx.id });
      close();
      toast('✅ সংরক্ষিত — ৳ ' + fmt(total));
      await afterTxSave(tx, isCreating);
    }catch(e){
      alert('❌ ' + e.message);
      sBtn.disabled = false;
      sBtn.innerHTML = orig;
    }
  });
}

  }

  if(ec) ec.addEventListener('click', async ()=>{ const acc = wrap.querySelector('#f_acc').value.trim(), name = wrap.querySelector('#f_name').value.trim(); if(!acc && !name) return; const hb = wrap.querySelector('#f_custBranch_hidden'); const br = hb?.value || 'kalaroa'; upsertCustomer({ accountNo: acc, name, mobile: wrap.querySelector('#f_mobile').value.trim(), address: wrap.querySelector('#f_addr').value.trim(), branch: br }); await saveDB(); toast('✅ সেভ'); });

        custAddr: wrap.querySelector('#f_addr')?.value.trim() || '',
        note: wrap.querySelector('#f_note')?.value.trim() || '',
        user: session.name, userUsername: session.username,
        createdAt: editing ? editing.createdAt : new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        year: date.slice(0,4), accepted: true, acceptedDate: date
      };
      const isCreating = !editing;
      if(!editing){ DB().txs.push(tx); } else { const i = DB().txs.findIndex(x => x.id === editing.id); if(i >= 0) DB().txs[i] = tx; }
      if(cfg.cust && (tx.custAcc || tx.custName)){ const c = upsertCustomer({ accountNo: tx.custAcc, name: tx.custName, mobile: tx.custMobile, address: tx.custAddr, branch: cB }); if(c) tx.custAcc = c.accountNo; }
      if(type === 'support' && tx.custAcc) updateCustomerDueInDB(tx.custAcc, false);
      addTxLog(tx.id, isCreating ? 'create' : 'update', isCreating ? { action: 'new transaction' } : computeTxChanges(editing, tx), tx);
      addActivityLog({ type: isCreating ? 'txn_create' : 'txn_update', title: (isCreating ? '💸 ' : '✏️ ') + (cfg.title || type) + (isCreating ? ' তৈরি' : ' আপডেট'), detail: tx.custName || '', amount: tA, targetId: tx.id });
      close();
      toast('✅ সংরক্ষিত — ৳ ' + fmt(tA));
      await afterTxSave(tx, isCreating);
    }catch(e){
      alert('❌ ' + e.message);
      sBtn.disabled = false;
      sBtn.innerHTML = orig;
    }
  });
}

/* ============================================================

  const df = editing ? editing.from : (isAdminUser ? (viewBranch === 'all' ? 'kalaroa' : viewBranch) : myB);
  const dt = editing ? editing.to : (df === 'kalaroa' ? 'jhaudanga' : 'kalaroa');
  const fromVault = DB().liveVault?.[df] || {};
  const body = '<div class="form-row"><div class="field"><label>তারিখ</label><input type="date" id="f_date" value="' + (editing ? editing.date : dashDate) + '"></div><div class="field"><label>যে আউটলেট থেকে</label><select id="f_from">' + branchOpts(df) + '</select></div><div class="field"><label>যে আউটলেটে</label><select id="f_to">' + branchOpts(dt) + '</select></div></div><div class="bank-hint">💡 নোট sender-এর ভল্ট থেকে কমবে, receiver-এর ভল্টে যোগ হবে।</div><div class="notes-cols" id="notesCols"><div class="notes-col out"><h4>💸 পাঠানো নোট</h4>' + notesRowHTML('out', editing?.notesOut||null, fromVault) + '<div class="sum-line"><span>মোট</span><b id="sumOut">৳ 0.00</b></div></div><div class="notes-col in"><h4>📥 গ্রহণযোগ্য</h4>' + notesRowHTML('in', editing?.notesIn||null, {}) + '<div class="sum-line"><span>মোট</span><b id="sumIn">৳ 0.00</b></div></div></div><div id="noteAvailabilityWarning" style="margin-top:10px;display:none"></div><div class="total-preview"><div class="l">নেট পরিমাণ</div><div class="v" id="netAmt">৳ 0.00</div></div><div class="field" style="margin-top:14px"><label>📝 মন্তব্য</label><input type="text" id="f_note" value="' + (editing?.note||'') + '" autocomplete="off"></div><div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn green" id="f_save" style="flex:1;min-width:160px">📤 পাঠান</button></div><div id="pendingArea" style="margin-top:20px"></div><div id="modalHistoryArea"></div>';
  openModal({ title: '🔁 আউটলেট-থেকে-আউটলেট', bodyHTML: body, wide: true, onMount: (w, close) => setupTransferForm(w, editing, close) });
}

function setupTransferForm(wrap, editing, close){
  const so = wrap.querySelector('#sumOut'), si = wrap.querySelector('#sumIn'), ne = wrap.querySelector('#netAmt');
  const getBranchKey = () => { const b = wrap.querySelector('#f_from'); return b?.value || 'kalaroa'; };
  
  function recalc(){
    const on = readNotes(wrap, 'out');
    wrap.querySelectorAll('[id^="in_"]').forEach(inp => { const v = on[inp.dataset.denom] || 0; if(inp.dataset.touched !== 'true') inp.value = v > 0 ? v : ''; });
    const inN = readNotes(wrap, 'in');
    const os = noteSum(on), is = noteSum(inN);
    if(so) so.textContent = '৳ ' + fmt(os);
    if(si) si.textContent = '৳ ' + fmt(is);
    if(ne) ne.textContent = '৳ ' + fmt(Math.max(os, is));
    const wb = wrap.querySelector('#noteAvailabilityWarning');
    if(wb){
      const fb = getBranchKey();
      const vault = DB().liveVault?.[fb] || {};
      const iss = [];
      Object.keys(on).forEach(d => { const n = Number(on[d]) || 0, h = Number(vault[d]) || 0; if(n > h) iss.push({ d, n, h }); });
      if(iss.length > 0){
        const totalExcess = iss.reduce((s, it) => s + (it.n - it.h) * Number(it.d), 0);
        wb.innerHTML = '<div style="padding:12px 14px;border-radius:10px;background:rgba(220,38,38,.15);border:2px solid rgba(220,38,38,.6);font-size:13px;color:#f87171;font-weight:700"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="font-size:20px">🚫</span><span style="font-size:14px">ভল্টে পর্যাপ্ত নোট নেই!</span></div>' + iss.map(it => '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(220,38,38,.3)"><span>৳' + toBn(it.d) + ' — দরকার <b>' + toBn(it.n) + '</b></span><span style="color:#fca5a5">আছে <b>' + toBn(it.h) + '</b></span></div>').join('') + '<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(220,38,38,.4);display:flex;justify-content:space-between;font-size:13px"><span>💸 মোট অতিরিক্ত:</span><b style="color:#fff">৳ ' + fmt(totalExcess) + '</b></div></div>';
        wb.style.display = 'block';
      } else { wb.innerHTML = ''; wb.style.display = 'none'; }
    }
  }
  
  __setupDenomInputs(wrap, getBranchKey, recalc);
  wrap.querySelectorAll('[id^="in_"]').forEach(i => { i.addEventListener('focus', ()=>{ if(i.id.startsWith('in_')) i.dataset.touched = 'true'; }); });
  ['out', 'in'].forEach(p => updateVaultStock(wrap, p, getBranchKey()));
  const fromEl = wrap.querySelector('#f_from');
  if(fromEl) fromEl.addEventListener('change', () => { updateVaultStock(wrap, 'out', getBranchKey()); recalc(); });
  recalc();
  
  const area = wrap.querySelector('#modalHistoryArea');
  const allTx = getAllBranchTransfers().slice(0, 15);
  area.innerHTML = '<div class="modal-history"><div class="modal-history-title"><span class="bar"></span> 📋 সম্প্রতি (' + toBn(allTx.length) + ')</div>' + (allTx.length ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>সময়</th><th>From ➜ To</th><th>বিবরণ</th><th>টাকা</th><th>স্ট্যাটাস</th><th>ইউজার</th></tr></thead><tbody>' + allTx.map(t => '<tr><td style="font-size:12px">' + esc(fmtDateTime(t.createdAt)) + '</td><td>' + esc(BRANCHES[t.from]?.name||'') + ' ➜ <b style="color:#4ade80">' + esc(BRANCHES[t.to]?.name||'') + '</b></td><td style="font-size:11.5px;color:#a5b4d8;max-width:220px;line-height:1.6">' + noteListInline(t.notesOut || t.notesIn) + (t.note ? '<div style="margin-top:4px;font-style:italic">📝 ' + esc(t.note) + '</div>' : '') + '</td><td class="amt">৳ ' + fmt(t.amount) + '</td><td>' + (t.accepted ? '<span class="badge accepted">✅</span>' : '<span class="badge pending">⏳</span>') + '</td><td>' + esc(t.user||'-') + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">📭 নেই</div>') + '</div>';
  
  function renderPending(){
    const box = wrap.querySelector('#pendingArea');
    if(!box) return;
    const bf = currentBranchFilter();
    const myB = session.role === 'admin' ? (bf === 'all' ? null : bf) : session.branch;
    let pending = DB().txs.filter(t=> t.type === 'branch_transfer' && !t.accepted && !t.cancelled);
    if(myB) pending = pending.filter(t=> t.to === myB);
    if(!pending.length){ box.innerHTML = '<div class="pending-box"><h4>⏳ অপেক্ষমাণ</h4><div class="pending-empty">নেই ✅</div></div>'; return; }
    box.innerHTML = '<div class="pending-box"><h4>⏳ (' + toBn(pending.length) + ')</h4>' + pending.map(t=>{ const canCancel = canCancelTransfer(t); const cancelBtn = canCancel ? ' <button class="mini danger" data-cancel="' + t.id + '">❌</button>' : ''; return '<div class="pending-item"><div class="info"><b>' + esc(BRANCHES[t.from]?.name||t.from) + '</b> ➜ <b>' + esc(BRANCHES[t.to]?.name||t.to) + '</b><small>' + toBn(t.date) + ' • ৳ ' + fmt(t.amount) + '</small></div><button class="mini accept" data-acc="' + t.id + '">✅ গ্রহণ</button>' + cancelBtn + '</div>'; }).join('') + '</div>';
    box.querySelectorAll('[data-acc]').forEach(b => b.addEventListener('click', async ()=>{ await receiveTransferDirect(b.dataset.acc); close(); }));
    box.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', async ()=>{ await cancelTransferDirect(b.dataset.cancel); close(); }));
  }
  renderPending();
  
  wrap.querySelector('#f_save').addEventListener('click', async ()=>{
    const sBtn = wrap.querySelector('#f_save');
    if(sBtn.disabled) return;
    const date = wrap.querySelector('#f_date').value || todayStr();
    const from = wrap.querySelector('#f_from').value, to = wrap.querySelector('#f_to').value;
    const note = wrap.querySelector('#f_note').value.trim();
    if(from === to){ alert('একই আউটলেট নয়'); return; }
    const on = readNotes(wrap, 'out'), inN = readNotes(wrap, 'in');
    const os = noteSum(on), is = noteSum(inN);
    if(Object.keys(on).length === 0 && Object.keys(inN).length === 0){ sorryNoNote(); return; }
    if(os <= 0 && is <= 0){ sorryNoNote(); return; }
    
    // Vault strict check
    if(!editing){
      const vault = DB().liveVault?.[from] || {};
      const miss = [];
      Object.keys(on).forEach(d => { const n = Number(on[d]) || 0, h = Number(vault[d]) || 0; if(n > h) miss.push({ d, n, h }); });
      if(miss.length > 0){
        miss.forEach(m => { const inp = wrap.querySelector('#out_' + m.d); if(inp){ inp.style.borderColor = 'rgba(220,38,38,.9)'; inp.style.background = 'rgba(220,38,38,.25)'; inp.focus(); inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); } });
        const details = miss.map(m => '৳ ' + toBn(m.d) + ' — দরকার ' + toBn(m.n) + ', আছে ' + toBn(m.h)).join('\n');
        alert('🚫 ভল্টে পর্যাপ্ত নোট নেই!\n\n' + details + '\n\n📌 Modal বন্ধ হয়নি।');
        return;
      }
    }
    
    sBtn.disabled = true;
    const orig = sBtn.innerHTML;
    sBtn.innerHTML = '<span class="spinner"></span>';
    try{
      const amt = Math.max(os, is);
      const tx = { id: editing ? editing.id : uid(), type: 'branch_transfer', date, branch: from, custBranch: from, from, to, dir: 'out', amount: Math.round(amt*100)/100, notesOut: on, notesIn: inN, note: note || (BRANCHES[from].name + ' ➜ ' + BRANCHES[to].name), user: session.name, userUsername: session.username, createdAt: editing ? editing.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString(), year: date.slice(0,4), accepted: false, acceptedDate: null };
      const isCreating = !editing;
      if(!editing){ DB().txs.push(tx); } else { const i = DB().txs.findIndex(x => x.id === editing.id); if(i >= 0) DB().txs[i] = tx; }
      addTxLog(tx.id, isCreating ? 'create' : 'update', isCreating ? { action: 'new transaction' } : computeTxChanges(editing, tx), tx);
      if(isCreating) addActivityLog({ type: 'txn_create', title: '🔁 আউটলেট ট্রান্সফার তৈরি', detail: (BRANCHES[from]?.name||'') + ' ➜ ' + (BRANCHES[to]?.name||''), amount: amt, targetId: tx.id });
      close();
      toast('✅ পাঠানো — ৳ ' + fmt(amt));
      await afterTxSave(tx, isCreating);
    }catch(e){
      alert('❌ ' + e.message);
      sBtn.disabled = false;
      sBtn.innerHTML = orig;
    }
  });
}
