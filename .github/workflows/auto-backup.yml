name: Auto Backup Supabase to GitHub

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download Supabase data
        run: |
          mkdir -p backups
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/agent_bank?id=eq.cc_agent_bank_main&select=data" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o backups/database-backup.json

      - name: Format JSON (pretty print)
        run: |
          cat backups/database-backup.json | python3 -m json.tool > backups/temp.json 2>/dev/null || cp backups/database-backup.json backups/temp.json
          mv backups/temp.json backups/database-backup.json

      - name: Commit and push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add backups/database-backup.json
          git commit -m "🔄 Auto backup $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
