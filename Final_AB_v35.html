<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>কম্পিউটার ক্যাম্পাস | এজেন্ট ব্যাংকিং সিস্টেম</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="কম্পিউটার ক্যাম্পাস | এজেন্ট ব্যাংকিং">
<meta name="application-name" content="কম্পিউটার ক্যাম্পাস | এজেন্ট ব্যাংকিং">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3b82f6;--blue-2:#60a5fa;--blue-3:#93c5fd;--yellow:#facc15;--yellow-2:#fde047;--green:#22c55e;--green-2:#4ade80;--red:#dc2626;--txt:#f0f4ff;--muted:#7a8ab8;--dim:#4a5680;--line:rgba(59,130,246,.12);--line-2:rgba(59,130,246,.22);--line-3:rgba(59,130,246,.4);--pink:#ec4899;--pink-2:#f9a8d4}
body{font-family:'Noto Sans Bengali',sans-serif;color:var(--txt);background:#04060d;background-image:radial-gradient(circle at 15% 5%,rgba(59,130,246,.15),transparent 45%),radial-gradient(circle at 85% 95%,rgba(34,197,94,.12),transparent 45%);background-attachment:fixed;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#050810}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--blue),var(--green));border-radius:10px;border:2px solid #050810}
.hidden{display:none!important}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 12px rgba(34,197,94,0)}}
@keyframes pulsePink{0%,100%{box-shadow:0 0 0 0 rgba(236,72,153,.5)}50%{box-shadow:0 0 0 10px rgba(236,72,153,0)}}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}50%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
@keyframes duePulse{0%,100%{text-shadow:0 0 15px rgba(248,113,113,.7)}50%{text-shadow:0 0 25px rgba(248,113,113,1),0 0 45px rgba(220,38,38,.6)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes notifSlide{from{opacity:0;transform:translateX(420px)}to{opacity:1;transform:translateX(0)}}
@keyframes notifProgress{from{width:100%}to{width:0%}}
@keyframes bellRing{0%,100%{transform:rotate(0)}20%{transform:rotate(20deg)}40%{transform:rotate(-18deg)}60%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
@keyframes slideInRT{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.rgb{background:linear-gradient(90deg,var(--blue),var(--yellow),var(--green),var(--blue));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}

/* ============ Topbar ============ */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap;padding:10px 14px;background:rgba(4,6,13,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;min-height:68px;transition:transform .35s cubic-bezier(.2,1,.3,1),box-shadow .35s}
.topbar::-webkit-scrollbar{height:5px}
.topbar::-webkit-scrollbar-thumb{background:rgba(59,130,246,.6);border-radius:5px}
.topbar.hidden-scroll{transform:translateY(-110%)}
.topbar.scrolled{box-shadow:0 8px 30px rgba(0,0,0,.6)}
.topbar .tb-left{display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar .tb-right{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;flex-shrink:0;margin-left:auto}
.topbar .tb-menu-btn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line-3);background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.08));color:#fff;cursor:pointer;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.1));border:1px solid var(--line-3);flex-shrink:0}
.brand .logo svg{width:40px;height:40px}
.brand h1{font-size:19px;font-weight:800;line-height:1.2;white-space:nowrap}
.brand p{font-size:13px;color:#a5b4d8;margin-top:2px;font-weight:600;line-height:1.2;white-space:nowrap}
.tb-branch{font-size:14px;font-weight:700;padding:10px 14px;border-radius:12px;background:linear-gradient(145deg,rgba(59,130,246,.12),rgba(34,197,94,.06));border:1px solid var(--line-3);white-space:nowrap;color:#fff;display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-branch b{color:var(--green-2);font-weight:800;font-size:15px}
.tb-date{padding:10px 12px;border-radius:12px;background:#080c1a;border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:14px;font-weight:700;outline:none;white-space:nowrap;color-scheme:dark;flex-shrink:0;max-width:165px}
.tb-select{padding:10px 32px 10px 14px;border-radius:12px;background:#080c1a;border:1px solid var(--line-3);color:var(--green-2);font-family:inherit;font-size:14px;font-weight:800;outline:none;cursor:pointer;white-space:nowrap;min-width:200px;max-width:260px;color-scheme:dark;flex-shrink:0}
.tb-select option{background:#0f1428;color:#f0f4ff;font-weight:700}
.tb-time{font-size:14px;font-weight:800;padding:10px 14px;border-radius:12px;background:linear-gradient(145deg,rgba(59,130,246,.15),rgba(34,197,94,.08));border:1px solid var(--line-3);color:var(--green-2);display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.tb-time .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green-2);animation:pulseGreen 1.8s ease-in-out infinite}
.presence-badge{font-size:14px;padding:8px 14px;border-radius:18px;background:rgba(236,72,153,.12);border:1px solid rgba(236,72,153,.4);color:#f9a8d4;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.presence-badge b{color:#fff;font-weight:900;font-size:15px}
.queue-badge{font-size:14px;padding:8px 14px;border-radius:18px;background:rgba(236,72,153,.15);border:1px solid rgba(236,72,153,.5);color:#f9a8d4;font-weight:800;display:none;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.queue-badge.show{display:inline-flex;animation:pulsePink 2s ease-in-out infinite}
.queue-badge b{color:#fff;font-weight:900;font-size:15px}
.sync-spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite}

/* ============ Sidebar ============ */
.sidebar-overlay{position:fixed;inset:0;z-index:400;background:rgba(2,4,10,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.sidebar-overlay.active{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:340px;max-width:90vw;z-index:500;background:linear-gradient(165deg,#0f1428,#06091a);border-right:1px solid var(--line-3);box-shadow:20px 0 60px rgba(0,0,0,.9);transform:translateX(-100%);transition:transform .35s;display:flex;flex-direction:column;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sidebar-head{padding:18px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.sidebar-head h3{font-size:18px;font-weight:800;color:#fff}
.sidebar-head .sb-close{border:none;background:rgba(220,38,38,.15);color:#f87171;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;border:1px solid rgba(220,38,38,.4)}
.sidebar-body{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:8px}
.sb-section{font-size:12px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;padding:14px 8px 6px;margin-top:4px;border-top:1px dashed var(--line)}
.sb-section:first-child{border-top:none;margin-top:0;padding-top:6px}
.sb-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:linear-gradient(145deg,#0f1428,#080c1a);border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:left;width:100%}
.sb-btn:hover{background:linear-gradient(145deg,rgba(59,130,246,.15),rgba(34,197,94,.06));border-color:var(--line-3);transform:translateX(3px)}
.sb-btn .sb-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(34,197,94,.08));border:1px solid var(--line-3);flex-shrink:0}
.sb-btn .sb-lbl{flex:1;display:flex;flex-direction:column;gap:2px}
.sb-btn .sb-lbl .sb-sub{font-size:12.5px;color:var(--muted);font-weight:600}
.sb-btn.primary{background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(34,197,94,.15));border-color:var(--blue)}
.sb-btn.danger{background:linear-gradient(135deg,rgba(220,38,38,.15),rgba(153,27,27,.08));border-color:rgba(220,38,38,.4);color:#f87171}
.sb-btn.warn{background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(245,158,11,.08));border-color:rgba(250,204,21,.4);color:#facc15}
.sb-badge{margin-left:auto;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:800;background:rgba(220,38,38,.2);border:1px solid rgba(220,38,38,.5);color:#f87171}
.sb-user{padding:14px 16px;border-radius:14px;background:linear-gradient(145deg,rgba(59,130,246,.1),rgba(34,197,94,.04));border:1px solid var(--line-3);margin-bottom:6px}
.sb-user .name{font-size:16px;font-weight:800;color:#fff}
.sb-user .role{font-size:13px;color:var(--green-2);font-weight:700;margin-top:4px}

/* ============ Login ============ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 30%,#0a1020,#04060d 70%)}
.login-box{width:100%;max-width:440px;background:linear-gradient(165deg,#0f1428,#060a18);border:1px solid var(--line-2);border-radius:28px;padding:38px 30px;box-shadow:0 20px 50px rgba(0,0,0,.9);animation:popIn .5s}
.login-logo{width:88px;height:88px;margin:0 auto 18px;display:grid;place-items:center;animation:float 3s ease-in-out infinite}
.login-box h1{text-align:center;font-size:24px;font-weight:800;color:#fff;margin-bottom:8px}
.login-box h2{text-align:center;font-size:14px;color:#a5b4d8;font-weight:500;margin-bottom:26px}

/* ============ Fields ============ */
.field{position:relative;z-index:1;margin-bottom:16px}
.field label{display:block;font-size:14px;color:#b8c8ee;margin-bottom:7px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;padding:14px 16px;border-radius:12px;background:#050810;border:1px solid var(--line-2);color:var(--txt);font-family:inherit;font-size:16px;font-weight:500;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2);background:#060a16}
.field select{color-scheme:dark;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--blue-3) 50%),linear-gradient(135deg,var(--blue-3) 50%,transparent 50%);background-position:calc(100% - 20px) calc(50% - 2px),calc(100% - 15px) calc(50% - 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:42px;appearance:none;-webkit-appearance:none}
.field select option{background:#0f1428;color:#f0f4ff;font-weight:600}
input[type="date"]{color-scheme:dark}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.6) sepia(1) saturate(3) hue-rotate(180deg);cursor:pointer}

/* ============ Buttons ============ */
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;padding:13px 22px;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--blue),#2563eb);transition:all .2s;box-shadow:0 4px 16px rgba(59,130,246,.35);position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.btn.pink{background:linear-gradient(135deg,var(--blue),var(--green))}
.btn.green{background:linear-gradient(135deg,var(--green),#16a34a)}
.btn.gray{background:linear-gradient(145deg,#141a30,#0a0f1e);color:var(--txt);border:1px solid var(--line-2);font-size:14.5px}
.btn.red{background:linear-gradient(135deg,#dc2626,#991b1b)}
.btn.yellow{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000}
.btn.cyan{background:linear-gradient(135deg,#06b6d4,#0891b2)}
.btn.purple{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.btn.sm{padding:8px 14px;font-size:13px}

/* ============ Main ============ */
main{max-width:1500px;margin:0 auto;padding:26px 20px 80px;display:flex;flex-direction:column;gap:26px;align-items:center;animation:fadeInUp .5s;width:100%}
.section{width:100%;display:flex;flex-direction:column;align-items:center}
.section-title{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:16px;font-size:22px;font-weight:900;color:#fff;flex-wrap:wrap;text-align:center;width:100%}
.section-title span.bar{display:none}
.section-title .auto-badge,.section-title .badge{margin-left:10px;font-size:16px;padding:8px 16px}

/* ============ Cards ============ */
.grid{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{position:relative;cursor:pointer;overflow:hidden;border-radius:22px;padding:20px 18px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);transition:all .35s;text-align:left}
.card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--yellow),var(--green))}
.card:hover{transform:translateY(-6px) scale(1.01);border-color:var(--line-3);box-shadow:0 24px 60px rgba(0,0,0,.9)}
.card-top{display:flex;align-items:center;justify-content:flex-start;text-align:left;width:100%;gap:12px;margin-bottom:14px}
.card-top .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,rgba(59,130,246,.2),rgba(34,197,94,.08));border:1px solid var(--line-3);flex-shrink:0}
.card-top h3{font-size:16px;font-weight:800;color:#fff;text-align:left;line-height:1.4}
.big-amt{font-size:42px;line-height:1.2;font-weight:900;color:#fff;text-align:left;width:100%;letter-spacing:-.5px}
.big-amt.sm{font-size:26px;display:flex;align-items:center;gap:10px;margin-bottom:10px;justify-content:flex-start;flex-wrap:wrap;text-align:left}
.big-amt.sm .lbl{color:#a5b4d8;font-size:20px;font-weight:700;min-width:90px}
.card-sub{margin-top:12px;font-size:18px;color:#a5b4d8;line-height:1.7;font-weight:700;text-align:left;width:100%}
.card-sub b{color:var(--green-2);font-weight:900;font-size:20px}

/* ============ Vault ============ */
.vault-box{width:100%;border-radius:22px;padding:20px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);text-align:center;display:flex;flex-direction:column;align-items:center}
.vault-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%}
.vault-item{flex:1 1 100px;min-width:100px;text-align:center;padding:16px 10px;border-radius:14px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1px solid var(--line-2)}
.vault-item .d{font-size:14px;color:#a5b4d8;font-weight:800;text-align:center}
.vault-item .c{font-size:22px;font-weight:900;margin-top:6px;color:var(--green-2);text-align:center}
.vault-item .c span{font-size:14px}
.vault-total{margin-top:18px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:24px;padding-top:18px;border-top:1px dashed var(--line-2);width:100%;text-align:center}
.vault-total span{font-size:18px;color:#a5b4d8;font-weight:700}
.vault-total b{color:var(--green-2);font-size:18px;font-weight:900}

/* ============ Balance ============ */
.balance-panel{width:100%;border-radius:22px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);padding:22px;text-align:center}
.balance-row-top{display:grid;gap:16px;grid-template-columns:repeat(4,1fr)}
.balance-cell{padding:22px 16px;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.03),rgba(0,0,0,.15));border:1px solid var(--line-2);text-align:center}
.balance-cell .bc-ico{font-size:32px;margin-bottom:10px;display:block;text-align:center}
.balance-cell .bc-lbl,.balance-cell .bc-lbl.big-label{font-size:17px;color:#a5b4d8;font-weight:800;text-transform:uppercase;margin-bottom:10px;text-align:center}
.balance-cell .bc-lbl.big-label{color:var(--blue-2)!important;text-transform:none!important}
.balance-cell .bc-val{font-size:26px;font-weight:900;color:#fff;text-align:center}
.balance-cell.blue .bc-val{color:var(--blue-2)}
.balance-cell.green .bc-val{color:var(--green-2)}
.balance-cell.purple .bc-val{color:#a78bfa}
.balance-cell.yellow .bc-val{color:var(--yellow-2)}
.bal-grid{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:16px}
.bal-card{border-radius:22px;padding:26px 22px;background:linear-gradient(155deg,#0f1428,#07091a);border:1px solid var(--line-2);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bal-card .t{font-size:18px;color:#a5b4d8;font-weight:800;margin-bottom:12px;text-transform:uppercase;text-align:center;width:100%}
.bal-card .v{font-size:32px;font-weight:900;color:#fff;line-height:1.2;text-align:center;width:100%}
.bal-card.main{background:linear-gradient(135deg,#131a35,#0a0f1e 60%,#0f1428);border-color:var(--blue)}
.bal-card.main .v{color:var(--blue-2)}
.bal-card.capital{border-color:rgba(250,204,21,.45)}
.bal-card.capital .v{color:var(--yellow-2)}
.bal-card.deficit{border-color:rgba(220,38,38,.45)}
.bal-card.deficit .v{color:#f87171}
.bal-card.surplus{border-color:rgba(34,197,94,.45)}
.bal-card.surplus .v{color:var(--green-2)}

/* ============ Dual sections ============ */
.dual-sections-wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,22px);width:100%;align-items:start}
.dual-sections-wrap .section{width:100%;max-width:100%;min-width:0;margin:0}
.dual-sections-wrap .section-title{font-size:clamp(14px,2.2vw,18px);margin-bottom:clamp(10px,1.5vw,14px);text-align:center;justify-content:center}
.dual-sections-wrap .vault-box{padding:0;overflow:hidden}
.dual-sections-wrap .table-wrap{max-height:480px;overflow-y:auto;border-radius:12px;border:none}
.dual-sections-wrap table.tbl{min-width:0;width:100%;font-size:clamp(10px,1.8vw,13px)}
.dual-sections-wrap table.tbl th{padding:clamp(6px,1.1vw,12px) clamp(4px,.8vw,10px);font-size:clamp(9.5px,1.7vw,12px);white-space:nowrap;text-align:center}
.dual-sections-wrap table.tbl td{padding:clamp(6px,1.1vw,12px) clamp(4px,.8vw,10px);font-size:clamp(10px,1.8vw,13px);text-align:center;word-break:break-word}
.dual-sections-wrap table.tbl td:nth-child(2){text-align:left;max-width:120px}

/* ============ Modal ============ */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(2,4,10,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto;animation:fadeIn .2s}
.modal{width:100%;max-width:760px;border-radius:22px;overflow:hidden;background:linear-gradient(165deg,#0f1428,#06091a);border:1px solid var(--line-3);animation:popIn .3s;display:flex;flex-direction:column;max-height:95vh;margin:auto}
.modal.wide{max-width:1100px}
.modal.xwide{max-width:1400px}
@media (max-width: 768px){
  .modal,.modal.wide,.modal.xwide{max-width:100%;max-height:100vh;border-radius:16px}
  .modal-overlay{padding:8px}
  .modal-body{padding:16px}
}
@media (max-width: 480px){
  .modal,.modal.wide,.modal.xwide{max-height:100vh;border-radius:0}
  .modal-overlay{padding:0}
  .modal-head{padding:14px 16px}
  .modal-head h3{font-size:15px}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:5;background:#0f1428}
.modal-head h3{font-size:17px;font-weight:800;color:#fff;display:flex;align-items:center;gap:9px}
.modal-head .x{border:none;background:rgba(59,130,246,.15);color:var(--blue-3);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:15px;border:1px solid var(--line-3)}
.modal-head .x:hover{background:var(--blue);color:#fff;transform:rotate(90deg)}
.modal-body{padding:20px 22px 26px;font-size:14px}

/* বকেয়া Popup special */
.modal-overlay:has(#cust_stat_net) .modal{border:2px solid rgba(220,38,38,.5)!important;box-shadow:0 0 50px rgba(220,38,38,.35),0 24px 80px rgba(0,0,0,.95)!important}
.modal-overlay:has(#cust_stat_net) .modal-head{background:linear-gradient(135deg,rgba(220,38,38,.2),rgba(153,27,27,.08))!important;border-bottom:2px solid rgba(220,38,38,.5)!important}
.modal-overlay:has(#cust_stat_net) .modal-head h3{color:#fca5a5!important;text-shadow:0 0 12px rgba(220,38,38,.5)}
#cust_stat_net{text-shadow:0 0 15px rgba(248,113,113,.7);animation:duePulse 2s ease-in-out infinite}

/* ============ Forms ============ */
.form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.cust-box{margin-top:8px;padding:16px;border-radius:16px;background:linear-gradient(145deg,rgba(59,130,246,.06),rgba(34,197,94,.03));border:1px solid var(--line-2)}
.cust-box .head{margin-bottom:12px}
.cust-box .head h4{font-size:13px;color:var(--blue-3);font-weight:700;text-transform:uppercase}
.suggest{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);background:#06091a;max-height:240px;overflow-y:auto}
.suggest:empty{display:none}
.sug-item{padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px;color:#e8eeff;line-height:1.7}
.sug-item:hover{background:linear-gradient(90deg,rgba(59,130,246,.15),rgba(34,197,94,.08))}
.sug-item b{color:var(--green-2);font-size:14.5px}
.sug-item small{color:#a5b4d8;font-size:12.5px}
.notes-cols{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:8px}
.notes-col{padding:16px;border-radius:16px;border:1px solid var(--line-2);background:linear-gradient(145deg,#0a0f1e,#050810)}
.notes-col.out{border-color:rgba(250,204,21,.3)}
.notes-col.in{border-color:rgba(34,197,94,.3)}
.notes-col h4{font-size:20px;margin-bottom:14px;font-weight:800;color:#fff}
.notes-col.out h4{color:var(--yellow-2)}
.notes-col.in h4{color:var(--green-2)}
.notes-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:space-between}
.note-item{flex:1 1 54px;min-width:52px;text-align:center}
.note-item label{display:block;font-size:13.5px;color:#b8c8ee;margin-bottom:6px;font-weight:700}
.note-item input{width:100%;padding:11px 5px;text-align:center;border-radius:9px;background:#03060d;border:1px solid var(--line-2);color:#fff;font-family:inherit;font-size:15px;font-weight:800;outline:none}
.note-item input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.notes-col.out .note-item input{color:var(--yellow-2)}
.notes-col.in .note-item input{color:var(--green-2)}
.sum-line{margin-top:12px;font-size:14px;color:#a5b4d8;display:flex;justify-content:space-between;padding:10px 6px 0;border-top:1px dashed var(--line-2)}
.sum-line b{font-size:17px;color:#fff}
.total-preview{margin-top:18px;padding:18px;border-radius:16px;text-align:center;background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(34,197,94,.06));border:1px solid var(--line-3)}
.total-preview .l{font-size:12.5px;color:var(--blue-3);font-weight:700;text-transform:uppercase}
.total-preview .v{font-size:32px;margin-top:6px;color:#fff;font-weight:800}

/* ============ Pending ============ */
.pending-box{margin-top:16px;padding:16px;border-radius:16px;background:linear-gradient(145deg,rgba(250,204,21,.08),rgba(250,204,21,.02));border:1px solid rgba(250,204,21,.35)}
.pending-box h4{font-size:13.5px;color:var(--yellow);font-weight:800;margin-bottom:12px}
.pending-empty{color:#a5b4d8;text-align:center;padding:14px;font-size:13.5px}
.pending-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;margin-bottom:8px;background:rgba(0,0,0,.3);border:1px solid var(--line-2);flex-wrap:wrap}
.pending-item .info{font-size:13.5px;color:#eee;flex:1;min-width:180px;line-height:1.75}
.pending-item .info b{color:var(--yellow)}
.pending-item .info small{color:var(--muted);display:block;margin-top:3px}
.accept-head{padding:16px;border-radius:16px;margin-bottom:16px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1px solid var(--line-3);font-size:14px;line-height:1.9;color:#e0eaff}

/* ============ Online box ============ */
.online-box{margin-top:16px;padding:18px;border-radius:16px;background:linear-gradient(145deg,rgba(59,130,246,.08),rgba(34,197,94,.04));border:1.5px solid var(--blue);display:none}
.online-box.active{display:block}
.online-box h4{font-size:14px;font-weight:800;margin-bottom:12px;color:var(--blue-3)}

/* ============ Branch toggle ============ */
.cust-branch-toggle{padding:16px 18px;border-radius:16px;margin-top:8px;margin-bottom:16px;background:linear-gradient(145deg,rgba(59,130,246,.06),rgba(34,197,94,.03));border:1px solid var(--line-2)}
.cust-branch-toggle .toggle-title{font-size:13px;font-weight:800;color:#fff;margin-bottom:12px;text-transform:uppercase}
.branch-toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.branch-toggle-btn{padding:13px 20px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;border:1px solid var(--line-2);background:linear-gradient(145deg,#0f1428,#080c1a);color:var(--muted);transition:all .25s}
.branch-toggle-btn.active{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(59,130,246,.4)}

/* ============ Tables ============ */
.table-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line-2);width:100%;max-width:100%;-webkit-overflow-scrolling:touch;display:block}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
table.tbl th{background:linear-gradient(180deg,rgba(59,130,246,.18),rgba(59,130,246,.06));padding:14px;text-align:left;font-weight:700;color:var(--blue-3);font-size:13px;border-bottom:1px solid var(--line-3);text-transform:uppercase;white-space:nowrap}
table.tbl td{padding:12px 14px;border-top:1px solid var(--line);color:#e0e8ff;line-height:1.7;font-size:13.5px}
table.tbl td.amt{font-weight:800;color:var(--green-2);white-space:nowrap}
table.tbl tr:hover td{background:rgba(59,130,246,.04)}
table.tbl tr.clickable-row{cursor:pointer}
table.tbl tr.clickable-row:hover td{background:rgba(236,72,153,.08)!important}

/* ============ Badges ============ */
.badge{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:700;white-space:nowrap;background:rgba(59,130,246,.15);border:1px solid var(--line-3);color:var(--blue-3);display:inline-block}
.badge.pending{background:rgba(250,204,21,.15);border-color:rgba(250,204,21,.5);color:var(--yellow-2)}
.badge.accepted{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:var(--green-2)}
.badge.due{background:rgba(220,38,38,.18);border-color:rgba(220,38,38,.5);color:#f87171}
.mini{border:none;cursor:pointer;background:rgba(59,130,246,.15);color:var(--blue-3);padding:7px 12px;border-radius:8px;font-size:13px;border:1px solid var(--line-3);font-weight:700;transition:all .2s}
.mini:hover{background:var(--blue);color:#fff}
.mini.danger{background:rgba(220,38,38,.15);color:#f87171;border-color:rgba(220,38,38,.4)}
.mini.danger:hover{background:var(--red);color:#fff}
.mini.accept{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;border-color:transparent}
.mini.cash-btn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border-color:transparent}
.mini.online-btn{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:transparent}
.mini.print-btn{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;border-color:transparent}
.mini.show{background:rgba(34,197,94,.2);color:var(--green-2);border-color:rgba(34,197,94,.4)}
.empty{padding:36px 24px;text-align:center;color:#a5b4d8;font-size:14.5px}
.bank-hint{font-size:13.5px;color:#b8c8ee;background:rgba(59,130,246,.08);padding:12px 16px;border-radius:10px;margin-bottom:12px;border:1px dashed rgba(59,130,246,.35)}
.cust-row{cursor:pointer}
.cust-row:hover td{background:rgba(59,130,246,.06)!important}
.cust-row.has-due td{background:rgba(220,38,38,.05)}
.date-mode-banner{width:100%;padding:14px 20px;border-radius:16px;background:linear-gradient(145deg,rgba(250,204,21,.12),rgba(250,204,21,.04));border:1px solid rgba(250,204,21,.4);color:var(--yellow-2);font-size:14px;font-weight:600;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.date-mode-banner b{color:#fff;font-weight:800}
.date-mode-banner .close-mode{margin-left:auto;background:rgba(250,204,21,.2);color:var(--yellow-2);border:1px solid rgba(250,204,21,.5);padding:8px 15px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.auto-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.5);color:var(--green-2);font-size:12.5px;font-weight:700}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.2);border-top-color:var(--blue-3);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
.sync-indicator{position:fixed;bottom:14px;right:14px;z-index:900;font-size:11px;color:var(--muted);background:rgba(4,6,13,.9);padding:6px 12px;border-radius:20px;border:1px solid var(--line-2);font-weight:600;pointer-events:none}
.sync-indicator.active{color:var(--green-2);border-color:rgba(34,197,94,.5)}

/* Branch mgmt */
.branch-tab{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.branch-tab-btn{padding:14px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:800;border:1.5px solid var(--line-2);background:linear-gradient(145deg,#0f1428,#080c1a);color:var(--muted)}
.branch-tab-btn.active{background:linear-gradient(135deg,var(--blue),#06b6d4);color:#fff;border-color:transparent}
.branch-summary-box{padding:14px 16px;border-radius:12px;background:linear-gradient(145deg,rgba(6,182,212,.06),rgba(59,130,246,.03));border:1px dashed rgba(6,182,212,.4);margin-bottom:14px;font-size:13px;color:#d0daf5;line-height:1.85}
.online-tick-box{padding:16px 18px;border-radius:16px;margin-top:8px;margin-bottom:16px;background:linear-gradient(145deg,rgba(34,197,94,.08),rgba(59,130,246,.04));border:1px solid rgba(34,197,94,.4)}
.online-tick-label{display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line-2)}
.online-tick-label input[type="checkbox"]{width:22px;height:22px;cursor:pointer;accent-color:#22c55e;flex-shrink:0}
.online-tick-text .title{font-size:14px;font-weight:800;color:#fff}
.online-tick-text .sub{font-size:12.5px;color:#a5b4d8;margin-top:3px;line-height:1.6}
.bank-only-box{padding:16px 18px;border-radius:16px;margin-top:8px;margin-bottom:16px;background:linear-gradient(145deg,rgba(139,92,246,.08),rgba(59,130,246,.04));border:1px solid rgba(139,92,246,.4)}
.bank-only-box .title{font-size:14px;font-weight:800;color:#a78bfa;margin-bottom:12px}

/* DB browser */
.db-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line-2)}
.db-tab-btn{padding:10px 16px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;border:1px solid var(--line-2);background:linear-gradient(145deg,#0f1428,#080c1a);color:var(--muted)}
.db-tab-btn.active{background:linear-gradient(135deg,var(--blue),#2563eb);color:#fff;border-color:transparent}
.db-tab-btn .cnt{margin-left:6px;padding:1px 8px;border-radius:6px;background:rgba(255,255,255,.15);font-size:11px;font-weight:800}
.db-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.db-search{flex:1;min-width:200px;padding:10px 14px;border-radius:10px;background:#050810;border:1px solid var(--line-2);color:#fff;font-family:inherit;font-size:13.5px;outline:none}
.db-info{font-size:12.5px;color:#a5b4d8;padding:8px 12px;border-radius:8px;background:rgba(59,130,246,.08);border:1px solid var(--line-2)}
.db-json{font-family:'Courier New',monospace;font-size:12px;background:#03060d;border:1px solid var(--line-2);border-radius:12px;padding:16px;overflow-x:auto;color:#c9d5f0;line-height:1.7;max-height:520px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}

/* History */
.modal-history{margin-top:24px;padding-top:18px;border-top:2px dashed var(--line-3)}
.modal-history-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:15px;font-weight:800;color:#fff;flex-wrap:wrap}
.modal-history-title span.bar{width:4px;height:22px;border-radius:4px;background:linear-gradient(180deg,#ec4899,#a855f7)}

/* Notifications */
.notif-container{position:fixed;top:78px;right:18px;z-index:99999;display:flex;flex-direction:column;gap:12px;max-width:420px;width:calc(100% - 36px);pointer-events:none}
.notif-card{pointer-events:auto;position:relative;overflow:hidden;border-radius:18px;padding:16px 18px;background:linear-gradient(150deg,#0f1428,#06091a);border:1.5px solid rgba(59,130,246,.6);box-shadow:0 24px 60px rgba(0,0,0,.95);animation:notifSlide .35s cubic-bezier(.2,1,.3,1);display:flex;gap:14px;align-items:flex-start;backdrop-filter:blur(14px);cursor:pointer}
.notif-card.success{border-color:rgba(34,197,94,.7);background:linear-gradient(150deg,rgba(34,197,94,.18),rgba(6,9,26,.95))}
.notif-card.warning{border-color:rgba(250,204,21,.7);background:linear-gradient(150deg,rgba(250,204,21,.16),rgba(6,9,26,.95))}
.notif-card.danger{border-color:rgba(220,38,38,.7);background:linear-gradient(150deg,rgba(220,38,38,.18),rgba(6,9,26,.95))}
.notif-card.info{border-color:rgba(59,130,246,.7);background:linear-gradient(150deg,rgba(59,130,246,.16),rgba(6,9,26,.95))}
.notif-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex-shrink:0;background:linear-gradient(145deg,rgba(59,130,246,.25),rgba(34,197,94,.1));border:1px solid rgba(59,130,246,.5)}
.notif-card.success .notif-icon{background:linear-gradient(145deg,rgba(34,197,94,.35),rgba(34,197,94,.1));border-color:rgba(34,197,94,.6)}
.notif-card.warning .notif-icon{background:linear-gradient(145deg,rgba(250,204,21,.35),rgba(250,204,21,.1));border-color:rgba(250,204,21,.6)}
.notif-card.danger .notif-icon{background:linear-gradient(145deg,rgba(220,38,38,.35),rgba(220,38,38,.1));border-color:rgba(220,38,38,.6)}
.notif-icon.ring{animation:bellRing .8s ease-in-out}
.notif-content{flex:1;min-width:0}
.notif-title{font-size:14px;font-weight:900;color:#fff;line-height:1.5;margin-bottom:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notif-title .notif-badge{font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(59,130,246,.25);border:1px solid rgba(59,130,246,.5);color:#93c5fd;font-weight:800;text-transform:uppercase}
.notif-body{font-size:12.5px;color:#c9d5f0;line-height:1.85;word-break:break-word}
.notif-body b{color:#fff;font-weight:800}
.notif-body .notif-amt{color:#4ade80;font-weight:900;font-size:15px}
.notif-body .notif-meta{display:block;margin-top:6px;font-size:11px;color:#7a8ab8}
.notif-close{position:absolute;top:8px;right:10px;width:26px;height:26px;border:none;border-radius:8px;background:rgba(255,255,255,.06);color:#a5b4d8;cursor:pointer;font-size:13px;display:grid;place-items:center}
.notif-close:hover{background:rgba(220,38,38,.3);color:#f87171}
.notif-progress{position:absolute;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#3b82f6,#22c55e);animation:notifProgress linear forwards}
.notif-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.notif-actions button{padding:7px 14px;border-radius:9px;border:1px solid rgba(59,130,246,.4);background:rgba(59,130,246,.15);color:#93c5fd;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
.notif-actions button.primary{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent;color:#fff}

/* Net banner */
.net-banner{position:fixed;top:0;left:0;right:0;z-index:9998;padding:10px 18px;background:linear-gradient(135deg,rgba(220,38,38,.95),rgba(153,27,27,.92));color:#fff;font-weight:800;font-size:13px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.6);transform:translateY(-100%);transition:transform .35s;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.net-banner.show{transform:translateY(0)}
.net-banner.online-banner{background:linear-gradient(135deg,rgba(34,197,94,.95),rgba(22,163,74,.92))}
.net-banner .retry-btn{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);padding:5px 12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}

/* Responsive */
@media (max-width: 900px){
  .topbar{padding:8px 10px;gap:8px;min-height:62px}
  .topbar .tb-menu-btn{width:44px;height:44px;font-size:20px}
  .brand .logo{width:42px;height:42px}
  .brand .logo svg{width:36px;height:36px}
  .brand h1{font-size:17px}
  .brand p{font-size:12px}
  .presence-badge,.queue-badge{font-size:13px;padding:7px 12px}
  .tb-branch{font-size:13px;padding:9px 12px}
  .tb-select{font-size:13px;padding:9px 28px 9px 12px;min-width:170px;max-width:200px}
  .tb-date{font-size:13px;padding:9px 10px;max-width:150px}
  .tb-time{font-size:13px;padding:9px 12px}
  .balance-row-top{grid-template-columns:repeat(2,1fr)}
  .dual-sections-wrap{grid-template-columns:1fr;gap:18px}
  .dual-sections-wrap .table-wrap{max-height:none}
}
@media (max-width: 700px){.notes-cols{grid-template-columns:1fr}}
@media (max-width: 640px){
  main{padding:18px 12px 60px;gap:20px}
  .modal-body{padding:16px}
  .sidebar{width:88vw}
  .card{padding:16px}
  table.tbl th,table.tbl td{font-size:12.5px;padding:10px}
  .btn{font-size:14px;padding:12px 18px}
  .mini{font-size:12.5px;padding:6px 10px}
  .notif-container{top:70px;right:10px;left:10px;width:auto;max-width:none}
  .section-title{font-size:20px}
  .big-amt{font-size:34px}
  .big-amt.sm{font-size:22px}
  .big-amt.sm .lbl{font-size:17px;min-width:78px}
  .card-sub{font-size:16px}
  .card-sub b{font-size:18px}
  .vault-item .d{font-size:16px}
  .vault-item .c{font-size:22px}
  .balance-cell .bc-val{font-size:22px}

function playNotifSound(type){
  if(!__soundEnabled) return;
  try{
    if(!__audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; __audioCtx = new AC(); }
    if(__audioCtx.state === 'suspended'){ __audioCtx.resume(); }
    const patterns = { success:[{f:880,d:.10,t:0},{f:1100,d:.14,t:.11},{f:1320,d:.22,t:.26}], danger:[{f:520,d:.16,t:0},{f:420,d:.16,t:.18},{f:520,d:.22,t:.36}], warning:[{f:720,d:.13,t:0},{f:720,d:.13,t:.18}], info:[{f:620,d:.10,t:0},{f:820,d:.16,t:.12}], transfer:[{f:660,d:.10,t:0},{f:880,d:.10,t:.11},{f:1100,d:.20,t:.22}] };
    const notes = patterns[type] || patterns.info;
    notes.forEach(n => {
      const osc = __audioCtx.createOscillator(), gain = __audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = n.f;
      gain.gain.setValueAtTime(0, __audioCtx.currentTime + n.t);
      gain.gain.linearRampToValueAtTime(0.28, __audioCtx.currentTime + n.t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, __audioCtx.currentTime + n.t + n.d);
      osc.connect(gain); gain.connect(__audioCtx.destination);
      osc.start(__audioCtx.currentTime + n.t); osc.stop(__audioCtx.currentTime + n.t + n.d + 0.02);
    });
  }catch(e){}
}

}
function getNetworkType(){
  try{
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if(!conn) return 'unknown';
    const t = (conn.type || '').toLowerCase();
    if(t) return t;
    const et = conn.effectiveType || '';
    if(et === '4g' || et === '5g') return 'fast';
    if(et === '3g') return 'medium';
    if(et === '2g' || et === 'slow-2g') return 'slow';
    return 'unknown';
  }catch(e){ return 'unknown'; }
}

/* ============ Activity Channel ============ */

function setupActivityChannel(){
  try{
    if(!__isRemoteReady || !__supabaseClient) return;
    if(__activityChannel){
      try{ __activityChannel.unsubscribe(); __supabaseClient.removeChannel(__activityChannel); }catch(e){}
      __activityChannel = null;
    }
    __activityChannelReady = false;
    __activityChannel = __supabaseClient
      .channel('cc_activity_broadcast', { config: { broadcast: { self: false, ack: true } } })
      .on('broadcast', { event: 'activity' }, (payload) => {
        try{
          const data = payload && payload.payload;
          if(!data || !data.type) return;
          if(data.senderId && session && data.senderId === session.id) return;
          handleRemoteActivity(data);
        }catch(e){}
      })
      .subscribe((status) => {
        if(status === 'SUBSCRIBED'){
          __activityChannelReady = true;
          __activityChannelRetry = 0;
          if(__activityQueue.length){
            const q = __activityQueue.slice(); __activityQueue = [];
            q.forEach(p => { try{ __activityChannel.send({ type: 'broadcast', event: 'activity', payload: p }).catch(()=>{}); }catch(e){} });
          }
        } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){
          __activityChannelReady = false;
          __activityChannelRetry++;
          const delay = Math.min(2000 * Math.pow(1.6, __activityChannelRetry - 1), 20000);
          setTimeout(() => { if(navigator.onLine) setupActivityChannel(); }, delay);
        } else if(status === 'CLOSED'){
          __activityChannelReady = false;
          setTimeout(() => { if(navigator.onLine) setupActivityChannel(); }, 3000);
        }
      });
  }catch(e){ setTimeout(() => { if(navigator.onLine) setupActivityChannel(); }, 5000); }
}

function broadcastActivity(data){
  try{
    if(!data || !data.type) return;
    const payload = { ...data, senderId: session?.id || 'anon_' + Date.now(), senderName: session?.name || 'অজানা', senderUsername: session?.username || '', senderRole: session?.role || 'user', senderBranch: session?.role === 'admin' ? 'অ্যাডমিন' : (BRANCHES[session?.branch]?.name || 'অজানা'), device: getDeviceName(), location: (window.__geoCache && window.__geoCache.label) || 'Kalaroa, Satkhira, BD', at: new Date().toISOString() };
    if(!__activityChannel || !__activityChannelReady){
      __activityQueue.push(payload);
      if(__activityQueue.length > ACTIVITY_QUEUE_MAX) __activityQueue = __activityQueue.slice(-ACTIVITY_QUEUE_MAX);
      if(!__activityChannel) setupActivityChannel();
      return;
    }
    __activityChannel.send({ type: 'broadcast', event: 'activity', payload }).catch(() => { __activityQueue.push(payload); __activityChannelReady = false; setupActivityChannel(); });
  }catch(e){}
}

function handleRealtimeUpdate(payload){

    const remoteTs = Date.parse(remote.__lastUpdate || 0) || 0;
    const localTs = Date.parse((DB() && DB().__lastUpdate) || 0) || 0;
    if(remoteTs <= localTs) return;
    __isApplyingRemote = true;
    const oldTxIds = new Set((DB()?.txs || []).map(t => t.id));

    if(session){ renderTopbar(); renderDashboard(); renderSidebar(); }
    if(newTxs.length > 0){
      const otherTxs = newTxs.filter(tx => !(window.__recentMyTxIds || []).includes(tx.id));
      if(otherTxs.length > 0){
        otherTxs.sort((a,b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
        otherTxs.forEach((tx, idx) => { setTimeout(() => { notifyTransaction(tx, '⚡ নতুন'); }, idx * 600); });

  }catch(e){ __isApplyingRemote = false; }
}

function recomputeLive(){
  const d = DB();
  Object.keys(BRANCHES).forEach(b=>{
    d.liveVault[b] = {};
    DENOMS.forEach(x => d.liveVault[b][x] = Number(d.baseVault[b][x]) || 0);
    d.liveAccounts[b] = { bank: Number(d.baseAccounts[b].bank) || 0, cash: Number(d.baseAccounts[b].cash) || 0, other: Number(d.baseAccounts[b].other) || 0 };
  });
  const sorted = getAllTxs().slice().sort((a,b)=> (a.createdAt || a.date || '').localeCompare(b.createdAt || b.date || ''));
  sorted.forEach(tx=>{
    if(tx.cancelled) return;
    if(tx.type === 'branch_transfer'){ applyTxToLive(tx, 'send'); if(tx.accepted && !tx.cancelled) applyTxToLive(tx, 'accept'); }
    else applyTxToLive(tx);
  });
  syncLiveCashFromVault();
}
function applyTxToLive(tx, phase){
  const d = DB();
  const bb = tx.branch || 'kalaroa';
  const vb = tx.custBranch || tx.branch || 'kalaroa';
  const ensure = br => { if(!br) return; if(!d.liveAccounts[br]) d.liveAccounts[br] = { bank:0, cash:0, other:0 }; if(!d.liveVault[br]) d.liveVault[br] = {}; DENOMS.forEach(x=>{ if(typeof d.liveVault[br][x] !== 'number') d.liveVault[br][x] = 0; }); };
  ensure(bb); ensure(vb);
  const amt = Number(tx.amount) || 0;
  const nIn = tx.notesIn || {}, nOut = tx.notesOut || {};
  switch(tx.type){
    case 'loan_given':
      if(tx.cashNotTaken){ d.liveAccounts[bb].bank += amt; }
      else if(tx.onlineTransfer && (Number(tx.onlineAmount)||0) > 0){ const onlineAmt = Number(tx.onlineAmount) || 0; const cashAmt = Number(tx.cashAmount) || (amt - onlineAmt); d.liveAccounts[bb].bank -= onlineAmt; d.liveAccounts[bb].bank += cashAmt; adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      else { d.liveAccounts[bb].bank += amt; adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      break;
    case 'loan_collection': if(tx.collectionMode === 'cash'){ adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); } else d.liveAccounts[bb].bank -= amt; break;
    case 'loan_received': d.liveAccounts[bb].bank -= amt; adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); break;
    case 'deposit': d.liveAccounts[bb].bank -= amt; adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); break;
    case 'withdrawal': d.liveAccounts[bb].bank += amt; adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); break;
    case 'expense': adjustNotes(d.liveVault[bb], nOut, -1); adjustNotes(d.liveVault[bb], nIn, +1); break;
    case 'branch_transfer': {
      const from = tx.from, to = tx.to;
      if(!from || !to || from === to) break;
      ensure(from); ensure(to);
      const transferNotes = (nOut && Object.keys(nOut).length > 0) ? nOut : nIn;
      if(!transferNotes || !Object.keys(transferNotes).length) break;
      if(phase === 'send') adjustNotes(d.liveVault[from], transferNotes, -1);
      else if(phase === 'accept') adjustNotes(d.liveVault[to], transferNotes, +1);
      break;
    }
    case 'bank_transfer': if(tx.dir === 'in') d.liveAccounts[bb].bank += amt; else if(tx.dir === 'out') d.liveAccounts[bb].bank -= amt; break;
    case 'other_bank':
      if(tx.dir === 'online_in') d.liveAccounts[bb].bank += amt;
      else if(tx.dir === 'online_out') d.liveAccounts[bb].bank -= amt;
      else if(tx.dir === 'in'){ d.liveAccounts[bb].bank += amt; adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); }
      else { d.liveAccounts[bb].bank -= amt; adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      break;
    case 'support':
      if(tx.dir === 'online_support_out') d.liveAccounts[bb].bank -= amt;
      else if(tx.dir === 'online_support_in') d.liveAccounts[bb].bank += amt;
      else if(tx.dir === 'out'){ adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); }
      else { adjustNotes(d.liveVault[vb], nIn, +1); adjustNotes(d.liveVault[vb], nOut, -1); }
      break;
    case 'money_exchange': adjustNotes(d.liveVault[vb], nOut, -1); adjustNotes(d.liveVault[vb], nIn, +1); break;
  }
}
function syncLiveCashFromVault(){
  const d = DB();

}
function adjustNotes(target, notes, sign){
  if(!notes || !target) return;
  for(const k in notes){ target[k] = (target[k]||0) + sign * (Number(notes[k])||0); if(target[k] < 0) target[k] = 0; }
}

function calculateCustomerDue(accountNo){
  const res = { paid:0, refund:0, net:0, count:0 };
  if(!accountNo) return res;
  const acc = String(accountNo).trim();
  getAllTxs().forEach(t=>{
    if(t.type !== 'support') return;
    if(String(t.custAcc||'').trim() !== acc) return;
    res.count++;
    const amt = Number(t.amount) || 0;
    if(t.dir === 'out' || t.dir === 'online_support_out') res.paid += amt;
    else if(t.dir === 'in' || t.dir === 'online_support_in') res.refund += amt;
  });
  res.paid = Math.round(res.paid*100)/100; res.refund = Math.round(res.refund*100)/100;
  res.net = Math.round((res.paid - res.refund)*100)/100;
  return res;
}
function recalcAllCustomerDues(save){
  const map = {};
  getAllTxs().forEach(t => {
    if(t.type !== 'support') return;
    const acc = String(t.custAcc || '').trim(); if(!acc) return;
    if(!map[acc]) map[acc] = { paid:0, refund:0, count:0 };
    const amt = Number(t.amount) || 0;
    if(t.dir === 'out' || t.dir === 'online_support_out') map[acc].paid += amt;
    else if(t.dir === 'in' || t.dir === 'online_support_in') map[acc].refund += amt;
    map[acc].count++;
  });
  (DB().customers || []).forEach(c=>{
    const m = map[c.accountNo] || { paid:0, refund:0, count:0 };
    c.supportPaid = Math.round(m.paid*100)/100; c.supportRefund = Math.round(m.refund*100)/100;
    c.supportDue = Math.round((c.supportPaid - c.supportRefund)*100)/100; c.supportCount = m.count;
  });
}

function getPendingCollections(){
  const result = [];
  getAllTxs().forEach(t => {
    if(t.type !== 'loan_given' || !t.cashNotTaken || t.collectionStatus === 'collected') return;
    const totalOwed = Number(t.cashNotTakenAmount) || Number(t.amount) || 0;
    const collected = Number(t.collectedAmount) || 0;
    const pending = totalOwed - collected;
    if(pending <= 0.01) return;
    result.push({ ...t, _pending: Math.round(pending*100)/100, _owed: totalOwed, _collected: collected });
  });
  result.sort((a,b)=> (a.date||'').localeCompare(b.date||''));

}

function computeStats(bf, date){
  const r = { loan_given:{amt:0,cnt:0}, loan_received:{amt:0,cnt:0}, deposit:{amt:0,cnt:0}, withdrawal:{amt:0,cnt:0}, transfer:{in:0,out:0,cnt:0}, expense:{amt:0,cnt:0}, other:{in:0,out:0,onlineIn:0,onlineOut:0}, support:{in:0,out:0,cnt:0}, money_exchange:{in:0,out:0,cnt:0}, bank_transfer:{in:0,out:0,cnt:0} };
  getAllTxs().forEach(t=>{
    if(t.cancelled) return;
    const ok = (bf === 'all') || (t.branch === bf) || (t.type === 'branch_transfer' && (t.from === bf || t.to === bf));
    if(!ok) return;
    if(t.type === 'branch_transfer'){
      const accepted = !!t.accepted, sd = t.date || '', ad = t.acceptedDate || '';
      const isS = (t.from === bf), isR = (t.to === bf);
      if(!accepted){ if(bf === 'all'){ r.transfer.out += t.amount; if(!date || sd === date) r.transfer.cnt++; } else { if(isS){ r.transfer.out += t.amount; if(!date || sd === date) r.transfer.cnt++; } } return; }
      if(bf === 'all'){ if(!date || ad === date){ r.transfer.in += t.amount; r.transfer.out += t.amount; r.transfer.cnt++; } }
      else { if(isS){ if(!date || sd === date){ r.transfer.out += t.amount; r.transfer.cnt++; } } if(isR){ if(!date || ad === date){ r.transfer.in += t.amount; if(!isS) r.transfer.cnt++; } } }
      return;
    }
    if(date && t.date !== date) return;
    switch(t.type){
      case 'loan_given': r.loan_given.amt += t.amount; r.loan_given.cnt++; break;
      case 'loan_received': r.loan_received.amt += t.amount; r.loan_received.cnt++; break;
      case 'deposit': r.deposit.amt += t.amount; r.deposit.cnt++; break;
      case 'withdrawal': r.withdrawal.amt += t.amount; r.withdrawal.cnt++; break;
      case 'expense': r.expense.amt += t.amount; r.expense.cnt++; break;
      case 'bank_transfer': if(t.dir === 'in') r.bank_transfer.in += t.amount; else r.bank_transfer.out += t.amount; r.bank_transfer.cnt++; break;
      case 'other_bank': if(t.dir === 'in') r.other.in += t.amount; else if(t.dir === 'online_in') r.other.onlineIn += t.amount; else if(t.dir === 'out') r.other.out += t.amount; else if(t.dir === 'online_out') r.other.onlineOut += t.amount; break;
      case 'support': if(t.dir === 'online_support_out' || t.dir === 'out') r.support.out += t.amount; else r.support.in += t.amount; r.support.cnt++; break;
      case 'money_exchange': r.money_exchange.out += Number(t.notesOutSum)||0; r.money_exchange.in += Number(t.notesInSum)||0; r.money_exchange.cnt++; break;
    }
  });
  return r;
}

/* ========== ✅ Single Transaction Print (Fixed) ========== */
function printSingleTransaction(tx){
  if(!tx){ toast('❌ নেই'); return; }
  const cfg = TX_CFG[tx.type] || { title: tx.type, icon: '📌' };
  const outletName = BRANCHES[tx.branch]?.name || 'উভয় আউটলেট';

  // ========== ঋণ বিতরণের জন্য বিশেষ ব্যালেন্স বিবরণী ==========
  let balanceSection = '';
  if(tx.type === 'loan_given' && !tx.cancelled){
    const totalLoan = Number(tx.amount) || 0;
    const onlineAmt = Number(tx.onlineAmount) || 0;
    const notTaken = Number(tx.cashNotTakenAmount) || 0;
    const notesOut = tx.notesOut || {};
    const notesIn = tx.notesIn || {};

    // ✅ ক্যাশ = নোটের যোগফল (গ্রাহক সত্যি যা হাতে পেয়েছেন)
    let cashAmt = 0;
    Object.keys(notesOut).forEach(d => { cashAmt += Number(d) * (Number(notesOut[d]) || 0); });
    let cashReceived = 0;
    Object.keys(notesIn).forEach(d => { cashReceived += Number(d) * (Number(notesIn[d]) || 0); });

    // নোট breakdown rows
    const denomRows = Object.keys(notesOut).filter(d => Number(notesOut[d]) > 0).sort((a,b) => b-a)
      .map(d => '<tr><td style="padding:4px 8px 4px 22px;font-size:10.5px;color:#a16207">💸 ৳ ' + toBn(d) + ' × ' + toBn(notesOut[d]) + ' টি</td>' +
                '<td style="padding:4px 8px;font-size:11px;text-align:right;font-weight:800;color:#a16207">৳ ' + fmt(Number(d) * Number(notesOut[d])) + '</td></tr>').join('');
    const denomInRows = Object.keys(notesIn).filter(d => Number(notesIn[d]) > 0).sort((a,b) => b-a)
      .map(d => '<tr><td style="padding:4px 8px 4px 22px;font-size:10.5px;color:#15803d">📥 ৳ ' + toBn(d) + ' × ' + toBn(notesIn[d]) + ' টি</td>' +
                '<td style="padding:4px 8px;font-size:11px;text-align:right;font-weight:800;color:#15803d">৳ ' + fmt(Number(d) * Number(notesIn[d])) + '</td></tr>').join('');

    balanceSection =
      '<div class="print-title" style="margin-top:6px;margin-bottom:6px;padding:6px 10px;font-size:12px">💰 এই লেনদেনের ব্যালেন্স বিবরণী</div>' +
      '<table class="tbl-print" style="margin-bottom:8px">' +
        '<thead><tr>' +
          '<th style="padding:5px 8px;font-size:10px;width:55%">বিবরণ</th>' +
          '<th style="padding:5px 8px;font-size:10px;text-align:right;width:45%">পরিমাণ</th>' +
        '</tr></thead>' +
        '<tbody>' +
          '<tr><td style="padding:5px 8px;font-size:11.5px">🏦 মূল উত্তোলনযোগ্য ঋণ (সর্বমোট)</td>' +
              '<td style="padding:5px 8px;font-size:12px;text-align:right;font-weight:900;color:#1e40af">৳ ' + fmt(totalLoan) + '</td></tr>' +
          '<tr style="background:#f8fafc"><td style="padding:5px 8px;font-size:11.5px">🌐 অনলাইন ফান্ড ট্রান্সফার' +
              (tx.onlineBankName ? ' — <i>' + esc(tx.onlineBankName) + '</i>' : '') + '</td>' +
              '<td style="padding:5px 8px;font-size:12px;text-align:right;font-weight:900;color:#6d28d9">৳ ' + fmt(onlineAmt) + '</td></tr>' +
          (denomRows
            ? '<tr><td colspan="2" style="padding:4px 8px;background:#fef3c7;font-size:11px;font-weight:900;color:#a16207;border-top:1px solid #fde047">💸 ক্যাশ প্রদান (গ্রাহক হাতে পেয়েছেন) — নোট বিবরণী</td></tr>' + denomRows +
              '<tr style="background:#fef3c7"><td style="padding:5px 8px;font-size:11.5px;font-weight:800;color:#a16207">📤 ক্যাশ প্রদান মোট</td>' +
                '<td style="padding:5px 8px;font-size:12.5px;text-align:right;font-weight:900;color:#a16207">৳ ' + fmt(cashAmt) + '</td></tr>'
            : '<tr><td style="padding:5px 8px;font-size:11.5px">💵 ক্যাশ প্রদান</td>' +
                '<td style="padding:5px 8px;font-size:12px;text-align:right;font-weight:900;color:#15803d">৳ 0.00</td></tr>') +
          (denomInRows
            ? '<tr><td colspan="2" style="padding:4px 8px;background:#dcfce7;font-size:11px;font-weight:900;color:#15803d;border-top:1px solid #86efac">📥 গ্রহণ (গ্রাহকের কাছ থেকে)</td></tr>' + denomInRows +
              '<tr style="background:#dcfce7"><td style="padding:5px 8px;font-size:11.5px;font-weight:800;color:#15803d">📥 গ্রহণ মোট</td>' +
                '<td style="padding:5px 8px;font-size:12.5px;text-align:right;font-weight:900;color:#15803d">৳ ' + fmt(cashReceived) + '</td></tr>'
            : '') +
          (notTaken > 0
            ? '<tr style="background:#fefce8"><td style="padding:5px 8px;font-size:11.5px">🏦 গ্রাহক ক্যাশ নেয়নি — ব্যাংকে থাকল</td>' +
              '<td style="padding:5px 8px;font-size:12px;text-align:right;font-weight:900;color:#a16207">৳ ' + fmt(notTaken) + '</td></tr>'
            : '') +
          '<tr style="background:#dbeafe;border-top:2px solid #1e40af"><td style="padding:7px 8px;font-size:12px;font-weight:900;color:#1e40af">✅ সর্বমোট</td>' +
              '<td style="padding:7px 8px;font-size:13px;text-align:right;font-weight:900;color:#1e40af">৳ ' + fmt(totalLoan) + '</td></tr>' +
        '</tbody>' +
      '</table>';
  }

  // ========== অন্য লেনদেনের জন্য সাধারণ নোট সেকশন ==========
  let notesSection = '';
  if(tx.type !== 'loan_given' && !tx.cancelled){
    const nOut = tx.notesOut || {}, nIn = tx.notesIn || {};
    const outRows = Object.keys(nOut).filter(k => nOut[k] > 0).sort((a,b) => b-a)
      .map(d => '<tr><td style="padding:4px 6px;font-size:10px">💸 ৳ ' + toBn(d) + ' × ' + toBn(nOut[d]) + ' টি</td>' +
                '<td class="amt" style="color:#a16207;padding:4px 6px;font-size:10px">৳ ' + fmt(d * nOut[d]) + '</td></tr>').join('');
    const inRows = Object.keys(nIn).filter(k => nIn[k] > 0).sort((a,b) => b-a)
      .map(d => '<tr><td style="padding:4px 6px;font-size:10px">📥 ৳ ' + toBn(d) + ' × ' + toBn(nIn[d]) + ' টি</td>' +
                '<td class="amt" style="color:#15803d;padding:4px 6px;font-size:10px">৳ ' + fmt(d * nIn[d]) + '</td></tr>').join('');
    const outTotal = Object.keys(nOut).reduce((s,d) => s + d * nOut[d], 0);
    const inTotal = Object.keys(nIn).reduce((s,d) => s + d * nIn[d], 0);
    if(outRows || inRows){
      notesSection = '<div class="print-title" style="margin-top:6px;margin-bottom:6px;padding:6px 10px;font-size:13px">🗄️ টাকার বিবরণী (নোট)</div>';
      if(outRows) notesSection += '<div style="font-size:10.5px;font-weight:900;color:#a16207;padding:4px 8px;background:#fef3c7;border-left:3px solid #f59e0b;border-radius:3px;margin-bottom:3px">📤 প্রদান</div><table class="tbl-print" style="margin-bottom:5px"><thead><tr><th style="padding:5px 6px;font-size:9.5px">নোট</th><th style="padding:5px 6px;font-size:9.5px;text-align:right;width:35%">পরিমাণ</th></tr></thead><tbody>' + outRows + '<tr style="background:#fef3c7"><td style="font-weight:900;color:#a16207;padding:5px 6px;font-size:10.5px">📤 প্রদান মোট</td><td class="amt" style="font-weight:900;color:#a16207;padding:5px 6px;font-size:11px">৳ ' + fmt(outTotal) + '</td></tr></tbody></table>';
      if(inRows) notesSection += '<div style="font-size:10.5px;font-weight:900;color:#15803d;padding:4px 8px;background:#dcfce7;border-left:3px solid #22c55e;border-radius:3px;margin-bottom:3px;margin-top:5px">📥 গ্রহণ</div><table class="tbl-print" style="margin-bottom:5px"><thead><tr><th style="padding:5px 6px;font-size:9.5px">নোট</th><th style="padding:5px 6px;font-size:9.5px;text-align:right;width:35%">পরিমাণ</th></tr></thead><tbody>' + inRows + '<tr style="background:#dcfce7"><td style="font-weight:900;color:#15803d;padding:5px 6px;font-size:10.5px">📥 গ্রহণ মোট</td><td class="amt" style="font-weight:900;color:#15803d;padding:5px 6px;font-size:11px">৳ ' + fmt(inTotal) + '</td></tr></tbody></table>';
    }
  }

  const body =
    '<div class="print-title" style="margin-bottom:8px;padding:8px 12px;font-size:14px">' + (cfg.icon || '') + ' ' + esc(cfg.title || tx.type) + ' — লেনদেন রশিদ</div>' +
    '<div class="info-grid" style="gap:5px;margin-bottom:6px;grid-template-columns:repeat(2,1fr)">' +
      '<div class="info-cell blue" style="padding:8px 10px"><div class="lbl" style="font-size:9px">তারিখ</div><div class="val" style="font-size:13px;margin-top:2px">' + toBn(tx.date || '-') + '</div></div>' +
      '<div class="info-cell green" style="padding:8px 10px"><div class="lbl" style="font-size:9px">পরিমাণ</div><div class="val" style="font-size:14px;margin-top:2px">৳ ' + fmt(tx.amount) + '</div></div>' +
      '<div class="info-cell" style="padding:8px 10px;grid-column:1/-1"><div class="lbl" style="font-size:9px">আউটলেট</div><div class="val" style="font-size:13px;margin-top:2px">' + esc(outletName) + '</div></div>' +
    '</div>' +
    (tx.type === 'branch_transfer' ? '<div class="summary-line" style="padding:6px 10px;margin-bottom:6px;font-size:11.5px"><span class="k">📤 প্রেরক ➜ 📥 গ্রহণকারী</span><span class="v">' + esc(BRANCHES[tx.from]?.name || '') + ' ➜ ' + esc(BRANCHES[tx.to]?.name || '') + '</span></div>' : '') +
    (tx.cancelled ? '<div class="summary-line" style="padding:6px 10px;margin-bottom:6px;font-size:11.5px;background:#fef2f2;border:1px solid #fca5a5"><span class="k">🔴 স্ট্যাটাস: বাতিল</span><span class="v" style="color:#b91c1c">কারণ: ' + esc(tx.cancelReason || '—') + '</span></div>' : '') +
    (tx.custName ? '<div class="info-grid" style="margin-bottom:6px"><div class="info-cell blue" style="grid-column:1/-1;padding:6px 10px"><div class="lbl" style="font-size:9px">👤 গ্রাহক</div><div class="val" style="font-size:12px;margin-top:1px">' + esc(tx.custName) + (tx.custAcc ? ' — ' + esc(tx.custAcc) : '') + (tx.custMobile ? ' • 📱 ' + esc(tx.custMobile) : '') + '</div></div></div>' : '') +
    balanceSection +
    notesSection +
    (tx.note ? '<div class="info-cell yellow" style="margin-top:6px;padding:6px 10px"><div class="lbl" style="font-size:9px">📝 মন্তব্য</div><div class="val" style="font-weight:700;font-size:11.5px;margin-top:1px">' + esc(tx.note) + '</div></div>' : '') +
    '<div style="margin-top:8px;padding:6px 10px;border:1.5px dashed #64748b;border-radius:5px;background:#f8fafc;text-align:center"><div style="font-size:9.5px;color:#475569;font-weight:700">🏦 আউটলেট</div><div style="font-size:12.5px;color:#1e40af;font-weight:900;margin-top:1px">' + esc(outletName) + '</div></div>';

  openPrintWindow((cfg.title || tx.type) + ' — ৳ ' + fmt(tx.amount), body);
}

function printCustomerHistory(accountNo, custName){
  if(!accountNo){ toast('❌ নেই'); return; }
  const allTxs = getCustomerAllTxs(accountNo);
  const cust = DB().customers.find(c => c.accountNo === accountNo);
  const name = custName || cust?.name || '-';
  const sTxs = allTxs.filter(t => t.type === 'support');
  const sPaid = sTxs.filter(t => t.dir === 'out' || t.dir === 'online_support_out').reduce((s,t)=> s+Number(t.amount||0),0);
  const sRefund = sTxs.filter(t => t.dir === 'in' || t.dir === 'online_support_in').reduce((s,t)=> s+Number(t.amount||0),0);
  const sNet = sPaid - sRefund;
  function dirInfo(t){
    if(t.type === 'support'){
      if(t.dir === 'out') return { icon:'🤝', label:'সাপোর্ট', badge:'<span style="display:inline-block;padding:1px 5px;border-radius:3px;background:#dbeafe;border:1px solid #93c5fd;color:#1e40af;font-size:8.5px;font-weight:800">প্রদান</span>' };
      if(t.dir === 'in') return { icon:'🤝', label:'সাপোর্ট', badge:'<span style="display:inline-block;padding:1px 5px;border-radius:3px;background:#dcfce7;border:1px solid #86efac;color:#15803d;font-size:8.5px;font-weight:800">↩️ ফেরত</span>' };
      if(t.dir === 'online_support_out') return { icon:'🤝', label:'সাপোর্ট', badge:'<span style="display:inline-block;padding:1px 5px;border-radius:3px;background:#ede9fe;border:1px solid #c4b5fd;color:#6d28d9;font-size:8.5px;font-weight:800">🌐 অনলাইন প্রদান</span>' };
      if(t.dir === 'online_support_in') return { icon:'🤝', label:'সাপোর্ট', badge:'<span style="display:inline-block;padding:1px 5px;border-radius:3px;background:#cffafe;border:1px solid #67e8f9;color:#0e7490;font-size:8.5px;font-weight:800">🌐 অনলাইন ফেরত</span>' };
    }
    if(t.type === 'loan_given') return { icon:'💸', label:'ঋণ বিতরণ', badge:'<span style="display:inline-block;padding:1px 5px;border-radius:3px;background:#dbeafe;border:1px solid #93c5fd;color:#1e40af;font-size:8.5px;font-weight:800">বিতরণ</span>' };
    if(t.type === 'loan_received') return { icon:'📥', label:'ঋণ গ্রহণ', badge:'<span style="display:inline-block;padding:1px 5px;border-radius:3px;background:#dcfce7;border:1px solid #86efac;color:#15803d;font-size:8.5px;font-weight:800">গ্রহণ</span>' };
    if(t.type === 'deposit') return { icon:'🏦', label:'জমা', badge:'<span style="display:inline-block;padding:1px 5px;border-radius:3px;background:#dcfce7;border:1px solid #86efac;color:#15803d;font-size:8.5px;font-weight:800">জমা</span>' };
    if(t.type === 'withdrawal') return { icon:'💵', label:'উত্তোলন', badge:'<span style="display:inline-block;padding:1px 5px;border-radius:3px;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;font-size:8.5px;font-weight:800">উত্তোলন</span>' };
    if(t.type === 'branch_transfer') return { icon:'🔁', label:'আউটলেট ট্রান্সফার', badge:'<span style="display:inline-block;padding:1px 5px;border-radius:3px;background:#e0e7ff;border:1px solid #a5b4fc;color:#3730a3;font-size:8.5px;font-weight:800">'+(t.accepted ? '✅ গৃহীত' : '⏳ অপেক্ষমাণ')+'</span>' };
    if(t.type === 'expense') return { icon:'🧾', label:'ক্যাশ খরচ', badge:'<span style="display:inline-block;padding:1px 5px;border-radius:3px;background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;font-size:8.5px;font-weight:800">খরচ</span>' };
    const cfg = TX_CFG[t.type] || { title:t.type, icon:'📌' };
    return { icon:cfg.icon, label:cfg.title, badge:'' };
  }
  const rows = allTxs.map((t,i) => {
    const info = dirInfo(t);
    const nOut = t.notesOut || {}, nIn = t.notesIn || {};
    const outParts = Object.keys(nOut).filter(k => nOut[k] > 0).sort((a,b)=>b-a).map(d => '৳'+toBn(d)+'×'+toBn(nOut[d]));
    const inParts = Object.keys(nIn).filter(k => nIn[k] > 0).sort((a,b)=>b-a).map(d => '৳'+toBn(d)+'×'+toBn(nIn[d]));
    let notesHtml = '';
    if(outParts.length) notesHtml += '<div style="font-size:9.5px;color:#a16207;margin-top:2px"><b>📤</b> '+outParts.join(' • ')+'</div>';
    if(inParts.length) notesHtml += '<div style="font-size:9.5px;color:#15803d;margin-top:2px"><b>📥</b> '+inParts.join(' • ')+'</div>';
    const noteHtml = t.note ? '<div style="font-size:9.5px;color:#475569;margin-top:2px;font-style:italic">📝 '+esc(t.note)+'</div>' : '';
    const detailHtml = (notesHtml || noteHtml) ? (notesHtml + noteHtml) : '<span style="color:#94a3b8">—</span>';
    return '<tr><td style="text-align:center;font-weight:700;vertical-align:top;padding:5px 4px;font-size:10px">'+toBn(i+1)+'</td><td style="white-space:nowrap;font-weight:700;vertical-align:top;padding:5px 4px;font-size:10px">'+toBn(t.date)+'<div style="font-size:9px;color:#475569;font-weight:700;margin-top:2px">'+esc(fmtTimeOnly(t.createdAt))+'</div></td><td style="vertical-align:top;padding:5px 4px;font-size:10px"><b>'+info.icon+' '+esc(info.label)+'</b> '+info.badge+detailHtml+'</td><td style="font-size:9.5px;vertical-align:top;padding:5px 4px">'+esc(BRANCHES[t.branch]?.name||'-')+'</td><td class="amt" style="vertical-align:top;padding:5px 4px;font-size:10.5px">৳ '+fmt(t.amount)+'</td></tr>';

/* ============ Transfer Accept/Cancel ============ */
async function receiveTransferDirect(id){
  const found = findTxAnywhere(id);
  if(!found || !found.tx || found.tx.accepted){ toast('❌ পাওয়া যায়নি'); return; }
  const t = found.tx;
  if(t.cancelled){ toast('❌ বাতিল হয়েছে'); return; }
  if(!canAcceptTransfer(t)){ toast('❌ শুধু গ্রহণকারী আউটলেট'); return; }
  if(!confirm('গ্রহণ?\n\n' + (BRANCHES[t.from]?.name||'') + ' ➜ ' + (BRANCHES[t.to]?.name||'') + '\n৳ ' + fmt(t.amount))) return;
  const nowISO = new Date().toISOString();
  updateTxAnywhere(id, { accepted: true, acceptedDate: todayStr(), acceptedAt: nowISO, acceptedBy: session.name, updatedAt: nowISO });
  addTxLog(id, 'accept', { accepted: { from: false, to: true }, acceptedBy: { from: '', to: session.name } }, t);
  addActivityLog({ type: 'txn_accept', title: '✅ আউটলেট ট্রান্সফার গৃহীত', detail: (BRANCHES[t.from]?.name||'') + ' ➜ ' + (BRANCHES[t.to]?.name||''), amount: t.amount, targetId: id });
  recomputeLive(); await saveDB();
  try{ await pushRemoteDB(true); }catch(e){}
  toast('✅ গ্রহণ — ৳ ' + fmt(t.amount));
  renderTopbar(); renderDashboard(); renderSidebar();
}
async function cancelTransferDirect(id){
  const found = findTxAnywhere(id);
  if(!found || !found.tx){ toast('❌ পাওয়া যায়নি'); return; }
  const t = found.tx;
  if(t.accepted && !t.cancelled){ toast('❌ ইতিমধ্যে গৃহীত'); return; }
  if(t.cancelled){ toast('❌ ইতিমধ্যে বাতিল'); return; }
  if(!canCancelTransfer(t)){ toast('❌ শুধু প্রেরক আউটলেট বাতিল করতে পারবে'); return; }
  const reason = prompt('🔴 ট্রান্সফার বাতিল করবেন?\n\n📤 প্রেরক: ' + (BRANCHES[t.from]?.name || '') + '\n📥 গ্রহণকারী: ' + (BRANCHES[t.to]?.name || '') + '\n💰 পরিমাণ: ৳ ' + fmt(t.amount) + '\n\n⚠️ নোট প্রেরক আউটলেটের ভল্টে ফিরে যাবে।\n\nবাতিলের কারণ (ঐচ্ছিক):', 'দরকার নেই');
  if(reason === null) return;
  if(!confirm('🔴 নিশ্চিত করুন — বাতিল হবে?')) return;
  const nowISO = new Date().toISOString();
  updateTxAnywhere(id, { accepted: false, cancelled: true, cancelledAt: nowISO, cancelledBy: session.name, cancelReason: reason || 'দরকার নেই', updatedAt: nowISO });
  addTxLog(id, 'delete', { cancelled: { from: false, to: true }, cancelReason: { from: '', to: reason || 'দরকার নেই' }, cancelledBy: { from: '', to: session.name } }, t);
  addActivityLog({ type: 'txn_delete', title: '🔴 আউটলেট ট্রান্সফার বাতিল', detail: (BRANCHES[t.from]?.name || '') + ' ➜ ' + (BRANCHES[t.to]?.name || '') + ' — কারণ: ' + (reason || 'দরকার নেই'), amount: t.amount, targetId: id });
  recomputeLive(); await saveDB();
  try{ await pushRemoteDB(true); }catch(e){}
  toast('🔴 বাতিল — ৳ ' + fmt(t.amount) + ' ভল্টে ফেরত');
  renderTopbar(); renderDashboard(); renderSidebar();
}

  openModal({ title: (cfg.icon||'') + ' ' + cfg.title, bodyHTML: body, wide: true, onMount: (w, close) => setupTxForm(w, type, editing, close, activeBranchForForm) });
}

      '<div class="notes-col in"><h4>📥 গ্রহণ</h4>' + notesRowHTML('in', editing?.notesIn || null) + '<div class="sum-line"><span>মোট</span><b id="sumIn">৳ 0.00</b></div></div>' +

    '<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn green" id="f_save" style="flex:1;min-width:160px">💾 সংরক্ষণ</button></div>' +

  openModal({ title: '💸 ঋণের টাকা বিতরণ', bodyHTML: body, wide: true, onMount: (w, close) => setupLoanGivenForm(w, editing, close, baseBranch) });
