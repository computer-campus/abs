function setupLoanGivenForm(wrap, editing, close, defaultBranch){
  const so = wrap.querySelector('#sumOut');
  const si = wrap.querySelector('#sumIn');
  const cTick = wrap.querySelector('#f_cashNotTakenTick');
  const cInfo = wrap.querySelector('#cashNotTakenInfo');
  const cAmt = wrap.querySelector('#f_cashNotTakenAmount');
  const loanTotalInput = wrap.querySelector('#f_loan_total');
  const onlineAmountInput = wrap.querySelector('#f_onlineAmount');
  const summaryEl = wrap.querySelector('#loanSummaryPreview');
  const custInfoEl = wrap.querySelector('#custInfoPanel');
  const accEl = wrap.querySelector('#f_acc');
  const nameEl = wrap.querySelector('#f_name');

  wrap.querySelectorAll('.note-item input').forEach(inp => attachAmountInput(inp, { decimal: false }));
  if(loanTotalInput) attachAmountInput(loanTotalInput, { decimal: true });
  if(onlineAmountInput) attachAmountInput(onlineAmountInput, { decimal: true });
  if(cAmt) attachAmountInput(cAmt, { decimal: true });

  function getLoanTotal(){ return parseNum(loanTotalInput?.value); }
  function getOnline(){ return parseNum(onlineAmountInput?.value); }
  function getCashPortion(){ return Math.max(0, getLoanTotal() - getOnline()); }

  function updateSummary(){
    const total = getLoanTotal();
    const online = getOnline();
    const cash = getCashPortion();
    const notTaken = cTick?.checked ? parseNum(cAmt?.value) : 0;
    if(summaryEl){
      let html = '';
      html += '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.08)"><span>🏦 মোট ঋণ:</span><b style="color:#93c5fd;font-size:15px">৳ ' + fmt(total) + '</b></div>';
      html += '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.08)"><span>🌐 অনলাইন ফান্ড:</span><b style="color:#c4b5fd;font-size:15px">৳ ' + fmt(online) + '</b></div>';
      if(cTick?.checked){
        html += '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.08)"><span>💵 ক্যাশ (প্রদেয়):</span><b style="color:#facc15;font-size:15px">৳ ' + fmt(cash) + '</b></div>';
        html += '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>🏦 ব্যাংকে থাকবে:</span><b style="color:#facc15;font-size:15px">৳ ' + fmt(notTaken) + '</b></div>';
      } else {
        html += '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>💵 ক্যাশ (প্রদেয়):</span><b style="color:#4ade80;font-size:15px">৳ ' + fmt(cash) + '</b></div>';
      }
      summaryEl.innerHTML = html;
    }
    if(cTick?.checked && cAmt && !cAmt.dataset.touched){
      const c = getCashPortion();
      cAmt.value = c > 0 ? c.toLocaleString('en-US') : '';
    }
  }

  function updateWarn(){
    const wb = wrap.querySelector('#noteAvailabilityWarning');
    if(!wb) return;
    const branchEl = wrap.querySelector('#f_branch');
    const vb = branchEl?.value || defaultBranch;
    const vault = DB().liveVault?.[vb] || {};
    const on = readNotes(wrap, 'out');
    const iss = [];
    Object.keys(on).forEach(d => { const n = Number(on[d]) || 0; const h = Number(vault[d]) || 0; if(n > h) iss.push({ d, n, h }); });
    if(iss.length > 0){
      wb.innerHTML = '<div style="padding:10px 14px;border-radius:10px;background:rgba(220,38,38,.15);border:1.5px solid rgba(220,38,38,.5);font-size:13px;color:#f87171;font-weight:700">⚠️ ভল্টে কম: ' + iss.map(it => '৳' + it.d + '×' + it.n + '(আছে ' + it.h + ')').join(' • ') + '</div>';
      wb.style.display = 'block';
    } else { wb.innerHTML = ''; wb.style.display = 'none'; }
  }

  function recalc(){
    const on = readNotes(wrap, 'out');
    const inN = readNotes(wrap, 'in');
    const os = noteSum(on);
    const is = noteSum(inN);
    if(so) so.textContent = '৳ ' + fmt(os);
    if(si) si.textContent = '৳ ' + fmt(is);
    updateSummary();
    updateWarn();
  }

  if(cTick){
    cTick.addEventListener('change', () => {
      if(cInfo) cInfo.style.display = cTick.checked ? 'block' : 'none';
      if(cTick.checked && cAmt) cAmt.dataset.touched = '';
      recalc();
    });
    if(cInfo) cInfo.style.display = cTick.checked ? 'block' : 'none';
  }

  function showCustomerInfo(acc, name){
    if(!acc || !custInfoEl) return;
    const allTxs = getCustomerAllTxs(acc);
    const loanTxs = allTxs.filter(t => t.type === 'loan_given' && !t.cancelled);
    const totalLoan = loanTxs.reduce((s,t) => s + (Number(t.amount) || 0), 0);
    const totalOnline = loanTxs.reduce((s,t) => s + (Number(t.onlineAmount) || 0), 0);
    // ✅ ক্যাশ = নোটের যোগফল
    const totalCash = loanTxs.reduce((s,t) => {
      const no = t.notesOut || {};
      let sum = 0;
      Object.keys(no).forEach(d => { sum += Number(d) * (Number(no[d]) || 0); });
      return s + sum;
    }, 0);
    const totalNotTaken = loanTxs.reduce((s,t) => s + (Number(t.cashNotTakenAmount) || 0), 0);
    custInfoEl.style.display = 'block';
    custInfoEl.innerHTML =
      '<div style="padding:12px 14px;border-radius:12px;background:linear-gradient(145deg,rgba(59,130,246,.12),rgba(34,197,94,.05));border:1.5px solid rgba(59,130,246,.4)">' +
        '<div style="font-size:12.5px;color:#93c5fd;font-weight:800;text-transform:uppercase;margin-bottom:10px">👤 গ্রাহক তথ্য — ' + esc(name || '-') + '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;font-size:12.5px">' +
          '<div style="padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(59,130,246,.25)"><div style="color:#a5b4d8;font-size:10.5px;font-weight:700">📊 মোট লেনদেন</div><div style="color:#fff;font-weight:900;font-size:14px;margin-top:2px">' + toBn(allTxs.length) + ' টি</div></div>' +
          '<div style="padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(59,130,246,.25)"><div style="color:#a5b4d8;font-size:10.5px;font-weight:700">🏦 মোট ঋণ পেয়েছেন</div><div style="color:#93c5fd;font-weight:900;font-size:14px;margin-top:2px">৳ ' + fmt(totalLoan) + '</div></div>' +
          '<div style="padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(59,130,246,.25)"><div style="color:#a5b4d8;font-size:10.5px;font-weight:700">🌐 অনলাইনে</div><div style="color:#c4b5fd;font-weight:900;font-size:14px;margin-top:2px">৳ ' + fmt(totalOnline) + '</div></div>' +
          '<div style="padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(59,130,246,.25)"><div style="color:#a5b4d8;font-size:10.5px;font-weight:700">💵 ক্যাশে</div><div style="color:#4ade80;font-weight:900;font-size:14px;margin-top:2px">৳ ' + fmt(totalCash) + '</div></div>' +
          '<div style="padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(59,130,246,.25)"><div style="color:#a5b4d8;font-size:10.5px;font-weight:700">🏦 ব্যাংকে রেখেছেন</div><div style="color:#facc15;font-weight:900;font-size:14px;margin-top:2px">৳ ' + fmt(totalNotTaken) + '</div></div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button type="button" class="btn cyan sm" id="ci_view_history" style="flex:1;min-width:140px;padding:9px 14px;font-size:13px">📜 সম্পূর্ণ হিস্টোরি দেখুন</button></div>' +
      '</div>';
    setTimeout(() => {
      const btn = custInfoEl.querySelector('#ci_view_history');
      if(btn){
        btn.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          if(typeof openCustomerDetailPopup === 'function'){ openCustomerDetailPopup(acc, name); }
        });
      }
    }, 100);
  }

  const sEl = wrap.querySelector('#f_search');
  const sg = wrap.querySelector('#f_suggest');
  if(sEl && sg){
    sEl.addEventListener('input', () => {
      const list = searchCustomers(sEl.value);
      if(!list.length){ sg.innerHTML = ''; return; }
      sg.innerHTML = list.map(c => {
        const d = calculateCustomerDue(c.accountNo);
        const dueBadge = d.net > 0 ? '<span style="display:inline-block;margin-left:6px;padding:2px 8px;border-radius:6px;background:rgba(220,38,38,.2);border:1px solid rgba(220,38,38,.5);color:#f87171;font-size:11px;font-weight:800">বকেয়া ৳ ' + fmt(d.net) + '</span>' : '';
        return '<div class="sug-item" data-id="' + c.id + '" data-acc="' + esc(c.accountNo) + '" data-name="' + esc(c.name) + '"><b>' + esc(c.name) + '</b> — <small>' + esc(c.accountNo) + '</small>' + dueBadge + '<br><small>📱 ' + esc(c.mobile || '-') + '</small></div>';
      }).join('');
      sg.querySelectorAll('.sug-item').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const c = DB().customers.find(x => x.id === el.dataset.id); if(!c) return;
          accEl.value = c.accountNo;
          nameEl.value = c.name;
          wrap.querySelector('#f_mobile').value = c.mobile || '';
          wrap.querySelector('#f_addr').value = c.address || '';
          sEl.value = c.accountNo;
          sg.innerHTML = '';
          showCustomerInfo(c.accountNo, c.name);
        });
      });
    });
  }

  if(accEl){
    accEl.addEventListener('blur', () => {
      const acc = accEl.value.trim();
      if(acc){ const c = DB().customers.find(x => x.accountNo === acc); if(c) showCustomerInfo(acc, c.name); }
    });
  }

  const ec = wrap.querySelector('#f_editCust');
  if(ec) ec.addEventListener('click', async () => {
    const acc = accEl.value.trim();
    const name = nameEl.value.trim();
    if(!acc && !name) return;
    const branchEl = wrap.querySelector('#f_branch');
    const br = branchEl?.value || defaultBranch;
    upsertCustomer({ accountNo: acc, name, mobile: wrap.querySelector('#f_mobile').value.trim(), address: wrap.querySelector('#f_addr').value.trim(), branch: br });
    await saveDB();
    toast('✅ গ্রাহক সেভ');
    if(acc) showCustomerInfo(acc, name);
  });

  const cd = wrap.querySelector('#f_checkDue');
  if(cd) cd.addEventListener('click', () => {
    const acc = accEl.value.trim();
    if(!acc){ toast('⚠️ অ্যাকাউন্ট দিন'); return; }
    const c = DB().customers.find(x => x.accountNo === acc);
    if(c) openCustomerDetailPopup(c.accountNo, c.name);
    else toast('ℹ️ গ্রাহক পাওয়া যায়নি');
  });

  if(cAmt) cAmt.addEventListener('focus', () => { cAmt.dataset.touched = '1'; });
  if(loanTotalInput) loanTotalInput.addEventListener('input', recalc);
  if(onlineAmountInput) onlineAmountInput.addEventListener('input', recalc);
  if(cAmt) cAmt.addEventListener('input', recalc);
  wrap.querySelectorAll('.note-item input').forEach(i => i.addEventListener('input', recalc));
  recalc();

  // History
  const area = wrap.querySelector('#modalHistoryArea');
  if(area){
    const allLoans = getAllTxs().filter(t => t.type === 'loan_given' && !t.cancelled);
    const custMap = {};
    allLoans.forEach(t => {
      const key = (t.custAcc || '').trim() || ('name_' + (t.custName || 'unknown'));
      if(!custMap[key]) custMap[key] = { acc: t.custAcc || '', name: t.custName || '-', total: 0, online: 0, cash: 0, count: 0, lastTime: t.createdAt || '' };
      custMap[key].total += Number(t.amount) || 0;
      custMap[key].online += Number(t.onlineAmount) || 0;
      const no = t.notesOut || {};
      Object.keys(no).forEach(d => { custMap[key].cash += Number(d) * (Number(no[d]) || 0); });
      custMap[key].count++;
      if((t.createdAt || '') > (custMap[key].lastTime || '')) custMap[key].lastTime = t.createdAt;
    });
    const custList = Object.values(custMap).sort((a,b) => (b.lastTime || '').localeCompare(a.lastTime || ''));
    area.innerHTML = '<div class="modal-history"><div class="modal-history-title"><span class="bar"></span> 👥 গ্রাহক ভিত্তিক ঋণ হিস্টোরি (' + toBn(custList.length) + ' জন • মোট ' + toBn(allLoans.length) + ' লেনদেন)</div>' + (custList.length ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>গ্রাহক</th><th>অ্যাকাউন্ট</th><th>লেনদেন</th><th>মোট ঋণ</th><th>অনলাইন</th><th>ক্যাশ</th><th></th></tr></thead><tbody>' + custList.map((c,i) => '<tr class="clickable-row" data-cust-acc="' + esc(c.acc) + '" data-cust-name="' + esc(c.name) + '"><td>' + toBn(i+1) + '</td><td>👤 <b style="color:#4ade80">' + esc(c.name) + '</b></td><td style="font-family:monospace;font-size:11.5px">' + esc(c.acc || '-') + '</td><td style="text-align:center">' + toBn(c.count) + '</td><td style="color:#93c5fd;font-weight:800;white-space:nowrap">৳ ' + fmt(c.total) + '</td><td style="color:#c4b5fd;font-weight:800;white-space:nowrap">৳ ' + fmt(c.online) + '</td><td style="color:#4ade80;font-weight:800;white-space:nowrap">৳ ' + fmt(c.cash) + '</td><td><button class="mini show" data-view-cust="' + esc(c.acc) + '" data-view-name="' + esc(c.name) + '">👁️</button></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">📭 নেই</div>') + '</div>';
    area.querySelectorAll('tr[data-cust-acc]').forEach(tr => {
      tr.addEventListener('click', (e) => {
        if(e.target.closest('button')) return;
        const acc = tr.dataset.custAcc, name = tr.dataset.custName;
        if(acc && typeof openCustomerDetailPopup === 'function') openCustomerDetailPopup(acc, name);
      });
    });
    area.querySelectorAll('[data-view-cust]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); if(btn.dataset.viewCust && typeof openCustomerDetailPopup === 'function') openCustomerDetailPopup(btn.dataset.viewCust, btn.dataset.viewName); });
    });
  }

  // Save
  wrap.querySelector('#f_save').addEventListener('click', async () => {
    const sBtn = wrap.querySelector('#f_save'); if(sBtn.disabled) return;
    sBtn.disabled = true; const orig = sBtn.innerHTML; sBtn.innerHTML = '<span class="spinner"></span>';
    try{
      const date = wrap.querySelector('#f_date').value || todayStr();
      const branchEl = wrap.querySelector('#f_branch');
      const tB = branchEl?.value || defaultBranch;
      const cB = tB;
      const on = readNotes(wrap, 'out');
      const inN = readNotes(wrap, 'in');
      const os = noteSum(on);
      const is = noteSum(inN);
      const total = getLoanTotal();
      const online = getOnline();
      const cashNotTaken = !!cTick?.checked;
      const cashNotTakenAmt = cashNotTaken ? parseNum(cAmt?.value) : 0;
      const cashPortion = Math.max(0, total - online);
      if(total <= 0){ alert('⚠️ মূল উত্তোলনযোগ্য ঋণ দিন'); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      if(online < 0){ alert('⚠️ অনলাইন পরিমাণ ভুল'); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      if(online > total){ alert('⚠️ অনলাইন পরিমাণ মোট ঋণের বেশি হতে পারবে না'); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      if(cashNotTaken){
        if(cashNotTakenAmt <= 0){ alert('⚠️ ব্যাংকে থাকা পরিমাণ দিন'); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      } else {
        if(Math.abs(os - cashPortion) > 0.01){
          alert('⚠️ ক্যাশ নোটের যোগফল ৳ ' + fmt(os) + ' — কিন্তু ক্যাশ প্রদেয় ৳ ' + fmt(cashPortion) + '\n\nদয়া করে নোট মিলিয়ে দিন।');
          sBtn.disabled = false; sBtn.innerHTML = orig; return;
        }
        if(Object.keys(on).length === 0 && cashPortion > 0){ sorryNoNote(); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      }
      const vault = DB().liveVault?.[cB] || {};
      const miss = [];
      Object.keys(on).forEach(d => { const n = Number(on[d]) || 0; const h = Number(vault[d]) || 0; if(n > h) miss.push({ d, n, h }); });
      if(miss.length > 0 && !editing){
        alert('⚠️ নোট কম:\n' + miss.map(m => '৳' + m.d + ' — দরকার ' + m.n + ', আছে ' + m.h).join('\n'));
        sBtn.disabled = false; sBtn.innerHTML = orig; return;
      }
      const custAcc = accEl.value.trim();
      const custName = nameEl.value.trim();
      if(!custName || !custAcc){ alert('⚠️ গ্রাহকের নাম ও অ্যাকাউন্ট দিন'); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      const tx = {
        id: editing ? editing.id : uid(), type: 'loan_given',
        date, branch: tB, custBranch: cB, dir: 'out',
        amount: Math.round(total * 100) / 100,
        onlineAmount: online > 0 ? Math.round(online * 100) / 100 : null,
        cashAmount: Math.round(cashPortion * 100) / 100,
        cashNotTaken, cashNotTakenAmount: cashNotTaken ? Math.round(cashNotTakenAmt * 100) / 100 : null,
        onlineTransfer: online > 0,
        onlineBankName: online > 0 ? (wrap.querySelector('#f_onlineBankName')?.value || '') : null,
        notesOut: on, notesIn: inN,
        custAcc, custName,
        custMobile: wrap.querySelector('#f_mobile').value.trim(),
        custAddr: wrap.querySelector('#f_addr').value.trim(),
        note: wrap.querySelector('#f_note').value.trim() || '',
        user: session.name, userUsername: session.username,
        createdAt: editing ? editing.createdAt : new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        year: date.slice(0, 4), accepted: true, acceptedDate: date
      };
      if(cashNotTaken && !editing){ tx.collectionStatus = 'pending'; tx.collectedAmount = 0; }
      else if(editing && editing.collectionStatus){ tx.collectionStatus = editing.collectionStatus; tx.collectedAmount = editing.collectedAmount; }
      const isCreating = !editing;
      if(!editing){ DB().txs.push(tx); } else { const i = DB().txs.findIndex(x => x.id === editing.id); if(i >= 0) DB().txs[i] = tx; }
      upsertCustomer({ accountNo: custAcc, name: custName, mobile: tx.custMobile, address: tx.custAddr, branch: cB });
      addTxLog(tx.id, isCreating ? 'create' : 'update', isCreating ? { action: 'new loan' } : computeTxChanges(editing, tx), tx);
      addActivityLog({ type: isCreating ? 'txn_create' : 'txn_update', title: (isCreating ? '💸 ' : '✏️ ') + 'ঋণ বিতরণ' + (isCreating ? ' তৈরি' : ' আপডেট'), detail: custName, amount: total, targetId: tx.id });
      recomputeLive(); await saveDB();
      if(isCreating){
        if(!window.__recentMyTxIds) window.__recentMyTxIds = [];
        window.__recentMyTxIds.push(tx.id);
        if(window.__recentMyTxIds.length > 20) window.__recentMyTxIds = window.__recentMyTxIds.slice(-20);
        setTimeout(() => { const idx = window.__recentMyTxIds.indexOf(tx.id); if(idx >= 0) window.__recentMyTxIds.splice(idx, 1); }, 10000);
      }
      try{ if(!editing) await pushRemoteDB(true, [tx]); }catch(e){}
      close(); toast('✅ সংরক্ষিত — ৳ ' + fmt(total));
      renderDashboard(); renderTopbar(); renderSidebar();
    }catch(e){ alert('❌ ' + e.message); sBtn.disabled = false; sBtn.innerHTML = orig; }
  });
}

/* ============ সাধারণ setupTxForm (loan_given ছাড়া বাকি সব) ============ */
function setupTxForm(wrap, type, editing, close, activeBranchForForm){
  const cfg = TX_CFG[type];
  const so = wrap.querySelector('#sumOut'), si = wrap.querySelector('#sumIn'), ne = wrap.querySelector('#netAmt');
  const nb = wrap.querySelector('#noteDetailContent');
  const hasDir = !!cfg.dir;
  const hasBT = !!cfg.cust && type !== 'support';
  const isBO = !!cfg.bankOnly;
  const isOS = () => { const d = wrap.querySelector('#f_dir')?.value; return d === 'online_support_out' || d === 'online_support_in'; };
  const isOn = () => { const d = wrap.querySelector('#f_dir')?.value; return d === 'online_in' || d === 'online_out'; };
  wrap.querySelectorAll('.note-item input').forEach(inp => attachAmountInput(inp, { decimal: false }));
  wrap.querySelectorAll('input[type="text"][inputmode="decimal"]').forEach(inp => attachAmountInput(inp, { decimal: true }));
  if(hasBT){
    wrap.querySelectorAll('.branch-toggle-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ wrap.querySelectorAll('.branch-toggle-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); wrap.querySelector('#f_custBranch_hidden').value = btn.dataset.bbranch; });
    });
  }
  if(hasDir){
    const dirEl = wrap.querySelector('#f_dir');
    function applyDir(){
      const d = dirEl.value;
      const nc = wrap.querySelector('#notesCols'), ob = wrap.querySelector('#onlineBox'), osb = wrap.querySelector('#onlineSupportBox');
      const isOSv = d === 'online_support_out' || d === 'online_support_in';
      const isOv = d === 'online_in' || d === 'online_out';
      if(nc) nc.style.display = (isOSv || isOv) ? 'none' : 'grid';
      if(ob) ob.classList.toggle('active', isOv);
      if(osb) osb.classList.toggle('active', isOSv);
      recalc();
    }
    dirEl.addEventListener('change', applyDir);
    applyDir();
  }
  function recalc(){
    if(isBO){ const v = parseNum(wrap.querySelector('#bt_amount')?.value); if(ne) ne.textContent = '৳ ' + fmt(v); return; }
    const on = readNotes(wrap, 'out'), inN = readNotes(wrap, 'in');
    const os = noteSum(on), is = noteSum(inN);
    if(so) so.textContent = '৳ ' + fmt(os);
    if(si) si.textContent = '৳ ' + fmt(is);
    if(isOS()){ const v = parseNum(wrap.querySelector('#support_amount')?.value); if(ne) ne.textContent = '৳ ' + fmt(v); }
    else if(isOn()){ const v = parseNum(wrap.querySelector('#online_amount')?.value); if(ne) ne.textContent = '৳ ' + fmt(v); }
    else { if(ne) ne.textContent = '৳ ' + fmt(Math.abs(os - is)); }
    let html = '';
    if(Object.keys(on).length) html += '<div style="margin-bottom:6px"><b style="color:#fff">📤</b> ' + noteDetailHTML(on) + '</div>';
    if(Object.keys(inN).length) html += '<div><b style="color:#fff">📥</b> ' + noteDetailHTML(inN) + '</div>';
    if(nb) nb.innerHTML = html || '—';
  }
  wrap.querySelectorAll('.note-item input').forEach(i => i.addEventListener('input', recalc));
  recalc();
  const area = wrap.querySelector('#modalHistoryArea');
  if(area){
    let list = getAllTxs().filter(t => t.type === type && !t.cancelled).sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
    const disp = list.slice(0, 15);
    area.innerHTML = '<div class="modal-history"><div class="modal-history-title"><span class="bar"></span> 📋 সম্প্রতি (' + toBn(list.length) + ')</div>' + (disp.length ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>সময়</th><th>গ্রাহক</th><th>বিবরণ</th><th>টাকা</th><th>ইউজার</th><th>প্রিন্ট</th></tr></thead><tbody>' + disp.map(t => {
      const cn = t.custName || '-', ca = t.custAcc || '', cl = !!ca;
      return '<tr class="' + (cl?'clickable-row':'') + '" ' + (cl ? 'data-cust-acc="' + esc(ca) + '" data-cust-name="' + esc(cn) + '"' : '') + '><td style="font-size:12px">' + esc(fmtDateTime(t.createdAt)) + '</td><td>' + (cl ? '👤 <b style="color:#4ade80">' + esc(cn) + '</b><br><small>' + esc(ca) + '</small>' : '—') + '</td><td style="font-size:11.5px;color:#a5b4d8;max-width:200px;line-height:1.6">' + noteListInline(t.notesOut || t.notesIn) + (t.note ? '<div style="margin-top:4px;font-style:italic">📝 ' + esc(t.note) + '</div>' : '') + '</td><td class="amt">৳ ' + fmt(t.amount) + '</td><td>' + esc(t.user||'-') + '</td><td><button class="mini print-btn" data-print-tx="' + t.id + '">🖨️</button></td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="empty">📭 নেই</div>') + '</div>';
    attachTxHistoryCustomerClick(area);
    area.querySelectorAll('[data-print-tx]').forEach(b => b.addEventListener('click', (e)=>{ e.stopPropagation(); const t = getAllTxs().find(x=>x.id === b.dataset.printTx); if(t) printSingleTransaction(t); }));
  }
  const sEl = wrap.querySelector('#f_search'), sg = wrap.querySelector('#f_suggest');
  if(sEl && sg){
    sEl.addEventListener('input', ()=>{
      const list = searchCustomers(sEl.value);
      if(!list.length){ sg.innerHTML = ''; return; }
      sg.innerHTML = list.map(c=>{ const d = calculateCustomerDue(c.accountNo); const dueBadge = d.net > 0 ? '<span style="display:inline-block;margin-left:6px;padding:2px 8px;border-radius:6px;background:rgba(220,38,38,.2);border:1px solid rgba(220,38,38,.5);color:#f87171;font-size:11px;font-weight:800">বকেয়া ৳ ' + fmt(d.net) + '</span>' : ''; return '<div class="sug-item" data-id="' + c.id + '" data-acc="' + esc(c.accountNo) + '" data-name="' + esc(c.name) + '"><b>' + esc(c.name) + '</b> — <small>' + esc(c.accountNo) + '</small>' + dueBadge + '<br><small>📱 ' + esc(c.mobile||'-') + '</small></div>'; }).join('');
      sg.querySelectorAll('.sug-item').forEach(el=>{ el.addEventListener('click', (e)=>{ e.stopPropagation(); const c = DB().customers.find(x=>x.id === el.dataset.id); if(!c) return; wrap.querySelector('#f_acc').value = c.accountNo; wrap.querySelector('#f_name').value = c.name; wrap.querySelector('#f_mobile').value = c.mobile || ''; wrap.querySelector('#f_addr').value = c.address || ''; sEl.value = c.accountNo; sg.innerHTML = ''; }); });
    });
  }
  const ec = wrap.querySelector('#f_editCust');
  if(ec) ec.addEventListener('click', async ()=>{ const acc = wrap.querySelector('#f_acc').value.trim(), name = wrap.querySelector('#f_name').value.trim(); if(!acc && !name) return; const hb = wrap.querySelector('#f_custBranch_hidden'), br = hb?.value || 'kalaroa'; upsertCustomer({ accountNo: acc, name, mobile: wrap.querySelector('#f_mobile').value.trim(), address: wrap.querySelector('#f_addr').value.trim(), branch: br }); await saveDB(); toast('✅ সেভ'); });
  const cd = wrap.querySelector('#f_checkDue');
  if(cd) cd.addEventListener('click', ()=>{ const acc = wrap.querySelector('#f_acc').value.trim(); if(!acc){ toast('⚠️ অ্যাকাউন্ট দিন'); return; } const c = DB().customers.find(x=>x.accountNo === acc); if(c) openCustomerDetailPopup(c.accountNo, c.name); else toast('ℹ️ নেই'); });
  wrap.querySelector('#f_save').addEventListener('click', async ()=>{
    const sBtn = wrap.querySelector('#f_save'); if(sBtn.disabled) return;
    sBtn.disabled = true; const orig = sBtn.innerHTML; sBtn.innerHTML = '<span class="spinner"></span>';
    try{
      const date = wrap.querySelector('#f_date').value || todayStr();
      const on = isBO ? {} : readNotes(wrap, 'out');
      const inN = isBO ? {} : readNotes(wrap, 'in');
      const os = noteSum(on), is = noteSum(inN);
      const dir = wrap.querySelector('#f_dir')?.value || null;
      const osL = isOS(), onL = isOn();
      const _anyNote = Object.keys(on).length > 0 || Object.keys(inN).length > 0;
      const _anySpecial = (isBO && parseNum(wrap.querySelector('#bt_amount')?.value) > 0) || (osL && parseNum(wrap.querySelector('#support_amount')?.value) > 0) || (onL && parseNum(wrap.querySelector('#online_amount')?.value) > 0);
      if(!_anyNote && !_anySpecial){ sorryNoNote(); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      let osA = 0, onA = 0;
      if(osL){ osA = parseNum(wrap.querySelector('#support_amount')?.value); if(osA <= 0){ alert('পরিমাণ দিন'); sBtn.disabled = false; sBtn.innerHTML = orig; return; } }
      if(onL){ onA = parseNum(wrap.querySelector('#online_amount')?.value); if(onA <= 0){ alert('পরিমাণ দিন'); sBtn.disabled = false; sBtn.innerHTML = orig; return; } }
      let btA = 0;
      if(isBO){ btA = parseNum(wrap.querySelector('#bt_amount')?.value); if(btA <= 0){ alert('পরিমাণ দিন'); sBtn.disabled = false; sBtn.innerHTML = orig; return; } }
      let tB, cB;
      if(type === 'support' || hasBT){ const hb = wrap.querySelector('#f_custBranch_hidden'); const br = hb?.value || (session.role === 'admin' ? (viewBranch === 'all' ? 'kalaroa' : viewBranch) : session.branch); tB = BRANCHES[br] ? br : 'kalaroa'; cB = tB; }
      else { const bs = wrap.querySelector('#f_branch'); if(bs?.value && BRANCHES[bs.value]) tB = bs.value; else tB = session.role !== 'admin' ? session.branch : 'kalaroa'; cB = tB; }
      const bk = wrap.querySelector('#f_bank')?.value || null;
      let tA;
      if(isBO) tA = btA;
      else if(osL) tA = osA;
      else if(onL) tA = onA;
      else if(type === 'support') tA = Math.abs(os - is);
      else if(dir === 'in') tA = is;
      else if(dir === 'out') tA = os;
      else tA = Math.abs(os - is);
      if(!isBO){
        const vault = DB().liveVault?.[cB] || {};
        const miss = [];
        Object.keys(on).forEach(d => { const n = Number(on[d]) || 0; const h = Number(vault[d]) || 0; if(n > h) miss.push({ d, n, h }); });
        if(miss.length > 0 && !editing){ alert('⚠️ নোট কম:\n' + miss.map(m => '৳' + m.d + ' — দরকার ' + m.n + ', আছে ' + m.h).join('\n')); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      }
      const tx = { id: editing ? editing.id : uid(), type, date, branch: tB, custBranch: cB, bank: bk, dir, amount: Math.round(tA*100)/100, onlineAmount: (onL || osL) ? Math.round(tA*100)/100 : null, notesOut: osL ? {} : on, notesIn: osL ? {} : inN, custAcc: wrap.querySelector('#f_acc')?.value.trim() || '', custName: wrap.querySelector('#f_name')?.value.trim() || '', custMobile: wrap.querySelector('#f_mobile')?.value.trim() || '', custAddr: wrap.querySelector('#f_addr')?.value.trim() || '', note: wrap.querySelector('#f_note')?.value.trim() || '', user: session.name, userUsername: session.username, createdAt: editing ? editing.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString(), year: date.slice(0,4), accepted: true, acceptedDate: date };
      const isCreating = !editing;
      if(!editing){ DB().txs.push(tx); } else { const i = DB().txs.findIndex(x => x.id === editing.id); if(i >= 0) DB().txs[i] = tx; }
      if(cfg.cust && (tx.custAcc || tx.custName)){ const c = upsertCustomer({ accountNo: tx.custAcc, name: tx.custName, mobile: tx.custMobile, address: tx.custAddr, branch: cB }); if(c) tx.custAcc = c.accountNo; }
      if(type === 'support' && tx.custAcc) updateCustomerDueInDB(tx.custAcc, false);
      addTxLog(tx.id, isCreating ? 'create' : 'update', isCreating ? { action: 'new transaction' } : computeTxChanges(editing, tx), tx);
      addActivityLog({ type: isCreating ? 'txn_create' : 'txn_update', title: (isCreating ? '💸 ' : '✏️ ') + (cfg.title || type) + (isCreating ? ' তৈরি' : ' আপডেট'), detail: tx.custName || '', amount: tA, targetId: tx.id });
      recomputeLive(); await saveDB();
      if(isCreating){ if(!window.__recentMyTxIds) window.__recentMyTxIds = []; window.__recentMyTxIds.push(tx.id); if(window.__recentMyTxIds.length > 20) window.__recentMyTxIds = window.__recentMyTxIds.slice(-20); setTimeout(() => { const idx = window.__recentMyTxIds.indexOf(tx.id); if(idx >= 0) window.__recentMyTxIds.splice(idx, 1); }, 10000); }
      try{ if(!editing) await pushRemoteDB(true, [tx]); }catch(e){}
      close(); toast('✅ সংরক্ষিত — ৳ ' + fmt(tA));
      renderDashboard(); renderTopbar(); renderSidebar();
    }catch(e){ alert('❌ ' + e.message); sBtn.disabled = false; sBtn.innerHTML = orig; }
  });
}

/* ============ Branch Transfer Form ============ */
function openBranchTransferForm(editId){
  const editing = editId ? getAllTxs().find(t => t.id === editId) : null;
  const isAdminUser = session.role === 'admin';
  const myB = session.branch || 'kalaroa';
  const df = editing ? editing.from : (isAdminUser ? (viewBranch === 'all' ? 'kalaroa' : viewBranch) : myB);
  const dt = editing ? editing.to : (df === 'kalaroa' ? 'jhaudanga' : 'kalaroa');

function setupTransferForm(wrap, editing, close){
  const so = wrap.querySelector('#sumOut'), si = wrap.querySelector('#sumIn'), ne = wrap.querySelector('#netAmt');
  wrap.querySelectorAll('.note-item input').forEach(inp => attachAmountInput(inp, { decimal: false }));
  function recalc(){
    const on = readNotes(wrap, 'out');
    wrap.querySelectorAll('[id^="in_"]').forEach(inp => { const v = on[inp.dataset.denom] || 0; if(inp.dataset.touched !== 'true') inp.value = v > 0 ? v : ''; });
    const inN = readNotes(wrap, 'in');
    const os = noteSum(on), is = noteSum(inN);
    if(so) so.textContent = '৳ ' + fmt(os);
    if(si) si.textContent = '৳ ' + fmt(is);
    if(ne) ne.textContent = '৳ ' + fmt(Math.max(os, is));
    const wb = wrap.querySelector('#noteAvailabilityWarning');
    if(wb){ const fb = wrap.querySelector('#f_from')?.value || 'kalaroa'; const vault = DB().liveVault?.[fb] || {}; const iss = []; Object.keys(on).forEach(d => { const n = Number(on[d]) || 0, h = Number(vault[d]) || 0; if(n > h) iss.push({ d, n, h }); }); if(iss.length > 0){ wb.innerHTML = '<div style="padding:10px 14px;border-radius:10px;background:rgba(220,38,38,.15);border:1.5px solid rgba(220,38,38,.5);font-size:13px;color:#f87171;font-weight:700">⚠️ কম: ' + iss.map(it => '৳' + it.d + '×' + it.n + '(আছে ' + it.h + ')').join(' • ') + '</div>'; wb.style.display = 'block'; } else { wb.innerHTML = ''; wb.style.display = 'none'; } }
  }
  wrap.querySelectorAll('.note-item input').forEach(i => { i.addEventListener('focus', ()=>{ if(i.id.startsWith('in_')) i.dataset.touched = 'true'; }); i.addEventListener('input', recalc); });
  recalc();
  const area = wrap.querySelector('#modalHistoryArea');
  const allTx = getAllBranchTransfers().slice(0, 15);
  area.innerHTML = '<div class="modal-history"><div class="modal-history-title"><span class="bar"></span> 📋 সম্প্রতি (' + toBn(allTx.length) + ')</div>' + (allTx.length ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>সময়</th><th>From ➜ To</th><th>বিবরণ</th><th>টাকা</th><th>স্ট্যাটাস</th><th>ইউজার</th></tr></thead><tbody>' + allTx.map(t => '<tr><td style="font-size:12px">' + esc(fmtDateTime(t.createdAt)) + '</td><td>' + esc(BRANCHES[t.from]?.name||'') + ' ➜ <b style="color:#4ade80">' + esc(BRANCHES[t.to]?.name||'') + '</b></td><td style="font-size:11.5px;color:#a5b4d8;max-width:220px;line-height:1.6">' + noteListInline(t.notesOut || t.notesIn) + (t.note ? '<div style="margin-top:4px;font-style:italic">📝 ' + esc(t.note) + '</div>' : '') + '</td><td class="amt">৳ ' + fmt(t.amount) + '</td><td>' + (t.accepted ? '<span class="badge accepted">✅</span>' : '<span class="badge pending">⏳</span>') + '</td><td>' + esc(t.user||'-') + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">📭 নেই</div>') + '</div>';
  function renderPending(){
    const box = wrap.querySelector('#pendingArea'); if(!box) return;
    const bf = currentBranchFilter();
    const myB = session.role === 'admin' ? (bf === 'all' ? null : bf) : session.branch;
    let pending = DB().txs.filter(t=> t.type === 'branch_transfer' && !t.accepted && !t.cancelled);
    if(myB) pending = pending.filter(t=> t.to === myB);
    if(!pending.length){ box.innerHTML = '<div class="pending-box"><h4>⏳ অপেক্ষমাণ</h4><div class="pending-empty">নেই ✅</div></div>'; return; }
    box.innerHTML = '<div class="pending-box"><h4>⏳ (' + toBn(pending.length) + ')</h4>' + pending.map(t=>{ const canCancel = canCancelTransfer(t); const cancelBtn = canCancel ? ' <button class="mini danger" data-cancel="' + t.id + '">❌</button>' : ''; return '<div class="pending-item"><div class="info"><b>' + esc(BRANCHES[t.from]?.name||t.from) + '</b> ➜ <b>' + esc(BRANCHES[t.to]?.name||t.to) + '</b><small>' + toBn(t.date) + ' • ৳ ' + fmt(t.amount) + '</small></div><button class="mini accept" data-acc="' + t.id + '">✅ গ্রহণ</button>' + cancelBtn + '</div>'; }).join('') + '</div>';
    box.querySelectorAll('[data-acc]').forEach(b => b.addEventListener('click', async ()=>{ await receiveTransferDirect(b.dataset.acc); close(); }));
    box.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', async ()=>{ await cancelTransferDirect(b.dataset.cancel); close(); }));
  }
  renderPending();
  wrap.querySelector('#f_save').addEventListener('click', async ()=>{
    const sBtn = wrap.querySelector('#f_save'); if(sBtn.disabled) return;
    sBtn.disabled = true; const orig = sBtn.innerHTML; sBtn.innerHTML = '<span class="spinner"></span>';
    try{
      const date = wrap.querySelector('#f_date').value || todayStr();
      const from = wrap.querySelector('#f_from').value, to = wrap.querySelector('#f_to').value;
      const note = wrap.querySelector('#f_note').value.trim();
      if(from === to){ alert('একই আউটলেট নয়'); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      const on = readNotes(wrap, 'out'), inN = readNotes(wrap, 'in');
      const os = noteSum(on), is = noteSum(inN);
      if(Object.keys(on).length === 0 && Object.keys(inN).length === 0){ sorryNoNote(); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      if(os <= 0 && is <= 0){ sorryNoNote(); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      const vault = DB().liveVault?.[from] || {};
      const miss = [];
      Object.keys(on).forEach(d => { const n = Number(on[d]) || 0, h = Number(vault[d]) || 0; if(n > h) miss.push({ d, n, h }); });
      if(miss.length > 0 && !editing){ alert('⚠️ কম:\n' + miss.map(m => '৳' + m.d + ' — দরকার ' + m.n + ', আছে ' + m.h).join('\n')); sBtn.disabled = false; sBtn.innerHTML = orig; return; }
      const amt = Math.max(os, is);
      const tx = { id: editing ? editing.id : uid(), type: 'branch_transfer', date, branch: from, custBranch: from, from, to, dir: 'out', amount: Math.round(amt*100)/100, notesOut: on, notesIn: inN, note: note || (BRANCHES[from].name + ' ➜ ' + BRANCHES[to].name), user: session.name, userUsername: session.username, createdAt: editing ? editing.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString(), year: date.slice(0,4), accepted: false, acceptedDate: null };
      const isCreating = !editing;
      if(!editing){ DB().txs.push(tx); } else { const i = DB().txs.findIndex(x => x.id === editing.id); if(i >= 0) DB().txs[i] = tx; }
      addTxLog(tx.id, isCreating ? 'create' : 'update', isCreating ? { action: 'new transaction' } : computeTxChanges(editing, tx), tx);
      if(isCreating) addActivityLog({ type: 'txn_create', title: '🔁 আউটলেট ট্রান্সফার তৈরি', detail: (BRANCHES[from]?.name||'') + ' ➜ ' + (BRANCHES[to]?.name||''), amount: amt, targetId: tx.id });
      recomputeLive(); await saveDB();
      if(!editing){ if(!window.__recentMyTxIds) window.__recentMyTxIds = []; window.__recentMyTxIds.push(tx.id); if(window.__recentMyTxIds.length > 20) window.__recentMyTxIds = window.__recentMyTxIds.slice(-20); setTimeout(() => { const idx = window.__recentMyTxIds.indexOf(tx.id); if(idx >= 0) window.__recentMyTxIds.splice(idx, 1); }, 10000); }
      try{ if(!editing) await pushRemoteDB(true, [tx]); }catch(e){}
      close(); renderDashboard(); renderTopbar(); renderSidebar();
      toast('✅ পাঠানো — ৳ ' + fmt(amt));
    }catch(e){ alert('❌ ' + e.message); sBtn.disabled = false; sBtn.innerHTML = orig; }
  });
}

lay:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn green" id="me_save" style="flex:1;min-width:160px">💾 সংরক্ষণ</button></div>',

/* ============ Collection Child ============ */
function openCollectionChildModal(parentId, mode){
  const found = findTxAnywhere(parentId); if(!found || !found.tx){ toast('❌ নেই'); return; }
  const parent = found.tx;
  const owed = Number(parent.cashNotTakenAmount) || Number(parent.amount) || 0;
  const collected = Number(parent.collectedAmount) || 0;
  const pending = Math.round((owed - collected)*100)/100;
  if(pending <= 0.01){ toast('✅ সম্পূর্ণ'); return; }
  const isC = mode === 'cash';
  openModal({ title: isC ? '💵 ক্যাশ সংগ্রহ' : '🌐 অনলাইন সংগ্রহ', wide: true,
    bodyHTML: '<div class="accept-head" style="border-color:' + (isC?'rgba(34,197,94,.5)':'rgba(59,130,246,.5)') + '"><div style="font-size:15px;font-weight:800;color:#fff;margin-bottom:8px">' + (isC ? '💵 ক্যাশ সংগ্রহ' : '🌐 অনলাইন সংগ্রহ') + '</div>👤 <b>' + esc(parent.custName||'-') + '</b><br>মোট: ৳ ' + fmt(owed) + ' • পূর্বে সংগৃহীত: ৳ ' + fmt(collected) + '<br>⏳ বাকি: <b style="color:#facc15;font-size:17px">৳ ' + fmt(pending) + '</b></div><div class="form-row"><div class="field"><label>তারিখ</label><input type="date" id="cc_date" value="' + todayStr() + '"></div><div class="field"><label>আউটলেট</label>' + (session.role === 'admin' ? '<select id="cc_branch"><option value="kalaroa" ' + (parent.branch==='kalaroa'?'selected':'') + '>কলারোয়া</option><option value="jhaudanga" ' + (parent.branch==='jhaudanga'?'selected':'') + '>ঝাউডাঙ্গা</option></select>' : '<input type="hidden" id="cc_branch" value="' + parent.branch + '"><input type="text" value="' + BRANCHES[parent.branch].name + '" disabled>') + '</div><div class="field"><label>💰 পরিমাণ</label><input type="text" inputmode="decimal" id="cc_amount" value="' + pending.toFixed(2) + '" autocomplete="off"></div></div>' + (!isC ? '<div class="form-row"><div class="field"><label>ব্যাংক</label><select id="cc_bank">' + bankOpts('al_arafah_kalaroa') + '</select></div><div class="field"><label>প্রাপক</label><input type="text" id="cc_partner" autocomplete="off"></div></div>' : '<div class="notes-col out"><h4>💸 প্রদান</h4>' + notesRowHTML('cc_out', null) + '<div class="sum-line"><span>মোট</span><b id="cc_sumOut">৳ 0.00</b></div></div>') + '<div class="field"><label>📝 মন্তব্য</label><input type="text" id="cc_note" value="' + (isC ? 'ক্যাশ সংগ্রহ' : 'অনলাইন সংগ্রহ') + '" autocomplete="off"></div><div style="display:flex;gap:10px;margin-top:18px"><button class="btn ' + (isC?'green':'') + '" id="cc_save" style="flex:1">✅ সংগ্রহ</button></div>',
    onMount: (w, close) => {
      const so = w.querySelector('#cc_sumOut');
      function recalc(){ if(isC && so) so.textContent = '৳ ' + fmt(noteSum(readNotes(w, 'cc_out'))); }
      if(isC) w.querySelectorAll('.note-item input').forEach(inp => { attachAmountInput(inp, { decimal: false }); inp.addEventListener('input', recalc); });
      w.querySelectorAll('input[inputmode="decimal"]').forEach(inp => attachAmountInput(inp, { decimal: true }));
      recalc();
      w.querySelector('#cc_save').addEventListener('click', async ()=>{
        const b = w.querySelector('#cc_save'); b.disabled = true; const og = b.innerHTML; b.innerHTML = '<span class="spinner"></span>';
        try{
          const date = w.querySelector('#cc_date').value, br = w.querySelector('#cc_branch').value;
          const amt = Math.round(parseNum(w.querySelector('#cc_amount').value)*100)/100;
          if(amt <= 0){ alert('পরিমাণ দিন'); b.disabled = false; b.innerHTML = og; return; }

          addTxLog(child.id, 'create', { action: 'collection entry created' }, child);
          addActivityLog({ type: 'txn_collect', title: '💰 ঋণ সংগ্রহ', detail: parent.custName || '', amount: amt, targetId: parent.id });
          recomputeLive(); await saveDB();
          try{ await pushRemoteDB(true, [child]); }catch(e){}
          close(); renderDashboard(); renderSidebar();
          toast('✅ সংগ্রহ — ৳ ' + fmt(amt) + (ns === 'collected' ? ' (সম্পূর্ণ)' : ' (বাকি ৳ ' + fmt(owed - nc) + ')'));
        }catch(e){ alert('❌ ' + e.message); b.disabled = false; b.innerHTML = og; }
      });
    }
  });
}

            totalIn += Number(t.onlineAmount) || 0;
          }
          else if(t.type === 'deposit' && !t.cancelled){ totalIn += amt; }
          else if(t.type === 'loan_received' && !t.cancelled){ totalIn += amt; }
          else if(t.type === 'support' && !t.cancelled && (t.dir === 'out' || t.dir === 'online_support_out')){ totalIn += amt; }
          else if(t.type === 'other_bank' && !t.cancelled && (t.dir === 'in' || t.dir === 'online_in')){ totalIn += amt; }

          if(t.type === 'withdrawal' && !t.cancelled){ totalOut += amt; }

          else if(t.type === 'expense' && !t.cancelled){ totalOut += amt; }

          const notesHtml = (nOutStr || nInStr)
            ? '<div style="font-size:10.5px;margin-top:3px">' + (nOutStr ? '<span style="color:#facc15">📤 ' + nOutStr + '</span> ' : '') + (nInStr ? '<span style="color:#4ade80">📥 ' + nInStr + '</span>' : '') + '</div>'
            : '';

            '<td style="font-size:11.5px;white-space:nowrap">' + toBn(t.date) + '<div style="font-size:10px;color:#7a8ab8">' + esc(fmtTimeOnly(t.createdAt)) + '</div></td>' +
            '<td><span style="color:' + info.color + ';font-weight:800">' + info.icon + ' ' + info.label + '</span> ' + dirBadge + notesHtml + noteHtml + '</td>' +
            '<td style="font-size:11px">' + esc(BRANCHES[t.branch]?.name || '-') + '</td>' +
            '<td class="amt" style="color:' + info.color + ';white-space:nowrap">৳ ' + fmt(t.amount) + '</td>' +
            '<td style="font-size:11px">' + esc(t.user || '-') + '</td>' +
            '</tr>';
        }).join('');
        el.innerHTML =
          '<div class="section-title" style="margin-bottom:10px"><span class="bar"></span> 📋 সম্পূর্ণ লেনদেন তালিকা (' + toBn(txs.length) + ' টি)</div>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px">' +
            '<div style="padding:10px;border-radius:10px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4);text-align:center"><div style="font-size:11px;color:#4ade80;font-weight:700">📥 গ্রাহক পেয়েছেন</div><div style="font-size:17px;font-weight:900;color:#4ade80;margin-top:3px">৳ ' + fmt(totalIn) + '</div></div>' +
            '<div style="padding:10px;border-radius:10px;background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.4);text-align:center"><div style="font-size:11px;color:#facc15;font-weight:700">📤 গ্রাহক দিয়েছেন</div><div style="font-size:17px;font-weight:900;color:#facc15;margin-top:3px">৳ ' + fmt(totalOut) + '</div></div>' +
            '<div style="padding:10px;border-radius:10px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.4);text-align:center"><div style="font-size:11px;color:#93c5fd;font-weight:700">📊 মোট লেনদেন</div><div style="font-size:17px;font-weight:900;color:#93c5fd;margin-top:3px">' + toBn(txs.length) + ' টি</div></div>' +
          '</div>' +
          '<div class="table-wrap" style="max-height:400px;overflow-y:auto">' +
            '<table class="tbl" style="min-width:520px"><thead><tr><th>তারিখ</th><th>ধরন</th><th>আউটলেট</th><th>টাকা</th><th>ইউজার</th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table>' +
          '</div>';
        el.querySelectorAll('[data-tx-row]').forEach(tr => {
          tr.addEventListener('click', () => {
            const id = tr.dataset.txRow;
            if(id && typeof openTxDetail === 'function') openTxDetail(id);
          });
        });
      }
      renderAllTxns();
      w.querySelector('#cust_h_support').addEventListener('click', ()=>{
        close();
        setTimeout(() => { openTxModal('support', null, { custAcc: accountNo, custName: name, custMobile: cust?.mobile || '', custAddr: cust?.address || '' }); }, 200);
      });
      w.querySelector('#cust_h_print').addEventListener('click', ()=>{ printCustomerHistory(accountNo, name); });
    }
  });
}

function openTxDetail(id){
  const found = findTxAnywhere(id);
  if(!found || !found.tx){ toast('❌ পাওয়া যায়নি'); return; }
  const t = found.tx;
  const cfg = TX_CFG[t.type] || { title: t.type, icon: '📌' };
  const notes = t.notesOut || t.notesIn || {};
  const notesHtml = Object.keys(notes).sort((a,b)=>b-a).map(d => '<div style="display:flex;justify-content:space-between;padding:8px 14px;border-radius:10px;background:rgba(59,130,246,.1);margin-bottom:6px;border:1px solid rgba(59,130,246,.25)"><span style="color:#93c5fd;font-weight:700">৳ ' + toBn(d) + ' × ' + toBn(notes[d]) + '</span><span style="color:#fff;font-weight:800">= ৳ ' + fmt(d * notes[d]) + '</span></div>').join('');

async function deleteTx(id){
  if(!requireAdmin('লেনদেন ডিলিট')) return;
  const t = DB().txs.find(x => x.id === id);
  if(!t){ toast('❌ লেনদেন পাওয়া যায়নি'); return; }
  if(!DB().deletedTxIds) DB().deletedTxIds = {};
  DB().deletedTxIds[id] = new Date().toISOString();
  DB().txs = DB().txs.filter(x=>x.id !== id);
  addTxLog(id, 'delete', { deleted: { from: 'active', to: 'deleted' } }, t);
  addActivityLog({ type: 'txn_delete', title: '🗑️ লেনদেন ডিলিট', detail: (TX_CFG[t?.type]?.title || '') + ' — ' + (t.custName || ''), amount: t?.amount || 0, targetId: id });
  recomputeLive(); await saveDB();
  try{ await pushRemoteDB(true); }catch(e){}
  renderDashboard(); renderSidebar();
  toast('🗑️ ডিলিট সম্পন্ন');
}

async function deleteTxFromAudit(txId){
  try{
    if(!requireAdmin('লেনদেন ডিলিট করতে')) return;
    const found = findTxAnywhere(txId);
    if(!found || !found.tx){ toast('❌ পাওয়া যায়নি'); return; }
    const t = found.tx;
    // deletedTxIds এ যোগ
    if(!DB().deletedTxIds) DB().deletedTxIds = {};
    DB().deletedTxIds[txId] = new Date().toISOString();
    // main txs থেকে সরান
    DB().txs = DB().txs.filter(x => x.id !== txId);
    // archive থেকেও সরান
    if(DB().yearlyArchive){
      Object.keys(DB().yearlyArchive).forEach(y => {
        if(Array.isArray(DB().yearlyArchive[y])){
          DB().yearlyArchive[y] = DB().yearlyArchive[y].filter(x => x.id !== txId);
        }
      });
    }
    // Log
    addTxLog(txId, 'delete', { deleted: { from: 'active', to: 'deleted' }, deletedFrom: 'audit_log' }, t);
    addActivityLog({ type: 'txn_delete', title: '🗑️ অডিট থেকে ডিলিট', detail: (TX_CFG[t.type]?.title || '') + (t.custName ? ' — ' + t.custName : ''), amount: t.amount, targetId: txId });
    recomputeLive(); await saveDB();
    try{ await pushRemoteDB(true); }catch(e){}
    renderDashboard(); renderSidebar();
    // Audit modal refresh
    const modalRoot = document.getElementById('modalRoot');
    if(modalRoot && modalRoot.children.length > 0){
      modalRoot.innerHTML = '';
      setTimeout(() => openAuditLogModal(), 100);
    }
    toast('🗑️ ডিলিট সম্পন্ন');
  }catch(e){
    alert('❌ ডিলিট ব্যর্থ: ' + e.message);
    console.error(e);
  }
}

/* ============ DB Browser ============ */
const DB_TABLES = { txs:{label:'💸 লেনদেন',icon:'💸'}, txEditLog:{label:'📜 অডিট',icon:'📜'}, activityLog:{label:'🔔 অ্যাক্টিভিটি',icon:'🔔'}, customers:{label:'🧑 গ্রাহক',icon:'🧑'}, users:{label:'👥 ইউজার',icon:'👥'}, branchCapital:{label:'💵 মূলধন',icon:'💵'}, baseVault:{label:'🗄️ বেস ভল্ট',icon:'🗄️'}, baseAccounts:{label:'🏦 বেস',icon:'🏦'}, liveVault:{label:'⚡ লাইভ ভল্ট',icon:'⚡'}, liveAccounts:{label:'💵 লাইভ',icon:'💵'} };
function getTableData(n){ const d = DB(); if(!d) return null; return d[n]; }
function getTableCount(n){ const d = getTableData(n); if(d == null) return 0; if(Array.isArray(d)) return d.length; if(typeof d === 'object') return Object.keys(d).length; return 1; }
function openDatabaseBrowser(){
  if(!requireAdmin('ডেটাবেস ব্রাউজ করতে')) return;
  let activeTab = 'txs', searchQuery = '';
  const tabsHTML = Object.entries(DB_TABLES).map(([k,v]) => '<button class="db-tab-btn" data-dbtab="' + k + '">' + v.icon + ' ' + v.label + ' <span class="cnt">' + toBn(getTableCount(k)) + '</span></button>').join('');
  openModal({ title: '🗄️ ডেটাবেস ব্রাউজার', xwide: true,
    bodyHTML: '<div class="db-tabs" id="dbTabs">' + tabsHTML + '</div><div class="db-toolbar"><input type="text" class="db-search" id="dbSearch" placeholder="🔍 খুঁজুন..." autocomplete="off"><span class="db-info" id="dbInfo">—</span></div><div id="dbContent"></div>',
    onMount: (w) => {
      const tabsEl = w.querySelector('#dbTabs'), contentEl = w.querySelector('#dbContent'), infoEl = w.querySelector('#dbInfo');
      function setActive(t){ activeTab = t; tabsEl.querySelectorAll('.db-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.dbtab === t)); renderTable(); }
      tabsEl.querySelectorAll('.db-tab-btn').forEach(b => b.addEventListener('click', () => setActive(b.dataset.dbtab)));
      w.querySelector('#dbSearch').addEventListener('input', (e) => { searchQuery = e.target.value; renderTable(); });
      function renderTable(){
        const data = getTableData(activeTab);
        if(data == null){ contentEl.innerHTML = '<div class="empty">📭 খালি</div>'; infoEl.textContent = '0'; return; }
        if(Array.isArray(data)){
          let list = data.slice();
          if(searchQuery){ const q = searchQuery.toLowerCase(); list = list.filter(item => JSON.stringify(item).toLowerCase().includes(q)); }
          infoEl.textContent = 'মোট: ' + toBn(data.length) + ' • দেখানো: ' + toBn(list.length);
          if(!list.length){ contentEl.innerHTML = '<div class="empty">📭 নেই</div>'; return; }
          const allKeys = new Set(); list.forEach(item => { if(item && typeof item === 'object') Object.keys(item).forEach(k => allKeys.add(k)); });
          const dk = Array.from(allKeys).slice(0, 8);
          contentEl.innerHTML = '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th>' + dk.map(k => '<th>' + esc(k) + '</th>').join('') + '<th>অ্যাকশন</th></tr></thead><tbody>' + list.slice(0, 200).map((item, i) => '<tr><td>' + toBn(i+1) + '</td>' + dk.map(k => { let v = item[k]; if(v == null) return '<td>—</td>'; if(typeof v === 'object') v = JSON.stringify(v).slice(0,50)+'…'; v = String(v); if(v.length > 60) v = v.slice(0,60)+'…'; return '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(v) + '</td>'; }).join('') + '<td><button class="mini" data-dbview="' + i + '">👁️</button></td></tr>').join('') + '</tbody></table></div>';
          contentEl.querySelectorAll('[data-dbview]').forEach(b => b.addEventListener('click', () => openModal({ title: '👁️ দেখুন', wide: true, bodyHTML: '<div class="db-json">' + esc(JSON.stringify(list[+b.dataset.dbview], null, 2)) + '</div>' })));
        } else {
          const keys = Object.keys(data);
          infoEl.textContent = 'কী: ' + toBn(keys.length);
          contentEl.innerHTML = '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>কী</th><th>মান</th></tr></thead><tbody>' + keys.map((k,i) => { let v = data[k]; if(typeof v === 'object') v = JSON.stringify(v); return '<tr><td>' + toBn(i+1) + '</td><td style="font-family:monospace;color:#93c5fd">' + esc(k) + '</td><td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace;font-size:12px">' + esc(String(v).slice(0,200)) + '</td></tr>'; }).join('') + '</tbody></table></div>';
        }
      }
      setActive(activeTab);
    }
  });
}

/* ============ Backup Manager ============ */
const BACKUP_DB_NAME = 'cc_agent_bank_backups';
const BACKUP_STORE = 'backups';
const BACKUP_DB_VERSION = 1;
const AUTO_BACKUP_MAX = 30;
const AUTO_BACKUP_KEY = 'cc_last_auto_backup_date';
let __backupDB = null;

function openBackupDB(){
  return new Promise((resolve, reject) => {
    if(__backupDB) return resolve(__backupDB);
    if(!('indexedDB' in window)) return reject(new Error('IndexedDB সাপোর্ট নেই'));
    const req = indexedDB.open(BACKUP_DB_NAME, BACKUP_DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(BACKUP_STORE)){
        const store = db.createObjectStore(BACKUP_STORE, { keyPath: 'id' });
        store.createIndex('createdAt', 'createdAt', { unique: false });
        store.createIndex('isAuto', 'isAuto', { unique: false });
      }
    };
    req.onsuccess = (e) => { __backupDB = e.target.result; resolve(__backupDB); };
    req.onerror = (e) => reject(e.target.error || new Error('DB open error'));
  });
}
async function saveBackupToStore(data, options){
  options = options || {};
  const db = await openBackupDB();
  const json = JSON.stringify(data);
  const backup = { id: options.id || uid(), name: options.name || 'ব্যাকআপ', note: options.note || '', isAuto: !!options.isAuto, createdAt: options.createdAt || new Date().toISOString(), size: json.length, txCount: (data.txs || []).length, custCount: (data.customers || []).length, userCount: (data.users || []).length, logCount: (data.txEditLog || []).length, activityCount: (data.activityLog || []).length, archiveYears: Object.keys(data.yearlyArchive || {}), appVersion: data.__version || window.APP_VERSION, capital: Number(data.totalCapital) || 0, user: (typeof session !== 'undefined' && session) ? session.name : 'system', username: (typeof session !== 'undefined' && session) ? session.username : 'system', data: data };
  return new Promise((resolve, reject) => {
    const tx = db.transaction(BACKUP_STORE, 'readwrite');
    const req = tx.objectStore(BACKUP_STORE).put(backup);
    req.onsuccess = () => resolve(backup);
    req.onerror = (e) => reject(e.target.error);
  });
}
async function getAllBackups(){
  const db = await openBackupDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(BACKUP_STORE, 'readonly');
    const req = tx.objectStore(BACKUP_STORE).getAll();
    req.onsuccess = () => { const list = req.result || []; list.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || '')); resolve(list); };
    req.onerror = (e) => reject(e.target.error);
  });
}
async function deleteBackupById(id){
  const db = await openBackupDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(BACKUP_STORE, 'readwrite');
    const req = tx.objectStore(BACKUP_STORE).delete(id);
    req.onsuccess = () => resolve(true);
    req.onerror = (e) => reject(e.target.error);
  });
}
async function clearAllBackups(){
  const db = await openBackupDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(BACKUP_STORE, 'readwrite');
    const req = tx.objectStore(BACKUP_STORE).clear();
    req.onsuccess = () => resolve(true);
    req.onerror = (e) => reject(e.target.error);
  });
}
function formatBytes(bytes){
  if(!bytes || bytes < 0) return '0 B';
  const units = ['B','KB','MB','GB'];
  let i = 0, n = bytes;
  while(n >= 1024 && i < units.length-1){ n /= 1024; i++; }
  return n.toFixed(2) + ' ' + units[i];
}
function fmtBackupDate(iso){
  if(!iso) return '-';
  try{ const d = new Date(iso); if(isNaN(d.getTime())) return '-'; return toBn(String(d.getDate()).padStart(2,'0'))+'/'+toBn(String(d.getMonth()+1).padStart(2,'0'))+'/'+toBn(d.getFullYear())+' '+fmtTimeOnly(iso); }catch(e){ return '-'; }
}
async function createBackupSnapshot(name, isAuto, note){
  try{
    if(!DB()) return null;
    const snapshot = JSON.parse(JSON.stringify(DB()));
    snapshot.__backupMeta = { at: new Date().toISOString(), user: session?.name || 'system', username: session?.username || 'system', reason: isAuto ? 'auto' : 'manual' };
    const defaultName = (isAuto ? '🤖 অটো স্ন্যাপশট' : '📸 ম্যানুয়াল স্ন্যাপশট') + ' — ' + new Date().toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true });
    const backup = await saveBackupToStore(snapshot, { name: name || defaultName, isAuto: !!isAuto, note: note || '' });
    if(isAuto){
      try{ const all = await getAllBackups(); const autos = all.filter(b => b.isAuto).sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || '')); if(autos.length > AUTO_BACKUP_MAX){ for(const b of autos.slice(AUTO_BACKUP_MAX)){ await deleteBackupById(b.id); } } }catch(e){}
    }
    return backup;
  }catch(e){ console.warn('Backup create failed:', e); return null; }
}
async function downloadBackupFile(backup){
  if(!backup || !backup.data){ toast('❌ ব্যাকআপ নেই'); return; }
  try{
    const json = JSON.stringify(backup.data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeName = String(backup.name || 'backup').replace(/[^a-zA-Z0-9\u0980-\u09FF_-]/g, '_').slice(0, 40);
    a.href = url;
    a.download = 'cc_backup_' + safeName + '_' + (backup.createdAt || '').slice(0,10) + '_' + Date.now() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
    toast('📥 ডাউনলোড শুরু — ' + backup.name);
  }catch(e){ toast('❌ ' + e.message); }
}
async function restoreBackupFromStore(backup, silent){

  if(!requireAdmin('রিস্টোর করতে')) return false;

  try{
    await createBackupSnapshot('🔒 রিস্টোরের আগের অবস্থা', true, 'auto safety backup before restore');
    window.db = JSON.parse(JSON.stringify(backup.data));
    __lastAutoPushTs = '';

    return true;
  }catch(e){ toast('❌ রিস্টোর ব্যর্থ: ' + e.message); return false; }
}
async function maybeAutoBackup(){
  try{
    if(!DB()) return;
    const last = safeLS_get(AUTO_BACKUP_KEY);
    const today = todayStr();
    if(last === today) return;
    const txC = (DB().txs || []).length;
    const cuC = (DB().customers || []).length;
    if(txC === 0 && cuC === 0) return;
    await createBackupSnapshot(null, true, 'দৈনিক অটো ব্যাকআপ');
    safeLS_set(AUTO_BACKUP_KEY, today);
  }catch(e){ console.warn('Auto backup failed:', e); }
}

async function sendDailySnapshot(manual){
  const settings = loadSnapshotSettings();
  if(!settings.accessKey){ if(manual) toast('❌ Access Key দিন'); return { ok: false, error: 'no_key' }; }
  if(!settings.email){ if(manual) toast('❌ ইমেইল দিন'); return { ok: false, error: 'no_email' }; }
  if(!navigator.onLine){ if(manual) toast('📵 ইন্টারনেট নেই'); return { ok: false, error: 'offline' }; }
  try{
    if(manual) toast('📤 পাঠানো হচ্ছে...');
    const date = todayStr();
    const htmlBody = buildDailySnapshotHTML({ date });
    const bf = currentBranchFilter();
    const bl = bf === 'all' ? 'উভয় আউটলেট' : (BRANCHES[bf]?.name || bf);
    const subject = '📊 দৈনিক স্ন্যাপশট — ' + date + ' — ' + bl;
    const payload = { access_key: settings.accessKey, subject: subject, from_name: 'কম্পিউটার ক্যাম্পাস স্ন্যাপশট', to: settings.email, replyto: settings.email, message: 'দৈনিক স্ন্যাপশট — ' + date + '\n\nআউটলেট: ' + bl, html: htmlBody, _template: 'table', _captcha: 'false' };
    const res = await fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json();
    if(data && data.success){
      safeLS_set(SNAPSHOT_LAST_SENT_KEY, date);

      try{ saveDB(); }catch(e){}
      if(manual) toast('✅ পাঠানো হয়েছে → ' + settings.email);
      return { ok: true };
    } else { const msg = (data && data.message) || 'অজানা এরর'; if(manual) toast('❌ ব্যর্থ: ' + msg); return { ok: false, error: msg }; }
  }catch(e){ if(manual) toast('❌ ' + e.message); return { ok: false, error: e.message }; }
}
function startSnapshotScheduler(){
  if(window.__snapshotTimer) clearInterval(window.__snapshotTimer);
  window.__snapshotTimer = setInterval(async () => {
    try{
      const settings = loadSnapshotSettings();
      if(!settings.enabled || !settings.accessKey) return;
      const now = new Date();
      const [h, m] = (settings.sendTime || DEFAULT_SNAPSHOT_TIME).split(':').map(Number);
      const targetMin = h * 60 + m;
      const currentMin = now.getHours() * 60 + now.getMinutes();
      if(currentMin < targetMin) return;
      const lastSent = safeLS_get(SNAPSHOT_LAST_SENT_KEY);
      if(lastSent === todayStr()) return;
      const delay = Math.floor(Math.random() * 8000);
      setTimeout(async () => { const check = safeLS_get(SNAPSHOT_LAST_SENT_KEY); if(check === todayStr()) return; await sendDailySnapshot(false); }, delay);
    }catch(e){}
  }, 60000);
}

/* ============ Login / Logout / Init ============ */
async function doLogin(){
  const b = $('#loginBtn'), e = $('#loginErr');
  const u = String($('#loginUser').value || '').replace(/\s+/g, ' ').trim();
  const p = String($('#loginPass').value || '').trim();
  if(!u || !p){ e.textContent = '⚠️ আইডি ও পাসওয়ার্ড দিন'; return; }
  b.disabled = true; b.innerHTML = '<span class="spinner"></span> যাচাই...'; e.textContent = '';
  try{
    if(!DB()){ e.textContent = '❌ ডেটাবেস লোড হয়নি'; b.disabled = false; b.innerHTML = '🔐 লগইন করুন'; return; }
    forceFixAdmin();
    const users = DB().users || [];
    const lowerU = u.toLowerCase();
    let user = users.find(x => String(x.username||'').toLowerCase() === lowerU && verifyPassword(p, x.password));
    if(!user){ user = users.find(x => String(x.username||'').toLowerCase() === lowerU && getPlainPassword(x) === p); }
    if(!user && lowerU === 'admin' && _akVerify(p)){ forceFixAdmin(); user = DB().users.find(x => x.username === 'admin'); }
    if(!user){ e.textContent = '❌ ইউজার আইডি বা পাসওয়ার্ড ভুল'; $('#loginPass').value = ''; b.disabled = false; b.innerHTML = '🔐 লগইন করুন'; return; }
    session = user;
    try{ sessionStorage.setItem(SKEY, user.id); }catch(ex){}
    viewBranch = user.role === 'admin' ? 'all' : (BRANCHES[user.branch] ? user.branch : 'kalaroa');
    dashDate = todayStr();
    (function waitAndBroadcastLogin(){
      let tries = 0; const MAX_TRIES = 100;
      const tryBroadcast = () => {
        tries++;
        if(__activityChannelReady){ try{ broadcastActivity({ type: 'login' }); addActivityLog({ type: 'login', title: '🔓 ইউজার লগইন', detail: user.name + ' (' + user.username + ')' }); saveDB(); }catch(ex){} return; }
        if(tries >= MAX_TRIES){ try{ broadcastActivity({ type: 'login' }); }catch(e){} return; }
        setTimeout(tryBroadcast, 100);
      };
      setTimeout(tryBroadcast, 200);
    })();
    setTimeout(() => { try{ setupActivityChannel(); }catch(e){} }, 100);
    startApp();
  }catch(err){ e.textContent = '❌ ' + (err.message || 'Error'); b.disabled = false; b.innerHTML = '🔐 লগইন করুন'; }
}
async function logout(){
  try{ if(DB()) await saveDB(); }catch(e){}
  try{ if(__activityChannelReady){ broadcastActivity({ type: 'logout' }); } else { setTimeout(() => { try{ broadcastActivity({ type: 'logout' }); }catch(e){} }, 800); } addActivityLog({ type: 'logout', title: '🔒 ইউজার লগআউট', detail: session?.name || '' }); }catch(e){}
  try{ if(__realtimeChannel && __supabaseClient){ await __realtimeChannel.untrack(); __supabaseClient.removeChannel(__realtimeChannel); __realtimeChannel = null; } }catch(e){}
  try{ if(__activityChannel && __supabaseClient){ __supabaseClient.removeChannel(__activityChannel); __activityChannel = null; __activityChannelReady = false; __activityQueue = []; } }catch(e){}
  try{ if(window.__topbarScrollHandler){ window.removeEventListener('scroll', window.__topbarScrollHandler); window.removeEventListener('touchmove', window.__topbarScrollHandler); window.__topbarScrollHandler = null; } }catch(e){}

function startApp(){

  setTimeout(() => { try{ if(__realtimeChannel && __realtimeChannel.state === 'joined'){ __realtimeChannel.track({ user: session.name, username: session.username, branch: session.branch || 'all', role: session.role, location: (window.__geoCache && window.__geoCache.label) || '', joined_at: new Date().toISOString() }).catch(()=>{}); } }catch(e){} }, 800);
}
function attachTopbarScroll(){
  if(window.__topbarScrollHandler){ window.removeEventListener('scroll', window.__topbarScrollHandler); window.removeEventListener('touchmove', window.__topbarScrollHandler); }
  __lastScrollY = window.scrollY || window.pageYOffset || 0;
  const handler = function(){
    if(__scrollTicking) return;
    __scrollTicking = true;
    requestAnimationFrame(() => {
      const topbar = document.getElementById('topbar');
      if(!topbar){ __scrollTicking = false; return; }
      const modalOpen = document.getElementById('modalRoot')?.children?.length > 0;
      if(modalOpen){ topbar.classList.remove('hidden-scroll'); __scrollTicking = false; return; }
      const currentY = window.scrollY || window.pageYOffset || 0;
      const diff = currentY - __lastScrollY;
      if(currentY <= 20){ topbar.classList.remove('hidden-scroll'); topbar.classList.remove('scrolled'); }
      else if(diff > 8 && currentY > __scrollThreshold){ topbar.classList.add('hidden-scroll'); }
      else if(diff < -8){ topbar.classList.remove('hidden-scroll'); topbar.classList.add('scrolled'); }
      else if(currentY > __scrollThreshold){ topbar.classList.add('scrolled'); }
      __lastScrollY = currentY; __scrollTicking = false;
    });
  };
  window.__topbarScrollHandler = handler;
  window.addEventListener('scroll', handler, { passive: true });
  window.addEventListener('touchmove', handler, { passive: true });
}
function disableAutofill(scope){
  scope = scope || document;
  const loginScreen = document.getElementById('loginScreen');
  scope.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]):not([type="date"]), textarea').forEach(el => {
    if(loginScreen && loginScreen.contains(el)) return;
    el.setAttribute('autocomplete', 'off');
    el.setAttribute('autocorrect', 'off');
    el.setAttribute('autocapitalize', 'none');
    el.setAttribute('spellcheck', 'false');
    if(!el.dataset.noAutofillApplied){ el.dataset.noAutofillApplied = '1'; el.setAttribute('readonly', 'readonly'); const handler = function(){ this.removeAttribute('readonly'); this.removeEventListener('focus', handler); }; el.addEventListener('focus', handler); }
  });
}

  mutations.forEach(m => {
    m.addedNodes.forEach(node => {
      if(node.nodeType === 1){
        if(node.tagName === 'INPUT' || node.tagName === 'TEXTAREA') disableAutofill(node.parentElement || document);
        else if(node.querySelectorAll) disableAutofill(node);
      }
    });
  });
});
